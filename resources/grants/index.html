<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
/* Presentation builder engine. Design rules: docs/DESIGN.md. Do not change colours or fonts per deck without a reason. */
:root{--bg:#fff;--tint:#f6f7f8;--ink:#1f2a33;--body:#36424c;--muted:#66727c;--faint:#98a2aa;--line:#e2e6ea;
--logo:#cc0000;--wine:#9e1630;--wine-pale:#f8ecee;--navy:#17365d;--navy-pale:#e9eef4;
--x1:#edf1f6;--x2:#c8d5e5;--x3:#88a3c6;--x4:#43679a;
--sans:'Open Sans','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
/* top bar */
.top{position:fixed;inset:0 0 auto 0;height:66px;z-index:20;display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(226,230,234,.7)}
.brand img{height:34px;display:block}
.dots{flex:1;display:flex;justify-content:center;gap:10px}
.dots button{width:9px;height:9px;border-radius:50%;background:#d3d8de;transition:all .3s;position:relative}
.dots button[aria-current=true]{background:var(--wine);width:28px;border-radius:6px}
.dots button:hover::after{content:attr(data-label);position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--body);background:#fff;box-shadow:0 4px 14px rgba(31,42,51,.12);padding:4px 8px;border-radius:6px}
.tools{display:flex;align-items:center;gap:4px}
.tools .ttl{font-size:14px;color:var(--muted);padding:8px 14px 8px 0;margin-right:6px;border-right:1px solid var(--line)}
.tools button{font-size:14px;color:var(--muted);padding:8px 10px;border-radius:9px;text-decoration:underline;text-decoration-color:#c3cad1;text-underline-offset:4px}
.tools button:hover{color:var(--wine);text-decoration-color:var(--wine)}
/* scenes */
main{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.scene{position:relative;min-height:100vh;scroll-snap-align:start;padding:96px 7vw 44px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.scene.alt{background:var(--tint)}
/* Section divider: marks the start of a new part of the presentation. */
.scene.divider{background:var(--wine-pale)}
.divd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(28px,5vw,84px);align-items:center}
.divn{font-size:clamp(120px,15vw,230px);font-weight:300;line-height:.8;color:var(--wine);letter-spacing:-.04em}
.divd h2{font-size:clamp(44px,5vw,76px);margin-bottom:18px}
.divd .kick{margin-bottom:12px}
#dots button.sec{margin-left:12px}
.scene::after{content:"";position:absolute;right:-12vw;top:-18vh;width:46vw;height:46vw;border-radius:50%;background:radial-gradient(closest-side,rgba(158,22,48,.06),transparent);pointer-events:none}
.wrap{position:relative;max-width:1440px;width:100%;margin:0 auto}
.kick{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);margin-bottom:14px}
h1,h2,h3{font-weight:700;letter-spacing:-.015em}
h2{font-size:clamp(34px,3.5vw,54px);line-height:1.08;margin-bottom:16px;color:var(--wine)}
.lead{font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted);max-width:1060px;font-weight:300}
.statement{font-weight:300;font-size:clamp(22px,2vw,31px);line-height:1.38;max-width:1180px;margin:6px 0 30px;color:var(--ink)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.in .reveal{opacity:1;transform:none}
.in .d1{transition-delay:.12s}.in .d2{transition-delay:.24s}.in .d3{transition-delay:.36s}.in .d4{transition-delay:.48s}.in .d5{transition-delay:.6s}
/* meta.motion.slow: a calmer build-up when a scene opens */
body.slow .reveal{transition-duration:1.6s}
body.slow .in .d1{transition-delay:.35s}body.slow .in .d2{transition-delay:.8s}body.slow .in .d3{transition-delay:1.25s}body.slow .in .d4{transition-delay:1.7s}body.slow .in .d5{transition-delay:2.15s}
/* Steps: elements with data-step are shown one at a time with each click; the others stay visible but faded. */
.scene [data-step]{cursor:pointer}
.scene.in [data-step]{transition-property:opacity,transform;transition-duration:.7s}
.scene.in [data-step].dim{opacity:.45}
.scene.in.stepped [data-step]{transition-delay:0s!important}
.cite{font-size:.62em;vertical-align:super;color:var(--wine);font-weight:700;padding:0 1px}.cite:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
.pill.x1{background:var(--x1);color:#2f4257;box-shadow:inset 0 0 0 1px #d9e1ea}.pill.x2{background:var(--x2);color:#1f3247}.pill.x3{background:var(--x3);color:#fff}.pill.x4{background:var(--x4);color:#fff}
.hint{font-size:14px;color:var(--faint)}
.caption{font-size:15px;color:var(--muted);line-height:1.5;margin-top:12px;max-width:1240px}
.lsm{font-size:17px;max-width:1240px}
.more{display:inline-block;margin-top:16px;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;text-decoration-color:#c3cad1}.more:hover{color:var(--wine)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:0 8px 30px rgba(31,42,51,.05)}
.card .kick{color:var(--navy)}
.card p{font-size:16px;line-height:1.6;color:var(--body)}
/* hero */
.hero{padding-bottom:120px}.hero .wrap{position:static}.hero::after{display:none}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:relative;max-width:900px;pointer-events:none}
.hero-text.center{margin:0 auto;text-align:center;max-width:1100px}.hero-text.center .legendline{justify-content:center}
.hero-text h1{font-size:clamp(52px,6.4vw,100px);line-height:1;margin-bottom:22px;color:var(--wine)}
.hero-text h1 em{font-style:italic;font-weight:400}
.hero-sub{font-size:clamp(18px,1.6vw,24px);color:var(--body);font-weight:300;margin-bottom:10px}
.hero-meta{font-size:15px;color:var(--muted)}
.legendline{position:relative;display:flex;gap:10px 22px;margin-top:34px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legendline i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.start{pointer-events:auto;margin-top:36px;display:inline-flex;align-items:center;gap:12px;background:var(--wine);color:#fff;font-weight:600;padding:13px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(158,22,48,.18);transition:transform .2s}
.start:hover{transform:translateY(-2px)}.start.skip{margin-left:14px;text-decoration:none;background:#fff;color:var(--wine);border:1.5px solid var(--wine);box-shadow:none}
.foot{position:absolute;left:7vw;bottom:24px;font-size:13.5px;color:var(--muted);max-width:820px}
/* story */
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:7vw;align-items:start;margin-top:8px}
.journey{position:relative;display:flex;flex-direction:column;gap:24px;padding-left:46px}
.journey::before{content:"";position:absolute;left:15px;top:12px;bottom:12px;width:2px;background:var(--line)}
.step{position:relative;text-align:left;font-size:20px;line-height:1.45;color:var(--ink)}
.step::before{content:attr(data-n);position:absolute;left:-46px;top:0;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--wine);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--wine)}
.step:hover span{color:var(--wine);text-decoration:underline;text-underline-offset:4px}
/* cards */
.ncards{display:grid;gap:22px}
.ncard{text-align:left;padding:22px 24px 26px;border-radius:6px 6px 16px 16px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--wine);box-shadow:0 8px 30px rgba(31,42,51,.05)}
.ncard .n{font-size:32px;font-weight:300;color:var(--wine);line-height:1;margin-bottom:12px}
.ncard h3{font-size:21px;margin-bottom:10px;color:var(--ink)}
.ncard p{font-size:16px;line-height:1.55;color:var(--body)}
/* figures */
.figs{display:grid;gap:4vw;margin-top:34px}
.fig{font-size:clamp(38px,3.8vw,60px);line-height:1.05;font-weight:700;color:var(--wine);margin-bottom:10px;letter-spacing:-.02em}
.figi h3{font-size:19px;font-weight:600;margin-bottom:12px;letter-spacing:0}
.figi p{font-size:16.5px;line-height:1.55;color:var(--body)}
.figi .note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.figi .note b,.rowi .note b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.figrows{display:flex;flex-direction:column;margin-top:26px}
.rowi{display:grid;grid-template-columns:270px 1fr 1fr;gap:28px;align-items:start;padding:22px 0;border-top:1px solid var(--line)}
.rowi:last-child{border-bottom:1px solid var(--line)}
.rowi .fig{font-size:28px;margin-bottom:2px}.rowi h3{font-size:19px;color:var(--ink)}
.rowi p{font-size:17px;line-height:1.5;color:var(--ink)}
.rowi .note{padding-left:18px;border-left:3px solid var(--navy-pale)}
/* overview of parts */
.ovw{display:grid;align-items:stretch;margin-top:34px}
.part{text-align:left;padding:22px 22px 24px;border-radius:6px 6px 16px 16px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(18px);transition:opacity .7s calc(.3s + var(--k)*.35s),transform .7s calc(.3s + var(--k)*.35s),box-shadow .2s}
.in .part{opacity:1;transform:none}
.part:hover{box-shadow:0 10px 26px rgba(31,42,51,.12)}
.part .pn{font-size:30px;font-weight:300;color:var(--navy);line-height:1}
.part b{font-size:20px;color:var(--ink)}.part span{font-size:15.5px;line-height:1.5;color:var(--body)}
.part.result{border-top-color:var(--wine)}
.op{display:grid;place-items:center;font-size:28px;color:var(--muted);opacity:0;transition:opacity .6s .9s}
.in .op{opacity:1}
.glyph{display:grid;grid-template-columns:repeat(var(--cols,6),14px);gap:3px;margin-bottom:4px}
.glyph i{display:block;height:14px;border-radius:3px;opacity:0;transform:scale(.4);transition:opacity .4s,transform .4s}
.in .glyph i{opacity:1;transform:none}
/* intensity: shared by path and tiles */
.x1{background:linear-gradient(145deg,#ffffff,#edf1f6);box-shadow:inset 0 0 0 1px #d9e1ea}.x2{background:linear-gradient(145deg,#e6edf6,#c8d5e5)}.x3{background:linear-gradient(145deg,#b7c9e0,#88a3c6)}.x4{background:linear-gradient(145deg,#7393c0,#43679a)}
.xlegend{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--body);margin-top:22px;flex-wrap:wrap}
.xlegend i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:7px;vertical-align:-3px}
.pathbox{position:relative;margin-top:30px}
.pathbox svg{width:100%;height:auto;display:block;overflow:visible}
.station{cursor:pointer}
.station circle.core{transition:transform .5s cubic-bezier(.2,.9,.2,1.2);transform-box:fill-box;transform-origin:center;transform:scale(0)}
.in .station circle.core{transform:scale(1)}
.station:hover circle.core{stroke:var(--ink);stroke-width:3}
.station .halo{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes breathe2{0%,100%{opacity:.24;transform:scale(.97)}50%{opacity:.36;transform:scale(1.04)}}
@keyframes breathe3{0%,100%{opacity:.28;transform:scale(.96)}50%{opacity:.48;transform:scale(1.09)}}
@keyframes breathe4{0%,100%{opacity:.32;transform:scale(.95)}50%{opacity:.56;transform:scale(1.12)}}
.in .station.l2 .halo{animation:breathe2 4.6s ease-in-out infinite}.in .station.l3 .halo{animation:breathe3 4.6s ease-in-out infinite}.in .station.l4 .halo{animation:breathe4 4.6s ease-in-out infinite}
.in .station:nth-child(odd) .halo{animation-delay:-1.3s}
.flow{stroke:#8f9aa6;stroke-width:2;opacity:0;transition:opacity .6s}.in .flow{opacity:1}
.back{fill:none;stroke:#b3bcc6;stroke-width:1.6;stroke-dasharray:5 6}
.colsN{display:grid;gap:18px;margin-top:8px}
.colsN button{text-align:center;padding:6px;border-radius:12px}
.colsN button:hover{background:var(--tint)}
.colsN b{display:flex;align-items:flex-end;justify-content:center;min-height:2.6em;font-size:17px;font-weight:700;margin-bottom:6px;color:var(--ink);line-height:1.3}
.colsN span{display:block;font-size:14.5px;line-height:1.45;color:var(--muted)}
.lanes{display:grid;gap:10px;margin-top:28px}
.lanes .h{font-size:14px;font-weight:600;color:var(--body);align-self:end;padding-bottom:4px}
.lanes .rl{text-align:left;padding:6px 12px 6px 0}
.lanes .rl b{display:block;font-size:19px;font-weight:700;color:var(--ink)}
.lanes .rl small{font-size:13px;color:var(--muted)}
.lanes .rl:hover b{color:var(--wine)}
.lc{border-radius:14px;position:relative;opacity:0;transform:scale(.92);height:clamp(48px,7vh,84px)}
.in .lc{opacity:1;transform:none;transition:opacity .6s,transform .6s}
.lc:hover{transform:translateY(-3px);outline:3px solid var(--ink);outline-offset:0}
.lc.x2{box-shadow:0 6px 16px rgba(67,103,154,.10)}.lc.x3{box-shadow:0 8px 22px rgba(67,103,154,.2)}.lc.x4{box-shadow:0 10px 28px rgba(67,103,154,.32)}
@keyframes glow3{0%,100%{box-shadow:0 8px 20px rgba(67,103,154,.16)}50%{box-shadow:0 11px 28px rgba(67,103,154,.3)}}
@keyframes glow4{0%,100%{box-shadow:0 10px 24px rgba(67,103,154,.22)}50%{box-shadow:0 13px 32px rgba(67,103,154,.38)}}
.in .lc.x3{animation:glow3 4.6s ease-in-out infinite}.in .lc.x4{animation:glow4 4.6s ease-in-out infinite}
/* categorical heatmap */
.hm-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:2px}
.scene.alt .seg{background:#fff;border:1px solid var(--line)}
.seg button{padding:8px 14px;border-radius:9px;font-size:15px;color:var(--body)}
.seg button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:700;box-shadow:0 1px 4px rgba(31,42,51,.12)}
.scene.alt .seg button[aria-pressed=true]{background:var(--tint)}
.hm-grid{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.ov{display:grid;gap:5px 6px;align-items:center}
.ov .hh{font-size:14px;font-weight:700;color:var(--ink);align-self:end;padding:0 2px 4px;line-height:1.2}
.ov .co{align-self:stretch;display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--navy);background:var(--navy-pale);border-radius:10px;padding:0 12px;line-height:1.25}
.ov .ty{font-size:14.5px;color:var(--body);white-space:nowrap}
.ov .gap{grid-column:1/-1;height:6px}
.hc{width:100%;border-radius:7px;transition:background-color .6s,box-shadow .2s,transform .15s;cursor:pointer;position:relative}
.ov .hc{height:34px}
@keyframes cellin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.in .ov .hc{animation:cellin .5s both}
.hc:hover{box-shadow:0 0 0 3px var(--ink);transform:translateY(-1px)}
.gv{display:grid;gap:8px}
.gv .hh{font-size:14px;font-weight:700;color:var(--ink);align-self:end;padding:0 2px 4px}
.gv .rlab{display:flex;flex-direction:column;justify-content:center;padding-right:10px}
.gv .rlab b{font-size:19px;font-weight:700}.gv .rlab small{font-size:13px;color:var(--muted)}
.gv .hc{min-height:124px;padding:14px 14px 26px;text-align:left;font-size:16px;line-height:1.3;font-weight:600}
.gv .hc::after{content:"\2192";position:absolute;right:12px;bottom:8px;opacity:.35}.gv .hc:hover::after{opacity:.85}
.cnote{font-size:17px;color:var(--body);margin:0 0 12px;line-height:1.45}
.peek{background:var(--tint);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:420px}
.scene.alt .peek{background:#fff;border:1px solid var(--line)}
.peek .kick{margin:0;color:var(--navy)}
.peek h3{font-size:22px;color:var(--ink);line-height:1.2}
.peek p{font-size:15px;line-height:1.5;color:var(--body)}
.peek .hint{margin-top:auto}
.legend{display:flex;gap:16px;font-size:14px;color:var(--body);align-items:center;flex-wrap:wrap}
.legend.v{flex-direction:column;align-items:flex-start;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:15px;height:15px;border-radius:4px;position:relative}
.ramp{display:inline-flex;gap:2px}.ramp i{display:block;width:11px;height:15px;border-radius:3px}
.dot.chg::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff}
.crow{display:grid;gap:5px;font-size:13.5px;color:var(--body)}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar span{display:grid;place-items:center;font-size:12.5px;font-weight:700}
.mapnote{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.45}
/* compare */
.maps{display:grid;grid-template-columns:1fr 46px 1fr;gap:14px;align-items:start;margin-top:16px}
.pm{display:flex;flex-direction:column;gap:10px}
.pm-t{font-size:14.5px;font-weight:700;padding:7px 12px;border-radius:9px;text-align:center}
.pm-t.a{background:var(--tint);color:var(--body)}.pm-t.b{background:var(--navy);color:#fff}
.scene.alt .pm-t.a{background:#fff;border:1px solid var(--line)}
.pmg{display:grid;gap:3px 4px}
.pmh{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:3px}
.pmc{font-size:13px;font-weight:700;line-height:1.3;color:var(--navy);background:var(--navy-pale);border-radius:8px;padding:6px 10px;display:flex;align-items:center;margin-right:6px}
.pmgap{grid-column:1/-1;height:4px}
.pmr{font-size:12.5px;line-height:1.2;color:var(--body);white-space:nowrap;padding-right:8px;align-self:center}
.pmg .hc{height:clamp(16px,2.3vh,24px);border-radius:4px}
.hc.changed::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;opacity:.95}
.arrow{align-self:center;font-size:32px;color:var(--muted);text-align:center;padding-top:28px}
.plegend{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.notes{display:grid;gap:12px;margin-top:14px}
.notes div{padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.notes b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.notes p{font-size:14px;line-height:1.45;color:var(--body)}
/* text, quote, next */
.tcols{display:grid;gap:28px;margin:30px 0 20px}
.tcols h3{font-size:22px;margin-bottom:10px;color:var(--ink)}
.tcols p{font-size:17px;line-height:1.6;color:var(--body)}
.quote{font-size:clamp(28px,2.8vw,44px);font-weight:300;line-height:1.3;color:var(--ink);max-width:1100px}
.quote::before{content:"“";color:var(--wine);font-weight:700}.quote::after{content:"”";color:var(--wine);font-weight:700}
.attrib{margin-top:18px;font-size:16px;color:var(--muted)}
.closing{font-size:17px;color:var(--muted);max-width:1100px;line-height:1.55}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:600;background:#fff;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
/* drawer, modal, reading view, tooltip */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,94vw);z-index:40;background:#fff;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:30px 36px 60px}
.drawer.open{transform:none;box-shadow:-30px 0 80px rgba(31,42,51,.18)}
.drawer .x{position:sticky;top:0;float:right;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:8px;background:#fff}
.drawer .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);margin-bottom:10px;font-weight:700}
.drawer h3{font-size:26px;line-height:1.2;margin-bottom:14px;color:var(--ink)}
.drawer h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin:22px 0 8px}
.drawer p,.drawer li{font-size:15.5px;line-height:1.6;color:var(--body)}
.drawer ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.drawer li{padding-left:16px;position:relative}.drawer li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--wine)}
.drawer .scen{display:flex;align-items:center;gap:10px;margin:4px 0 6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bars div{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13.5px;color:var(--body)}
.bars i{display:block;height:10px;border-radius:5px;background:var(--navy)}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(31,42,51,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:6vh 8vw;z-index:50;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 34px;overflow:auto;display:none;box-shadow:0 30px 80px rgba(31,42,51,.25)}
.modal.on{display:block}
.modal h3{font-size:26px;margin-bottom:14px}
.modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:16px}
.srcl{list-style:none;display:flex;flex-direction:column;gap:10px}
.srcl li{font-size:14.5px;line-height:1.5;color:var(--body)}.srcl li b{color:var(--ink)}.srcl li a{color:var(--wine)}
.modal.wide{inset:4vh 5vw;padding:0;overflow:hidden}
.modal.wide #modalX{position:absolute;top:16px;right:18px;z-index:2}
.rd{display:grid;grid-template-columns:280px 1fr;height:100%}
.rd-nav{border-right:1px solid var(--line);padding:26px 20px;overflow:auto;display:flex;flex-direction:column;gap:2px;background:var(--tint)}
.rd-nav button{text-align:left;font-size:14px;color:var(--body);padding:7px 10px;border-radius:8px;line-height:1.35}
.rd-nav button:hover,.rd-nav button[aria-current=page]{background:#fff;color:var(--wine)}
.rd-art{overflow:auto;padding:34px 56px 60px}
.rd-art h1{font-size:30px;color:var(--wine);margin:0 0 16px}.rd-art h2{font-size:23px;color:var(--ink);margin:30px 0 10px}.rd-art h3{font-size:18px;margin:22px 0 8px}
.rd-art p,.rd-art li{font-size:16px;line-height:1.65;color:var(--body);max-width:880px;margin-bottom:12px}
.rd-art ul,.rd-art ol{padding-left:22px;margin-bottom:12px}
.rd-art table{border-collapse:collapse;margin:14px 0;font-size:14px}.rd-art td,.rd-art th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tip{position:fixed;z-index:30;pointer-events:none;max-width:400px;background:#fff;box-shadow:0 10px 30px rgba(31,42,51,.16);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--ink);opacity:0;transition:opacity .15s}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media (max-height:940px){.pmg .hc{height:16px}.plegend .hint{display:none}.notes p{font-size:13.5px}}
@media (max-width:900px){.divd{grid-template-columns:1fr}.divn{font-size:110px}.two,.hm-grid,.maps,.rowi{grid-template-columns:1fr}.ncards,.figs,.tcols{grid-template-columns:1fr 1fr!important}.ovw{grid-template-columns:1fr!important}.ovw .op{display:none}.lanes{grid-template-columns:100px repeat(var(--cols),1fr)!important}.lanes .rl b{font-size:15px}.lanes .rl small{display:none}.colsN{grid-template-columns:repeat(3,1fr)!important}.dots,.peek,.arrow,.tools .ttl{display:none}.scene{padding:90px 18px 40px}.gv .hc{font-size:11px;min-height:90px;padding:8px}.rd{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rd-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap}.rd-nav .kick{display:none}.rd-art{padding:24px 18px}}
.figbox{display:grid;grid-template-columns:1fr;gap:26px;align-items:start}
.figbox.with-ctl{grid-template-columns:minmax(0,1fr) 300px}
.figmain{min-width:0}.figmain svg{width:100%;height:auto;max-height:calc(100vh - 450px);display:block}
.figctl{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--body)}
.figctl .kick{margin-bottom:4px;color:var(--navy)}
.figctl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.35}
.figctl input[type=checkbox]{accent-color:var(--wine);width:17px;height:17px;margin-top:2px;flex:none}
.figctl .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.figctl .seg button{flex:1;padding:8px;font-size:14px;color:var(--body)}
.figctl .seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.figctl .btn{text-align:left;font-size:14px;padding:9px 12px}
.figctl .read{border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.figctl .read b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.figctl .hint{font-size:13px;color:var(--muted);grid-column:1/-1}
@media(max-width:900px){.figbox.with-ctl{grid-template-columns:1fr}}
.figside{display:grid;gap:clamp(28px,3.4vw,56px);align-items:center}
.figside.left{grid-template-columns:var(--tw) minmax(0,1fr)}
.figside.right{grid-template-columns:minmax(0,1fr) var(--tw)}
.figtext.prose p{max-width:none}
.figbox+.figtext{margin-top:20px}.figtext+.figbox{margin-top:18px}
.figlink{margin-right:22px;margin-top:10px}
[data-det].notelink{cursor:pointer;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c3cad1}
[data-det].notelink:hover{color:var(--wine);text-decoration-color:var(--wine)}
@media(max-width:900px){.figside.left,.figside.right{grid-template-columns:1fr}}
@media(max-width:600px){.top{gap:10px;padding:0 14px}.brand img{height:25px}.tools button{padding:8px 6px}}
.prose{display:grid;grid-template-columns:1fr;gap:0 56px;font-size:clamp(15.5px,1.15vw,17.5px);line-height:1.55;color:var(--body);max-width:1200px}
.prose.c2{grid-template-columns:1fr 1fr}
.prose p{margin-bottom:14px;max-width:72ch}
.prose p em.head{font-style:italic;color:var(--ink)}
.prose p em{font-style:italic}
@media(max-width:900px){.prose.c2{grid-template-columns:1fr}}
@media (max-height:820px) and (min-width:901px){.scene{padding-top:80px;padding-bottom:24px}}
/* meta.text = "large": reading text about 15 percent larger, for decks shown on a screen in a room. */
body.large .kick{font-size:14px}
body.large .lead{font-size:clamp(20px,1.6vw,25px)}body.large .statement{font-size:clamp(24px,2.2vw,34px)}
body.large .card p,body.large .ncard p,body.large .figi p{font-size:18.5px}body.large .ncard h3,body.large .tcols h3{font-size:23px}
body.large .rowi p,body.large .tcols p,body.large .closing,body.large .cnote{font-size:19.5px}body.large .rowi h3,body.large .figi h3{font-size:21px}
body.large .part b{font-size:22px}body.large .part span{font-size:17.5px}body.large .step{font-size:22px}
body.large .notes p{font-size:16px}body.large .notes b,body.large .figi .note b,body.large .rowi .note b{font-size:13px}
body.large .caption,body.large .hint{font-size:16.5px}body.large .prose p{font-size:20px}
body.large .pmh,body.large .pmr{font-size:14px}body.large .pmc{font-size:14.5px}body.large .pm-t{font-size:16px}body.large .legend{font-size:15.5px}
body.large .drawer p,body.large .drawer li{font-size:17px}body.large .btn{font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<script type="application/json" id="deck">{"meta": {"title": "Helping each other with grants", "author": "Joost van de Brake, HRM&OB lunch meeting", "discussion": {"api": "https://teamwork-practice-exam.compatibel.chatgpt.site", "meeting": "grants-lunch-2026", "questions": ["What has helped us so far?", "Where do we get stuck?", "What should we organise?"], "record": {"date": "27 October 2026", "summarisedIdeas": 3, "summary": {"overview": "What helps us is time to prepare, structured support from peers, and knowing who works on what. We get stuck on competition between colleagues, too little recognition, and not knowing what reviewers expect.", "proposals": ["Set a date twice a year to review our grant plans.", "Agree how we share the outcomes of applications at a future lunch meeting."], "questions": [{"question": 1, "points": ["Mentoring and feedback from experts, also from outside our own field.", "Time to write, and planning well before the deadline, especially for large consortia.", "Peer writing groups, networks outside the department, and committee work."]}, {"question": 2, "points": ["We compete where we could work together, especially on grants that are not individual.", "Too little recognition, and too little help with building a CV.", "Not knowing what reviewers and interdisciplinary panels expect."]}, {"question": 3, "points": ["Coordination from the top when a call is coming, with workshops and peer feedback groups.", "An overview of who works on what, for example a spreadsheet once or twice a year.", "A lunch meeting where we present failed and successful proposals."]}]}}}, "motion": {"slow": true, "replay": true}, "text": "large", "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAABIAAAAAQAAAEgAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAABEygAwAEAAAAAQAAAJwAAAAA/+0AOFBob3Rvc2hvcCAzLjAAOEJJTQQEAAAAAAAAOEJJTQQlAAAAAAAQ1B2M2Y8AsgTpgAmY7PhCfv/AABEIAJwETAMBI  "https://erc.europa.eu/apply-grant/advanced-grant", "note": "Provisional 2027 dates, checked 25 September 2026."}, {"id": "MSCADN", "authors": "European Commission", "year": "2026", "group": "calls", "title": "MSCA Doctoral Networks 2026", "url": "https://marie-sklodowska-curie-actions.ec.europa.eu/node/1591", "note": "Checked 22 October 2026."}, {"id": "HECL4", "authors": "European Commission (CORDIS)", "year": "2026", "group": "calls", "title": "HORIZON-CL4-2027-02-DIGITAL-EMERGING-52-two-stage: New approaches for Human/AI collaboration for the workforce of the future", "url": "https://cordis.europa.eu/programme/id/HORIZON_HORIZON-CL4-2027-02-DIGITAL-EMERGING-52-two-stage", "note": "Checked 22 October 2026."}, {"id": "MSCAPF", "authors": "European Commission", "year": "2026", "group": "calls", "title": "MSCA Postdoctoral Fellowships 2027", "url": "https://marie-sklodowska-curie-actions.ec.europa.eu/funding/msca-postdoctoral-fellowships-2027", "note": "Dates to be confirmed, checked 25 September 2026."}, {"id": "KIC", "authors": "NWO", "year": "2026", "group": "calls", "title": "KIC Human Capital and Digital Innovation in the Netherlands", "url": "https://www.nwo.nl/en/calls/kic-human-capital-and-digital-innovation-in-the-netherlands", "note": "Call in preparation, checked 25 September 2026."}], "scenes": [{"type": "hero", "id": "start", "nav": "Start", "kicker": "HRM&OB lunch meeting", "title": "Helping each other with grants", "emphasis": "each other", "break_before": "with", "subtitle": "A follow-up to the research afternoon of 15 September", "meta": "Joost van de Brake", "constellation": false, "align": "center", "skip": {"text": "Skip to our notes", "goto": "discuss-1"}}, {"type": "story", "id": "today", "nav": "Agenda", "width": 1100, "kicker": "This meeting", "title": "After the research afternoon", "lead": "At the research afternoon we did not get to grants, so they are the main topic of this lunch. I start with a short look back.", "card": {"label": "What I hope we achieve", "text": "I hope we agree on how we help each other with applications and what we organise as a department."}, "steps_label": "Agenda", "steps": [{"text": "Looking back", "goto": "part-back"}, {"text": "AI in research", "goto": "part-ai"}, {"text": "Grants", "goto": "part-grants"}, {"text": "Discussion", "goto": "discuss-1"}]}, {"type": "divider", "id": "part-back", "width": 1000, "nav": "1 · Looking back", "number": "1", "title": "Looking back", "lead": "What we discussed on 15 September and what has happened since."}, {"type": "figure", "id": "lookback", "nav": "Research afternoon", "steps": true, "kicker": "Looking back", "title": "The research afternoon of 15 September", "html": "<style>.lb{display:grid;grid-template-columns:190px 1fr 1fr;margin-top:22px;border-top:1px solid #e2e6ea;font-size:18.5px;line-height:1.45}.lb>div{padding:14px 18px 14px 0;border-bottom:1px solid #e2e6ea}.lb .lh{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#17365d;padding-top:10px;padding-bottom:10px}.lb .lt{font-weight:700;color:#9e1630;cursor:pointer;font-size:19.5px}.lb .lt span{display:block;font-weight:400;font-size:13px;color:#66727c;text-decoration:underline;text-underline-offset:3px;margin-top:2px}.lb .lt:hover span{color:#9e1630}.lb p{color:#36424c;margin:0}.lb .st{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:600;border-radius:999px;padding:2px 10px;color:#17365d;background:#e9eef4}.lb .st.done{color:#1b5e3a;background:#e3f2e8}.lb .row{opacity:0;transform:translateY(10px);transition:opacity 1.4s,transform 1.4s}.in .lb .row{opacity:1;transform:none}@media (max-width:900px){.lb{grid-template-columns:1fr}.lb .lh{display:none}.lb>div{padding-right:0}.lb .lt{padding-bottom:0;border-bottom:0}}<\/style><div class=\"lb\"><div class=\"lh\">Topic<\/div><div class=\"lh\">What we discussed<\/div><div class=\"lh\">What we agreed<\/div><div class=\"lt row\" data-detail=\"open\" data-step=\"0\" style=\"transition-delay:0.50s\">Open science<span>More detail<\/span><\/div><div class=\"row\" data-step=\"0\" style=\"transition-delay:0.50s\"><p>We agree that open access is valuable. Some of us worry how it fits with journal quality, our careers, and international coauthors.<\/p><\/div><div class=\"row\" data-step=\"0\" style=\"transition-delay:0.50s\"><p>We need clearer faculty guidance. I have discussed this in the research directors’ group, and an update is coming soon.<\/p><\/div><div class=\"lt row\" data-detail=\"ours\" data-step=\"1\" style=\"transition-delay:0.95s\">Our research<span>More detail<\/span><\/div><div class=\"row\" data-step=\"1\" style=\"transition-delay:0.95s\"><p>We appreciate the lunch seminars, PhD meetings, and atmosphere. We discussed feedback on unfinished papers, data sharing, methods support, and student assistants.<\/p><\/div><div class=\"row\" data-step=\"1\" style=\"transition-delay:0.95s\"><p>I would add our expertise and data to the dashboard.<\/p><span class=\"st done\">Done. Please check your own fields.<\/span><\/div><div class=\"lt row\" data-detail=\"ai\" data-step=\"2\" style=\"transition-delay:1.40s\">AI in research<span>More detail<\/span><\/div><div class=\"row\" data-step=\"2\" style=\"transition-delay:1.40s\"><p>Some of us want funded tools, practical support, and open models. We also discussed acceptable use, confidentiality, and sustainability.<\/p><\/div><div class=\"row\" data-step=\"2\" style=\"transition-delay:1.40s\"><p>I would take these points to the faculty working group on AI.<\/p><\/div><div class=\"lt row\" data-detail=\"grants\" data-step=\"3\" style=\"transition-delay:1.85s\">Grants<span>More detail<\/span><\/div><div class=\"row\" data-step=\"3\" style=\"transition-delay:1.85s\"><p>We did not get to this discussion.<\/p><\/div><div class=\"row\" data-step=\"3\" style=\"transition-delay:1.85s\"><p>I would put grants on the agenda of a lunch meeting.<\/p><\/div><\/div>", "details": {"open": {"kicker": "Research afternoon · Open science", "title": "Open access, journal quality, and our careers", "blocks": [{"heading": "What we discussed", "text": "Leading journals that are not covered by open access deals remain important for our careers, also because good schools abroad look for publications in these journals. Several of us described open access as a collective action problem that the faculty cannot solve on its own, and international coauthors do not always agree on where to publish."}, {"heading": "Questions for the faculty", "text": "We would like to know why gold open access is discouraged, whether the rules are mainly about costs or about opening research to society, and what we should do when journal fit, our careers, coauthors, and the open access rules conflict."}, {"heading": "Since then", "text": "I have discussed these questions in the research directors’ group, and an update is coming soon."}]}, "ours": {"kicker": "Research afternoon · Our research", "title": "Feedback, data, and support", "blocks": [{"heading": "What we discussed", "text": "Feedback on unfinished working papers was the idea that received most support, for example in a roundtable over lunch. Many of us are willing to share data but do not know how to make it available, and several colleagues would like an overview of the support in the faculty, more help with advanced methods, and student assistants."}, {"heading": "Since then", "text": "The dashboard now lets you search colleagues by topic and method, offer help with methods, and describe datasets and their access conditions, so that we can more easily find and help each other."}, {"heading": "Still open", "text": "Student assistants would require a collective decision, because the workload funds that could pay for them now go to teaching time."}]}, "ai": {"kicker": "Research afternoon · AI in research", "title": "Tools, support, and rules", "blocks": [{"heading": "What we discussed", "text": "Ideas ranged from funded Claude or ChatGPT accounts for everyone to an integrated alternative, and from customised tools to local and open models set up with help from CIT. Many of us want clear rules and a common understanding of what is ethical and what goes too far. We also noted that we do not always need the strongest model, which helps with sustainability."}, {"heading": "Next step", "text": "I discuss these points in the working group, and the second part of this meeting gives an update."}]}, "grants": {"kicker": "Research afternoon · Grants", "title": "Grants are on the agenda of this meeting", "blocks": [{"heading": "Questions for this meeting", "list": ["What has helped us with applications?", "Where would help from colleagues make the biggest difference?", "What should we organise?"]}]}}}, {"type": "figure", "id": "part-ai", "nav": "2 · AI in research", "width": 1000, "kicker": "Being updated", "title": "AI in research", "lead": "I have taken this part out while we update it. You can still open the preview, and the staff survey is open.", "html": "<style>.an{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:clamp(28px,4vw,60px);align-items:start;margin-top:22px}.an-p{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #9e1630;border-radius:16px;padding:24px 28px}.an-p .kick{margin-bottom:12px}.an-p p{font-size:19px;line-height:1.55;color:#36424c;margin:0 0 20px}@media (max-width:900px){.an{grid-template-columns:1fr}}<\/style><div class=\"an\"><div class=\"an-p\"><div class=\"kick\">Sneak preview<\/div><p>What we want to achieve, the three dimensions, and what faculty support could change.<\/p><a class=\"btn primary\" href=\"ai-preview/\">Open the AI preview<\/a><\/div><style>#ai-update .figside{align-items:start;grid-template-columns:minmax(0,1fr) 330px}.sv{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #17365d;border-radius:16px;padding:24px 26px;text-align:center}.sv .kick{color:#17365d;margin-bottom:12px}.sv .qr{width:200px;height:200px;margin:0 auto 14px}.sv .qr svg{width:100 1 0h3m1 0h1m2 0h1m2 0h1m3 0h2m5 0h3m2 0h1m3 0h1m-33 1h1m5 0h1m5 0h1m1 0h4m1 0h3m2 0h3m-27 1h7m1 0h1m1 0h5m1 0h1m2 0h1m1 0h1m1 0h4m1 0h2m1 0h1\"/><\/svg>\n<\/div><a class=\"btn primary\" href=\"https://rug.eu.qualtrics.com/jfe/form/SV_3UxGEEQoxMODyVE\" target=\"_blank\" rel=\"noopener\">Take the survey<\/a><\/div><\/div>"}, {"type": "divider", "id": "part-grants", "width": 1000, "nav": "3 · Grants", "number": "3", "title": "Grants", "lead": "The main topic of this meeting is how we can help each other with applications."}, {"type": "figures", "id": "plan", "nav": "Strategic plan", "steps": true, "kicker": "Grants", "title": "What FEB’s strategic plan says about grants", "lead": "The plan asks for more prestigious grants, such as NWO Talent, KIC, ERC, NWA, and EU Horizon, and more European proposals from senior staff. {{SP}}", "layout": "rows", "note_label": "Also in the plan", "items": [{"figure": "20%", "label": "Grant funding", "text": "FEB wants funding from prestigious grants to be 20 percent higher in 2031 than the average over 2023–2025. {{SP}}", "note": "FEB will invest in better support for proposals."}, {"figure": "20%", "label": "Joint proposals", "text": "FEB wants 20 percent more collaborative funding proposals (regional, national, and European) in 2029 than in 2025. {{SP}}", "note": "Regional programmes such as Nij Begun count too."}, {"figure": "PDP", "label": "Time to apply", "text": "From 2027, personal development plans let senior staff focus on grants for a while without also having to publish. {{SP}}", "note": "The plan accepts less output in the short run."}]}, {"type": "text", "id": "recent", "nav": "Recent grants", "kicker": "Grants", "title": "Recent grants in our department", "lead": "Congratulations to the applicants and to everyone who helped them.", "columns": [{"title": "NWO Open Competition L", "text": "Carsten de Dreu and Zsombor Méder, “What drives cooperation across group-boundaries”. {{NWOL}}"}, {"title": "NWO Open Competition L", "text": "Floor Rink, Janka Stoker, and Michelle Ryan, “Leadership in a time of inclusion and resistance”. {{NWOL}}"}, {"title": "NWO Open Competition XS", "text": "Yingjie Yuan, “Human leadership of Multi-Agent AI teams for Creative Problem-Solving”. {{NWOXS}}"}], "note": "The two L grants are each worth about €800,000. {{NWOL}}"}, {"type": "figure", "id": "calls", "nav": "Calls", "kicker": "Grants", "title": "Calls in the coming year", "lead": "These calls fit our research, with dates from the funders’ websites. The call calendar on our dashboard lists more.", "html": "<div class=\"callscroll\"><svg viewBox=\"0 0 1200 374\" role=\"img\" aria-label=\"Grant deadlines from November 2026 to September 2027\" style=\"width:100%;height:auto;max-height:none;font-family:'Open Sans',sans-serif\"><style>.cl{opacity:0;transition:opacity 1s}.in .cl{opacity:1}.cl:hover circle{stroke-width:3.2}.cl:hover .nm{fill:#9e1630}@media (max-width:900px){.callscroll{overflow-x:auto}.callscroll svg{min-width:880px}}<\/style><rect x=\"230.0\" y=\"32\" width=\"84.7\" height=\"338\" fill=\"#17365d\" fill-opacity=\".04\"/><text x=\"272.3\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Nov 2026<\/text><text x=\"358.4\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Dec<\/text><rect x=\"402.2\" y=\"32\" width=\"87.5\" height=\"338\" fill=\"#17365d\" fill-opacity=\".04\"/><text x=\"445.9\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Jan 2027<\/text><text x=\"529.2\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Feb<\/text><rect x=\"568.7\" y=\"32\" width=\"87.5\" height=\"338\" fill=\"#17365d\" fill-opacity=\".04\"/><text x=\"612.5\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Mar<\/text><text x=\"698.6\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#66727c\">Apr<\/text>
