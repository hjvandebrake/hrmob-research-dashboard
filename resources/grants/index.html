=\"7\" fill=\"#fff\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"1059.2\" y=\"204.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Advanced<\/text><text x=\"1059.2\" y=\"220.0\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#66727c\">26 Aug · provisional<\/text><\/g><text x=\"0\" y=\"278.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#17365d\">EU Horizon and MSCA<\/text><line x1=\"230\" y1=\"273.0\" x2=\"1170\" y2=\"273.0\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"/><g class=\"cl\" data-detail=\"MSCADN\" style=\"cursor:pointer;transition-delay:1.92s\"><circle cx=\"294.9\" cy=\"273.0\" r=\"7\" fill=\"#9e1630\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"306.9\" y=\"270.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Doctoral Networks<\/text><text x=\"306.9\" y=\"286.0\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#66727c\">24 Nov · proposal<\/text><\/g><g class=\"cl\" data-detail=\"HECL4\" style=\"cursor:pointer;transition-delay:2.04s\"><circle cx=\"492.5\" cy=\"273.0\" r=\"7\" fill=\"#9e1630\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"504.5\" y=\"270.0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Human/AI collaboration<\/text><text x=\"504.5\" y=\"286.0\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#66727c\">2 Feb · first stage<\/text><\/g><g class=\"cl\" data-detail=\"MSCAPF\" style=\"cursor:pointer;transition-delay:2.16s\"><circle cx=\"1107.9\" cy=\"273.0\" r=\"7\" fill=\"#fff\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"1095.9\" y=\"270.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Postdoctoral Fellowships<\/text><text x=\"1095.9\" y=\"286.0\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#66727c\">8 Sep · to be confirmed<\/text><\/g><text x=\"0\" y=\"344.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#17365d\">KIC<\/text><line x1=\"230\" y1=\"339.0\" x2=\"1170\" y2=\"339.0\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"/><g class=\"cl\" data-detail=\"KIC\" style=\"cursor:pointer;transition-delay:2.28s\"><circle cx=\"927.2\" cy=\"339.0\" r=\"7\" fill=\"#fff\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"915.2\" y=\"336.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Human Capital and Digital Innovation<\/text><text x=\"915.2\" y=\"352.0\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#66727c\">6 Jul · in preparation<\/text><\/g><\/svg><\/div><div style=\"display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#36424c;margin-top:10px\"><span><i style=\"display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #9e1630;vertical-align:-1px;margin-right:7px;background:#9e1630\"><\/i>Deadline<\/span><span><i style=\"display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #9e1630;vertical-align:-1px;margin-right:7px;background:#fff\"><\/i>Provisional, to be confirmed, or call in preparation<\/span><\/div>", "details": {"VIDI": {"kicker": "NWO Talent Programme", "title": "NWO Talent Programme Vidi, Social Sciences and Humanities 2026", "blocks": [{"heading": "Deadlines", "list": ["3 Nov 2026, pre-proposal", "6 Apr 2027, full proposal"]}, {"heading": "About this call", "text": "For researchers who obtained their PhD within the past eight years, with the usual extensions. {{VIDI}}"}]}, "VENI": {"kicker": "NWO Talent Programme", "title": "NWO Talent Programme Veni, Social Sciences and Humanities 2026", "blocks": [{"heading": "Deadlines", "list": ["26 Jan 2027, invited only"]}, {"heading": "About this call", "text": "The pre-proposal round closed on 1 September 2026, so only applicants who were invited submit a full proposal. {{VENI}}"}]}, "EXPAND": {"kicker": "NWO Open Competition SSH", "title": "SSH Open Competition Expand 2026", "blocks": [{"heading": "Deadlines", "list": ["17 Nov 2026, pre-proposal", "10 Jun 2027, full proposal"]}, {"heading": "About this call", "text": "Expand is the new name of the SSH Open Competition M and L, the scheme of our two recent L grants. {{EXPAND}}"}]}, "EXPLORE": {"kicker": "NWO Open Competition SSH", "title": "SSH Open Competition Explore 2027, round 1", "blocks": [{"heading": "Deadlines", "list": ["19 Jan 2027, round 1", "6 Apr 2027, round 2", "14 Sep 2027, round 3"]}, {"heading": "About this call", "text": "Explore is the new name of the SSH Open Competition XS, with three rounds in 2027. {{EXPLORE}}"}]}, "ERCCOG": {"kicker": "European Research Council", "title": "Consolidator Grant", "blocks": [{"heading": "Deadlines", "list": ["12 Jan 2027, provisional"]}, {"heading": "About this call", "text": "The ERC marks this date as provisional. {{ERCCOG}}"}]}, "ERCSYG": {"kicker": "European Research Council", "title": "Synergy Grant", "blocks": [{"heading": "Deadlines", "list": ["11 May 2027, provisional"]}, {"heading": "About this call", "text": "For two to four principal investigators with complementary expertise. The ERC marks this date as provisional. {{ERCSYG}}"}]}, "ERCADG": {"kicker": "European Research Council", "title": "Advanced Grant", "blocks": [{"heading": "Deadlines", "list": ["26 Aug 2027, provisional"]}, {"heading": "About this call", "text": "For established research leaders. The ERC marks this date as provisional. {{ERCADG}}"}]}, "MSCADN": {"kicker": "EU Horizon and MSCA", "title": "MSCA Doctoral Networks 2026", "blocks": [{"heading": "Deadlines", "list": ["24 Nov 2026, proposal"]}, {"heading": "About this call", "text": "Academic and non-academic partners in several countries train doctoral candidates together in a network. {{MSCADN}}"}]}, "HECL4": {"kicker": "EU Horizon and MSCA", "title": "New approaches for Human/AI collaboration for the workforce of the future", "blocks": [{"heading": "Deadlines", "list": ["2 Feb 2027, first stage"]}, {"heading": "About this call", "text": "A Horizon Europe topic on new approaches to human and AI collaboration for the workforce of the future, for consortia. Proposals that pass the first stage go to a second stage on 2 September 2027. {{HECL4}}"}]}, "MSCAPF": {"kicker": "EU Horizon and MSCA", "title": "MSCA Postdoctoral Fellowships 2027", "blocks": [{"heading": "Deadlines", "list": ["8 Sep 2027, to be confirmed"]}, {"heading": "About this call", "text": "Postdocs apply together with a host institution in another country. The dates are still to be confirmed. {{MSCAPF}}"}]}, "KIC": {"kicker": "KIC", "title": "KIC Human Capital and Digital Innovation in the Netherlands", "blocks": [{"heading": "Deadlines", "list": ["6 Jul 2027, in preparation"]}, {"heading": "About this call", "text": "A call in preparation for consortia of researchers and public and private partners. NWO notes that the details may change. {{KIC}}"}]}}}, {"type": "figure", "id": "coordinator", "nav": "Funding coordinator", "kicker": "Grants", "title": "Contact our funding coordinator early", "lead": "Lars van den Brink advises on grant applications. Contact him as soon as you consider a call.", "html": "<style>.lars{display:grid;grid-template-columns:minmax(300px,.85fr) 1.15fr;gap:clamp(24px,3.5vw,56px);align-items:stretch;margin-top:8px}.lars-card{background:#17365d;color:#fff;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;justify-content:center}.lars-card .lk{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}.lars-card .ln{font-size:clamp(30px,2.8vw,42px);font-weight:700;line-height:1.1;margin:10px 0 6px}.lars-card .lr{font-size:17.5px;opacity:.85}.lars-card .lbtn{align-self:flex-start;margin-top:26px;background:#fff;color:#17365d;font-weight:700;font-size:16px;padding:11px 22px;border-radius:999px;text-decoration:none}.lars-card .lbtn:hover{background:#e9eef4}.lars-card .lm{margin-top:10px;font-size:15px;opacity:.85}.lars-list{display:flex;flex-direction:column;justify-content:center;gap:0;border-top:1px solid #e2e6ea}.lars-list div{padding:16px 0;border-bottom:1px solid #e2e6ea}.lars-list b{display:block;font-size:20px;color:#1f2a33;margin-bottom:4px}.lars-list p{font-size:18.5px;line-height:1.5;color:#36424c;margin:0}@media (max-width:900px){.lars{grid-template-columns:1fr}}<\/style><div class=\"lars\"><div class=\"lars-card\"><div class=\"lk\">FEB funding coordinator<\/div><div class=\"ln\">Lars van den Brink<\/div><div class=\"lr\">Funding Officer, FEB Research Office<\/div><a class=\"lbtn\" href=\"mailto:l.h.van.den.brink@rug.nl?subject=Grant%20application\">Email Lars<\/a><div class=\"lm\">l.h.van.den.brink@rug.nl<\/div><\/div><div class=\"lars-list\"><div><b>Suitable calls<\/b><p>Ask Lars which calls suit your idea and your career stage.<\/p><\/div><div><b>Requirements and faculty procedures<\/b><p>Ask what the funder requires and which faculty procedures apply to your application.<\/p><\/div><div><b>Support during the application<\/b><p>For Jutta Bolt’s ERC Consolidator application, the faculty’s funding officer helped her find editing services, prepare the budget, and practise for the interview. {{SP}}<\/p><\/div><\/div><\/div>"}, {"type": "cards", "id": "colleagues", "nav": "Help from colleagues", "width": 1100, "kicker": "Grants", "title": "Help from colleagues", "lead": "We already do this, but informally, so not everyone knows they can ask. Should we formalise it, or at least write it down?", "numbered": false, "cards": [{"title": "Early feedback", "text": "Discuss the idea and its fit with the call."}, {"title": "A draft reader", "text": "Ask for comments on the parts that need work."}, {"title": "Practice panel", "text": "Prepare for review or an interview."}]}, {"type": "figure", "id": "discuss-1", "nav": "Discussion 1", "width": 1100, "kicker": "Discussion · question 1 of 3", "title": "What has helped us so far?", "lead": "We discussed the questions in small groups on 27 October.", "html": "<style>/* Live discussion (discussion scene) and AI summary (final scene). Embedded by build_deck.py. */\n.dq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 26px;margin-top:16px;border-top:1px solid #e2e6ea}\n.dq>div{padding:14px 0;border-bottom:1px solid #e2e6ea}\n.dq .n{font-size:clamp(30px,2.6vw,42px);font-weight:300;color:#9e1630;line-height:1.05}\n.dq .q{font-size:clamp(21px,1.8vw,28px);font-weight:600;color:#1f2a33;line-height:1.25;margin-bottom:8px}\n.dqf{display:flex;gap:10px;align-items:stretch}\n.dqf textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;color:#1f2a33;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;resize:vertical;min-height:46px}\n.dqf textarea:focus{outline:2px solid #17365d;outline-offset:1px;border-color:#17365d}\n.dqf button{flex:none;align-self:stretch;padding:0 20px}\n.dqf button[disabled]{opacity:.5;cursor:default}\n.dqi{margin-top:6px;font-size:14.5px;color:#66727c}\n.dqi summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:max-content}\n.dqi summary::-webkit-details-marker{display:none}\n.dqi ul{margin:8px 0 0;padding:0;list-style:none;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px}\n.dqi li{background:#fff;border:1px solid #e2e6ea;border-radius:8px;padding:6px 10px;color:#36424c;line-height:1.4}\n.dqs{margin-top:10px;font-size:14px;color:#66727c;min-height:20px}\n.dqs.err,.fs-meta.err{color:#8e1f30}\n.fs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(22px,3vw,44px);align-items:start;margin-top:18px}\n.fs-sum{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #9e1630;border-radius:14px;padding:20px 24px}\n.fs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}\n.fs-head .kick{margin:0}\n.fs-go{white-space:nowrap}\n.fs-go[disabled]{opacity:.55;cursor:default}\n.fs-empty{font-size:18px;color:#66727c;line-height:1.5}\n.fs-ov{font-size:20px;line-height:1.5;color:#1f2a33;margin-bottom:12px}\n.fs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}\n.fs-grid h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#17365d;line-height:1.35;margin:0 0 6px}\n.fs-grid ul,.fs-prop ul{margin:0;padding-left:18px;font-size:16.5px;line-height:1.45;color:#36424c}\n.fs-grid li+li,.fs-prop li+li{margin-top:4px}\n.fs-prop{margin-top:14px;padding-top:12px;border-top:1px solid #e2e6ea}\n.fs-prop h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9e1630;margin:0 0 6px}\n.fs-meta{margin-top:12px;font-size:13.5px;color:#66727c}\n.fs-meta a{color:inherit}\n.fs-side{display:flex;flex-direction:column;gap:16px}\n.fs-side div{border-top:1px solid #e2e6ea;padding-top:12px}\n.fs-side b{display:block;font-size:19px;color:#1f2a33;margin-bottom:4px}\n.fs-side p{font-size:17px;line-height:1.5;color:#36424c;margin:0}\n.fs-side .btn{align-self:flex-start}\n@media (max-width:900px){.fs{grid-template-columns:1fr}.fs-grid{grid-template-columns:1fr}.dqf{flex-direction:column}.dqf button{padding:10px 20px}}\n/* One question per scene (24 October 2026): a large box and the ideas below it. */\n.dqf.big{flex-direction:column;gap:10px;margin-top:22px}\n.dqf.big textarea{font-size:20px;line-height:1.45;min-height:170px;padding:14px 16px;border-radius:12px}\n.dqa{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.dqh{font-size:15.5px;color:#66727c}\n.dqf.big button{padding:11px 30px;font-size:17px}\n.dqi .dqc{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#17365d;margin:6px 0 8px}\n.dqf.big~.dqi ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}\n.dqf.big~.dqi li{font-size:17px;white-space:pre-line}\n@media (max-width:900px){.dqf.big~.dqi ul{grid-template-columns:1fr}.dqa{flex-direction:column;align-items:stretch}}\n/* A long summary scrolls inside its panel, so the slide keeps its size (24 October 2026). */\n.fs-body{max-height:calc(100vh - 380px);min-height:120px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px}\n.fs-body::-webkit-scrollbar{width:8px}.fs-body::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:4px}\n@media (max-width:900px){.fs-body{max-height:none;overflow:visible}}\n/* Saved outcome (27 October 2026): what we concluded beside our notes; long notes scroll in their panel. */\n.dqf[hidden],.fs-go[hidden]{display:none!important}\n.dr{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(26px,3.5vw,56px);align-items:start;margin-top:20px}\n.dr .kick{margin-bottom:12px}\n.dr-c{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}\n.dr-c li{font-size:clamp(20px,1.65vw,25px);line-height:1.4;color:#1f2a33;border-left:4px solid #9e1630;padding:4px 0 4px 18px}\n.dr-n{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:16px 22px;max-height:calc(100vh - 360px);min-height:120px;overflow-y:auto;overscroll-behavior:contain}\n.dr-n p{font-size:17.5px;line-height:1.6;color:#36424c;margin:0}.dr-n p+p{margin-top:10px}\n.dr-f{font-size:14px;color:#66727c;margin:10px 0 0}\n@media (max-width:900px){.dr{grid-template-columns:1fr}.dr-n{max-height:none}}\n<\/style><div class=\"dr\"><div><div class=\"kick\">What we concluded<\/div><ul class=\"dr-c\"><li>Mentoring and feedback from experts, also from outside our own field.<\/li><li>Time to write, and planning well before the deadline, especially for large consortia.<\/li><li>Peer writing groups, networks outside the department, and committee work.<\/li><\/ul><\/div><div><div class=\"kick\">Our notes*<\/div><div class=\"dr-n\"><p>In-depth discussions with a mentor about research ideas that could become grant proposals, and time to sit down, think and write instead of having to focus on other things.<\/p><p>Grants depend on timing and on a pipeline. It helps when someone lays out the steps: how to plan ahead, what the schedule is, and what you need to anticipate. For larger consortium grants, much of the work has to be done before the call comes out, so giving people time to work on this ahead of time is key to setting them up for success.<\/p><p>Writing workshops with peers who are also working on proposals and who start writing well before the deadline, like the workshops offered centrally by the university. They set deadlines, give feedback, and help you see when something needs improving. Feedback on the proposal from experts, also from outside your own field.<\/p><p>A network outside the department and the university, especially for larger consortia: people outside your own domain, and people in organisations where you can collect data. We can help each other by referring to each other and keeping each other in mind. The same goes for serving on committees: we could do this actively and recommend each other. Finally, an overview of who is working on what, perhaps in the dashboard.<\/p><\/div><p class=\"dr-f\">* Paraphrased with AI from the notes we typed in the meeting on 27 October 2026.<\/p><\/div><\/div><form class=\"dqf big\" data-q=\"1\" hidden><textarea rows=\"6\" maxlength=\"3000\" aria-label=\"Your notes for this question\" placeholder=\"Type your group’s notes here\"><\/textarea><div class=\"dqa\"><span><\/span><button type=\"submit\" class=\"btn primary\">Add<\/button><\/div><\/form><p class=\"dqs\" aria-live=\"polite\"><\/p><div class=\"dqi\" hidden><p class=\"dqc\"><\/p><ul><\/ul><\/div>", "script": "/* Discussion scene: colleagues type ideas per question; ideas are stored by the discussion API.\n   After the meeting (27 October 2026) the scene shows the saved outcome, built into its HTML (.dr) by build_deck.py;\n   ?meeting=<name> hides it and turns the live box back on for that meeting.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst REC = !params.get('meeting') && cfg.record;\nconst status = section.querySelector('.dqs');\nconst say = (text, err) => { status.textContent = text || ''; status.classList.toggle('err', !!err); };\n\nfunction show(ideas) {\n  section.querySelectorAll('.dqf').forEach((form) => {\n    const q = +form.dataset.q;\n    const mine = ideas.filter((idea) => idea.question === q);\n    const box = form.parentElement.querySelector('.dqi');\n    box.querySelector('.dqc').textContent = mine.length ? `${mine.length} ${mine.length === 1 ? 'answer' : 'answers'} so far` : 'No answers yet';\n    box.querySelector('ul').innerHTML = mine.map((idea) => `<li>${esc(idea.text)}<\/li>`).join('');\n    box.hidden = !mine.length;\n  });\n  setTimeout(() => dispatchEvent(new Event('resize')), 50);\n}\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/ideas?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'unavailable');\n    show((await r.json()).ideas.reverse());\n    if (status.classList.contains('err')) say('');\n  } catch (e) {\n    say('The answers could not be loaded. Check the internet connection and try again.', true);\n  }\n}\n\nif (!REC) {\n  section.querySelector('.dr')?.remove();\n  section.querySelectorAll('.dqf').forEach((form) => {\n    form.hidden = false;\n    const field = form.querySelector('textarea');\n    const button = form.querySelector('button');\n    field.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });\n    form.addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const text = field.value.trim();\n      if (text.length < 3) { field.focus(); return; }\n      button.disabled = true;\n      say('Saving…');\n      try {\n        const r = await fetch(`${API}/api/discussion/ideas`, {\n          method: 'POST', headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ meeting: MEETING, question: +form.dataset.q, text }),\n        });\n        const data = await r.json().catch(() => ({}));\n        if (!r.ok) throw new Error(data.error || 'The answer could not be saved.');\n        field.value = '';\n        say('Thank you, your answer is saved.');\n        await load();\n      } catch (err) {\n        say(err.message && !/fetch/i.test(err.message) ? err.message : 'The answer could not be saved. Check the internet connection and try again.', true);\n      } finally {\n        button.disabled = false;\n      }\n    });\n  });\n\n  /* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\n  let timer = 0;\n  new IntersectionObserver((entries) => entries.forEach((entry) => {\n    clearInterval(timer);\n    if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n  }), { threshold: 0.3 }).observe(section);\n}\n"}, {"type": "figure", "id": "discuss-2", "nav": "Discussion 2", "width": 1100, "kicker": "Discussion · question 2 of 3", "title": "Where do we get stuck?", "html": "<style>/* Live discussion (discussion scene) and AI summary (final scene). Embedded by build_deck.py. */\n.dq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 26px;margin-top:16px;border-top:1px solid #e2e6ea}\n.dq>div{padding:14px 0;border-bottom:1px solid #e2e6ea}\n.dq .n{font-size:clamp(30px,2.6vw,42px);font-weight:300;color:#9e1630;line-height:1.05}\n.dq .q{font-size:clamp(21px,1.8vw,28px);font-weight:600;color:#1f2a33;line-height:1.25;margin-bottom:8px}\n.dqf{display:flex;gap:10px;align-items:stretch}\n.dqf textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;color:#1f2a33;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;resize:vertical;min-height:46px}\n.dqf textarea:focus{outline:2px solid #17365d;outline-offset:1px;border-color:#17365d}\n.dqf button{flex:none;align-self:stretch;padding:0 20px}\n.dqf button[disabled]{opacity:.5;cursor:default}\n.dqi{margin-top:6px;font-size:14.5px;color:#66727c}\n.dqi summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:max-content}\n.dqi summary::-webkit-details-marker{display:none}\n.dqi ul{margin:8px 0 0;padding:0;list-style:none;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px}\n.dqi li{background:#fff;border:1px solid #e2e6ea;border-radius:8px;padding:6px 10px;color:#36424c;line-height:1.4}\n.dqs{margin-top:10px;font-size:14px;color:#66727c;min-height:20px}\n.dqs.err,.fs-meta.err{color:#8e1f30}\n.fs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(22px,3vw,44px);align-items:start;margin-top:18px}\n.fs-sum{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #9e1630;border-radius:14px;padding:20px 24px}\n.fs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}\n.fs-head .kick{margin:0}\n.fs-go{white-space:nowrap}\n.fs-go[disabled]{opacity:.55;cursor:default}\n.fs-empty{font-size:18px;color:#66727c;line-height:1.5}\n.fs-ov{font-size:20px;line-height:1.5;color:#1f2a33;margin-bottom:12px}\n.fs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}\n.fs-grid h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#17365d;line-height:1.35;margin:0 0 6px}\n.fs-grid ul,.fs-prop ul{margin:0;padding-left:18px;font-size:16.5px;line-height:1.45;color:#36424c}\n.fs-grid li+li,.fs-prop li+li{margin-top:4px}\n.fs-prop{margin-top:14px;padding-top:12px;border-top:1px solid #e2e6ea}\n.fs-prop h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9e1630;margin:0 0 6px}\n.fs-meta{margin-top:12px;font-size:13.5px;color:#66727c}\n.fs-meta a{color:inherit}\n.fs-side{display:flex;flex-direction:column;gap:16px}\n.fs-side div{border-top:1px solid #e2e6ea;padding-top:12px}\n.fs-side b{display:block;font-size:19px;color:#1f2a33;margin-bottom:4px}\n.fs-side p{font-size:17px;line-height:1.5;color:#36424c;margin:0}\n.fs-side .btn{align-self:flex-start}\n@media (max-width:900px){.fs{grid-template-columns:1fr}.fs-grid{grid-template-columns:1fr}.dqf{flex-direction:column}.dqf button{padding:10px 20px}}\n/* One question per scene (24 October 2026): a large box and the ideas below it. */\n.dqf.big{flex-direction:column;gap:10px;margin-top:22px}\n.dqf.big textarea{font-size:20px;line-height:1.45;min-height:170px;padding:14px 16px;border-radius:12px}\n.dqa{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.dqh{font-size:15.5px;color:#66727c}\n.dqf.big button{padding:11px 30px;font-size:17px}\n.dqi .dqc{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#17365d;margin:6px 0 8px}\n.dqf.big~.dqi ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}\n.dqf.big~.dqi li{font-size:17px;white-space:pre-line}\n@media (max-width:900px){.dqf.big~.dqi ul{grid-template-columns:1fr}.dqa{flex-direction:column;align-items:stretch}}\n/* A long summary scrolls inside its panel, so the slide keeps its size (24 October 2026). */\n.fs-body{max-height:calc(100vh - 380px);min-height:120px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px}\n.fs-body::-webkit-scrollbar{width:8px}.fs-body::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:4px}\n@media (max-width:900px){.fs-body{max-height:none;overflow:visible}}\n/* Saved outcome (27 October 2026): what we concluded beside our notes; long notes scroll in their panel. */\n.dqf[hidden],.fs-go[hidden]{display:none!important}\n.dr{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(26px,3.5vw,56px);align-items:start;margin-top:20px}\n.dr .kick{margin-bottom:12px}\n.dr-c{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}\n.dr-c li{font-size:clamp(20px,1.65vw,25px);line-height:1.4;color:#1f2a33;border-left:4px solid #9e1630;padding:4px 0 4px 18px}\n.dr-n{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:16px 22px;max-height:calc(100vh - 360px);min-height:120px;overflow-y:auto;overscroll-behavior:contain}\n.dr-n p{font-size:17.5px;line-height:1.6;color:#36424c;margin:0}.dr-n p+p{margin-top:10px}\n.dr-f{font-size:14px;color:#66727c;margin:10px 0 0}\n@media (max-width:900px){.dr{grid-template-columns:1fr}.dr-n{max-height:none}}\n<\/style><div class=\"dr\"><div><div class=\"kick\">What we concluded<\/div><ul class=\"dr-c\"><li>We compete where we could work together, especially on grants that are not individual.<\/li><li>Too little recognition, and too little help with building a CV.<\/li><li>Not knowing what reviewers and interdisciplinary panels expect.<\/li><\/ul><\/div><div><div class=\"kick\">Our notes*<\/div><div class=\"dr-n\"><p>We should not compete with each other. Include rather than compete, especially for grants that are not individual.<\/p><p>Many of us feel a lack of recognition. Awards can help, and we can arrange them ourselves. We should also do more to help colleagues build their CVs, starting with the low-hanging fruit.<\/p><p>We do not know what reviewers look for as evidence that you can do the project, or what interdisciplinary panels require and expect.<\/p><\/div><p class=\"dr-f\">* Paraphrased with AI from the notes we typed in the meeting on 27 October 2026.<\/p><\/div><\/div><form class=\"dqf big\" data-q=\"2\" hidden><textarea rows=\"6\" maxlength=\"3000\" aria-label=\"Your notes for this question\" placeholder=\"Type your group’s notes here\"><\/textarea><div class=\"dqa\"><span><\/span><button type=\"submit\" class=\"btn primary\">Add<\/button><\/div><\/form><p class=\"dqs\" aria-live=\"polite\"><\/p><div class=\"dqi\" hidden><p class=\"dqc\"><\/p><ul><\/ul><\/div>", "script": "/* Discussion scene: colleagues type ideas per question; ideas are stored by the discussion API.\n   After the meeting (27 October 2026) the scene shows the saved outcome, built into its HTML (.dr) by build_deck.py;\n   ?meeting=<name> hides it and turns the live box back on for that meeting.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst REC = !params.get('meeting') && cfg.record;\nconst status = section.querySelector('.dqs');\nconst say = (text, err) => { status.textContent = text || ''; status.classList.toggle('err', !!err); };\n\nfunction show(ideas) {\n  section.querySelectorAll('.dqf').forEach((form) => {\n    const q = +form.dataset.q;\n    const mine = ideas.filter((idea) => idea.question === q);\n    const box = form.parentElement.querySelector('.dqi');\n    box.querySelector('.dqc').textContent = mine.length ? `${mine.length} ${mine.length === 1 ? 'answer' : 'answers'} so far` : 'No answers yet';\n    box.querySelector('ul').innerHTML = mine.map((idea) => `<li>${esc(idea.text)}<\/li>`).join('');\n    box.hidden = !mine.length;\n  });\n  setTimeout(() => dispatchEvent(new Event('resize')), 50);\n}\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/ideas?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'unavailable');\n    show((await r.json()).ideas.reverse());\n    if (status.classList.contains('err')) say('');\n  } catch (e) {\n    say('The answers could not be loaded. Check the internet connection and try again.', true);\n  }\n}\n\nif (!REC) {\n  section.querySelector('.dr')?.remove();\n  section.querySelectorAll('.dqf').forEach((form) => {\n    form.hidden = false;\n    const field = form.querySelector('textarea');\n    const button = form.querySelector('button');\n    field.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });\n    form.addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const text = field.value.trim();\n      if (text.length < 3) { field.focus(); return; }\n      button.disabled = true;\n      say('Saving…');\n      try {\n        const r = await fetch(`${API}/api/discussion/ideas`, {\n          method: 'POST', headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ meeting: MEETING, question: +form.dataset.q, text }),\n        });\n        const data = await r.json().catch(() => ({}));\n        if (!r.ok) throw new Error(data.error || 'The answer could not be saved.');\n        field.value = '';\n        say('Thank you, your answer is saved.');\n        await load();\n      } catch (err) {\n        say(err.message && !/fetch/i.test(err.message) ? err.message : 'The answer could not be saved. Check the internet connection and try again.', true);\n      } finally {\n        button.disabled = false;\n      }\n    });\n  });\n\n  /* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\n  let timer = 0;\n  new IntersectionObserver((entries) => entries.forEach((entry) => {\n    clearInterval(timer);\n    if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n  }), { threshold: 0.3 }).observe(section);\n}\n"}, {"type": "figure", "id": "discuss-3", "nav": "Discussion 3", "width": 1100, "kicker": "Discussion · question 3 of 3", "title": "What should we organise?", "html": "<style>/* Live discussion (discussion scene) and AI summary (final scene). Embedded by build_deck.py. */\n.dq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 26px;margin-top:16px;border-top:1px solid #e2e6ea}\n.dq>div{padding:14px 0;border-bottom:1px solid #e2e6ea}\n.dq .n{font-size:clamp(30px,2.6vw,42px);font-weight:300;color:#9e1630;line-height:1.05}\n.dq .q{font-size:clamp(21px,1.8vw,28px);font-weight:600;color:#1f2a33;line-height:1.25;margin-bottom:8px}\n.dqf{display:flex;gap:10px;align-items:stretch}\n.dqf textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;color:#1f2a33;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;resize:vertical;min-height:46px}\n.dqf textarea:focus{outline:2px solid #17365d;outline-offset:1px;border-color:#17365d}\n.dqf button{flex:none;align-self:stretch;padding:0 20px}\n.dqf button[disabled]{opacity:.5;cursor:default}\n.dqi{margin-top:6px;font-size:14.5px;color:#66727c}\n.dqi summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:max-content}\n.dqi summary::-webkit-details-marker{display:none}\n.dqi ul{margin:8px 0 0;padding:0;list-style:none;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px}\n.dqi li{background:#fff;border:1px solid #e2e6ea;border-radius:8px;padding:6px 10px;color:#36424c;line-height:1.4}\n.dqs{margin-top:10px;font-size:14px;color:#66727c;min-height:20px}\n.dqs.err,.fs-meta.err{color:#8e1f30}\n.fs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(22px,3vw,44px);align-items:start;margin-top:18px}\n.fs-sum{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #9e1630;border-radius:14px;padding:20px 24px}\n.fs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}\n.fs-head .kick{margin:0}\n.fs-go{white-space:nowrap}\n.fs-go[disabled]{opacity:.55;cursor:default}\n.fs-empty{font-size:18px;color:#66727c;line-height:1.5}\n.fs-ov{font-size:20px;line-height:1.5;color:#1f2a33;margin-bottom:12px}\n.fs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}\n.fs-grid h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#17365d;line-height:1.35;margin:0 0 6px}\n.fs-grid ul,.fs-prop ul{margin:0;padding-left:18px;font-size:16.5px;line-height:1.45;color:#36424c}\n.fs-grid li+li,.fs-prop li+li{margin-top:4px}\n.fs-prop{margin-top:14px;padding-top:12px;border-top:1px solid #e2e6ea}\n.fs-prop h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9e1630;margin:0 0 6px}\n.fs-meta{margin-top:12px;font-size:13.5px;color:#66727c}\n.fs-meta a{color:inherit}\n.fs-side{display:flex;flex-direction:column;gap:16px}\n.fs-side div{border-top:1px solid #e2e6ea;padding-top:12px}\n.fs-side b{display:block;font-size:19px;color:#1f2a33;margin-bottom:4px}\n.fs-side p{font-size:17px;line-height:1.5;color:#36424c;margin:0}\n.fs-side .btn{align-self:flex-start}\n@media (max-width:900px){.fs{grid-template-columns:1fr}.fs-grid{grid-template-columns:1fr}.dqf{flex-direction:column}.dqf button{padding:10px 20px}}\n/* One question per scene (24 October 2026): a large box and the ideas below it. */\n.dqf.big{flex-direction:column;gap:10px;margin-top:22px}\n.dqf.big textarea{font-size:20px;line-height:1.45;min-height:170px;padding:14px 16px;border-radius:12px}\n.dqa{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.dqh{font-size:15.5px;color:#66727c}\n.dqf.big button{padding:11px 30px;font-size:17px}\n.dqi .dqc{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#17365d;margin:6px 0 8px}\n.dqf.big~.dqi ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}\n.dqf.big~.dqi li{font-size:17px;white-space:pre-line}\n@media (max-width:900px){.dqf.big~.dqi ul{grid-template-columns:1fr}.dqa{flex-direction:column;align-items:stretch}}\n/* A long summary scrolls inside its panel, so the slide keeps its size (24 October 2026). */\n.fs-body{max-height:calc(100vh - 380px);min-height:120px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px}\n.fs-body::-webkit-scrollbar{width:8px}.fs-body::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:4px}\n@media (max-width:900px){.fs-body{max-height:none;overflow:visible}}\n/* Saved outcome (27 October 2026): what we concluded beside our notes; long notes scroll in their panel. */\n.dqf[hidden],.fs-go[hidden]{display:none!important}\n.dr{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(26px,3.5vw,56px);align-items:start;margin-top:20px}\n.dr .kick{margin-bottom:12px}\n.dr-c{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}\n.dr-c li{font-size:clamp(20px,1.65vw,25px);line-height:1.4;color:#1f2a33;border-left:4px solid #9e1630;padding:4px 0 4px 18px}\n.dr-n{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:16px 22px;max-height:calc(100vh - 360px);min-height:120px;overflow-y:auto;overscroll-behavior:contain}\n.dr-n p{font-size:17.5px;line-height:1.6;color:#36424c;margin:0}.dr-n p+p{margin-top:10px}\n.dr-f{font-size:14px;color:#66727c;margin:10px 0 0}\n@media (max-width:900px){.dr{grid-template-columns:1fr}.dr-n{max-height:none}}\n<\/style><div class=\"dr\"><div><div class=\"kick\">What we concluded<\/div><ul class=\"dr-c\"><li>Coordination from the top when a call is coming, with workshops and peer feedback groups.<\/li><li>An overview of who works on what, for example a spreadsheet once or twice a year.<\/li><li>A lunch meeting where we present failed and successful proposals.<\/li><\/ul><\/div><div><div class=\"kick\">Our notes*<\/div><div class=\"dr-n\"><p>First of all, it is hard to arrange things informally when we do not know who is doing what. We would like something top down: a person who says that a grant is coming and that there will be a workshop, a peer feedback group, and so on, especially if more will be asked of us.<\/p><p>A future lunch meeting in which we present failed proposals, so that we all know who works on what and who has which ideas (see also the YAG’s Failing Forward). We would also like to see proposals that were successful.<\/p><p>A current overview of who is doing what. Why not send out a spreadsheet once or twice a year?<\/p><\/div><p class=\"dr-f\">* Paraphrased with AI from the notes we typed in the meeting on 27 October 2026.<\/p><\/div><\/div><form class=\"dqf big\" data-q=\"3\" hidden><textarea rows=\"6\" maxlength=\"3000\" aria-label=\"Your notes for this question\" placeholder=\"Type your group’s notes here\"><\/textarea><div class=\"dqa\"><span><\/span><button type=\"submit\" class=\"btn primary\">Add<\/button><\/div><\/form><p class=\"dqs\" aria-live=\"polite\"><\/p><div class=\"dqi\" hidden><p class=\"dqc\"><\/p><ul><\/ul><\/div>", "script": "/* Discussion scene: colleagues type ideas per question; ideas are stored by the discussion API.\n   After the meeting (27 October 2026) the scene shows the saved outcome, built into its HTML (.dr) by build_deck.py;\n   ?meeting=<name> hides it and turns the live box back on for that meeting.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst REC = !params.get('meeting') && cfg.record;\nconst status = section.querySelector('.dqs');\nconst say = (text, err) => { status.textContent = text || ''; status.classList.toggle('err', !!err); };\n\nfunction show(ideas) {\n  section.querySelectorAll('.dqf').forEach((form) => {\n    const q = +form.dataset.q;\n    const mine = ideas.filter((idea) => idea.question === q);\n    const box = form.parentElement.querySelector('.dqi');\n    box.querySelector('.dqc').textContent = mine.length ? `${mine.length} ${mine.length === 1 ? 'answer' : 'answers'} so far` : 'No answers yet';\n    box.querySelector('ul').innerHTML = mine.map((idea) => `<li>${esc(idea.text)}<\/li>`).join('');\n    box.hidden = !mine.length;\n  });\n  setTimeout(() => dispatchEvent(new Event('resize')), 50);\n}\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/ideas?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'unavailable');\n    show((await r.json()).ideas.reverse());\n    if (status.classList.contains('err')) say('');\n  } catch (e) {\n    say('The answers could not be loaded. Check the internet connection and try again.', true);\n  }\n}\n\nif (!REC) {\n  section.querySelector('.dr')?.remove();\n  section.querySelectorAll('.dqf').forEach((form) => {\n    form.hidden = false;\n    const field = form.querySelector('textarea');\n    const button = form.querySelector('button');\n    field.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });\n    form.addEventListener('submit', async (e) => {\n      e.preventDefault();\n      const text = field.value.trim();\n      if (text.length < 3) { field.focus(); return; }\n      button.disabled = true;\n      say('Saving…');\n      try {\n        const r = await fetch(`${API}/api/discussion/ideas`, {\n          method: 'POST', headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ meeting: MEETING, question: +form.dataset.q, text }),\n        });\n        const data = await r.json().catch(() => ({}));\n        if (!r.ok) throw new Error(data.error || 'The answer could not be saved.');\n        field.value = '';\n        say('Thank you, your answer is saved.');\n        await load();\n      } catch (err) {\n        say(err.message && !/fetch/i.test(err.message) ? err.message : 'The answer could not be saved. Check the internet connection and try again.', true);\n      } finally {\n        button.disabled = false;\n      }\n    });\n  });\n\n  /* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\n  let timer = 0;\n  new IntersectionObserver((entries) => entries.forEach((entry) => {\n    clearInterval(timer);\n    if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n  }), { threshold: 0.3 }).observe(section);\n}\n"}, {"type": "figure", "id": "next", "nav": "What we agree", "kicker": "Grants", "title": "What we agree", "lead": "Our answers from 27 October, summarised during the meeting.", "html": "<div class=\"fs\"><section class=\"fs-sum\" aria-live=\"polite\"><div class=\"fs-head\"><div class=\"kick\">Summary of our discussion<\/div><button type=\"button\" class=\"btn primary fs-go\" disabled hidden>Summarise the discussion<\/button><\/div><div class=\"fs-body\"><p class=\"fs-empty\">The summary of the discussion appears here.<\/p><\/div><p class=\"fs-meta\"><\/p><\/section><aside class=\"fs-side\"><div><b>This meeting<\/b><p>We choose what to try this year and who organises it.<\/p><\/div><div><b>Planning an application?<\/b><p>Let me and Lars know early, so we can find readers and a practice panel in time. <a href=\"https://hjvandebrake.github.io/hrmob-research-dashboard/#faq/grant-steps\" target=\"_blank\" rel=\"noopener\">See the steps for an application<\/a><\/p><\/div><div><b>AI survey<\/b><p>Ten minutes, and your answers shape our proposal. <a href=\"https://rug.eu.qualtrics.com/jfe/form/SV_3UxGEEQoxMODyVE\" target=\"_blank\" rel=\"noopener\">Take the survey<\/a><\/p><\/div><a class=\"btn\" href=\"mailto:h.j.van.de.brake@rug.nl?subject=Grant%20plans&amp;body=Call%20or%20scheme%3A%0APlanned%20deadline%3A%0AHelp%20I%20would%20like%3A%0A\">Tell me about your plans<\/a><\/aside><\/div>", "script": "/* Final scene: shows the AI summary of the discussion ideas and lets the presenter create or update it.\n   After the meeting the deck carries the saved summary (DECK.meta.discussion.record); ?meeting=<name> goes live again.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst QUESTIONS = cfg.questions;\nconst REC = !params.get('meeting') && cfg.record;\nconst body = section.querySelector('.fs-body');\nconst meta = section.querySelector('.fs-meta');\nconst go = section.querySelector('.fs-go');\nlet busy = false;\n\nconst plural = (n) => `${n} ${n === 1 ? 'answer' : 'answers'}`;\n\nfunction render(data) {\n  const s = data.summary;\n  go.textContent = s ? 'Update the summary' : 'Summarise the discussion';\n  go.disabled = busy || !data.ideaCount;\n  meta.classList.remove('err');\n  if (!s) {\n    body.innerHTML = `<p class=\"fs-empty\">${data.ideaCount ? `${plural(data.ideaCount)} so far.` : 'The summary of the discussion appears here.'}<\/p>`;\n    meta.innerHTML = '';\n    return;\n  }\n  body.innerHTML = `${s.overview ? `<p class=\"fs-ov\">${esc(s.overview)}<\/p>` : ''}\n    <div class=\"fs-grid\">${s.questions.map((q) => `<div><h4>${esc(QUESTIONS[q.question - 1] || '')}<\/h4><ul>${q.points.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div>\n    ${s.proposals.length ? `<div class=\"fs-prop\"><h4>Proposals to decide on<\/h4><ul>${s.proposals.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul><\/div>` : ''}`;\n  const fresh = data.ideaCount - data.summarisedIdeas;\n  setTimeout(() => dispatchEvent(new Event('resize')), 50); // let the engine refit the scene to the new content\n  meta.innerHTML = REC ? `Summarised with AI from our ${plural(data.summarisedIdeas)}, ${REC.date}.`\n    : `Summary of ${plural(data.summarisedIdeas)}${fresh > 0 ? `, ${fresh} new since then` : ''}`;\n}\n\nif (REC) render({ summary: REC.summary, ideaCount: REC.summarisedIdeas, summarisedIdeas: REC.summarisedIdeas });\nelse go.hidden = false;\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/summary?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error();\n    render(await r.json());\n  } catch (e) {\n    go.disabled = true;\n    meta.textContent = 'The discussion service could not be reached.';\n    meta.classList.add('err');\n  }\n}\n\ngo.addEventListener('click', async () => {\n  busy = true;\n  go.disabled = true;\n  meta.classList.remove('err');\n  meta.textContent = 'Summarising…';\n  try {\n    const r = await fetch(`${API}/api/discussion/summary`, {\n      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ meeting: MEETING }),\n    });\n    const data = await r.json().catch(() => ({}));\n    if (!r.ok) throw new Error(data.error || 'The summary could not be made.');\n    busy = false;\n    render(data);\n  } catch (err) {\n    busy = false;\n    go.disabled = false;\n    meta.textContent = err.message && !/fetch/i.test(err.message) ? err.message : 'The summary could not be made. Check the internet connection and try again.';\n    meta.classList.add('err');\n  }\n});\n\nif (!REC) new IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting && !busy) load(); }), { threshold: 0.3 }).observe(section);\n"}]}</script>
<script>
/* ---------- data and helpers ---------- */
const DECK=JSON.parse(document.getElementById('deck').textContent),M=DECK.meta||{};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC={};(DECK.sources||[]).forEach((s,i)=>SRC[s.id]=Object.assign({number:i+1},s));
const cite=t=>esc(t).replace(/\{\{([^}]+)\}\}/g,(_,id)=>SRC[id]?`<button class="cite" data-src="${esc(id)}">[${SRC[id].number}]</button>`:'');
const plain=t=>String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS=(M.scale_labels)||['Small','Moderate','Large','Very large'];
const DEFCAT={opportunity:{label:'Opportunity',color:'#9fcfb0',light:'#cfe6d6',ink:'#1d5a3d'},mixed:{label:'Mixed',color:'#ecd27c',light:'#f6e5ad',ink:'#6a4d0c'},risk:{label:'Risk',color:'#e4a294',light:'#f2cdc5',ink:'#8a2b1d'}};
const DET=[];const det=o=>{if(!o)return '';DET.push(o);return ` data-det="${DET.length-1}"`;};
const byId={};(DECK.scenes||[]).forEach((s,i)=>{s.id=s.id||'s'+i;byId[s.id]=s;});
if(M.logo)$('#logo').src=M.logo;$('#logo').alt=M.logo_alt||'';document.title=M.title||'Presentation';
$('#tools').innerHTML=`<span class="ttl">${esc(M.title||'')}</span>${(DECK.readings||[]).map(r=>`<button data-reading="${esc(r.id)}">${esc(r.label)}</button>`).join('')}${(DECK.sources||[]).length?'<button id="srcBtn">Sources</button>':''}<button id="fsBtn">Present</button>`;

/* ---------- scene renderers ---------- */
const R={};
const head=(s,big)=>`${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h2 class="reveal d1">${esc(s.title)}</h2>${s.lead?`<p class="${big?'statement':'lead'} reveal d2">${cite(s.lead)}</p>`:''}`;
