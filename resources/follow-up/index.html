rt. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "With faculty support", "text": "The researcher tests whether the AI-assisted literature search finds a set of studies already known to be relevant, and records why each borderline study was left out. This shows whether the search missed or skewed part of the literature."}, {"heading": "Without a faculty programme", "text": "Within the limited time of a project, a postdoc or assistant professor can use AI to screen studies and see how other fields measure the same relationship, and so weigh more measures and designs. The researcher still reads the original studies behind the chosen measures and design. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "When a statistical meta-analysis relies on the AI’s final list of eligible studies and no one has checked that list for missed studies, the judgment becomes mixed or turns to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|design": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "AI widens design options, but design errors are costly", "title_after": "A methods expert’s check makes AI design ideas useful", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Design", "title": "AI widens design options, but design errors are costly", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "Why", "text": "Alternative designs from AI give a postdoc or assistant professor who runs an independent project more ways to answer the research question. But a wrong identification strategy or measurement choice may cancel out the time AI saved and weaken the project’s main finding."}, {"heading": "With faculty support", "text": "A methods colleague checks what the AI-suggested design compares with what, and the researcher states the main comparisons before seeing any results. If AI-generated variables are used, a hand-coded sample corrects for their errors, so design errors are caught before they cost the project."}, {"heading": "Sources", "list": ["{{S14-305}} Austin et al. (2026), An Experimental Comparison of AI-Enabled Semi-Structured Interviews and Fixed Surveys: Respondent Satisfaction, Response Patterns, Quality, and Representation", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "Designs the researcher knows well and whose assumptions can be tested strengthen the case for opportunity. When the researcher is new to the identification strategy and no one reviews the design, the judgment moves to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Quantitative · Design", "title": "A methods expert’s check makes AI design ideas useful", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "With faculty support", "text": "A methods colleague checks what the AI-suggested design compares with what, and the researcher states the main comparisons before seeing any results. If AI-generated variables are used, a hand-coded sample corrects for their errors, so design errors are caught before they cost the project."}, {"heading": "Without a faculty programme", "text": "Alternative designs from AI give a postdoc or assistant professor who runs an independent project more ways to answer the research question. But a wrong identification strategy or measurement choice may cancel out the time AI saved and weaken the project’s main finding."}, {"heading": "Sources", "list": ["{{S14-305}} Austin et al. (2026), An Experimental Comparison of AI-Enabled Semi-Structured Interviews and Fixed Surveys: Respondent Satisfaction, Response Patterns, Quality, and Representation", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "Designs the researcher knows well and whose assumptions can be tested strengthen the case for opportunity. When the researcher is new to the identification strategy and no one reviews the design, the judgment moves to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|data": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI makes larger datasets feasible, if the data stay safe", "title_after": "Safe university AI and validation enable larger datasets", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Data / sources", "title": "AI makes larger datasets feasible, if the data stay safe", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "Why", "text": "Because AI lowers the cost of extracting and cleaning records, a postdoc or assistant professor can afford a dataset that spans several years or countries. The benefit depends on validation showing measurement invariance, that is, that each variable measures the same thing in every year and country compared. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers for sensitive or licensed data. The data plan funds a hand-coded sample and advice on correcting the estimates for records that the AI mislabels, so a larger dataset becomes both safe and trustworthy."}, {"heading": "Sources", "list": ["{{S14-301}} Duan and Pelger (2026), Inference with AI-Generated Covariates", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "With public data or approved university tools, the judgment moves to opportunity. Personal or licensed data in tools the university has not approved, records that cover a non-random subset of the population, or AI errors that are correlated with the treatment or the outcome would turn it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Quantitative · Data / sources", "title": "Safe university AI and validation enable larger datasets", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers for sensitive or licensed data. The data plan funds a hand-coded sample and advice on correcting the estimates for records that the AI mislabels, so a larger dataset becomes both safe and trustworthy."}, {"heading": "Without a faculty programme", "text": "Because AI lowers the cost of extracting and cleaning records, a postdoc or assistant professor can afford a dataset that spans several years or countries. The benefit depends on validation showing measurement invariance, that is, that each variable measures the same thing in every year and country compared. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "Sources", "list": ["{{S14-301}} Duan and Pelger (2026), Inference with AI-Generated Covariates", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "With public data or approved university tools, the judgment moves to opportunity. Personal or licensed data in tools the university has not approved, records that cover a non-random subset of the population, or AI errors that are correlated with the treatment or the outcome would turn it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|analysis": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI speeds up analysis, but results need careful checks", "title_after": "A colleague’s code review makes faster analysis pay off", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Analysis & interpretation", "title": "AI speeds up analysis, but results need careful checks", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "Why", "text": "AI coding tools let a postdoc or assistant professor run robustness checks and reproduce earlier analyses faster. Before claiming a finding, the researcher still has to check the larger number of specifications, and a reproduced coefficient with the same sign does not establish the finding."}, {"heading": "With faculty support", "text": "The researcher reruns the main estimate independently and tests the AI-written code on a small example with a known answer, while a specialist in the method reviews the measures and the interpretation. Faster analysis then produces results the researcher can defend."}, {"heading": "Sources", "list": ["{{S08-010}} Alizadeh et al. (2026), AI Coding Agents Can Reproduce Social Science Findings", "{{S14-304}} Kohler et al. (2026), Read the Paper, Write the Code: Agentic Reproduction of Social-Science Results", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice", "{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science"]}, {"heading": "What could change the judgment", "text": "An estimator the researcher knows and has specified in advance moves the judgment towards opportunity, while AI-generated measures or an open-ended search through specifications can move it towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Quantitative · Analysis & interpretation", "title": "A colleague’s code review makes faster analysis pay off", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "With faculty support", "text": "The researcher reruns the main estimate independently and tests the AI-written code on a small example with a known answer, while a specialist in the method reviews the measures and the interpretation. Faster analysis then produces results the researcher can defend."}, {"heading": "Without a faculty programme", "text": "AI coding tools let a postdoc or assistant professor run robustness checks and reproduce earlier analyses faster. Before claiming a finding, the researcher still has to check the larger number of specifications, and a reproduced coefficient with the same sign does not establish the finding."}, {"heading": "Sources", "list": ["{{S08-010}} Alizadeh et al. (2026), AI Coding Agents Can Reproduce Social Science Findings", "{{S14-304}} Kohler et al. (2026), Read the Paper, Write the Code: Agentic Reproduction of Social-Science Results", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice", "{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science"]}, {"heading": "What could change the judgment", "text": "An estimator the researcher knows and has specified in advance moves the judgment towards opportunity, while AI-generated measures or an open-ended search through specifications can move it towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|writing": {"category": "opportunity", "category_after": "opportunity", "level": 4, "title": "AI helps authors write up their own theory and results", "title_after": "AI helps authors write up their own theory and results", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Writing & review", "title": "AI helps authors write up their own theory and results", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial parts of the paper, including the theory and hypotheses, or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim."}, {"heading": "Why", "text": "A postdoc or assistant professor who designed the study and ran the analyses can save time by letting AI draft substantial sections and replies to reviewers. The author remains responsible for every claim in the paper. This includes the theory and hypotheses, where the author has to make sure the argument was not fitted to the results afterwards."}, {"heading": "With faculty support", "text": "The author keeps a list that links each claim to the table supporting it and checks each AI-drafted reply against what the reviewer actually asked. This keeps faster drafting accurate."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S14-204}} Kusumegi et al. (2025), Scientific production in the era of Large Language Models", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If an AI draft turns an association into a causal claim or sidesteps a check the reviewer asked for, the judgment becomes mixed or moves to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Quantitative · Writing & review", "title": "AI helps authors write up their own theory and results", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial parts of the paper, including the theory and hypotheses, or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim."}, {"heading": "With faculty support", "text": "The author keeps a list that links each claim to the table supporting it and checks each AI-drafted reply against what the reviewer actually asked. This keeps faster drafting accurate."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor who designed the study and ran the analyses can save time by letting AI draft substantial sections and replies to reviewers. The author remains responsible for every claim in the paper. This includes the theory and hypotheses, where the author has to make sure the argument was not fitted to the results afterwards."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S14-204}} Kusumegi et al. (2025), Scientific production in the era of Large Language Models", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If an AI draft turns an association into a causal claim or sidesteps a check the reviewer asked for, the judgment becomes mixed or moves to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|question": {"category": "opportunity", "category_after": "opportunity", "level": 1, "title": "AI widens the concepts researchers consider", "title_after": "AI widens the concepts researchers consider", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Question & theory", "title": "AI widens the concepts researchers consider", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer."}, {"heading": "Why", "text": "Concepts suggested by AI can widen the questions a postdoc or assistant professor considers for their own research, and the researcher still decides which question the people or organisations studied can answer. The duties of postdocs and assistant professors differ, but neither title by itself determines the value of this limited use of AI to generate ideas."}, {"heading": "With faculty support", "text": "After the first interviews or site visits, a colleague who knows the method or the topic challenges the chosen research question and records why the alternatives that AI suggested were dropped."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "The judgment becomes mixed if deadline pressure pushes the researcher towards a question many others already ask, or if the researcher does not know the organisation being studied."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Question & theory", "title": "AI widens the concepts researchers consider", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer."}, {"heading": "With faculty support", "text": "After the first interviews or site visits, a colleague who knows the method or the topic challenges the chosen research question and records why the alternatives that AI suggested were dropped."}, {"heading": "Without a faculty programme", "text": "Concepts suggested by AI can widen the questions a postdoc or assistant professor considers for their own research, and the researcher still decides which question the people or organisations studied can answer. The duties of postdocs and assistant professors differ, but neither title by itself determines the value of this limited use of AI to generate ideas."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "The judgment becomes mixed if deadline pressure pushes the researcher towards a question many others already ask, or if the researcher does not know the organisation being studied."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|literature": {"category": "mixed", "category_after": "opportunity", "level": 3, "title": "Faster screening, but AI can blur different concepts", "title_after": "A table of key studies keeps similar concepts apart", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Literature", "title": "Faster screening, but AI can blur different concepts", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missing studies and differing theories and reads central studies in full."}, {"heading": "Why", "text": "Faster screening may protect a postdoc’s or assistant professor’s time for independent work, but treating studies that use one name for different constructs as if they agree can weaken the paper’s argument. Contract pressure and teaching load decide whether the researcher has time to read the central studies in full. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "The researcher documents the literature search so that others could repeat it and compares the central studies in a table on who was studied, the method, the definition of the main concept and contrary evidence. A librarian checks the search where possible, which keeps concepts with the same name apart."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S07-15}} Braun and Clarke (2006), Using thematic analysis in psychology", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "When the researcher spends the time saved on more citations or submissions without reading the cited studies, the judgment leans towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Literature", "title": "A table of key studies keeps similar concepts apart", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missing studies and differing theories and reads central studies in full."}, {"heading": "With faculty support", "text": "The researcher documents the literature search so that others could repeat it and compares the central studies in a table on who was studied, the method, the definition of the main concept and contrary evidence. A librarian checks the search where possible, which keeps concepts with the same name apart."}, {"heading": "Without a faculty programme", "text": "Faster screening may protect a postdoc’s or assistant professor’s time for independent work, but treating studies that use one name for different constructs as if they agree can weaken the paper’s argument. Contract pressure and teaching load decide whether the researcher has time to read the central studies in full. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S07-15}} Braun and Clarke (2006), Using thematic analysis in psychology", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "When the researcher spends the time saved on more citations or submissions without reading the cited studies, the judgment leans towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|design": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "AI plans save time but can hide access problems", "title_after": "A pilot interview round shows access problems early", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Design", "title": "AI plans save time but can hide access problems", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question."}, {"heading": "Why", "text": "A full AI draft of the sampling plan and interview guide can save a postdoc or assistant professor planning time, but a plan that looks complete may hide participants who cannot be reached, missing consent, or follow-up questions that steer answers. How much authority the researcher actually has over the project differs between postdoc and assistant professor appointments."}, {"heading": "With faculty support", "text": "Before recruitment, the sampling plan and the interview guide go through a methods review and a data and ethics review, and the researcher runs a small pilot. Problems with access or consent then appear before they can damage the study."}, {"heading": "Sources", "list": ["{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S06-025}} Jack et al. (2026), Automating the qualitative interview? Using Gen AI chatbots in social science research", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "Recruitment that begins before anyone has checked whether planned participants can be reached and how they give consent turns the judgment to risk, especially in a project with limited time."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Design", "title": "A pilot interview round shows access problems early", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question."}, {"heading": "With faculty support", "text": "Before recruitment, the sampling plan and the interview guide go through a methods review and a data and ethics review, and the researcher runs a small pilot. Problems with access or consent then appear before they can damage the study."}, {"heading": "Without a faculty programme", "text": "A full AI draft of the sampling plan and interview guide can save a postdoc or assistant professor planning time, but a plan that looks complete may hide participants who cannot be reached, missing consent, or follow-up questions that steer answers. How much authority the researcher actually has over the project differs between postdoc and assistant professor appointments."}, {"heading": "Sources", "list": ["{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S06-025}} Jack et al. (2026), Automating the qualitative interview? Using Gen AI chatbots in social science research", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "Recruitment that begins before anyone has checked whether planned participants can be reached and how they give consent turns the judgment to risk, especially in a project with limited time."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|data": {"category": "risk", "category_after": "mixed", "level": 4, "title": "Interview data are at risk in unapproved AI tools", "title_after": "Safe tools protect data, but AI interviews need trials", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Data / sources", "title": "Interview data are at risk in unapproved AI tools", "pill": {"text": "Risk", "color": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes."}, {"heading": "Why", "text": "Transcribing and organising interviews with AI can save a postdoc or assistant professor substantial time, and AI interviews can elicit richer answers than fixed questions. Who chooses to take part, how well the AI asks follow-up questions, and confidentiality concerns may still change what the interviews show, and no check of transcripts can correct for people who never agreed to an AI interview. Interview recordings, transcripts, and field notes nearly always contain personal data, and processing them in AI tools that the university has not approved can breach what participants consented to and data-protection law."}, {"heading": "With faculty support", "text": "The faculty offers transcription and AI models on university servers for interview data, and the researcher checks a sample of transcripts against the audio. AI-led interviews are first compared with ordinary interviews on who takes part, who drops out and what people say, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S14-401}} Chopra and Haaland (2026), Conducting Qualitative Interviews with AI", "{{S14-402}} Wuttke et al. (2025), AI Conversational Interviewing: Transforming Surveys with LLMs as Adaptive Interviewers", "{{S14-404}} Wollin-Giering et al. (2024), Automatic Transcription of English and German Qualitative Interviews", "{{S14-411}} Danó et al. (2025), AI meets marketing research: Virtual interviewers and the challenges of regional and demographic adoption", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "Data preparation on approved tools on university servers can be an opportunity. Recordings or transcripts in tools the university has not approved, or AI interviews on sensitive topics, keep it at risk, though some participants may prefer AI. Interest in AI interviews stated in one online panel does not predict take-up in FEB fieldwork."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Data / sources", "title": "Safe tools protect data, but AI interviews need trials", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes."}, {"heading": "With faculty support", "text": "The faculty offers transcription and AI models on university servers for interview data, and the researcher checks a sample of transcripts against the audio. AI-led interviews are first compared with ordinary interviews on who takes part, who drops out and what people say, so the judgment improves to mixed."}, {"heading": "Without a faculty programme", "text": "Transcribing and organising interviews with AI can save a postdoc or assistant professor substantial time, and AI interviews can elicit richer answers than fixed questions. Who chooses to take part, how well the AI asks follow-up questions, and confidentiality concerns may still change what the interviews show, and no check of transcripts can correct for people who never agreed to an AI interview. Interview recordings, transcripts, and field notes nearly always contain personal data, and processing them in AI tools that the university has not approved can breach what participants consented to and data-protection law."}, {"heading": "Sources", "list": ["{{S14-401}} Chopra and Haaland (2026), Conducting Qualitative Interviews with AI", "{{S14-402}} Wuttke et al. (2025), AI Conversational Interviewing: Transforming Surveys with LLMs as Adaptive Interviewers", "{{S14-404}} Wollin-Giering et al. (2024), Automatic Transcription of English and German Qualitative Interviews", "{{S14-411}} Danó et al. (2025), AI meets marketing research: Virtual interviewers and the challenges of regional and demographic adoption", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "Data preparation on approved tools on university servers can be an opportunity. Recordings or transcripts in tools the university has not approved, or AI interviews on sensitive topics, keep it at risk, though some participants may prefer AI. Interest in AI interviews stated in one online panel does not predict take-up in FEB fieldwork."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|analysis": {"category": "mixed", "category_after": "mixed", "level": 2, "title": "AI speeds up coding, but its themes need checking", "title_after": "AI speeds up coding, but its themes need checking", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Analysis & interpretation", "title": "AI speeds up coding, but its themes need checking", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI applies a codebook where the study uses fixed codes, compares passages and proposes themes or interpretations; the researcher judges each against the full transcripts, field notes and the analysis method the study reports."}, {"heading": "Why", "text": "A postdoc or assistant professor can use AI to speed up coding with a fixed codebook and to suggest rival readings. Errors in AI-proposed themes and quotations create checking work and may distort what participants meant in the situation they described. Judging AI codes and themes well takes knowledge of the method and of the interviews, whatever the researcher’s title."}, {"heading": "With faculty support", "text": "The researcher checks the AI’s coding of rare and difficult categories, links each theme to its excerpts, and discusses contradicting cases with a colleague who knows the method. Interpretation still needs much checking, so the judgment stays mixed."}, {"heading": "Sources", "list": ["{{S14-405}} Hill et al. (2026), Large language models for thematic analysis in healthcare research: A blinded mixed-methods comparison with human analysts", "{{S14-406}} Mehta et al. (2025), Evaluation of large language models within GenAI in qualitative research", "{{S14-407}} Levit and Saban (2025), When investigator meets large language models: a qualitative analysis of cancer patient decision-making journeys", "{{S09-030}} Yu et al. (2024), Heterogeneity and predictors of the effects of AI assistance on radiologists"]}, {"heading": "What could change the judgment", "text": "When most of the project uses fixed codes, the judgment may shift to opportunity. A theme that rests on AI restating the same passages in different words, without other evidence, shifts it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Analysis & interpretation", "title": "AI speeds up coding, but its themes need checking", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI applies a codebook where the study uses fixed codes, compares passages and proposes themes or interpretations; the researcher judges each against the full transcripts, field notes and the analysis method the study reports."}, {"heading": "With faculty support", "text": "The researcher checks the AI’s coding of rare and difficult categories, links each theme to its excerpts, and discusses contradicting cases with a colleague who knows the method. Interpretation still needs much checking, so the judgment stays mixed."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor can use AI to speed up coding with a fixed codebook and to suggest rival readings. Errors in AI-proposed themes and quotations create checking work and may distort what participants meant in the situation they described. Judging AI codes and themes well takes knowledge of the method and of the interviews, whatever the researcher’s title."}, {"heading": "Sources", "list": ["{{S14-405}} Hill et al. (2026), Large language models for thematic analysis in healthcare research: A blinded mixed-methods comparison with human analysts", "{{S14-406}} Mehta et al. (2025), Evaluation of large language models within GenAI in qualitative research", "{{S14-407}} Levit and Saban (2025), When investigator meets large language models: a qualitative analysis of cancer patient decision-making journeys", "{{S09-030}} Yu et al. (2024), Heterogeneity and predictors of the effects of AI assistance on radiologists"]}, {"heading": "What could change the judgment", "text": "When most of the project uses fixed codes, the judgment may shift to opportunity. A theme that rests on AI restating the same passages in different words, without other evidence, shifts it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-qualitative|writing": {"category": "mixed", "category_after": "opportunity", "level": 3, "title": "AI drafts help, but each claim needs interview evidence", "title_after": "AI drafts help when there is time to check each quotation", "details": {"kicker": "Postdocs & assistant professors · Qualitative · Writing & review", "title": "AI drafts help, but each claim needs interview evidence", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts parts of the paper, including the theory developed from the material, or replies to reviewers from the project’s excerpts, field notes and interpretive outline; the researcher checks that claims and quotations keep their meaning and that contrary cases remain."}, {"heading": "Why", "text": "AI drafts of manuscripts and replies to reviewers can protect a postdoc’s or assistant professor’s time. A paper the researcher writes independently must still link each claim to the interviews and deal with passages that contradict it, and faster drafting may mean more text to check."}, {"heading": "With faculty support", "text": "The researcher sets aside time to check each claim against its interview excerpts, to read every quotation in its original context, and to compare each reply to reviewers with the changes actually made. With that time, AI drafting saves effort without weakening the paper."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S14-406}} Mehta et al. (2025), Evaluation of large language models within GenAI in qualitative research", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "When deadlines leave no time to check the draft against the interviews, or the AI draft tells a neat story that leaves out the cases that contradict it, the judgment leans towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Qualitative · Writing & review", "title": "AI drafts help when there is time to check each quotation", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts parts of the paper, including the theory developed from the material, or replies to reviewers from the project’s excerpts, field notes and interpretive outline; the researcher checks that claims and quotations keep their meaning and that contrary cases remain."}, {"heading": "With faculty support", "text": "The researcher sets aside time to check each claim against its interview excerpts, to read every quotation in its original context, and to compare each reply to reviewers with the changes actually made. With that time, AI drafting saves effort without weakening the paper."}, {"heading": "Without a faculty programme", "text": "AI drafts of manuscripts and replies to reviewers can protect a postdoc’s or assistant professor’s time. A paper the researcher writes independently must still link each claim to the interviews and deal with passages that contradict it, and faster drafting may mean more text to check."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S14-406}} Mehta et al. (2025), Evaluation of large language models within GenAI in qualitative research", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "When deadlines leave no time to check the draft against the interviews, or the AI draft tells a neat story that leaves out the cases that contradict it, the judgment leans towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|question": {"category": "opportunity", "category_after": "opportunity", "level": 1, "title": "AI helps experts drop weak questions early", "title_after": "AI helps experts drop weak questions early", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Question & theory", "title": "AI helps experts drop weak questions early", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes theoretical questions, concepts, mechanisms and what a review should cover; the researcher chooses the problem and explains what it adds to existing theories or reviews."}, {"heading": "Why", "text": "A postdoc or assistant professor who knows the field well can use framings and objections from AI to drop weak questions early, while remaining responsible for showing what the question adds to existing theory. The researcher can still go wrong by fitting a theory to an attractive result after the fact, which is known as HARKing."}, {"heading": "With faculty support", "text": "Before starting, the researcher checks whether closely related papers already ask the question and states one rival explanation."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "A researcher who is new to the field, or who asks AI to justify a result after seeing it, which is a form of HARKing, makes the judgment mixed or moves it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Question & theory", "title": "AI helps experts drop weak questions early", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes theoretical questions, concepts, mechanisms and what a review should cover; the researcher chooses the problem and explains what it adds to existing theories or reviews."}, {"heading": "With faculty support", "text": "Before starting, the researcher checks whether closely related papers already ask the question and states one rival explanation."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor who knows the field well can use framings and objections from AI to drop weak questions early, while remaining responsible for showing what the question adds to existing theory. The researcher can still go wrong by fitting a theory to an attractive result after the fact, which is known as HARKing."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "A researcher who is new to the field, or who asks AI to justify a result after seeing it, which is a form of HARKing, makes the judgment mixed or moves it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|literature": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI widens the search, but missed studies weaken reviews", "title_after": "Documenting the literature search makes AI reviews reliable", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Literature", "title": "AI widens the search, but missed studies weaken reviews", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies; the researcher checks which studies and fields the search missed and reads the originals the argument rests on."}, {"heading": "Why", "text": "A postdoc or assistant professor can use AI to widen a search and compare neighbouring literatures, but a review’s conclusions rest on that comparison. A search that finds all the papers the researcher already knows can still miss a field that uses other terms, so a faster synthesis may need a separate check of which relevant studies the search missed. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "The researcher keeps the exact search terms, tests whether the literature search finds papers known to be relevant, and links each major claim in the review to the original studies. Gaps and one-sided selections then show up before the review is written."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S14-506}} Lau and Golder (2025), Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies", "{{S13-305}} Elsbach and Knippenberg (2020), Creating High-Impact Literature Reviews: An Argument for 'Integrative Reviews'", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "A narrow search within a debate the researcher knows well can be an opportunity, while a review that claims to include all relevant studies without checking how many the search missed can be a risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Literature", "title": "Documenting the literature search makes AI reviews reliable", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies; the researcher checks which studies and fields the search missed and reads the originals the argument rests on."}, {"heading": "With faculty support", "text": "The researcher keeps the exact search terms, tests whether the literature search finds papers known to be relevant, and links each major claim in the review to the original studies. Gaps and one-sided selections then show up before the review is written."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor can use AI to widen a search and compare neighbouring literatures, but a review’s conclusions rest on that comparison. A search that finds all the papers the researcher already knows can still miss a field that uses other terms, so a faster synthesis may need a separate check of which relevant studies the search missed. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S14-506}} Lau and Golder (2025), Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies", "{{S13-305}} Elsbach and Knippenberg (2020), Creating High-Impact Literature Reviews: An Argument for 'Integrative Reviews'", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "A narrow search within a debate the researcher knows well can be an opportunity, while a review that claims to include all relevant studies without checking how many the search missed can be a risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|design": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "AI suggests designs, but weak ones limit the paper", "title_after": "A colleague tests AI-suggested designs before they are used", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Design", "title": "AI suggests designs, but weak ones limit the paper", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a model’s assumptions, a conceptual framework or an integrative-review procedure; the researcher tests whether the design can yield an insight existing theories or reviews lack."}, {"heading": "Why", "text": "For a postdoc or assistant professor with a defined problem, AI can vary the assumptions or the review procedure. The chosen design, however, determines which studies or derivations count as evidence and what the paper can add to existing theory, and both the speed of generating options and the cost of a plausible but weak design are substantial."}, {"heading": "With faculty support", "text": "With a colleague from the field or a methods specialist, the researcher tests one assumption of the theoretical model or pilots the review plan on a few studies. Weak designs are then found before the paper depends on them."}, {"heading": "Sources", "list": ["{{S14-507}} Annie Liang (2025), Using Machine Learning to Generate, Clarify, and Improve Economic Models", "{{S13-306}} Richard Makadok (2022), Guidance for AMR Authors about Making Formal Theory Accessible", "{{S14-501}} Ramaul et al. (2025), Rethinking How We Theorize AI in Organization and Management: A Problematizing Review of Rationality and Anthropomorphism", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If the problem, the assumptions, and the procedure all come from AI and the researcher cannot defend them, the judgment moves towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Design", "title": "A colleague tests AI-suggested designs before they are used", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a model’s assumptions, a conceptual framework or an integrative-review procedure; the researcher tests whether the design can yield an insight existing theories or reviews lack."}, {"heading": "With faculty support", "text": "With a colleague from the field or a methods specialist, the researcher tests one assumption of the theoretical model or pilots the review plan on a few studies. Weak designs are then found before the paper depends on them."}, {"heading": "Without a faculty programme", "text": "For a postdoc or assistant professor with a defined problem, AI can vary the assumptions or the review procedure. The chosen design, however, determines which studies or derivations count as evidence and what the paper can add to existing theory, and both the speed of generating options and the cost of a plausible but weak design are substantial."}, {"heading": "Sources", "list": ["{{S14-507}} Annie Liang (2025), Using Machine Learning to Generate, Clarify, and Improve Economic Models", "{{S13-306}} Richard Makadok (2022), Guidance for AMR Authors about Making Formal Theory Accessible", "{{S14-501}} Ramaul et al. (2025), Rethinking How We Theorize AI in Organization and Management: A Problematizing Review of Rationality and Anthropomorphism", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If the problem, the assumptions, and the procedure all come from AI and the researcher cannot defend them, the judgment moves towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|data": {"category": "opportunity", "category_after": "opportunity", "level": 3, "title": "AI screens and codes many studies for a review", "title_after": "AI screens and codes many studies for a review", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Data / sources", "title": "AI screens and codes many studies for a review", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For integrative reviews, AI collects the studies, removes duplicates and extracts information from them; the researcher checks for missed studies, wrong inclusion decisions and extraction errors. Purely theoretical papers collect no data at this stage."}, {"heading": "Why", "text": "In a review with explicit inclusion criteria, AI can screen many records and extract the same items from each study while a postdoc or assistant professor who knows the literature checks influential studies and borderline cases. A prompt that worked in one review may fail in another and errors vary by task, so the AI has to be tuned and checked against human decisions."}, {"heading": "With faculty support", "text": "The researcher checks how many known relevant studies the AI screening finds, reviews a sample of the rejected records, and links each extracted item back to its paper."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S07-20}} Clark et al. (2025), Generative artificial intelligence use in evidence synthesis: A systematic review", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "The judgment applies to reviews only, since purely theoretical papers have no data stage, and it becomes mixed when the search spans fields that use different terms and the original papers cannot be accessed."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Data / sources", "title": "AI screens and codes many studies for a review", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For integrative reviews, AI collects the studies, removes duplicates and extracts information from them; the researcher checks for missed studies, wrong inclusion decisions and extraction errors. Purely theoretical papers collect no data at this stage."}, {"heading": "With faculty support", "text": "The researcher checks how many known relevant studies the AI screening finds, reviews a sample of the rejected records, and links each extracted item back to its paper."}, {"heading": "Without a faculty programme", "text": "In a review with explicit inclusion criteria, AI can screen many records and extract the same items from each study while a postdoc or assistant professor who knows the literature checks influential studies and borderline cases. A prompt that worked in one review may fail in another and errors vary by task, so the AI has to be tuned and checked against human decisions."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S07-20}} Clark et al. (2025), Generative artificial intelligence use in evidence synthesis: A systematic review", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "The judgment applies to reviews only, since purely theoretical papers have no data stage, and it becomes mixed when the search spans fields that use different terms and the original papers cannot be accessed."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|analysis": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "AI can make up mechanisms that look like new theory", "title_after": "Checking proofs and sources exposes made-up theory", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Analysis & interpretation", "title": "AI can make up mechanisms that look like new theory", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory."}, {"heading": "Why", "text": "A postdoc or assistant professor who knows the model or literature can use AI for comparative statics, which show how a model’s outcome shifts with a parameter, for counterexamples, or for rival syntheses, and software can check some proofs of given statements. Analysis also covers building mechanisms and interpreting studies, where HARKing, a plausible mechanism made up after seeing a pattern, can look like new theory."}, {"heading": "With faculty support", "text": "The researcher checks formal steps with proof-checking software where possible and tests each claim in a synthesis against the original studies and rival assumptions. Mechanisms that AI made up then do not pass as new theory."}, {"heading": "Sources", "list": ["{{S14-505}} Ravi et al. (2026), FormalProofBench: Can Models Write Graduate Level Math Proofs That Are Formally Verified?", "{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S14-507}} Annie Liang (2025), Using Machine Learning to Generate, Clarify, and Improve Economic Models"]}, {"heading": "What could change the judgment", "text": "A formal proof of a given statement is more likely to be an opportunity than open-ended conceptual synthesis. A field new to the researcher, or a story fitted to a result, moves the judgment to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Analysis & interpretation", "title": "Checking proofs and sources exposes made-up theory", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory."}, {"heading": "With faculty support", "text": "The researcher checks formal steps with proof-checking software where possible and tests each claim in a synthesis against the original studies and rival assumptions. Mechanisms that AI made up then do not pass as new theory."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor who knows the model or literature can use AI for comparative statics, which show how a model’s outcome shifts with a parameter, for counterexamples, or for rival syntheses, and software can check some proofs of given statements. Analysis also covers building mechanisms and interpreting studies, where HARKing, a plausible mechanism made up after seeing a pattern, can look like new theory."}, {"heading": "Sources", "list": ["{{S14-505}} Ravi et al. (2026), FormalProofBench: Can Models Write Graduate Level Math Proofs That Are Formally Verified?", "{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S14-507}} Annie Liang (2025), Using Machine Learning to Generate, Clarify, and Improve Economic Models"]}, {"heading": "What could change the judgment", "text": "A formal proof of a given statement is more likely to be an opportunity than open-ended conceptual synthesis. A field new to the researcher, or a story fitted to a result, moves the judgment to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-theory_review|writing": {"category": "opportunity", "category_after": "opportunity", "level": 4, "title": "AI helps authors write up their own theory faster", "title_after": "AI helps authors write up their own theory faster", "details": {"kicker": "Postdocs & assistant professors · Theory / review · Writing & review", "title": "AI helps authors write up their own theory faster", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "Why", "text": "When a postdoc or assistant professor has built the model or synthesis, AI can draft the explanatory sections and a first response to reviewers, and the researcher checks what the draft claims is new and uses the saved time on counterarguments. Studies of AI-written literature reviews support substantial AI drafting, although their citation scores and human ratings measure only part of what a review must do."}, {"heading": "With faculty support", "text": "The researcher traces every central claim and quotation to an original source and links each reviewer request to the change or reply it led to."}, {"heading": "Sources", "list": ["{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis"]}, {"heading": "What could change the judgment", "text": "AI text that adds premises, quietly changes the model, or takes longer to check than it saves would move the judgment to mixed or risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Theory / review · Writing & review", "title": "AI helps authors write up their own theory faster", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "With faculty support"
