ON-CL4-2027-02-DIGITAL-EMERGING-52-two-stage: New approaches for Human/AI collaboration for the workforce of the future", "url": "https://cordis.europa.eu/programme/id/HORIZON_HORIZON-CL4-2027-02-DIGITAL-EMERGING-52-two-stage", "note": "Checked 22 October 2026."}, {"id": "MSCAPF", "authors": "European Commission", "year": "2026", "group": "calls", "title": "MSCA Postdoctoral Fellowships 2027", "url": "https://marie-sklodowska-curie-actions.ec.europa.eu/funding/msca-postdoctoral-fellowships-2027", "note": "Dates to be confirmed, checked 25 September 2026."}, {"id": "KIC", "authors": "NWO", "year": "2026", "group": "calls", "title": "KIC Human Capital and Digital Innovation in the Netherlands", "url": "https://www.nwo.nl/en/calls/kic-human-capital-and-digital-innovation-in-the-netherlands", "note": "Call in preparation, checked 25 September 2026."}], "scenes": [{"type": "hero", "id": "start", "nav": "Start", "kicker": "HRM&OB lunch meeting", "title": "Helping each other with grants", "emphasis": "each other", "break_before": "with", "subtitle": "A follow-up to the research afternoon of 15 September, with a short look back and an update on AI", "meta": "Joost van de Brake", "constellation": false}, {"type": "story", "id": "today", "nav": "Agenda", "kicker": "This meeting", "title": "After the research afternoon", "lead": "At the research afternoon we ran out of time and did not get to grants, so I put grants on the agenda of this lunch meeting. Before we turn to grants, I give a short look back and an update on AI.", "card": {"label": "What I hope we achieve", "text": "I hope we agree on how we can help each other with grant applications and on what we want to organise as a department."}, "steps_label": "Agenda", "steps": [{"text": "Looking back", "goto": "part-back"}, {"text": "An update on AI", "goto": "part-ai"}, {"text": "Grants", "goto": "part-grants"}, {"text": "Discussion", "goto": "discuss-1"}]}, {"type": "divider", "id": "part-back", "nav": "1 · Looking back", "number": "1", "title": "Looking back", "lead": "What we discussed at the research afternoon on 15 September and what has happened since."}, {"type": "figure", "id": "lookback", "nav": "Research afternoon", "steps": true, "kicker": "Looking back", "title": "The research afternoon of 15 September", "lead": "Below is a short overview of our discussion. Click a topic name for more detail.", "html": "<style>.lb{display:grid;grid-template-columns:190px 1fr 1fr;margin-top:22px;border-top:1px solid #e2e6ea;font-size:16.5px;line-height:1.45}.lb>div{padding:14px 18px 14px 0;border-bottom:1px solid #e2e6ea}.lb .lh{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#17365d;padding-top:10px;padding-bottom:10px}.lb .lt{font-weight:700;color:#9e1630;cursor:pointer;font-size:17px}.lb .lt span{display:block;font-weight:400;font-size:13px;color:#66727c;text-decoration:underline;text-underline-offset:3px;margin-top:2px}.lb .lt:hover span{color:#9e1630}.lb p{color:#36424c;margin:0}.lb .st{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:600;border-radius:999px;padding:2px 10px;color:#17365d;background:#e9eef4}.lb .st.done{color:#1b5e3a;background:#e3f2e8}.lb .row{opacity:0;transform:translateY(10px);transition:opacity 1.4s,transform 1.4s}.in .lb .row{opacity:1;transform:none}@media (max-width:900px){.lb{grid-template-columns:1fr}.lb .lh{display:none}.lb>div{padding-right:0}.lb .lt{padding-bottom:0;border-bottom:0}}<\/style><div class=\"lb\"><div class=\"lh\">Topic<\/div><div class=\"lh\">What we discussed<\/div><div class=\"lh\">What we agreed<\/div><div class=\"lt row\" data-detail=\"open\" data-step=\"0\" style=\"transition-delay:0.50s\">Open science<span>More detail<\/span><\/div><div class=\"row\" data-step=\"0\" style=\"transition-delay:0.50s\"><p>We agree that publishing open access is valuable and useful. Some of us raised concerns about how open access expectations fit with journal quality, our careers, and international collaborations.<\/p><\/div><div class=\"row\" data-step=\"0\" style=\"transition-delay:0.50s\"><p>We need clearer guidance on what the faculty expects and why. I have discussed this in the research directors’ group, and an update is coming soon.<\/p><\/div><div class=\"lt row\" data-detail=\"ours\" data-step=\"1\" style=\"transition-delay:0.95s\">Our research<span>More detail<\/span><\/div><div class=\"row\" data-step=\"1\" style=\"transition-delay:0.95s\"><p>We appreciate our lunch seminars, the PhD meetings, and the atmosphere in the group. We discussed more opportunities for feedback on unfinished papers, data sharing, methods support, and student assistants.<\/p><\/div><div class=\"row\" data-step=\"1\" style=\"transition-delay:0.95s\"><p>I would update the dashboard so that we can include our expertise and available data.<\/p><span class=\"st done\">Done. Please check and update your own fields.<\/span><\/div><div class=\"lt row\" data-detail=\"ai\" data-step=\"2\" style=\"transition-delay:1.40s\">AI in research<span>More detail<\/span><\/div><div class=\"row\" data-step=\"2\" style=\"transition-delay:1.40s\"><p>Some of us would welcome funded tools and more practical support, including customised or open models. We also discussed questions around acceptable use, confidentiality, and sustainability.<\/p><\/div><div class=\"row\" data-step=\"2\" style=\"transition-delay:1.40s\"><p>I would discuss these points in the working group on AI in research and update you afterwards.<\/p><span class=\"st\">Update in this meeting<\/span><\/div><div class=\"lt row\" data-detail=\"grants\" data-step=\"3\" style=\"transition-delay:1.85s\">Grants<span>More detail<\/span><\/div><div class=\"row\" data-step=\"3\" style=\"transition-delay:1.85s\"><p>We did not get to this discussion.<\/p><\/div><div class=\"row\" data-step=\"3\" style=\"transition-delay:1.85s\"><p>I would put grants on the agenda of a lunch meeting.<\/p><span class=\"st\">This meeting<\/span><\/div><\/div>", "details": {"open": {"kicker": "Research afternoon · Open science", "title": "Open access, journal quality, and our careers", "blocks": [{"heading": "What we discussed", "text": "Leading journals that are not covered by open access deals remain important for our careers, also because good schools abroad look for publications in these journals. Several of us described open access as a collective action problem that the faculty cannot solve on its own, and international coauthors do not always agree on where to publish."}, {"heading": "Questions for the faculty", "text": "We would like to know why gold open access is discouraged, whether the rules are mainly about costs or about opening research to society, and what we should do when journal fit, our careers, coauthors, and the open access rules conflict."}, {"heading": "Since then", "text": "I have discussed these questions in the research directors’ group, and an update is coming soon."}]}, "ours": {"kicker": "Research afternoon · Our research", "title": "Feedback, data, and support", "blocks": [{"heading": "What we discussed", "text": "Feedback on unfinished working papers was the idea that received most support, for example in a roundtable over lunch. Many of us are willing to share data but do not know how to make it available, and several colleagues would like an overview of the support in the faculty, more help with advanced methods, and student assistants."}, {"heading": "Since then", "text": "The dashboard now lets you search colleagues by topic and method, offer help with methods, and describe datasets and their access conditions, so that we can more easily find and help each other."}, {"heading": "Still open", "text": "Student assistants would require a collective decision, because the workload funds that could pay for them now go to teaching time."}]}, "ai": {"kicker": "Research afternoon · AI in research", "title": "Tools, support, and rules", "blocks": [{"heading": "What we discussed", "text": "Ideas ranged from funded Claude or ChatGPT accounts for everyone to an integrated alternative, and from customised tools to local and open models set up with help from CIT. Many of us want clear rules and a common understanding of what is ethical and what goes too far. We also noted that we do not always need the strongest model, which helps with sustainability."}, {"heading": "Next step", "text": "I discuss these points in the working group, and the second part of this meeting gives an update."}]}, "grants": {"kicker": "Research afternoon · Grants", "title": "Grants are on the agenda of this meeting", "blocks": [{"heading": "Questions for this meeting", "list": ["What has helped us with applications?", "Where would help from colleagues make the biggest difference?", "What should we organise?"]}]}}}, {"type": "divider", "id": "part-ai", "nav": "2 · AI in research", "number": "2", "title": "AI in research", "lead": "An update on the faculty working group on AI in research and a sneak preview of my analysis for that group."}, {"type": "prose", "id": "ai-update", "nav": "AI update", "kicker": "AI in research", "title": "An update on AI", "columns": 1, "paragraphs": [{"head": "Where I left it.", "body": "At the research afternoon I talked mostly about the risks of AI and gave little direction on how we can use AI well."}, {"head": "The working group.", "body": "Since then, the Faculty Board has set up a working group on AI in research, which I chair. Every department has one member, and Rina Koning supports the group from the Research Office. After our first meeting on 19 October, we are preparing a survey among all FEB researchers, and the plan is to send a first proposal to the faculty in December and to try out support in the first half of 2027."}, {"head": "A sneak preview.", "body": "For the working group, I analysed where AI can improve our research and where it can harm it. The next three slides show a preview of that analysis."}]}, {"type": "cards", "id": "ai-aims", "nav": "AI · What we want", "kicker": "AI in research · Sneak preview", "title": "What we want to achieve", "lead": "We want AI to help FEB researchers do better research. Everyone should be able to use AI where it improves their work, check what it produces, and keep learning the craft of research.", "label": "Four principles", "cards": [{"title": "Quality and impact", "text": "We use AI where it improves the quality or impact of research and the gain is worth the total effort. {{SP}}"}, {"title": "Human oversight", "text": "Researchers stay responsible for what AI produces. They check it, can explain it, and decide what goes into their work. {{S03-006}}"}, {"title": "Preserving learning", "text": "We use AI in ways that support skill formation, so that anyone new to a method, PhD candidates included, still learns it themselves. {{S09-003}}"}, {"title": "Equal access", "text": "AI tools and support are available in every department and at every career stage, so that good use of AI does not depend on personal budgets. {{SP}}"}]}, {"type": "overview", "id": "ai-dimensions", "nav": "AI · Three dimensions", "kicker": "AI in research · Sneak preview", "title": "Three dimensions", "lead": "The same AI tools, from chat assistants such as ChatGPT and Claude to coding agents and literature tools such as Elicit, can help one researcher and hurt another. Whether they help depends on three dimensions, which the analysis combines into one assessment of opportunities and risks.", "items": [{"title": "Research stage", "text": "Where in a project AI is used, from the question to the final paper."}, {"title": "Research form", "text": "Whether the research is quantitative, qualitative, or theory and review, because AI output needs different checks in each form."}, {"title": "Career position", "text": "Whether the researcher is a PhD candidate, a postdoc, or an assistant, associate, or full professor, because each position has different tasks."}], "result": {"title": "Combined assessment", "text": "Opportunities and risks for each career group", "goto": "ai-support", "glyph": {"scene": "ai-heatmap", "group": "phd"}}}, {"type": "heatmap", "id": "ai-heatmap", "hidden": true, "title": "Combined assessment of opportunities and risks", "categories": [{"key": "opportunity", "label": "Opportunity", "color": "#7cc196", "light": "#d4ecdc", "ink": "#1b5e3a", "shades": ["#e3f2e8", "#b6dfc3", "#7cc196", "#3f9a66"]}, {"key": "mixed", "label": "Mixed", "color": "#f9d966", "light": "#ffeeb0", "ink": "#6b5200", "shades": ["#fff6d1", "#fde9a6", "#f9d966", "#efc644"]}, {"key": "risk", "label": "Risk", "color": "#e3818f", "light": "#f6d0d6", "ink": "#8e1f30", "shades": ["#fbe8eb", "#f4c1c9", "#e3818f", "#c8394f"]}], "group_label": "Career group", "row_label": "Research form", "groups": [{"key": "phd", "label": "PhD candidates"}, {"key": "postdoc_ap", "label": "Postdocs & assistant professors"}, {"key": "senior", "label": "Associate & full professors"}], "rows": [{"key": "phd-quantitative", "label": "Quantitative", "group": "phd"}, {"key": "phd-qualitative", "label": "Qualitative", "group": "phd"}, {"key": "phd-theory_review", "label": "Theory / review", "group": "phd"}, {"key": "postdoc_ap-quantitative", "label": "Quantitative", "group": "postdoc_ap"}, {"key": "postdoc_ap-qualitative", "label": "Qualitative", "group": "postdoc_ap"}, {"key": "postdoc_ap-theory_review", "label": "Theory / review", "group": "postdoc_ap"}, {"key": "senior-quantitative", "label": "Quantitative", "group": "senior"}, {"key": "senior-qualitative", "label": "Qualitative", "group": "senior"}, {"key": "senior-theory_review", "label": "Theory / review", "group": "senior"}], "cols": [{"key": "question", "label": "Question & theory", "short": "Question"}, {"key": "literature", "label": "Literature", "short": "Literature"}, {"key": "design", "label": "Design", "short": "Design"}, {"key": "data", "label": "Data / sources", "short": "Data"}, {"key": "analysis", "label": "Analysis & interpretation", "short": "Analysis"}, {"key": "writing", "label": "Writing & review", "short": "Writing"}], "cells": {"phd-quantitative|question": {"category": "mixed", "category_after": "opportunity", "level": 1, "title": "AI suggests questions, but candidates must learn to choose", "title_after": "Writing their own question first lets candidates use AI", "details": {"kicker": "PhD candidates · Quantitative · Question & theory", "title": "AI suggests questions, but candidates must learn to choose", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "Why", "text": "AI can give a PhD candidate rival hypotheses to consider, but a candidate who is still learning the field may choose an appealing question that the available data cannot answer. The candidate may also lose practice in framing the research problem of their own dissertation."}, {"heading": "With faculty support", "text": "Before using AI, the candidate writes down a research question and the comparison in the data that would answer it. The hypotheses that AI suggests are then discussed with the supervisor, so the candidate still practises choosing a question and gains from the wider set of options."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "HARKing, that is, hypotheses generated after the results are known and presented as earlier predictions, moves the judgment towards risk, while a candidate who can defend the chosen question moves it towards opportunity."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Question & theory", "title": "Writing their own question first lets candidates use AI", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "With faculty support", "text": "Before using AI, the candidate writes down a research question and the comparison in the data that would answer it. The hypotheses that AI suggests are then discussed with the supervisor, so the candidate still practises choosing a question and gains from the wider set of options."}, {"heading": "Without a faculty programme", "text": "AI can give a PhD candidate rival hypotheses to consider, but a candidate who is still learning the field may choose an appealing question that the available data cannot answer. The candidate may also lose practice in framing the research problem of their own dissertation."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "HARKing, that is, hypotheses generated after the results are known and presented as earlier predictions, moves the judgment towards risk, while a candidate who can defend the chosen question moves it towards opportunity."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-quantitative|literature": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI speeds up reading, but candidates may miss debates", "title_after": "Checking AI summaries against papers teaches the debates", "details": {"kicker": "PhD candidates · Quantitative · Literature", "title": "AI speeds up reading, but candidates may miss debates", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "Why", "text": "When AI screens the search results, a PhD candidate gains time to read the original papers. Learning a field, though, includes noticing where studies disagree and which designs are weak, and AI summaries may smooth over those disagreements and weaknesses. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "The candidate keeps a reading map that pairs each claim the dissertation relies on with a conflicting study and the relevant passage in the original paper. Checking AI summaries in this way teaches the candidate where studies disagree."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "If the candidate accepts the AI’s final list of studies without checking which relevant studies the AI missed, the judgment turns to risk, especially in a statistical meta-analysis."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Literature", "title": "Checking AI summaries against papers teaches the debates", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "With faculty support", "text": "The candidate keeps a reading map that pairs each claim the dissertation relies on with a conflicting study and the relevant passage in the original paper. Checking AI summaries in this way teaches the candidate where studies disagree."}, {"heading": "Without a faculty programme", "text": "When AI screens the search results, a PhD candidate gains time to read the original papers. Learning a field, though, includes noticing where studies disagree and which designs are weak, and AI summaries may smooth over those disagreements and weaknesses. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "If the candidate accepts the AI’s final list of studies without checking which relevant studies the AI missed, the judgment turns to risk, especially in a statistical meta-analysis."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-quantitative|design": {"category": "mixed", "category_after": "mixed", "level": 2, "title": "AI suggests designs that candidates must learn to defend", "title_after": "AI suggests designs that candidates must learn to defend", "details": {"kicker": "PhD candidates · Quantitative · Design", "title": "AI suggests designs that candidates must learn to defend", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "Why", "text": "A PhD candidate can learn about design by comparing the different quantities a study could estimate and the checks that AI proposes. Yet a specification drafted by AI can hide assumptions that the candidate must learn to explain and defend."}, {"heading": "With faculty support", "text": "Before any code is written, the candidate explains on one page what the study estimates, which observations it needs, and when the design would give a wrong answer. Designing a study remains something the candidate has to learn, so the judgment stays mixed."}, {"heading": "Sources", "list": ["{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "The judgment can move to opportunity when the candidate explains and tests the alternative designs from AI, and to risk if the candidate cannot defend the specification without AI."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Design", "title": "AI suggests designs that candidates must learn to defend", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "With faculty support", "text": "Before any code is written, the candidate explains on one page what the study estimates, which observations it needs, and when the design would give a wrong answer. Designing a study remains something the candidate has to learn, so the judgment stays mixed."}, {"heading": "Without a faculty programme", "text": "A PhD candidate can learn about design by comparing the different quantities a study could estimate and the checks that AI proposes. Yet a specification drafted by AI can hide assumptions that the candidate must learn to explain and defend."}, {"heading": "Sources", "list": ["{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "The judgment can move to opportunity when the candidate explains and tests the alternative designs from AI, and to risk if the candidate cannot defend the specification without AI."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-quantitative|data": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI speeds up data work, but only approved tools are safe", "title_after": "Safe university AI and a checked sample make data work pay", "details": {"kicker": "PhD candidates · Quantitative · Data / sources", "title": "AI speeds up data work, but only approved tools are safe", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "Why", "text": "With AI preparing the data, a PhD candidate can build a larger panel or a text-based measure that would take too long by hand. Checking what AI extracted against the original documents also deepens the candidate’s knowledge of the data. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers, so survey, personal and licensed data can be processed safely. The candidate also checks a hand-coded sample that covers different firms, years and unclear passages and explains each AI error, which deepens the candidate’s knowledge of the data."}, {"heading": "Sources", "list": ["{{S07-08}} Levich and Knust (2025), Discriminative meets generative: Automated information retrieval from unstructured corporate documents via (large) language models", "{{S08-013}} Ludwig et al. (2026), Large Language Models: An Applied Econometric Framework", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "With public, non-personal data or approved university tools, the judgment moves to opportunity. It changes to risk if personal or licensed data go to tools the university has not approved, if the candidate never looks at the raw records, or if the generated measure misses the intended construct."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Data / sources", "title": "Safe university AI and a checked sample make data work pay", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers, so survey, personal and licensed data can be processed safely. The candidate also checks a hand-coded sample that covers different firms, years and unclear passages and explains each AI error, which deepens the candidate’s knowledge of the data."}, {"heading": "Without a faculty programme", "text": "With AI preparing the data, a PhD candidate can build a larger panel or a text-based measure that would take too long by hand. Checking what AI extracted against the original documents also deepens the candidate’s knowledge of the data. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "Sources", "list": ["{{S07-08}} Levich and Knust (2025), Discriminative meets generative: Automated information retrieval from unstructured corporate documents via (large) language models", "{{S08-013}} Ludwig et al. (2026), Large Language Models: An Applied Econometric Framework", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "With public, non-personal data or approved university tools, the judgment moves to opportunity. It changes to risk if personal or licensed data go to tools the university has not approved, if the candidate never looks at the raw records, or if the generated measure misses the intended construct."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-quantitative|analysis": {"category": "risk", "category_after": "mixed", "level": 4, "title": "Candidates learn less if AI runs their analysis", "title_after": "Candidates learn when they redo key analyses themselves", "details": {"kicker": "PhD candidates · Quantitative · Analysis & interpretation", "title": "Candidates learn less if AI runs their analysis", "pill": {"text": "Risk", "color": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "Why", "text": "An AI coding tool can write the main estimation code and return a plausible table before a PhD candidate has learned to diagnose faulty data merges, wrong assumptions, or coding errors. Code that runs without errors does not by itself show that the conclusion drawn from the table is valid."}, {"heading": "With faculty support", "text": "The candidate codes or calculates one main result by hand, explains every change to the statistical model, and checks the extra analyses that the AI tool adds. The candidate keeps practising the method, although AI use still needs close supervision, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S09-003}} Shen and Tamkin (2026), How AI Impacts Skill Formation", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science"]}, {"heading": "What could change the judgment", "text": "With a simple estimator specified in advance and an independent replication, AI-written code can become an opportunity, but it remains a risk if the AI’s interpretation is accepted as proof of the finding."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Analysis & interpretation", "title": "Candidates learn when they redo key analyses themselves", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "With faculty support", "text": "The candidate codes or calculates one main result by hand, explains every change to the statistical model, and checks the extra analyses that the AI tool adds. The candidate keeps practising the method, although AI use still needs close supervision, so the judgment improves to mixed."}, {"heading": "Without a faculty programme", "text": "An AI coding tool can write the main estimation code and return a plausible table before a PhD candidate has learned to diagnose faulty data merges, wrong assumptions, or coding errors. Code that runs without errors does not by itself show that the conclusion drawn from the table is valid."}, {"heading": "Sources", "list": ["{{S09-003}} Shen and Tamkin (2026), How AI Impacts Skill Formation", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science"]}, {"heading": "What could change the judgment", "text": "With a simple estimator specified in advance and an independent replication, AI-written code can become an opportunity, but it remains a risk if the AI’s interpretation is accepted as proof of the finding."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-quantitative|writing": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Candidates get less practice in writing theory and results", "title_after": "Candidates who write their argument first can use AI", "details": {"kicker": "PhD candidates · Quantitative · Writing & review", "title": "Candidates get less practice in writing theory and results", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial parts of the paper, including the theory and hypotheses, or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim."}, {"heading": "Why", "text": "When AI drafts substantial parts of a dissertation chapter, a PhD candidate can have the chapter ready to discuss with the supervisors sooner. But formulating a claim from a result is part of how the candidate learns what the results support. In many fields, writing is also where the theory and hypotheses are developed, so the candidate may also get less practice in building the argument."}, {"heading": "With faculty support", "text": "The candidate first writes the theory, the hypotheses and the explanation of the main results, with an outline that links each claim to its result, and only then uses AI for the remaining text. The supervisor checks the claims against the results tables."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S09-003}} Shen and Tamkin (2026), How AI Impacts Skill Formation"]}, {"heading": "What could change the judgment", "text": "The judgment moves to risk if the candidate cannot defend the argument without the AI draft, and to opportunity if the candidate spends the time saved on working out what the results show."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Quantitative · Writing & review", "title": "Candidates who write their argument first can use AI", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial parts of the paper, including the theory and hypotheses, or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim."}, {"heading": "With faculty support", "text": "The candidate first writes the theory, the hypotheses and the explanation of the main results, with an outline that links each claim to its result, and only then uses AI for the remaining text. The supervisor checks the claims against the results tables."}, {"heading": "Without a faculty programme", "text": "When AI drafts substantial parts of a dissertation chapter, a PhD candidate can have the chapter ready to discuss with the supervisors sooner. But formulating a claim from a result is part of how the candidate learns what the results support. In many fields, writing is also where the theory and hypotheses are developed, so the candidate may also get less practice in building the argument."}, {"heading": "Sources", "list": ["{{S05-007}} Noy and Zhang (2023), Experimental evidence on the productivity effects of generative artificial intelligence", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S09-003}} Shen and Tamkin (2026), How AI Impacts Skill Formation"]}, {"heading": "What could change the judgment", "text": "The judgment moves to risk if the candidate cannot defend the argument without the AI draft, and to opportunity if the candidate spends the time saved on working out what the results show."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-qualitative|question": {"category": "mixed", "category_after": "opportunity", "level": 1, "title": "AI questions can steer candidates before fieldwork", "title_after": "Candidates gain when they test AI questions in the field", "details": {"kicker": "PhD candidates · Qualitative · Question & theory", "title": "AI questions can steer candidates before fieldwork", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer."}, {"heading": "Why", "text": "Rival questions from AI can help a PhD candidate compare possible studies, but a fluent suggestion can set the project’s direction before the candidate knows the people or organisations studied well enough to challenge it. Choosing and defending an option still gives practice, and the balance depends on whether the candidate first develops a question and tests alternatives in early fieldwork."}, {"heading": "With faculty support", "text": "The candidate writes a first research question before seeing any AI suggestions. In supervision, candidate and supervisor then compare the questions that AI suggests with notes from the first interviews or observations, so that early fieldwork shapes the question."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S14-102}} Si et al. (2025), The Ideation–Execution Gap: Execution Outcomes of LLM-Generated versus Human Research Ideas", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If a polished suggestion fixes the research question before any fieldwork, or if confidential field notes go into an unapproved AI tool, the judgment stays mixed or turns to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Qualitative · Question & theory", "title": "Candidates gain when they test AI questions in the field", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer."}, {"heading": "With faculty support", "text": "The candidate writes a first research question before seeing any AI suggestions. In supervision, candidate and supervisor then compare the questions that AI suggests with notes from the first interviews or observations, so that early fieldwork shapes the question."}, {"heading": "Without a faculty programme", "text": "Rival questions from AI can help a PhD candidate compare possible studies, but a fluent suggestion can set the project’s direction before the candidate knows the people or organisations studied well enough to challenge it. Choosing and defending an option still gives practice, and the balance depends on whether the candidate first develops a question and tests alternatives in early fieldwork."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S14-102}} Si et al. (2025), The Ideation–Execution Gap: Execution Outcomes of LLM-Generated versus Human Research Ideas", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If a polished suggestion fixes the research question before any fieldwork, or if confidential field notes go into an unapproved AI tool, the judgment stays mixed or turns to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-qualitative|literature": {"category": "mixed", "category_after": "opportunity", "level": 3, "title": "AI speeds up reading, but candidates may miss traditions", "title_after": "A librarian helps candidates find missed research traditions", "details": {"kicker": "PhD candidates · Qualitative · Literature", "title": "AI speeds up reading, but candidates may miss traditions", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missing studies and differing theories and reads central studies in full."}, {"heading": "Why", "text": "A broad first overview of studies and quicker summaries can help a PhD candidate learn a research area. While that knowledge is still forming, a missing research tradition or an inaccurate summary is hard to notice, and ordinary supervision catches some of these gaps and errors, though not all. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "A librarian helps the candidate design and document the literature search, and the candidate follows up references and records which studies were excluded and why. With the supervisor, the candidate then reads the central and the contradicting studies in full."}, {"heading": "Sources", "list": ["{{S06-011}} Khraisha et al. (2024), Can large language models replace humans in systematic reviews? Evaluating GPT-4's efficacy in screening and extracting data from peer-reviewed and grey literature in multiple languages", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "The judgment moves to risk if the candidate treats the studies an AI search returns as the full literature or relies on summaries without reading the studies."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Qualitative · Literature", "title": "A librarian helps candidates find missed research traditions", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missing studies and differing theories and reads central studies in full."}, {"heading": "With faculty support", "text": "A librarian helps the candidate design and document the literature search, and the candidate follows up references and records which studies were excluded and why. With the supervisor, the candidate then reads the central and the contradicting studies in full."}, {"heading": "Without a faculty programme", "text": "A broad first overview of studies and quicker summaries can help a PhD candidate learn a research area. While that knowledge is still forming, a missing research tradition or an inaccurate summary is hard to notice, and ordinary supervision catches some of these gaps and errors, though not all. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S06-011}} Khraisha et al. (2024), Can large language models replace humans in systematic reviews? Evaluating GPT-4's efficacy in screening and extracting data from peer-reviewed and grey literature in multiple languages", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "The judgment moves to risk if the candidate treats the studies an AI search returns as the full literature or relies on summaries without reading the studies."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-qualitative|design": {"category": "mixed", "category_after": "mixed", "level": 2, "title": "Candidates must still learn access, consent and interviewing", "title_after": "Candidates must still learn access, consent and interviewing", "details": {"kicker": "PhD candidates · Qualitative · Design", "title": "Candidates must still learn access, consent and interviewing", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question."}, {"heading": "Why", "text": "AI-drafted sampling plans and interview guides are useful to a PhD candidate, but the candidate must learn to arrange access to participants, obtain their consent and ask questions that do not steer their answers. Because the supervisor reviews the study design as usual, the balance is uncertain, and harm does not follow automatically."}, {"heading": "With faculty support", "text": "Before recruitment starts, the candidate explains why each group of participants is included and tests the AI-drafted interview guide with a qualitative methods adviser. Arranging access and consent remains something the candidate has to learn, so the judgment stays mixed."}, {"heading": "Sources", "list": ["{{S06-004}} Edmondson and McManus (2007), Methodological Fit in Management Field Research", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If fieldwork starts from a polished AI plan, with no pilot and no talks with the organisations about access, the judgment turns to risk. Few studies have directly examined complete designs drafted by AI."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Qualitative · Design", "title": "Candidates must still learn access, consent and interviewing", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question."}, {"heading": "With faculty support", "text": "Before recruitment starts, the candidate explains why each group of participants is included and tests the AI-drafted interview guide with a qualitative methods adviser. Arranging access and consent remains something the candidate has to learn, so the judgment stays mixed."}, {"heading": "Without a faculty programme", "text": "AI-drafted sampling plans and interview guides are useful to a PhD candidate, but the candidate must learn to arrange access to participants, obtain their consent and ask questions that do not steer their answers. Because the supervisor reviews the study design as usual, the balance is uncertain, and harm does not follow automatically."}, {"heading": "Sources", "list": ["{{S06-004}} Edmondson and McManus (2007), Methodological Fit in Management Field Research", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If fieldwork starts from a polished AI plan, with no pilot and no talks with the organisations about access, the judgment turns to risk. Few studies have directly examined complete designs drafted by AI."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-qualitative|data": {"category": "risk", "category_after": "mixed", "level": 4, "title": "Interview data are at risk in unapproved AI tools", "title_after": "Safe tools protect data, but candidates need field practice", "details": {"kicker": "PhD candidates · Qualitative · Data / sources", "title": "Interview data are at risk in unapproved AI tools", "pill": {"text": "Risk", "color": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes."}, {"heading": "Why", "text": "Corrected AI transcription and indexing save a PhD candidate time and can help the candidate get to know the interviews. AI interviews may, however, change who agrees to take part (self-selection) as well as what people say and which surprising replies get a follow-up (mode effects), and ordinary supervision does not settle how these gains and risks balance. Interview recordings, transcripts, and field notes nearly always contain personal data, and processing them in AI tools that the university has not approved can breach what participants consented to and data-protection law. Candidates are the least able to judge this risk."}, {"heading": "With faculty support", "text": "The faculty offers transcription and AI models on university servers, such as Whisper on the Hábrók cluster and the AI Platform, and the supervisor checks the data plan before fieldwork. Interview data then stay protected, but the candidate still needs practice in interviewing and AI-led interviews need careful piloting, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S14-401}} Chopra and Haaland (2026), Conducting Qualitative Interviews with AI", "{{S14-402}} Wuttke et al. (2025), AI Conversational Interviewing: Transforming Surveys with LLMs as Adaptive Interviewers", "{{S14-404}} Wollin-Giering et al. (2024), Automatic Transcription of English and German Qualitative Interviews", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "Approved tools on university servers for transcription move the judgment to mixed or even opportunity. Recordings or transcripts in tools the university has not approved, or AI-led interviews on sensitive workplace issues, keep it at risk. Studies find neither general refusal nor universal acceptance of AI interviews."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Qualitative · Data / sources", "title": "Safe tools protect data, but candidates need field practice", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes."}, {"heading": "With faculty support", "text": "The faculty offers transcription and AI models on university servers, such as Whisper on the Hábrók cluster and the AI Platform, and the supervisor checks the data plan before fieldwork. Interview data then stay protected, but the candidate still needs practice in interviewing and AI-led interviews need careful piloting, so the judgment improves to mixed."}, {"heading": "Without a faculty programme", "text": "Corrected AI transcription and indexing save a PhD candidate time and can help the candidate get to know the interviews. AI interviews may, however, change who agrees to take part (self-selection) as well as what people say and which surprising replies get a follow-up (mode effects), and ordinary supervision does not settle how these gains and risks balance. Interview recordings, transcripts, and field notes nearly always contain personal data, and processing them in the study uses fixed codes, compares passages and proposes themes or interpretations; the researcher judges each against the full transcripts, field notes and the analysis method the study reports."}, {"heading": "Why", "text": "A first round of AI coding with a fixed codebook may help a PhD candidate. When the project centres on interpretation, however, AI themes that arrive early can replace the candidate’s own first close reading of the interviews and field notes, and ordinary supervision does not necessarily make up for that lost practice."}, {"heading": "With faculty support", "text": "The candidate first analyses a selection of interviews alone, then compares this with the AI’s coding of difficult passages and defends each theme against the full interviews and contradicting cases. The candidate keeps practising interpretation, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S14-405}} Hill et al. (2026), Large language models for thematic analysis in healthcare research: A blinded mixed-methods comparison with human analysts", "{{S07-15}} Braun and Clarke (2006), Using thematic analysis in psychology", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "A project that mostly applies fixed codes, with the AI’s coding errors checked, may become an opportunity. Handing reflexive, interpretive analysis to AI can remain a risk even when the AI’s codes agree closely with human coding."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Qualitative · Analysis & interpretation", "title": "Candidates learn by coding some interviews alone first", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support support", "text": "The candidate first drafts the research problem and finds the published argument closest to it, and then tests the alternative questions that AI suggests against the main original studies with the supervisor. The candidate learns to show what a question adds to existing theory."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If the first elegant framing that AI offers becomes the dissertation question without checking whether earlier work proposed it, the judgment moves towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Question & theory", "title": "Drafting their own problem first lets candidates use AI", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes theoretical questions, concepts, mechanisms and what a review should cover; the researcher chooses the problem and explains what it adds to existing theories or reviews."}, {"heading": "With faculty support", "text": "The candidate first drafts the research problem and finds the published argument closest to it, and then tests the alternative questions that AI suggests against the main original studies with the supervisor. The candidate learns to show what a question adds to existing theory."}, {"heading": "Without a faculty programme", "text": "A PhD candidate can use AI to widen the set of possible problems to study. Yet a plausible question from AI may repeat an earlier argument and let the candidate skip practice in showing what a question adds to existing theory, and ordinary supervision helps only when the candidate can show how the question compares with prior work."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "If the first elegant framing that AI offers becomes the dissertation question without checking whether earlier work proposed it, the judgment moves towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-theory_review|literature": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "AI overviews help, but candidates may miss gaps and bias", "title_after": "Checking AI overviews against a reading list shows gaps", "details": {"kicker": "PhD candidates · Theory / review · Literature", "title": "AI overviews help, but candidates may miss gaps and bias", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies; the researcher checks which studies and fields the search missed and reads the originals the argument rests on."}, {"heading": "Why", "text": "AI tools that base their answers on retrieved papers can give a PhD candidate a useful overview of a literature. A candidate still learning the field finds it hard to notice missed studies or disagreements that the AI summary smoothed over, and reading the main original studies will not reveal every neighbouring field that the search left out. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "The candidate compares the AI overview of the literature with database searches and with the supervisor’s list of essential papers, and explains one disagreement between two original studies. This shows the candidate what the AI overview missed or simplified."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S14-506}} Lau and Golder (2025), Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "Reading only AI summaries of the original studies, or treating an unchecked AI overview as complete, moves the judgment towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Literature", "title": "Checking AI overviews against a reading list shows gaps", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies; the researcher checks which studies and fields the search missed and reads the originals the argument rests on."}, {"heading": "With faculty support", "text": "The candidate compares the AI overview of the literature with database searches and with the supervisor’s list of essential papers, and explains one disagreement between two original studies. This shows the candidate what the AI overview missed or simplified."}, {"heading": "Without a faculty programme", "text": "AI tools that base their answers on retrieved papers can give a PhD candidate a useful overview of a literature. A candidate still learning the field finds it hard to notice missed studies or disagreements that the AI summary smoothed over, and reading the main original studies will not reveal every neighbouring field that the search left out. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S14-506}} Lau and Golder (2025), Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "Reading only AI summaries of the original studies, or treating an unchecked AI overview as complete, moves the judgment towards risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-theory_review|design": {"category": "risk", "category_after": "mixed", "level": 2, "title": "Candidates learn less if AI designs their study", "title_after": "Candidates learn when they design their study first", "details": {"kicker": "PhD candidates · Theory / review · Design", "title": "Candidates learn less if AI designs their study", "pill": {"text": "Risk", "color": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a model’s assumptions, a conceptual framework or an integrative-review procedure; the researcher tests whether the design can yield an insight existing theories or reviews lack."}, {"heading": "Why", "text": "Depending on the paper, AI drafts the model’s assumptions, the conceptual framework, or the review procedure that a PhD candidate must learn to build and defend. A coherent AI draft can hide a model that does not fit the research question, a theory that repeats familiar arguments, or selection rules that miss studies the review needs."}, {"heading": "With faculty support", "text": "The candidate first writes down the reasoning behind the theoretical model or the review plan, then asks AI for an alternative to compare it with, and explains each assumption or selection rule without AI. The candidate keeps learning to design the study, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S13-306}} Richard Makadok (2022), Guidance for AMR Authors about Making Formal Theory Accessible", "{{S13-305}} Elsbach and Knippenberg (2020), Creating High-Impact Literature Reviews: An Argument for 'Integrative Reviews'", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "The judgment moves further towards risk when the candidate adopts the AI draft as the paper’s framework without rebuilding it. A checked use of AI to find weak points in the candidate’s own design may be beneficial."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Design", "title": "Candidates learn when they design their study first", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a model’s assumptions, a conceptual framework or an integrative-review procedure; the researcher tests whether the design can yield an insight existing theories or reviews lack."}, {"heading": "With faculty support", "text": "The candidate first writes down the reasoning behind the theoretical model or the review plan, then asks AI for an alternative to compare it with, and explains each assumption or selection rule without AI. The candidate keeps learning to design the study, so the judgment improves to mixed."}, {"heading": "Without a faculty programme", "text": "Depending on the paper, AI drafts the model’s assumptions, the conceptual framework, or the review procedure that a PhD candidate must learn to build and defend. A coherent AI draft can hide a model that does not fit the res or a review, AI can save substantial work in collecting them, removing duplicates, and extracting information. Missed studies and wrong decisions about which studies to include may, however, be hardest to detect for a candidate new to the literature. A purely theoretical paper has no data to collect at this stage."}, {"heading": "With faculty support", "text": "The candidate follows a written review protocol and checks whether the literature search found studies known to be relevant, and a second reader checks the excluded studies and the extracted information. Missed studies and extraction errors are then caught early."}, {"heading": "Sources", "list": ["{{S06-012}} Homiar et al. (2025), Development and evaluation of prompts for a large language model to screen titles and abstracts in a living systematic review", "{{S14-506}} Lau and Golder (2025), Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "The judgment would move to risk if the top results of an unrecorded AI search were taken as all relevant studies."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Data / sources", "title": "A review protocol and a second reader catch missed studies", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For integrative reviews, AI collects the studies, removes duplicates and extracts information from them; the researcher checks for missed studies, wrong inclusion decisions and extraction errors.
