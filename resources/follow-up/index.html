or": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory."}, {"heading": "Why", "text": "Derivations and syntheses proposed by AI can be useful, but testing whether they follow from the premises or sources is the reasoning a PhD candidate must learn. A polished AI mechanism, or a valid proof of a theorem that adds little to existing theory, can take the place of that practice."}, {"heading": "With faculty support", "text": "The candidate first works out one argument or derivation alone, then uses AI to look for counterexamples, and checks each step against the original sources or with proof-checking software. The candidate keeps practising theoretical reasoning, so the judgment improves to mixed."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S14-505}} Ravi et al. (2026), FormalProofBench: Can Models Write Graduate Level Math Proofs That Are Formally Verified?", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "Proving a narrow, already stated theorem with proof-checking software can be an opportunity. Mechanisms or syntheses that come from AI and that the candidate adopts without working them out again remain a risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Analysis & interpretation", "title": "Candidates learn when they work out one argument alone", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Risk without a faculty programme, mixed with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory."}, {"heading": "With faculty support", "text": "The candidate first works out one argument or derivation alone, then uses AI to look for counterexamples, and checks each step against the original sources or with proof-checking software. The candidate keeps practising theoretical reasoning, so the judgment improves to mixed."}, {"heading": "Without a faculty programme", "text": "Derivations and syntheses proposed by AI can be useful, but testing whether they follow from the premises or sources is the reasoning a PhD candidate must learn. A polished AI mechanism, or a valid proof of a theorem that adds little to existing theory, can take the place of that practice."}, {"heading": "Sources", "list": ["{{S14-101}} Si et al. (2024), Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers", "{{S14-505}} Ravi et al. (2026), FormalProofBench: Can Models Write Graduate Level Math Proofs That Are Formally Verified?", "{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus"]}, {"heading": "What could change the judgment", "text": "Proving a narrow, already stated theorem with proof-checking software can be an opportunity. Mechanisms or syntheses that come from AI and that the candidate adopts without working them out again remain a risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "phd-theory_review|writing": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Smooth AI text can hide gaps in the candidate’s reasoning", "title_after": "Defending the argument aloud shows what candidates know", "details": {"kicker": "PhD candidates · Theory / review · Writing & review", "title": "Smooth AI text can hide gaps in the candidate’s reasoning", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "Why", "text": "Working from a PhD candidate’s own premises, sources, and outline, AI can save substantial drafting time. But writing theory is also practice in connecting claims and defending them, and smooth AI text may hide that the candidate cannot trace each claim to its source or rebuild the argument alone."}, {"heading": "With faculty support", "text": "The candidate notes which source supports each claim, defends the argument aloud to the supervisor, and rewrites the central paragraph without AI. This shows what the candidate can explain, so AI drafting no longer hides gaps in the reasoning."}, {"heading": "Sources", "list": ["{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S13-303}} Messeri and Crockett (2026), The uncritical adoption of AI in science is alarming - we urgently need guard rails"]}, {"heading": "What could change the judgment", "text": "When finished AI prose repeatedly replaces the candidate’s own reasoning, the judgment changes to risk. AI drafting of a short explanation from the candidate’s settled outline can be an opportunity."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "PhD candidates · Theory / review · Writing & review", "title": "Defending the argument aloud shows what candidates know", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "With faculty support", "text": "The candidate notes which source supports each claim, defends the argument aloud to the supervisor, and rewrites the central paragraph without AI. This shows what the candidate can explain, so AI drafting no longer hides gaps in the reasoning."}, {"heading": "Without a faculty programme", "text": "Working from a PhD candidate’s own premises, sources, and outline, AI can save substantial drafting time. But writing theory is also practice in connecting claims and defending them, and smooth AI text may hide that the candidate cannot trace each claim to its source or rebuild the argument alone."}, {"heading": "Sources", "list": ["{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-012}} Universiteiten van Nederland / UFO (2023), Promovendus", "{{S13-303}} Messeri and Crockett (2026), The uncritical adoption of AI in science is alarming - we urgently need guard rails"]}, {"heading": "What could change the judgment", "text": "When finished AI prose repeatedly replaces the candidate’s own reasoning, the judgment changes to risk. AI drafting of a short explanation from the candidate’s settled outline can be an opportunity."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|question": {"category": "opportunity", "category_after": "opportunity", "level": 1, "title": "AI helps researchers find new, testable questions", "title_after": "AI helps researchers find new, testable questions", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Question & theory", "title": "AI helps researchers find new, testable questions", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "Why", "text": "A postdoc or assistant professor who is building an independent line of research can use the extra mechanisms that AI suggests to find a question that earlier studies have not answered and that the available data can test. The researcher still chooses the question and remains responsible for that choice."}, {"heading": "With faculty support", "text": "In a short meeting, colleagues compare the mechanisms that AI proposed with the measures and data the project can actually obtain. This keeps the researcher from choosing a question that the available data cannot answer."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If the researcher is new to the method or dataset and no colleague checks whether the available data can test the question, the judgment becomes mixed. HARKing, hypotheses written after seeing the results, could move the judgment to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Postdocs & assistant professors · Quantitative · Question & theory", "title": "AI helps researchers find new, testable questions", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "With faculty support", "text": "In a short meeting, colleagues compare the mechanisms that AI proposed with the measures and data the project can actually obtain. This keeps the researcher from choosing a question that the available data cannot answer."}, {"heading": "Without a faculty programme", "text": "A postdoc or assistant professor who is building an independent line of research can use the extra mechanisms that AI suggests to find a question that earlier studies have not answered and that the available data can test. The researcher still chooses the question and remains responsible for that choice."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S09-013}} Universiteiten van Nederland / UFO (2023), Onderzoeker", "{{S09-014}} Universiteiten van Nederland / UFO (2023), Universitair docent"]}, {"heading": "What could change the judgment", "text": "If the researcher is new to the method or dataset and no colleague checks whether the available data can test the question, the judgment becomes mixed. HARKing, hypotheses written after seeing the results, could move the judgment to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "postdoc_ap-quantitative|literature": {"category": "opportunity", "category_after": "opportunity", "level": 4, "title": "AI widens the search across fields and measures", "title_after": "AI widens the search across fields and measures", "details": {"kicker": "Postdocs & assistant professors · Quantitative · Literature", "title": "AI widens the search across fields and measures", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "Why", "text": "Within the limited time of a project, a postdoc or assistant professor can use AI to screen studies and see how other fields measure the same relationship, and so weigh more measures and designs.
