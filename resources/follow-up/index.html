ty with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "Why", "text": "Rival explanations from AI can help an associate or full professor who leads a project or programme plan studies that tell these explanations apart. The professor’s rank does not, however, guarantee expertise in every method that AI suggests."}, {"heading": "With faculty support", "text": "Before a grant or research programme commits several researchers to a question, colleagues who know the subject and the method check whether the planned data can tell the competing explanations apart."}, {"heading": "Sources", "list": ["{{S06-001}} Anton Korinek (2023), Generative AI for Economic Research: Use Cases and Implications for Economists", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "If a well-phrased question from AI that lies outside the lead’s expertise steers several projects before anyone checks that the data can answer it, the judgment becomes mixed or turns to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Quantitative · Question & theory", "title": "AI helps leads compare explanations across projects", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question."}, {"heading": "With faculty support", "text": "Before a grant or research programme commits several researchers to a question, colleagues who know the subject and the method check whether the planned data can tell the competing explanations apart."}, {"heading": "Without a faculty programme", "text": "Rival explanations from AI can help an associate or full professor who leads a project or programme plan studies that tell these explanations apart. The professor’s rank does not, however, guarantee expertise in every method that AI suggests."}, {"heading": "Sources", "list": ["{{S06-001}} Anton Korinek (2023), Generative AI for Economic Research: Use Cases and Implications for Economists", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "If a well-phrased question from AI that lies outside the lead’s expertise steers several projects before anyone checks that the data can answer it, the judgment becomes mixed or turns to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-quantitative|literature": {"category": "opportunity", "category_after": "opportunity", "level": 4, "title": "A checked AI literature map serves several projects", "title_after": "A checked AI literature map serves several projects", "details": {"kicker": "Associate & full professors · Quantitative · Literature", "title": "A checked AI literature map serves several projects", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "Why", "text": "A checked literature map lets an associate or full professor see where the projects in a programme measure the same construct in incompatible ways and which studies contradict the projects’ hypotheses. Because several projects use the same map, the time that AI saves in searching benefits the whole programme. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "With faculty support", "text": "A colleague who knows the field looks for research traditions that the AI-made literature map missed, and a meta-analysis specialist checks which studies were included before their effect sizes are combined."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "If the map misses a stream of research and several projects adopt the map without checking it, the judgment becomes mixed."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Quantitative · Literature", "title": "A checked AI literature map serves several projects", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on."}, {"heading": "With faculty support", "text": "A colleague who knows the field looks for research traditions that the AI-made literature map missed, and a meta-analysis specialist checks which studies were included before their effect sizes are combined."}, {"heading": "Without a faculty programme", "text": "A checked literature map lets an associate or full professor see where the projects in a programme measure the same construct in incompatible ways and which studies contradict the projects’ hypotheses. Because several projects use the same map, the time that AI saves in searching benefits the whole programme. AI tools may also favour some studies over others for reasons unrelated to quality, such as high citation counts or male authorship."}, {"heading": "Sources", "list": ["{{S08-020}} Asai et al. (2026), Synthesizing scientific literature with retrieval-augmented language models", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S08-017}} Algaba et al. (2025), How Deep Do Large Language Models Internalize Scientific Literature and Citation Practices?", "{{S08-024}} Algaba et al. (2024), Large Language Models Reflect Human Citation Patterns with a Heightened Citation Bias", "{{S08-025}} Jiangen He (2025), Who Gets Cited? Gender- and Majority-Bias in LLM-Driven Reference Selection"]}, {"heading": "What could change the judgment", "text": "If the map misses a stream of research and several projects adopt the map without checking it, the judgment becomes mixed."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-quantitative|design": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "AI widens design options, but errors spread to projects", "title_after": "Expert-checked designs can be reused across projects", "details": {"kicker": "Associate & full professors · Quantitative · Design", "title": "AI widens design options, but errors spread to projects", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "Why", "text": "AI helps an associate or full professor compare possible designs for the studies in a programme. If the professor approves a design that cannot answer the research question, that decision can steer the work of several colleagues and candidates."}, {"heading": "With faculty support", "text": "Before other projects reuse a study design, a reviewer who knows the method checks what the design estimates and how its key variable is measured. A checked design can then save time in several projects."}, {"heading": "Sources", "list": ["{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "Whatever the lead’s rank, the judgment moves to risk if a design that is new to the programme spreads to several projects before anyone who knows the method has checked it."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Quantitative · Design", "title": "Expert-checked designs can be reused across projects", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it."}, {"heading": "With faculty support", "text": "Before other projects reuse a study design, a reviewer who knows the method checks what the design estimates and how its key variable is measured. A checked design can then save time in several projects."}, {"heading": "Without a faculty programme", "text": "AI helps an associate or full professor compare possible designs for the studies in a programme. If the professor approves a design that cannot answer the research question, that decision can steer the work of several colleagues and candidates."}, {"heading": "Sources", "list": ["{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "Whatever the lead’s rank, the judgment moves to risk if a design that is new to the programme spreads to several projects before anyone who knows the method has checked it."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-quantitative|data": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Measures made with AI can serve projects, if data stay safe", "title_after": "Validated measures on university AI serve many projects", "details": {"kicker": "Associate & full professors · Quantitative · Data / sources", "title": "Measures made with AI can serve projects, if data stay safe", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "Why", "text": "When a measure built with AI is validated and each value can be traced to its source document, several projects in a programme can use it. An associate or full professor who oversees those projects then gains several times over from building and checking the data once. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers for the team’s sensitive or licensed data. Before other projects reuse a measure built with AI, the team records where each value comes from, and a researcher outside the team checks a validation sample."}, {"heading": "Sources", "list": ["{{S07-08}} Levich and Knust (2025), Discriminative meets generative: Automated information retrieval from unstructured corporate documents via (large) language models", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "On approved university tools, with a validated measure whose values can be traced, the judgment moves to opportunity. Data access terms that forbid the tool, personal data in tools the university has not approved, or an unvalidated measure whose errors spread across projects would turn it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Quantitative · Data / sources", "title": "Validated measures on university AI serve many projects", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them."}, {"heading": "With faculty support", "text": "The faculty offers AI models on university servers for the team’s sensitive or licensed data. Before other projects reuse a measure built with AI, the team records where each value comes from, and a researcher outside the team checks a validation sample."}, {"heading": "Without a faculty programme", "text": "When a measure built with AI is validated and each value can be traced to its source document, several projects in a programme can use it. An associate or full professor who oversees those projects then gains several times over from building and checking the data once. Without approved tools, however, survey responses, personal data, confidential company data, or licensed databases may end up with AI services the university has not checked, which can breach data-protection law or licence terms."}, {"heading": "Sources", "list": ["{{S07-08}} Levich and Knust (2025), Discriminative meets generative: Automated information retrieval from unstructured corporate documents via (large) language models", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S03-004}} RUG AI Office (2026), FAQ - The Do's and Don'ts in Mistral-Le Chat (Vibe)", "{{S03-018}} (CIT) and Tipping-Griffioen (2026), Project Plan – IT Fund: UG AI Platform & UG Standard Model(s)"]}, {"heading": "What could change the judgment", "text": "On approved university tools, with a validated measure whose values can be traced, the judgment moves to opportunity. Data access terms that forbid the tool, personal data in tools the university has not approved, or an unvalidated measure whose errors spread across projects would turn it to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is moderate. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-quantitative|analysis": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Leads must check more AI-assisted analyses", "title_after": "Shared code reviews let leads gain from faster analysis", "details": {"kicker": "Associate & full professors · Quantitative · Analysis & interpretation", "title": "Leads must check more AI-assisted analyses", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "Why", "text": "Faster reruns of analyses save time for an associate or full professor who leads projects, but the professor must then approve more scripts and interpretations written by AI tools. A rerun, moreover, does not test the measure or the comparison behind the result."}, {"heading": "With faculty support", "text": "The faculty pays for an independent check of AI-written code and for a methods specialist who reviews the measures and the interpretation. Project leads then gain from faster analyses without carrying all the checking themselves."}, {"heading": "Sources", "list": ["{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "If the team produces scripts and results faster than anyone can review them, or the lead lacks expertise in the method and no specialist checks the analysis, the judgment changes to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Quantitative · Analysis & interpretation", "title": "Shared code reviews let leads gain from faster analysis", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support."}, {"heading": "With faculty support", "text": "The faculty pays for an independent check of AI-written code and for a methods specialist who reviews the measures and the interpretation. Project leads then gain from faster analyses without carrying all the checking themselves."}, {"heading": "Without a faculty programme", "text": "Faster reruns of analyses save time for an associate or full professor who leads projects, but the professor must then approve more scripts and interpretations written by AI tools. A rerun, moreover, does not test the measure or the comparison behind the result."}, {"heading": "Sources", "list": ["{{S07-01}} Brodeur et al. (2026), AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S07-07}} Christensen and Hansen (2026), Performing Valid Inference with AI/ML-Generated Covariates: A Guide for Empirical Practice"]}, {"heading": "What could change the judgment", "text": "If the team produces scripts and results faster than anyone can review them, or the lead lacks expertise in the method and no specialist checks the analysis, the judgment changes to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-quantitative|writing": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Leads draft faster but must check more text by others", "title_after": "A list of claims and evidence makes checking drafts faster", "details": {"kicker": "Associate & full professors · Quantitative · Writing & review", "title": "Leads draft faster but must check more text by others", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial parts of the paper, including the theory and hypotheses, or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim."}, {"heading": "Why", "text": "As lead author, an associate or full professor can draft faster with AI, but may also receive more polished text from candidates and coauthors across projects. The professor then has more claims to verify and more mentoring to do."}, {"heading": "With faculty support", "text": "Coauthors and candidates give the professor a short record that links each claim to its evidence, and supervision time goes to discussing the reasoning behind the claims. Checking AI-assisted drafts then takes less of the professor’s time."}, {"heading": "Sources", "list": ["{{S06-020}} Gartenberg et al. (2026), More Versus Better: Artificial Intelligence, Incentives, and the Emerging Crisis in Peer Review", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "If the professor can check every draft in the portfolio, the judgment moves to  van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "When one AI-suggested explanation is imposed on linked projects before anyone has checked it in fieldwork, the judgment moves to mixed or risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Qualitative · Question & theory", "title": "AI helps leads question the team’s explanation", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Opportunity without a faculty programme, opportunity with support. Small impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer."}, {"heading": "With faculty support", "text": "Before several projects adopt a new research question, a team member who knows the organisations being studied checks it against what access allows and what early observations show."}, {"heading": "Without a faculty programme", "text": "An associate or full professor can use rival explanations from AI to challenge the explanation their linked projects favour and still choose the research question, and the gain is plausible even though a poor choice would affect colleagues. Leading those projects widens the reach of that decision without implying greater competence in qualitative methods."}, {"heading": "Sources", "list": ["{{S13-103}} Dell’Acqua et al. (2026), The Cybernetic Teammate: A Field Experiment on Generative AI and Teamwork", "{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Un ign", "title": "A flawed AI interview guide affects the whole team", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question."}, {"heading": "Why", "text": "Drafting with AI can reduce the coordination work of an associate or full professor, but when a project lead approves an interview guide or sampling plan, its errors can reach every interviewer. The task is the same as for the other career groups, and leading a project means more people rely on the professor’s approval."}, {"heading": "With faculty support", "text": "Before the AI-drafted interview guide is used across the project, the team pretests it in the organisation being studied, and a colleague who knows that organisation checks access, the burden on participants and the wording of the questions."}, {"heading": "Sources", "list": ["{{S06-024}} Juliane Riese (2018), What is ‘access’ in the context of qualitative research?", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "A lead who does not know the organisations studied and uses an untested guide across cases would turn the judgment to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Qualitative · Design", "title": "Pretesting the interview guide in the field shows its flaws", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": erview data in AI tools", "pill": {"text": "Risk", "color": "#f6d0d6", "ink": "#8e1f30"}, "intro": "Risk without a faculty programme, mixed with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes."}, {"heading": "Why", "text": "With AI, the team of an associate or full professor can process more interviews and documents, but the professor, as project lead, remains responsible for consent, data storage, and whether the data include the groups the study is about. AI can conduct interviews, although its effect on who takes part in a given organisation is still unresolved. The professor is also accountable when team members process recordings or transcripts in AI tools that the university has not approved, which can breach what participants consented to and data-protection law."}, {"heading": "With faculty support", "text": "The faculty offers transcription and AI models on university servers for the team’s interview data and funds time to correct transcripts. The team records recruitment, reviews the follow-up questions that the AI asked, and lets participants remove identifying details, while the professor remains responsible for consent."}, {"heading": "Sources", "list": ["{{S14-401}} Chopra and Haaland (2026), Conducting Qualitative Interviews with AI", "{{S14-411}} Danó et al. (2025), AI meets marketing research: Virtual interviewers and the challenges of regional and demographic adoption", "{{S14-412}} Li et al. (2026), Disclose with Care: Designing Privacy Controls in Interview Chatbots", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar", "{{S03-004}} RUG AI Office (2026), FAQ - Th  is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-theory_review|analysis": {"category": "mixed", "category_after": "opportunity", "level": 2, "title": "Convincing AI errors can mislead students and colleagues", "title_after": "A second expert checks AI arguments before others use them", "details": {"kicker": "Associate & full professors · Theory / review · Analysis & interpretation", "title": "Convincing AI errors can mislead students and colleagues", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Medium impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory."}, {"heading": "Why", "text": "A professor who specialises in the problem may use AI derivations or syntheses to probe an established explanation for weak points. A persuasive error in an AI argument can also shape the work of students and linked projects, and rank does not guarantee expertise in the specific problem."}, {"heading": "With faculty support", "text": "Before an AI-drafted argument guides other projects, a second scholar checks its sources or proof or tests a rival explanation. Errors are then caught before students and colleagues build on them."}, {"heading": "Sources", "list": ["{{S13-301}} Joep P. Cornelissen (2026), The Artificial Intelligence Con: The commodification of theory and the new and improved credibility crisis", "{{S13-307}} Novy-Marx and Velikov (2026), Artificial Intelligence-Powered (Finance) Scholarship", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could cha ent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "Formal steps checked by proof-checking software, with an expert choosing the theorem, may be an opportunity. If the group’s projects build on an untested AI synthesis of studies, the judgment may move to risk."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}, "senior-theory_review|writing": {"category": "mixed", "category_after": "opportunity", "level": 4, "title": "Leads must check more AI-assisted text by others", "title_after": "Sharing the checking in teams eases the load on professors", "details": {"kicker": "Associate & full professors · Theory / review · Writing & review", "title": "Leads must check more AI-assisted text by others", "pill": {"text": "Mixed", "color": "#ffeeb0", "ink": "#6b5200"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "Why", "text": "An associate or full professor can draft faster from a settled argument, but supervision and responsibility for the group’s research also mean reading more plausible AI-assisted sections by candidates and coauthors. The judgment therefore counts the time spent checking and mentoring as well as the time saved on the professor’s own writing."}, {"heading": "With faculty support", "text": "The team keeps a record of the sources behind each claim and agrees who checks them, and the professor makes time to discuss the argument with coauthors and candidates. The checking is then shared, and the professor gains from faster drafting."}, {"heading": "Sources", "list": ["{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S06-020}} Gartenberg et al. (2026), More Versus Better: Artificial Intelligence, Incentives, and the Emerging Crisis in Peer Review", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "AI drafting can be an opportunity when the professor explains an argument already worked out, and becomes a risk if the group’s faster drafts crowd out reasoning and source checks."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}, "details_after": {"kicker": "Associate & full professors · Theory / review · Writing & review", "title": "Sharing the checking in teams eases the load on professors", "pill": {"text": "Opportunity", "color": "#d4ecdc", "ink": "#1b5e3a"}, "intro": "Mixed without a faculty programme, opportunity with support. Very large impact of AI on this task.", "blocks": [{"heading": "AI task assessed", "text": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory."}, {"heading": "With faculty support", "text": "The team keeps a record of the sources behind each claim and agrees who checks them, and the professor makes time to discuss the argument with coauthors and candidates. The checking is then shared, and the professor gains from faster drafting."}, {"heading": "Without a faculty programme", "text": "An associate or full professor can draft faster from a settled argument, but supervision and responsibility for the group’s research also mean reading more plausible AI-assisted sections by candidates and coauthors. The judgment therefore counts the time spent checking and mentoring as well as the time saved on the professor’s own writing."}, {"heading": "Sources", "list": ["{{S14-508}} Go et al. (2026), LiRA: A Multi-Agent Framework for Reliable and Readable Literature Review Generation", "{{S06-020}} Gartenberg et al. (2026), More Versus Better: Artificial Intelligence, Incentives, and the Emerging Crisis in Peer Review", "{{S09-015}} Universiteiten van Nederland / UFO (2021), Universitair hoofddocent", "{{S09-016}} Universiteiten van Nederland / UFO (2023), Hoogleraar"]}, {"heading": "What could change the judgment", "text": "AI drafting can be an opportunity when the professor explains an argument already worked out, and becomes a risk if the group’s faster drafts crowd out reasoning and source checks."}, {"heading": "Evidence", "text": "Confidence in the evidence is low. This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position."}]}}}}, {"type": "compare", "id": "ai-support", "nav": "AI · Faculty support", "kicker": "AI in research · Sneak preview", "title": "What faculty AI support should aim for", "lead": "Faculty support should make AI a clear gain in as many research tasks as possible and remove the risks. In the goal map, 30 of the 36 mixed judgments become opportunities and all seven risks become mixed.", "base": "ai-heatmap", "mark_changes": false, "row_labels": true, "morph": "step", "left_label": "Without a faculty programme", "right_label": "Goal with faculty support", "hint": "Darker cells mean that AI can take on more of the work. Click a cell for the explanation and sources.", "notes": [{"label": "AI models on university servers", "text": "Researchers can use AI on personal and licensed data within data protection rules, so data work is no longer a risk. {{S03-018}}"}, {"label": "Practice alongside AI", "text": "Researchers first do a task themselves and then compare their work with what AI produces, so they keep building research skills. {{S09-003}}{{S09-004}}"}, {"label": "Checks on AI output", "text": "Researchers check AI-prepared data against a hand-coded sample, and a colleague reviews AI-written code and analyses. {{S14-301}}"}, {"label": "Help with literature searches", "text": "Librarians help researchers set up, document and check literature searches for missed or one-sided studies. {{S08-025}}"}, {"label": "Time for checking", "text": "Project plans and workloads include the time needed to check AI output."}], "caption": "These are goals. Small trials would show whether the support is used and worth its cost."}, {"type": "divider", "id": "part-grants", "nav": "3 · Grants", "number": "3", "title": "Grants", "lead": "Grants are the main topic of this meeting, and we spend most of the time on how we can help each other with applications."}, {"type": "figures", "id": "plan", "nav": "Strategic plan", "steps": true, "kicker": "Grants", "title": "What FEB’s strategic plan says about grants", "lead": "FEB’s strategic plan asks for more prestigious individual and collaborative grants, such as the NWO Talent Programme, KIC, ERC, NWA, and EU Horizon, and encourages senior staff to submit more European proposals. {{SP}}", "layout": "rows", "note_label": "Also in the plan", "items": [{"figure": "20%", "label": "Grant funding", "text": "FEB wants funding from prestigious grants to be 20 percent higher in 2031 than the average over 2023–2025. {{SP}}", "note": "FEB will invest in better support for proposals and will review funding plans in its annual strategy discussions with departments."}, {"figure": "20%", "label": "Joint proposals", "text": "FEB wants 20 percent more collaborative funding proposals (regional, national, and European) in 2029 than in 2025. {{SP}}", "note": "The plan names regional programmes such as Nij Begun as opportunities for funding."}, {"figure": "PDP", "label": "Time to apply", "text": "Personal development plans, to be introduced from 2027, allow senior staff to focus on grants for some time without also being expected to publish. {{SP}}", "note": "The plan sees the time that applications take as a hurdle and accepts less output in the short run."}]}, {"type": "text", "id": "recent", "nav": "Recent grants", "kicker": "Grants", "title": "Recent grants in our department", "lead": "Congratulations to the applicants and to everyone who helped them.", "columns": [{"title": "NWO Open Competition L", "text": "Carsten de Dreu and Zsombor Méder, “What drives cooperation across group-boundaries”. {{NWOL}}"}, {"title": "NWO Open Competition L", "text": "Floor Rink, Janka Stoker, and Michelle Ryan, “Leadership in a time of inclusion and resistance”. {{NWOL}}"}, {"title": "NWO Open Competition XS", "text": "Yingjie Yuan, “Human leadership of Multi-Agent AI teams for Creative Problem-Solving”. {{NWOXS}}"}], "note": "The two L grants are each worth about €800,000. {{NWOL}}"}, {"type": "figure", "id": "calls", "nav": "Calls", "kicker": "Grants", "title": "Calls in the coming year", "lead": "I selected calls that fit research in our department and took the dates from the funders’ websites in September and October 2026. The call calendar on our dashboard lists more calls.", "html": "<div class=\"callscroll\"><svg viewBox=\"0 0 1200 374\" role=\"img\" aria-label=\"Grant deadlines from November 2026 to September 2027\" style=\"width:100%;height:auto;max-height:none;font-family:'Open Sans',sans-serif\"><style>.cl{opacity:0;transition:opacity 1s}.in .cl{opacity:1}.cl:hover circle{stroke-width:3.2}.cl:hover .nm{fill:#9e1630}@media (max-width:900px){.callscroll{overflow-x:auto}.callscroll svg{min-width:880px}}<\/style><rect x=\"230.0\" y=\"32\" width=\"84.7\" height=\"338\" fill=\"#17365d\" fill-opacity=\".04\"/><text x=\"272.3\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" .0\" text-anchor=\"start\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Human/AI collaboration<\/text><text x=\"504.5\" y=\"286.0\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#66727c\">2 Feb · first stage<\/text><\/g><g class=\"cl\" data-detail=\"MSCAPF\" style=\"cursor:pointer;transition-delay:2.16s\"><circle cx=\"1107.9\" cy=\"273.0\" r=\"7\" fill=\"#fff\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"1095.9\" y=\"270.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Postdoctoral Fellowships<\/text><text x=\"1095.9\" y=\"286.0\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#66727c\">8 Sep · to be confirmed<\/text><\/g><text x=\"0\" y=\"344.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#17365d\">KIC<\/text><line x1=\"230\" y1=\"339.0\" x2=\"1170\" y2=\"339.0\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"/><g class=\"cl\" data-detail=\"KIC\" style=\"cursor:pointer;transition-delay:2.28s\"><circle cx=\"927.2\" cy=\"339.0\" r=\"7\" fill=\"#fff\" stroke=\"#9e1630\" stroke-width=\"2.2\"/><text class=\"nm\" x=\"915.2\" y=\"336.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#1f2a33\">Human Capital and Digital Innovation<\/text><text x=\"915.2\" y=\"352.0\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#66727c\">6 Jul · in preparation<\/text><\/g><\/svg><\/div><div style=\"display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#36424c;margin-top:10px\"><span><i style=\"display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #9e1630;vertical-align:-1px;margin-right:7px;background:#9e1630\"><\/i>Deadline<\/span><span><i style=\"display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #9e1630;vertical-align:-1px;margin-right:7px;background:#fff\"><\/i>Provisional, to be confirmed, or call in preparation<\/span><span style=\"margin-left:auto;color:#66727c\">Click a call for details and the link to the funder.<\/span><\/div>", "details": {"VIDI": {"kicker": "NWO Talent Programme", "title": "NWO Talent Programme Vidi, Social Sciences and Humanities 2026", "blocks": [{"heading": "Deadlines", "list": ["3 Nov 2026, pre-proposal", "6 Apr 2027, full proposal"]}, {"heading": "About this call", "text": "For researchers who obtained their PhD within the past eight years, with the usual extensions. {{VIDI}}"}]}, "VENI": {"kicker": "NWO Talent Programme", "title": "NWO Talent Programme Veni, Social Sciences and Humanities 2026", "blocks": [{"heading": "Deadlines", "list": ["26 Jan 2027, invited only"]}, {"heading": "About this call", "text": "The pre-proposal round closed on 1 September 2026, so only applicants who were invited submit a full proposal. {{VENI}}"}]}, "EXPAND": {"kicker": "NWO Open Competition SSH", "title": "SSH Open Competition Expand 2026", "blocks": [{"heading": "Deadlines", "list": ["17 Nov 2026, pre-proposal", "10 Jun 2027, full proposal"]}, {"heading": "About this call", "text": "Expand is the new name of the SSH Open Competition M and L, the scheme of our two recent L grants. {{EXPAND}}"}]}, "EXPLORE": {"kicker": "NWO Open Competition SSH", "title": "SSH Open Competition Explore 2027, round 1", "blocks": [{"heading": "Deadlines", "list": ["19 Jan 2027, round 1", "6 Apr 2027, round 2", "14 Sep 2027, round 3"]}, {"heading": "About this call", "text": "Explore is the new name of the SSH Open Competition XS, with three rounds in 2027. {{EXPLORE}}"}]}, "ERCCOG": {"kicker": "European Research Council", "title": "Consolidator Grant", "blocks": [{"heading": "Deadlines", "list": ["12 Jan 2027, provisional"]}, {"heading": "About this call", "text": "The ERC marks this date as provisional. {{ERCCOG}}"}]}, "ERCSYG": {"kicker": "European Research Council", "title": "Synergy Grant", "blocks": [{"heading": "Deadlines", "list": ["11 May 2027, provisional"]}, {"heading": "About this call", "text": "For two to four principal investigators with complementary expertise. The ERC marks this date as provisional. {{ERCSYG}}" flex-start}\n@media (max-width:900px){.fs{grid-template-columns:1fr}.fs-grid{grid-template-columns:1fr}.dqf{flex-direction:column}.dqf button{padding:10px 20px}}\n/* One question per scene (24 October 2026): a large box and the ideas below it. */\n.dqf.big{flex-direction:column;gap:10px;margin-top:22px}\n.dqf.big textarea{font-size:20px;line-height:1.45;min-height:170px;padding:14px 16px;border-radius:12px}\n.dqa{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.dqh{font-size:14px;color:#66727c}\n.dqf.big button{padding:11px 30px;font-size:17px}\n.dqi .dqc{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#17365d;margin:6px 0 8px}\n.dqf.big~.dqi ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}\n.dqf.big~.dqi li{font-size:15.5px}\n@media (max-width:900px){.dqf.big~.dqi ul{grid-template-columns:1fr}.dqa{flex-direction:column;align-items:stretch}}\n<\/style><form class=\"dqf big\" data-q=\"1\"><textarea rows=\"5\" maxlength=\"600\" aria-label=\"Your idea for this question\" placeholder=\"Type an idea and press Add\"><\/textarea><div class=\"dqa\"><span class=\"dqh\">Press Add, or Ctrl+Enter. One idea at a time works best.<\/span><button type=\"submit\" class=\"btn primary\">Add<\/button><\/div><\/form><p class=\"dqs\" aria-live=\"polite\"><\/p><div class=\"dqi\" hidden><p class=\"dqc\"><\/p><ul><\/ul><\/div>", "script": "/* Discussion scene: colleagues type ideas per question; ideas are stored by the discussion API.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst status = section.querySelector('.dqs');\ncon y('Thank you, your idea is saved.');\n      await load();\n    } catch (err) {\n      say(err.message && !/fetch/i.test(err.message) ? err.message : 'The idea could not be saved. Check the internet connection and try again.', true);\n    } finally {\n      button.disabled = false;\n    }\n  });\n});\n\n/* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\nlet timer = 0;\nnew IntersectionObserver((entries) => entries.forEach((entry) => {\n  clearInterval(timer);\n  if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n}), { threshold: 0.3 }).observe(section);\n"}, {"type": "figure", "id": "discuss-2", "nav": "Discussion 2", "kicker": "Discussion · question 2 of 3", "title": "Where would help from colleagues make the biggest difference?", "lead": "Think of the moments in an application where a colleague could help most.", "html": "<style>/* Live discussion (discussion scene) and AI summary (final scene). Embedded by build_deck.py. */\n.dq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 26px;margin-top:16px;border-top:1px solid #e2e6ea}\n.dq>div{padding:14px 0;border-bottom:1px solid #e2e6ea}\n.dq .n{font-size:clamp(30px,2.6vw,42px);font-weight:300;color:#9e1630;line-height:1.05}\n.dq .q{font-size:clamp(21px,1.8vw,28px);font-weight:600;color:#1f2a33;line-height:1.25;margin-bottom:8px}\n.dqf{display:flex;gap:10px;align-items:stretch}\n.dqf textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;color:#1f2a33;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;resize:vertical;min-height:46px}\n.dqf textarea:focus{outline:2px solid #17365d;outline-offset:1px;border-color:#17365d}\n.dqf button{flex:none;align-self:stretch;padding:0 20px}\n.dqf button[disabled]{opacity:.5;cursor:default}\n.dqi{margin-top:6px;font-size:14.5px;color:#66727c}\n.dqi summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:max- err.message && !/fetch/i.test(err.message) ? err.message : 'The idea could not be saved. Check the internet connection and try again.', true);\n    } finally {\n      button.disabled = false;\n    }\n  });\n});\n\n/* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\nlet timer = 0;\nnew IntersectionObserver((entries) => entries.forEach((entry) => {\n  clearInterval(timer);\n  if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n}), { threshold: 0.3 }).observe(section);\n"}, {"type": "figure", "id": "discuss-3", "nav": "Discussion 3", "kicker": "Discussion · question 3 of 3", "title": "What should we organise?", "lead": "At the research afternoon we already discussed a monthly feedback roundtable for papers, which could also support grant writing.", "html": "<style>/* Live discussion (discussion scene) and AI summary (final scene). Embedded by build_deck.py. */\n.dq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 26px;margin-top:16px;border-top:1px solid #e2e6ea}\n.dq>div{padding:14px 0;border-bottom:1px solid #e2e6ea}\n.dq .n{font-size:clamp(30px,2.6vw,42px);font-weight:300;color:#9e1630;line-height:1.05}\n.dq .q{font-size:clamp(21px,1.8vw,28px);font-weight:600;color:#1f2a33;line-height:1.25;margin-bottom:8px}\n.dqf{display:flex;gap:10px;align-items:stretch}\n.dqf textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;color:#1f2a33;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;resize:vertical;min-height:46px}\n.dqf textarea:focus{outline:2px solid #17365d;outline-offset:1px;border-color:#17365d}\n.dqf button{flex:none;align-self:stretch;padding:0 20px}\n.dqf button[disabled]{opacity:.5;cursor:default}\n.dqi{margin-top:6px;font-size:14.5px;color:#66727c}\n.dqi summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:max-content}\n.dqi summary::-webkit-details-marker{display:none}\n.dqi ul{margin:8px 0 0;padding:0;list-style:none;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px}\n.dqi li{background:#fff;border:1px solid #e2e6ea;border-radius:8px;padding:6px 10px;color:#36424c;line-height:1.4}\n.dqs{margin-top:10px;font-size:14px;color:#66727c;min-height:20px}\n.dqs.err,.fs-meta.err{color:#8e1f30}\n.fs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(22px,3vw,44px);align-items:start;margin-top:18px}\n.fs-sum{background:#fff;border:1px solid #e2e6ea;border-top:4px solid #9e1630;border-radius:14px;padding:20px 24px}\n.fs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}\n.fs-head .kick{margin:0}\n.fs-go{white-space:nowrap}\n.fs-go[disabled]{opacity:.55;cursor:default}\n.fs-empty{font-size:16px;color:#66727c;line-height:1.5}\n.fs-ov{font-size:18px;line-height:1.5;color:#1f2a33;margin-bottom:12px}\n.fs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}\n.fs-grid h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#17365d;line-height:1.35;margin:0 0 6px}\n.fs-grid ul,.fs-prop ul{margin:0;padding-left:18px;font-size:15px;line-height:1.45;color:#36424c}\n.fs-grid li+li,.fs-prop li+li{margin-top:4px}\n.fs-prop{margin-top:14px;padding-top:12px;border-top:1px solid #e2e6ea}\n.fs-prop h4{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9e1630;margin:0 0 6px}\n.fs-meta{margin-top:12px;font-size:13.5px;color:#66727c}\n.fs-meta a{color:inherit}\n.fs-side{display:flex;flex-direction:column;gap:16px}\n.fs-side div{border-top:1px solid #e2e6ea;padding-top:12px}\n.fs-side b{display:block;font-size:17px;color:#1f2a33;margin-bottom:4px}\n.fs-side p{font-size:15.5px;line-height:1.5;color:#36424c;margin:0}\n.fs-side .btn{align-self:flex-start}\n@media (max-width:900px){.fs{grid-template-columns:1fr}.fs-grid{grid-template-columns:1fr}.dqf{flex-direction:column}.dqf button{padding:10px 20px}}\n/* One question per scene (24 October 2026): a large box and the ideas below it. */\n.dqf.big{flex-direction:column;gap:10px;margin-top:22px}\n.dqf.big textarea{font-size:20px;line-height:1.45;min-height:170px;padding:14px 16px;border-radius:12px}\n.dqa{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.dqh{font-size:14px;color:#66727c}\n.dqf.big button{padding:11px 30px;font-size:17px}\n.dqi .dqc{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#17365d;margin:6px 0 8px}\n.dqf.big~.dqi ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}\n.dqf.big~.dqi li{font-size:15.5px}\n@media (max-width:900px){.dqf.big~.dqi ul{grid-template-columns:1fr}.dqa{flex-direction:column;align-items:stretch}}\n<\/style><form class=\"dqf big\" data-q=\"3\"><textarea rows=\"5\" maxlength=\"600\" aria-label=\"Your idea for this question\" placeholder=\"For example, a monthly roundtable for papers that also reads grant proposals\"><\/textarea><div class=\"dqa\"><span class=\"dqh\">Press Add, or Ctrl+Enter. One idea at a time works best.<\/span><button type=\"submit\" class=\"btn primary\">Add<\/button><\/div><\/form><p class=\"dqs\" aria-live=\"polite\"><\/p><div class=\"dqi\" hidden><p class=\"dqc\"><\/p><ul><\/ul><\/div>", "script": "/* Discussion scene: colleagues type ideas per question; ideas are stored by the discussion API.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst status = section.querySelector('.dqs');\nconst say = (text, err) => { status.textContent = text || ''; status.classList.toggle('err', !!err); };\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/ideas?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'unavailable');\n    const data = await r.json();\n    section.querySelectorAll('.dqf').forEach((form) => {\n      const q = +form.dataset.q;\n      const ideas = data.ideas.filter((idea) => idea.question === q).reverse();\n      const box = form.parentElement.querySelector('.dqi');\n      box.querySelector('.dqc').textContent = ideas.length ? `${ideas.length} ${ideas.length === 1 ? 'idea' : 'ideas'} so far` : 'No ideas yet';\n      box.querySelector('ul').innerHTML = ideas.map((idea) => `<li>${esc(idea.text)}<\/li>`).join('');\n      box.hidden = !ideas.length;\n    });\n    if (status.classList.contains('err')) say('');\n  } catch (e) {\n    say('The ideas could not be loaded. Check the internet connection and try again.', true);\n  }\n}\n\nsection.querySelectorAll('.dqf').forEach((form) => {\n  const field = form.querySelector('textarea');\n  const button = form.querySelector('button');\n  field.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const text = field.value.trim();\n    if (text.length < 3) { field.focus(); return; }\n    button.disabled = true;\n    say('Saving your idea…');\n    try {\n      const r = await fetch(`${API}/api/discussion/ideas`, {\n        method: 'POST', headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ meeting: MEETING, question: +form.dataset.q, text }),\n      });\n      const data = await r.json().catch(() => ({}));\n      if (!r.ok) throw new Error(data.error || 'The idea could not be saved.');\n      field.value = '';\n      say('Thank you, your idea is saved.');\n      await load();\n    } catch (err) {\n      say(err.message && !/fetch/i.test(err.message) ? err.message : 'The idea could not be saved. Check the internet connection and try again.', true);\n    } finally {\n      button.disabled = false;\n    }\n  });\n});\n\n/* Load when the scene comes into view, and refresh every 15 seconds while it is visible. */\nlet timer = 0;\nnew IntersectionObserver((entries) => entries.forEach((entry) => {\n  clearInterval(timer);\n  if (entry.isIntersecting) { load(); timer = setInterval(() => { if (!document.hidden) load(); }, 15000); }\n}), { threshold: 0.3 }).observe(section);\n"}, {"type": "figure", "id": "next", "nav": "What we agree", "kicker": "Grants", "title": "What we agree", "lead": "I will send round a short summary of what we agree in this meeting.", "html": "<div class=\"fs\"><section class=\"fs-sum\" aria-live=\"polite\"><div class=\"fs-head\"><div class=\"kick\">Summary of our discussion<\/div><button type=\"button\" class=\"btn primary fs-go\" disabled>Summarise the discussion<\/button><\/div><div class=\"fs-body\"><p class=\"fs-empty\">Ideas typed on the discussion slide appear here as a short summary, made by AI, once you click the button.<\/p><\/div><p class=\"fs-meta\"><\/p><\/section><aside class=\"fs-side\"><div><b>This meeting<\/b><p>We choose the forms of help that we want to try this year and decide who will organise them.<\/p><\/div><div><b>Planning an application?<\/b><p>Please let me and Lars van den Brink know, also when the idea is still at an early stage, so that we can find readers and a practice panel in time.<\/p><\/div><a class=\"btn\" href=\"mailto:h.j.van.de.brake@rug.nl?subject=Grant%20plans&amp;body=Call%20or%20scheme%3A%0APlanned%20deadline%3A%0AHelp%20I%20would%20like%3A%0A\">Tell me about your plans<\/a><\/aside><\/div>", "script": "/* Final scene: shows the AI summary of the discussion ideas and lets the presenter create or update it.\n   In scope: section, scene, DECK, cite, esc (engine figure script). */\nconst cfg = DECK.meta.discussion;\nconst params = new URLSearchParams(location.search);\nconst local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname);\nconst API = ((local && params.get('api')) || cfg.api).replace(/\\/+$/, '');\nconst MEETING = params.get('meeting') || cfg.meeting;\nconst QUESTIONS = cfg.questions;\nconst body = section.querySelector('.fs-body');\nconst meta = section.querySelector('.fs-meta');\nconst go = section.querySelector('.fs-go');\nlet busy = false;\n\nconst time = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });\nconst day = (iso) => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });\nconst exportLink = `<a href=\"${esc(API)}/api/discussion/export?meeting=${encodeURIComponent(MEETING)}\">Download all ideas (CSV)<\/a>`;\nconst plural = (n) => `${n} ${n === 1 ? 'idea' : 'ideas'}`;\n\nfunction render(data) {\n  const s = data.summary;\n  go.textContent = s ? 'Update the summary' : 'Summarise the discussion';\n  go.disabled = busy || !data.ideaCount;\n  meta.classList.remove('err');\n  if (!s) {\n    body.innerHTML = `<p class=\"fs-empty\">${data.ideaCount\n      ? `${plural(data.ideaCount)} have been added on the discussion slide. Click the button and AI summarises them here.`\n      : 'Ideas typed on the discussion slide appear here as a short summary, made by AI, once you click the button.'}<\/p>`;\n    meta.innerHTML = data.ideaCount ? exportLink : '';\n    return;\n  }\n  body.innerHTML = `${s.overview ? `<p class=\"fs-ov\">${esc(s.overview)}<\/p>` : ''}\n    <div class=\"fs-grid\">${s.questions.map((q) => `<div><h4>${esc(QUESTIONS[q.question - 1] || '')}<\/h4><ul>${q.points.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div>\n    ${s.proposals.length ? `<div class=\"fs-prop\"><h4>Proposals to decide on<\/h4><ul>${s.proposals.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul><\/div>` : ''}`;\n  const fresh = data.ideaCount - data.summarisedIdeas;\n  meta.innerHTML = `AI summary of ${plural(data.summarisedIdeas)}, made on ${day(data.createdAt)} at ${time(data.createdAt)}${fresh > 0 ? `. ${plural(fresh)} added since then` : ''} · ${exportLink}`;\n}\n\nasync function load() {\n  try {\n    const r = await fetch(`${API}/api/discussion/summary?meeting=${encodeURIComponent(MEETING)}`);\n    if (!r.ok) throw new Error();\n    render(await r.json());\n  } catch (e) {\n    go.disabled = true;\n    meta.textContent = 'The discussion service could not be reached.';\n    meta.classList.add('err');\n  }\n}\n\ngo.addEventListener('click', async () => {\n  busy = true;\n  go.disabled = true;\n  meta.classList.remove('err');\n  meta.textContent = 'AI is reading the ideas and writing the summary. This can take up to a minute.';\n  try {\n    const r = await fetch(`${API}/api/discussion/summary`, {\n      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ meeting: MEETING }),\n    });\n    const data = await r.json().catch(() => ({}));\n    if (!r.ok) throw new Error(data.error || 'The summary could not be made.');\n    busy = false;\n    render(data);\n  } catch (err) {\n    busy = false;\n    go.disabled = false;\n    meta.textContent = err.message && !/fetch/i.test(err.message) ? err.message : 'The summary could not be made. Check the internet connection and try again.';\n    meta.classList.add('err');\n  }\n});\n\nnew IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting && !busy) load(); }), { threshold: 0.3 }).observe(section);\n"}]}</script>
<script>
/* ---------- data and helpers ---------- */
const DECK=JSON.parse(document.getElementById('deck').textContent),M=DECK.meta||{};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC={};(DECK.sources||[]).forEach((s,i)=>SRC[s.id]=Object.assign({number:i+1},s));
const cite=t=>esc(t).replace(/\{\{([^}]+)\}\}/g,(_,id)=>SRC[id]?`<button class="cite" data-src="${esc(id)}">[${SRC[id].number}]</button>`:'');
const plain=t=>String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS=(M.scale_labels)||['Small','Moderate','Large','Very large'];
const DEFCAT={opportunity:{label:'Opportunity',color:'#9fcfb0',light:'#cfe6d6',ink:'#1d5a3d'},mixed:{label:'Mixed',color:'#ecd27c',light:'#f6e5ad',ink:'#6a4d0c'},risk:{label:'Risk',color:'#e4a294',light:'#f2cdc5',ink:'#8a2b1d'}};
const DET=[];const det=o=>{if(!o)return '';DET.push(o);return ` data-det="${DET.length-1}"`;};
const byId={};(DECK.scenes||[]).forEach((s,i)=>{s.id=s.id||'s'+i;byId[s.id]=s;});
if(M.logo)$('#logo').src=M.logo;$('#logo').alt=M.logo_alt||'';document.title=M.title||'Presentation';
$('#tools').innerHTML=`<span class="ttl">${esc(M.title||'')}</span>${(DECK.readings||[]).map(r=>`<button data-reading="${esc(r.id)}">${esc(r.label)}</button>`).join('')}${(DECK.sources||[]).length?'<button id="srcBtn">Sources</button>':''}<button id="fsBtn">Present</button>`;

/* ---------- scene renderers ---------- */
const R={};
const head=(s,big)=>`${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h2 class="reveal d1">${esc(s.title)}</h2>${s.lead?`<p class="${big?'statement':'lead'} reveal d2">${cite(s.lead)}</p>`:''}`;
const more=l=>l?`<button class="more reveal d5" data-reading="${esc(l.reading)}" data-chapter="${esc(l.chapter||'')}">${esc(l.label)}</button>`:'';
const xlegend=t=>`<div class="xlegend reveal d4"><b style="color:var(--ink);font-weight:600">${esc(t)}</b>${[1,2,3,4].map(l=>`<span><i class="x${l}"></i>${esc(LEVELS[l-1])}</span>`).join('')}<span class="hint" style="margin-left:auto">Click any part for the explanation and sources.</span></div>`;
R.hero=s=>{const t=esc(s.title||M.title||'');const br=s.break_before?t.replace(' '+esc(s.break_before),'<br>'+esc(s.break_before)):t;const brk=s.emphasis?br.replace(esc(s.emphasis),`<em>${esc(s.emphasis)}</em>`):br;
 const f=s.footnote;const [fa,fb]=f?f.text.split('[[link]]'):['',''];
 return `${s.constellation!==false&&(DECK.sources||[]).length?'<canvas id="stars" aria-hidden="true"></canvas>':''}<div class="hero-text">${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h1 class="reveal d1">${brk}</h1>${s.subtitle?`<p class="hero-sub reveal d2">${esc(s.subtitle)}</p>`:''}${s.meta?`<p class="hero-meta reveal d2">${esc(s.meta)}</p>`:''}<button class="start reveal d3" data-go="1">${esc(s.button||'Begin')} <span aria-hidden="true">↓</span></button><div class="legendline reveal d4" id="legend"></div></div>${f?`<p class="foot">${esc(fa)}${f.link?`<a href="${esc(f.link.url)}" target="_blank" rel="noopener">${esc(f.link.text)}</a>`:''}${esc(fb||'')}</p>`:''}`;};
R.story=s=>`${s.kicker?`<div class="kick reveal">${esc(s.kicker)}</div>`:''}<h2 class="reveal d1">${esc(s.title)}</h2><div class="two"><div>${s.lead?`<p class="lead reveal d2">${cite(s.lead)}</p>`:''}${s.card?`<div class="card reveal d3" style="margin-top:28px"><div class="kick">${esc(s.card.label)}</div><p>${cite(s.card.text)}</p></div>`:''}</div><div>${s.steps_label?`<div class="kick reveal d2" style="color:var(--navy);margin-top:6px">${esc(s.steps_label)}</div>`:''}<div class="journey">${(s.steps||[]).map((it,k)=>`<button class="step reveal d${Math.min(k+2,5)}" data-n="${k+1}" ${it.goto?`data-goid="${esc(it.goto)}"`:''}><span>${cite(it.text)}</span></button>`).join('')}</div></div></div>`;
