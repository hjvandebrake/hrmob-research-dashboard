. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining; senior means at least seven years in patent law", "S06-020": "Gartenberg et al., Organization Science editorial, original PDF pp. 2 and 5–10 (printed pp. 1 and 4–9), Figure 1 and Table 1", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9 on researcher duties and disclosure"}}, {"id": "theory_review-question-phd", "cohort": "phd", "research_type": "theory_review", "stage": "question", "bundle": "theory_review-question", "headline": "A plausible question may repeat earlier work", "headline_supported": "Candidates who draft a problem first learn from AI options", "rating": "mixed", "supported_rating": "opportunity", "rationale": "A PhD candidate can use AI to widen the set of possible problems to study. Yet a plausible question from AI may repeat an earlier argument and let the candidate skip practice in showing what a question adds to existing theory, and ordinary supervision helps only when the candidate can show how the question compares with prior work.", "support": "The candidate first drafts the problem and the published argument closest to it, and then, with the supervisor, tests the AI’s alternative questions against the main original studies on the problem.", "sensitivity": "If the first elegant framing that AI offers becomes the dissertation question without checking whether earlier work proposed it, the judgment moves towards risk.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-101", "S13-301", "S09-012"], "inventory_source_ids": ["S03-006", "S06-001", "S07-33", "S09-012", "S09-015", "S09-016", "S13-002", "S13-103", "S13-301", "S13-307"], "source_locators": {"S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, idea generation versus selection and functional background", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S13-307": "Novy-Marx and Velikov, AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "theory_review-literature-phd", "cohort": "phd", "research_type": "theory_review", "stage": "literature", "bundle": "theory_review-literature", "headline": "Candidates may not see what an AI overview misses", "headline_supported": "Candidates check the AI overview against a reading list", "rating": "mixed", "supported_rating": "opportunity", "rationale": "AI tools that base their answers on retrieved papers can give a PhD candidate a useful overview of a literature. A candidate still learning the field finds it hard to notice missed studies or disagreements that the AI summary smoothed over, and reading the main original studies will not reveal every neighbouring field that the search left out.", "support": "The candidate compares the AI overview with database searches and with the supervisor’s list of essential papers, and then explains one disagreement between two original studies.", "sensitivity": "Reading only AI summaries of the original studies, or treating an unchecked AI overview as complete, moves the judgment towards risk.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S08-020", "S14-506", "S09-012"], "inventory_source_ids": ["S03-006", "S06-001", "S06-006", "S06-011", "S06-012", "S06-014", "S08-017", "S08-020", "S09-004", "S09-015", "S09-016", "S13-303"], "source_locators": {"S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "theory_review-design-phd", "cohort": "phd", "research_type": "theory_review", "stage": "design", "bundle": "theory_review-design", "headline": "AI drafts the models candidates must learn to build", "headline_supported": "Candidates who build the framework first still learn how", "rating": "risk", "supported_rating": "mixed", "rationale": "Depending on the paper, AI drafts the model’s assumptions, the conceptual framework, or the review procedure that a PhD candidate must learn to build and defend. A coherent AI draft can hide a model that does not fit the research question, a theory that repeats familiar arguments, or selection rules that miss studies the review needs.", "support": "The candidate first writes the reasoning behind the model or review, then asks AI for an alternative framework to compare it with, and explains each assumption or selection rule without AI.", "sensitivity": "The judgment moves further towards risk when the candidate adopts the AI draft as the paper’s framework without rebuilding it. A checked use of AI to find weak points in the candidate’s own design may be beneficial.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-301", "S13-306", "S13-305", "S09-012"], "inventory_source_ids": ["S03-006", "S06-006", "S07-05", "S07-33", "S09-015", "S09-016", "S13-305", "S13 rough a methods review and a data and ethics review, and the researcher runs a small pilot and records each revision of the guide.", "sensitivity": "Recruitment that begins before anyone has checked whether planned participants can be reached and how they give consent turns the judgment to risk, especially in a project with limited time.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S06-024", "S06-025", "S09-013", "S09-014"], "inventory_source_ids": ["S03-010", "S05-012", "S06-024", "S06-025", "S09-012"], "source_locators": {"S05-012": "Strand et al., primary PDF pp. 6–8, Google Forms experiment on editing time (local average treatment effect among feature users)", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S03-010": "GDPR Articles 6, 9(2)(j) and 89 on lawful basis and research safeguards", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}}, {"id": "qualitative-data-postdoc_ap", "cohort": "postdoc_ap", "research_type": "qualitative", "stage": "data", "bundle": "qualitative-data", "headline": "Nonresponse to AI interviews can bias the sample", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "Transcribing and organising interviews with AI can save a postdoc or assistant professor substantial time, and AI interviews can elicit richer answers than fixed questions. Who chooses to take part, how well the AI asks follow-up questions, and confidentiality concerns may still change what the interviews show, and no check of transcripts can correct for people who never agreed to an AI interview.", "support": "The hemes and quotations create checking work and may distort what participants meant in the situation they described. Judging AI codes and themes well takes knowledge of the method and of the interviews, whatever the researcher’s title.", "support": "The researcher audits the AI’s coding of rare and difficult categories, keeps a record linking each theme to its excerpts, and discusses contradicting cases with a colleague who knows the method.", "sensitivity": "When most of the project uses fixed codes, the judgment may shift to opportunity. A theme that rests on AI restating the same passages in different words, without other evidence, shifts it to risk.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-405", "S14-406", "S14-407", "S09-030"], "inventory_source_ids": ["S07-02", "S07-15", "S07-16", "S07-17", "S07-18", "S07-19", "S13-303"], "source_locators": {"S07-02": "Xiao et al., author PDF pp. 2–3 (printed pp. 76–77) and Figure 1, kappa values for GPT-3 and expert coders", "S07-18": "Wise, Gresalfi and Spencer-Smith, abstract and sections on core commitments of qualitative inquiry", "S07-16": "Matta et al., Methods, Case and Discussion, missed context in interview analysis", "S07-19": "Goretzki and Mahlendorf, publisher abstract and introduction on surface patterns and situated meaning", "S07-15": "Braun and Clarke, printed p. 91 on reviewing themes against coded extracts and the whole data set and pp. 94–95 on weak analysis, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating the analysis of qualitative data", "S07-17": "Jowsey, Braun, Clarke et al., position article abstract and methodological argument"}}, {"id": "qualitative-writing-postdoc_ap", "cohort": "p Tracks 2025, PDF cover p. 1 and pp. 15–16, Research Profile promotion criteria for new hires from 1 January 2026", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), general FAQ on external tools and research FAQ on personal data, page last modified 9 September 2026"}}, {"id": "qualitative-literature-senior", "cohort": "senior", "research_type": "qualitative", "stage": "literature", "bundle": "qualitative-literature", "headline": "An incomplete AI search can steer a whole team’s projects", "headline_supported": "Cross-field searches help once a librarian checks them", "rating": "mixed", "supported_rating": "opportunity", "rationale": "AI searches across fields can turn up studies that help an associate or full professor in their own research. A paper the search misses, or a summary that omits who was studied and how, may also steer the team’s projects, and expertise in one research tradition does not guarantee knowledge of another.", "support": "A librarian reviews whether the search has missed studies on the topic, and a colleague reads the original passages behind each comparison between research traditions.", "sensitivity": "The judgment leans towards risk if an AI overview of the literature becomes the team’s reading list, or its source for concept definitions, before anyone has checked it.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S08-020", "S07-15", "S09-015", "S09-016"], "inventory_source_ids": ["S03-004", "S06-011", "S06-012", "S07-15", "S07-21", "S08-017", "S08-020", "S13-303"], "source_locators": {"S07-21": "Tran et al., PubMed abstract Methods and Results, five reviews and 22,665 citations", "S06-012": "Homiar et al., PubMed abstract Methods and Results, sensitivity and simulated workload reduction in one living review", "S08-020": "Asai et al. (OpenScholar), Nature main text opening, Table 1 and Methods baseline-model section, including citation fabrication without retrieval", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S08-017": "Algaba et al., arXiv abstract, experiment and results on citation recommendation bias", "S07-15": "Braun and Clarke, printed pp. 94–95 on the mismatch between theoretical framework and analytic claims, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on literature work as training for early-career researchers", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), question on uploading PDFs of articles, page last modified 9 September 2026"}}, {"id": "qualitative-design-senior", "cohort": "senior", "research_type": "qualitative", "stage": "design", "bundle": "qualitative-design", "headline": "A flawed interview guide affects every interviewer using it", "headline_supported": "Pretesting the guide in the organisation reveals its flaws", "rating": "mixed", "supported_rating": "opportunity", "rationale": "Drafting with AI can reduce the coordination work of an associate or full professor, but when a project lead approves an interview guide or sampling plan, its errors can reach every interviewer. The task is the same as for the other career groups, and leading a project means more people rely on the professor’s approval.", "support": "Before the guide is used across the project, the team pretests the AI-drafted guide in the organisation studied, and a colleague who knows that organisation checks access, the burden on participants, and question wording.", "sensitivity": "A lead who does not know the organisations studied and uses an untested guide across cases would turn the judgment to risk.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S06-024", "S09-015", "S09-016"], "inventory_source_ids": ["S03-010", "S05-012", "S06-024", "S06-025", "S09-012"], "source_locators": {"S05-012": "Strand et al., primary PDF pp. 6–8, Google Forms experiment on editing time (local average treatment effect among feature users)", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S03-010": "GDPR Articles 6, 9(2)(j) and 89 on lawful basis and research safeguards", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}}, {"id": "qualitative-data-senior", "cohort": "senior", "research_type": "qualitative", "stage": "data", "bundle": "qualitative-data", "headline": "The professor stays responsible for consent and who is heard", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "With AI, the team of an associate or full professor can process more interviews and documents, but the professor, as project lead, remains responsible for consent, data storage, and whether the data include the groups the study is about. AI can conduct interviews, although its effect on who takes part in a given organisation is still unresolved.", "support": "The faculty funds time to correct transcripts and to compare AI interviews with human or fixed-question interviews in the same organisation. The team logs recruitment, reviews the AI’s follow-up questions, and lets participants remove identifying details.", "sensitivity": "Approved transcription may be an opportunity, but untested AI interviews on sensitive topics may be a risk if they lower trust or change who takes part. The study of participants removing identifying details from chatbot transcripts had no human interviewer for comparison.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-401", "S14-411", "S14-412", "S09-015", "S09-016"], "inventory_source_ids": ["S03-004", "S06-025", "S06-026", "S07-15", "S13-303"], "source_locators": {"S07-15": "Braun and Clarke, printed pp. 87–88, phase 1 familiarisation and transcription, read in the local original PDF", "S06-026": "Barari et al., journal abstract, PDF pp. 161–64, Results and Discussion", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), research questions on processing transcripts and transcribing audio files, page last modified 9 September 2026", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating interviews and the analysis of qualitative data"}}, {"id": "qualitative-analysis-senior", "cohort": "senior", "research_type": "qualitative", "stage": "analysis", "bundle": "qualitative-analysis", "headline": "A lead who approves weak AI themes can mislead the team", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "An associate or full professor can use AI to compare many interviews or documents for their own research. If the professor approves AI themes that the interviews do not support, however, the whole team may build on a weak interpretation, so the professor must reserve time to read the original passages and contrary cases.", "support": "The team sets each AI-proposed theme beside the original excerpts, the surrounding turns of talk, field notes and contradicting passages, and asks the team member who knows the interviews best to challenge it.", "sensitivity": "Applying fixed codes may be an opportunity, while interpretation may be a risk when the professor has not done the fieldwork or read the interviews. Senior responsibility does not imply better knowledge of the transcripts.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-410", "S07-15", "S09-015", "S09-016"], "inventory_source_ids": ["S07-02", "S07-15", "S07-16", "S07-17", "S07-18", "S07-19", "S13-303"], "source_locators": {"S07-02": "Xiao et al., author PDF pp. 2–3 (printed pp. 76–77) and Figure 1, kappa values for GPT-3 and expert coders", "S07-18": "Wise, Gresalfi and Spencer-Smith, abstract and sections on core commitments of qualitative inquiry", "S07-16": "Matta et al., Methods, Case and Discussion, missed context in interview analysis", "S07-19": "Goretzki and Mahlendorf, publisher abstract and introduction on surface patterns and situated meaning", "S07-15": "Braun and Clarke, printed p. 91 on reviewing themes against coded extracts and the whole data set and pp. 94–95 on weak analysis, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating the analysis of qualitative data", "S07-17": "Jowsey, Braun, Clarke et al., position article abstract and methodological argument"}}, {"id": "qualitative-writing-senior", "cohort": "senior", "research_type": "qualitative", "stage": "writing", "bundle": "qualitative-writing", "headline": "Professors check AI drafts without seeing every interview", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "Full AI drafts of sections can help an associate or full professor develop their own argument. As project lead, the professor may also have to review more AI-generated sections from coauthors and candidates without having conducted or read all the interviews. The writing task is the same as for other researchers, and leading a project adds other people’s drafts to check.", "support": "Before final approval, the team names the person responsible for the interview transcripts, sets aside review time, links each claim to its excerpts and checks it against cases that contradict it.", "sensitivity": "With claims traced to interview excerpts and enough time, the judgment may move to opportunity, and to risk if the team drafts with AI faster than it can check. Rank alone does not show knowledge of the interviews.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S05-007", "S14-406", "S09-015", "S09-016"], "inventory_source_ids": ["S03-006", "S05-007", "S06-020", "S07-15", "S13-001", "S13-002", "S13-101"], "source_locators": {"S05-007": "Noy and Zhang, Science published abstract, 453 professionals in short writing tasks", "S07-15": "Braun and Clarke, Table 1 p. 87 and printed pp. 93–95 on producing the report as the final phase of analysis and on claims the extracts do not support, read in the local original PDF", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 methods and limitations", "S13-002": "Cheng et al., PDF pp. 5 and 7–8, experimental results", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining; senior means at least seven years in patent law", "S06-020": "Gartenberg et al., Organization Science editorial, original PDF pp. 2 and 5–10 (printed pp. 1 and 4–9), Figure 1 and Table 1", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9 on researcher duties and disclosure"}}, {"id": "theory_review-question-senior", "cohort": "senior", "research_type": "theory_review", "stage": "question", "bundle": "theory_review-question", "headline": "Relabelled old ideas can mislead a research group", "headline_supported": "An outside colleague checks if earlier work had the idea", "rating": "mixed", "supported_rating": "opportunity", "rationale": "Rival framings from AI may help an associate or full professor improve the central question of a research programme. An appealing old idea under a new label, the jangle fallacy, can then steer students, grants, and linked projects, so the judgment depends on the professor’s field knowledge and on an outside colleague checking whether earlier work proposed the idea.", "support": "Before the group’s projects build on the framing, an outside colleague from a neighbouring field checks whether earlier work proposed it and what evidence supports it.", "sensitivity": "If an untested AI framing is imposed on the whole group, the judgment moves towards risk. For a narrow question in the professor’s own speciality, the same use can be an opportunity.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S09-015", "S09-016", "S13-301", "S13-002"], "inventory_source_ids": ["S03-006", "S06-001", "S07-33", "S09-012", "S09-015", "S09-016", "S13-002", "S13-103", "S13-301", "S13-307"], "source_locators": {"S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, idea generation versus selection and functional background", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S13-307": "Novy-Marx and Velikov, AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "theory_review-literature-senior", "cohort": "senior", "research_type": "theory_review", "stage": "literature", "bundle": "theory_review-literature", "headline": "Fields an AI search misses can skew a team’s conclusions", "headline_supported": "A reader from the neighbouring field checks the comparison", "rating": "mixed", "supported_rating": "opportunity", "rationale": "An associate or full professor can compare literatures faster for a review or research programme, but a literature that the search misses or oversimplifies can shape the conclusions a team adopts. Knowing one debate does not mean knowing neighbouring fields that use other names for the topic, and a narrow search in the professor’s own field is more likely to be an opportunity.", "support": "The team keeps a list of included studies that shows how each one was found, and a reader from the neighbouring field challenges how the review compares the two fields.", "sensitivity": "A narrow search in the professor’s own speciality can be an opportunity, whereas an unchecked AI overview that the team’s review builds on can be a risk.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S08-020", "S14-506", "S13-305", "S09-015", "S09-016"], "inventory_source_ids": ["S03-006", "S06-001", "S06-006", "S06-011", "S06-012", "S06-014", "S08-017", "S08-020", "S09-004", "S09-015", "S09-016", "S13-303"], "source_locators": {"S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "theory_review-design-senior", "cohort": "senior", "research_type": "theory_review", "stage": "design", "bundle": "theory_review-design", "headline": "An untested AI design can spread through a research group", "headline_supported": "Colleagues check the design before other projects use it", "rating": "mixed", "supported_rating": "opportunity", "rationale": "An associate or full professor who knows the topic well can identify which model assumptions are essential and compare alternative frameworks. But the group’s projects may adopt a plausible AI design before anyone tests its premises, and a professor’s seniority makes that design reach more projects without guaranteeing expertise in the method it uses.", "support": "Colleagues outside the project check the design against existing theory and the method, including a junior specialist when that person knows the method best.", "sensitivity": "When several projects reuse an AI-generated design without testing its assumptions or what it adds to existing theory, the judgment changes to risk.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-306", "S09-015", "S09-016", "S14-505"], "inventory_source_ids": ["S03-006", "S06-006", "S07-05", "S07-33", "S09-015", "S09-016", "S13-305", "S13-306"], "source_locators": {"S07-05": "ORLM, publisher abstract and benchmark description; benchmarks do not test the choice of a substantive abstraction", "S13-306": "Makadok, original AMR PDF pp. 193–198, assumptions, omitted elements, derivations and accessibility", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-305": "Elsbach and van Knippenberg, original PDF pp. 1277–1279 and 1287–1288, definition, methodology sections, thinly supported elements and studies as data", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, {"id": "theory_review-data-senior", "cohort": "senior", "research_type": "theory_review", "stage": "data", "bundle": "theory_review-data", "headline": "Checked AI study lists leave more time to compare claims", "headline_supported": null, "rating": "opportunity", "supported_rating": "opportunity", "rationale": "An associate or full professor can let AI assemble the studies for a review, recording how each was found, and use field knowledge to test the inclusion rules, which leaves more time for comparing the studies’ claims. Given the professor’s responsibility for the quality of the group’s research, approving an unchecked AI list of studies would be costly.", "support": "Collaborators who know each field the review covers check the list of studies, and every exclusion is recorded for review.", "sensitivity": "The judgment applies to reviews only, since purely theoretical papers have no data stage, and it changes to mixed or risk if the professor approves the studies AI selected without examining them.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, which concerns the sources of a review.", "source_ids": ["S14-501", "S13-305", ses to probe an established explanation for weak points. A persuasive error in an AI argument can also shape the work of students and linked projects, and rank does not guarantee expertise in the specific problem.", "support": "Before an AI claim guides other projects, a second scholar checks its sources or proof, or tests a rival mechanism.", "sensitivity": "Formal steps checked by proof-checking software, with an expert choosing the theorem, may be an opportunity. If the group’s projects build on an untested AI synthesis of studies, the judgment may move to risk.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-301", "S13-307", "S09-015", "S09-016"], "inventory_source_ids": ["S03-006", "S06-001", "S06-006", "S06-014", "S08-007", "S09-003", "S09-004", "S09-015", "S09-016", "S13-301", "S13-304"], "source_locators": {"S08-007": "First Proof Second Batch report, p. 4 Summary and Discussion of Results, pp. 4–5 on unjustified steps and citation failures, pp. 7–10 selection, testing and grading", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10 and 17–19, randomised unfamiliar-library task, learning quiz and limitations", "S13-304": "Hochberg and Thrall, PNAS original PDF pp. 1–4, especially p. 3 on verification debt; opinion, not a measured trend", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, {"id": "theory_review-writing-senior", "cohort": "senior", "research_type": "theory_review", "stage": "writing", "bundle": "theory_review-writing", "headline": "Senior authors check more AI-assisted text by others", "headline_supported": "Senior authors check less when teams share the checking", "rating": "mixed", "supported_rating": "opportunity", "rationale": "An associate or full professor can draft faster from a settled argument, but supervision and responsibility for the group’s research also mean reading more plausible AI-assisted sections by candidates and coauthors. The judgment therefore counts the time spent checking and mentoring as well as the time saved on the professor’s own writing.", "support": "The team keeps a record of the sources behind each claim and agrees who verifies it, and the professor makes time to discuss the argument with coauthors and candidates.", "sensitivity": "AI drafting can be an opportunity when the professor explains an argument already worked out, and becomes a risk if the group’s faster drafts crowd out reasoning and source checks.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task descri <script>
const D=JSON.parse(document.getElementById('data').textContent);
const S=Object.fromEntries(D.slides.map(s=>[s.id,s]));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC=D.sources;
const cite=t=>esc(t).replace(/\{\{([^}]+)\}\}/g,(_,id)=>SRC[id]?`<button class="cite" data-src="${esc(id)}">[${SRC[id].number}]</button>`:'');
const plain=t=>String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();
const COH={phd:'PhD candidates',postdoc_ap:'Postdocs & assistant professors',senior:'Associate & full professors'};
const FORMS=[['quantitative','Quantitative','Numerical evidence and statistical methods'],['qualitative','Qualitative','Interviews, observation and documents'],['theory_review','Theory / review','Formal or conceptual arguments and synthesis']];
const STAGES=[['question','Question & theory'],['literature','Literature'],['design','Design'],['data','Data / sources'],['analysis','Analysis & interpretation'],['writing','Writing & review']];
const RAT={opportunity:'Opportunity',mixed:'Mixed',risk:'Risk'},SH=['opportunity','mixed','risk'];
const EXT={1:'Small',2:'Moderate',3:'Large',4:'Very large'};
const fname=k=>FORMS.find(f=>f[0]===k)[1],sname=k=>STAGES.find(s=>s[0]===k)[1];
const cellAt=(co,f,st)=>D.cells.find(c=>c.cohort===co&&c.research_type===f&&c.stage===st);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#logo').src=D.logo;$('#ttl').textContent=D.meta.title;document.title=D.meta.title;if(D.meta.has_report)$('#repBtn').hidden=false;

/* ---------- scenes ---------- */
const SCENES=[];
function scene(id,label,html,alt){SCENES.push({id,label});return `<section class="scene${alt?' alt':''}" id="${id}"><div class="wrap">${html}</div></section>`;}
const O=S.opening,F=S.followup||S.workgroup,A=S.ambition,Q=S.quality,ST=S.stages,FO=S.forms,PO=S.positions,MO=S['map-overview'],PR=S.programme,NX=S.next;
const target=j=>({ambition:'principles',dimensions:'stages',stages:'stages',forms:'forms',positions:'positions','map-overview':'heatmap',next:'next',quality:'goals'}[j]||j);

function heroHTML(){const [a,b]=O.footnote.text.split('[[link]]');return `<canvas id="stars" aria-hidden="true"></canvas><div class="hero-text"><div class="kick reveal">October 2026 · Faculty of Economics and Business</div><h1 class="reveal d1">${esc(O.title).replace(' well ',' <em>well</em> ').replace(/ (in research|at FEB)$/,'<br>$1')}</h1><p class="hero-sub reveal d2">${esc(O.lead)}</p><p class="hero-meta reveal d2">${esc(O.visual.meta)}</p><button class="start reveal d3" data-go="1">Begin <span aria-hidden="true">↓</span></button><div class="legendline reveal d4" id="legend"></div></div><p class="foot">${esc(a)}<a href="${esc(O.footnote.link.url)}" target="_blank" rel="noopener">${esc(O.footnote.link.text)}</a>${esc(b||'')}</p>`;}
function followHTML(){const c=F.visual.cols[0];return `<div class="kick reveal">Introduction</div><h2 class="reveal d1">${esc(F.title)}</h2><div class="two" style="margin-top:8px"><div><p class="lead reveal d2">${cite(F.lead)}</p><div class="card reveal d3" style="margin-top:28px"><div class="kick">${esc(F.visual.method_label)}</div><p>${cite(F.visual.method)}</p></div></div><div><div class="kick reveal d2" style="color:var(--navy);margin-top:6px">${esc(c.label)}</div><div class="journey">${c.items.map((it,k)=>`<button class="step reveal d${k+2}" data-n="${k+1}" data-goid="${esc(target(it.jump))}"><span>${esc(it.text)}</span></button>`).join('')}</div></div></div>`;}
const ICONS=[
`<svg viewBox="0 0 54 54" fill="none" stroke="#17365d" stroke-width="2"><circle cx="27" cy="27" r="22"/><circle cx="27" cy="27" r="13"/><circle cx="27" cy="27" r="4" fill="#cc0000" stroke="none"/></svg>`,
`<svg viewBox="0 0 54 54" fill="none" stroke="#17365d" stroke-width="2"><path d="M4 27s9-14 23-14 23 14 23 14-9 14-23 14S4 27 4 27z"/><circle cx="27" cy="27" r="7"/><circle cx="27" cy="27" r="2.5" fill="#cc0000" stroke="none"/></svg>`,
`<svg viewBox="0 0 54 54" fill="none" stroke="#17365d" stroke-width="2"><path d="M27 46V24"/><path d="M27 30c-10 0-15-7-15-15 9 0 15 6 15 15z"/><path d="M27 26c0-8 6-14 15-14 0 9-6 14-15 14z" stroke="#cc0000"/><path d="M14 46h26"/></svg>`,
`<svg viewBox="0 0 54 54" fill="none" stroke="#17365d" stroke-width="2"><circle cx="16" cy="18" r="5"/><circle cx="38" cy="18" r="5"/><path d="M7 40c0-7 4-12 9-12s9 5 9 12M29 40c0-7 4-12 9-12s9 5 9 12"/><path d="M4 46h46" stroke="#cc0000"/></svg>`];
function principlesHTML(){return `<div class="kick reveal">Introduction</div><h2 class="reveal d1">${esc(A.title)}</h2><p class="mission reveal d2">${esc(A.lead)}</p><div class="kick reveal d2" style="color:var(--navy);margin-top:4px">${esc(A.visual.principles_label||'Four principles')}</div><div class="four">${A.visual.principles.map((p,k)=>`<div class="pr reveal d${k+2}"><div class="prn">${k+1}</div><h3>${esc(p.title)}</h3><p>${cite(p.text)}</p></div>`).join('')}</div>`;}
function goalsHTML(){return `<div class="kick reveal">FEB’s strategy</div><h2 class="reveal d1">${esc(Q.title)}</h2><p class="lead reveal d2">${cite(Q.lead)}</p><div class="three">${Q.visual.items.map((g,k)=>`<div class="goal reveal d${k+2}"><div class="fig" data-fig="${esc(g.figure)}">${esc(g.figure)}</div><h3>${esc(g.label)}</h3><p>${cite(g.plan)}</p><div class="ai"><b>${esc(Q.visual.ai_label)}</b><p>${cite(g.ai)}</p></div></div>`).join('')}</div>`;}
function xlegend(t){return `<div class="xlegend reveal d4"><b style="color:var(--ink);font-weight:600">${esc(t)}</b>${[1,2,3,4].map(l=>`<span><i class="x${l}"></i>${EXT[l]}</span>`).join('')}<span class="hint" style="margin-left:auto">Click any part for the explanation and sources.</span></div>`;}
function dimsHTML(){const DV=S.dimensions,it=DV.visual.items,ids=['stages','forms','positions'];const glyph=FORMS.map(([f],r)=>STAGES.map(([st],c)=>`<i class="${cellAt('phd',f,st).rating}" style="transition-delay:${1.5+(r*6+c)*.06}s"></i>`).join('')).join('');
 return `<div class="kick reveal">Three dimensions</div><h2 class="reveal d1">${esc(DV.title)}</h2><p class="lead reveal d2">${cite(DV.lead)}</p><div class="dims">${it.map((d,k)=>`${k?'<div class="op">+</div>':''}<button class="dim" data-goid="${ids[k]}" style="--k:${k}"><span class="dn">${k+1}</span><b>${esc(d.title)}</b><span>${cite(d.text)}</span></button>`).join('')}<div class="op eq">→</div><button class="dim combo" data-goid="heatmap" style="--k:3"><span class="glyph">${glyph}</span><b>Combined assessment</b><span>Opportunities and risks for each career group</span></button></div>`;}
function stagesHTML(){const it=ST.visual.items,W=1200,H=232,Y=146,xs=it.map((s,i)=>(i+.5)*W/6),rs=it.map(s=>24+s.extent.level*9);
 const LIGHT={1:'#ffffff',2:'#e6edf6',3:'#b7c9e0',4:'#7393c0'},BASE={1:'#edf1f6',2:'#c8d5e5',3:'#88a3c6',4:'#43679a'};
 const grads=[1,2,3,4].map(l=>`<radialGradient id="sg${l}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="${LIGHT[l]}"/><stop offset="1" stop-color="${BASE[l]}"/></radialGradient>`).join('');
 const arrows=it.slice(0,-1).map((s,i)=>`<line class="flow" x1="${xs[i]+rs[i]+8}" y1="${Y}" x2="${xs[i+1]-rs[i+1]-12}" y2="${Y}" marker-end="url(#ah)" style="transition-delay:${.6+i*.15}s"/>`).join('');
 const arc=`M${xs[5]} ${Y-rs[5]-8} C ${xs[5]-40} 6, ${xs[0]+40} 6, ${xs[0]} ${Y-rs[0]-12}`;
 const loop=`M${xs[0]},${Y} L${xs[5]},${Y} C ${xs[5]-40},6 ${xs[0]+40},6 ${xs[0]},${Y}`;
 return `<div class="kick reveal">Dimension 1 of 3</div><h2 class="reveal d1">${esc(ST.title)}</h2><p class="lead reveal d2">${cite(ST.lead)}</p><div class="pathbox reveal d3"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The six research stages, from question to writing, with an arrow back to the start, and how much of the work AI can now take on"><defs>${grads}<filter id="sglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f9aa6"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3bcc6"/></marker></defs><path class="back" d="${arc}" marker-end="url(#ah2)"/>${arrows}${it.map((s,i)=>{const l=s.extent.level;return `<g class="station l${l}" data-stage="${s.key}" tabindex="0" role="button" aria-label="${esc(s.name)}: ${EXT[l]}">${l>1?`<circle class="halo" cx="${xs[i]}" cy="${Y+6}" r="${rs[i]+4}" fill="${BASE[l]}" filter="url(#sglow)" style="transition-delay:${.35+i*.15}s"/>`:''}<circle class="core" cx="${xs[i]}" cy="${Y}" r="${rs[i]}" fill="url(#sg${l})" ${l===1?'stroke="#d0d9e4" stroke-width="1.5"':''} style="transition-delay:${.2+i*.15}s"/></g>`;}).join('')}</svg><div class="cols6">${it.map(s=>`<button data-stage="${s.key}"><b>${esc(s.name)}</b><span>${esc(s.extent.short)}</span></button>`).join('')}</div></div>${xlegend(ST.visual.xtitle)}<button class="danal reveal d5" data-ana="cycle">Read the detailed analysis of the research stages</button>`;}
function formsHTML(){const E=FO.visual.extent;return `<div class="kick reveal">Dimension 2 of 3</div><h2 class="reveal d1">${esc(FO.title)}</h2><p class="lead reveal d2">${cite(FO.lead)}</p><div class="lanes f reveal d3"><div></div>${STAGES.map(([,n])=>`<div class="h">${esc(n)}</div>`).join('')}${FORMS.map(([k,n,sub],r)=>`<button class="rl" data-form="${k}"><b>${esc(n)}</b><small>${esc(sub)}</small></button>${STAGES.map(([st],c)=>{const l=E.levels[k][c];return `<button class="lc x${l}" data-fcell="${k}|${st}" aria-label="${esc(n)}, ${esc(sname(st))}: ${EXT[l]}" style="transition-delay:${.2+(r*6+c)*.05}s"></button>`;}).join('')}`).join('')}</div>${xlegend(E.title)}<button class="danal reveal d5" data-ana="forms">Read the detailed analysis of the research forms</button>`;}
function positionsHTML(){const E=PO.visual.extent,items=PO.visual.items;return `<div class="kick reveal">Dimension 3 of 3</div><h2 class="reveal d1">${esc(PO.title)}</h2><p class="lead reveal d2">${cite(PO.lead)}</p><div class="lanes p reveal d3"><div></div>${E.cols.map(c=>`<div class="h">${esc(c.label)}</div>`).join('')}${items.map((it,r)=>`<button class="rl" data-pos="${it.key}"><b>${esc(it.name)}</b><small>${esc(it.ufo)}</small></button>${E.cols.map((c,k)=>{const x=E.cells[it.key][c.key];return `<button class="lc x${x.level}" data-pcell="${it.key}|${c.key}" aria-label="${esc(it.name)}, ${esc(c.label)}: ${EXT[x.level]}" style="transition-delay:${.2+(r*3+k)*.05}s"></button>`;}).join('')}`).join('')}</div>${xlegend(E.title)}<p class="caption reveal d5">${cite(PO.visual.note)}</p><button class="danal reveal d5" data-ana="positions">Read the detailed analysis of the career positions</button>`;}

/* heatmap: the original overview and group view */

 const host=cv.parentElement.parentElement;host.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top,cx:e.clientX,cy:e.clientY};});host.addEventListener('mouseleave',()=>{mouse=null;hideTip();});

 const hex=(h,a)=>{const v=parseInt(h.slice(1),16);return `rgba(${v>>16},${(v>>8)&255},${v&255},${a})`;};
 const t0=performance.now();function frame(t){const tt=(t-t0)/1000;ctx.clearRect(0,0,W,H);
  ORDER.forEach(k=>{const [cx,cy,r]=C[k],R=r*Math.max(W,H)*.95,g=ctx.createRadialGradient(cx*W,cy*H,0,cx*W,cy*H,R);g.addColorStop(0,hex(COL[k],.07));g.addColorStop(1,hex(COL[k],0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx*W,cy*H,R,0,6.283);ctx.fill();});
  const Q=P.map(p=>({p,x:(p.bx+Math.sin(tt*p.sp+p.ph)*.005)*W,y:(p.by+Math.cos(tt*p.sp*.8+p.ph)*.008)*H}));
  for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){if(Q[i].p.x.c!==Q[j].p.x.c)continue;const d=Math.hypot(Q[i].x-Q[j].x,Q[i].y-Q[j].y);if(d<92){ctx.strokeStyle=hex(COL[Q[i].p.x.c],(.22*(1-d/92)).toFixed(3));ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(Q[i].x,Q[i].y);ctx.lineTo(Q[j].x,Q[j].y);ctx.stroke();}}
  hov=null;let best=16;if(mouse)Q.forEach(q=>{const d=Math.hypot(q.x-mouse.x,q.y-mouse.y);if(d<best){best=d;hov=q.p;}});
  Q.forEach(q=>{const h=hov===q.p;ctx.beginPath();ctx.fillStyle=COL[q.p.x.c];ctx.globalAlpha=h?1:.85;ctx.arc(q.x,q.y,q.p.rad*(h?2.3:1),0,6.283);ctx.fill();});ctx.globalAlpha=1;
  ctx.font='700 11.5px "Open Sans", sans-serif';ctx.textAlign='center';ORDER.forEach(k=>{const [cx,cy,r]=C[k];ctx.fillStyle=COL[k];const words=NAME[k].toUpperCase(),ly=(cy-r*1.45)*H-16;let lines=[words];if(ctx.measureText(words).width>Math.max(180,r*W*3.2)){const sp=[...words.matchAll(/ /g)].map(m=>m.index),mid=sp.reduce((a,b)=>Math.abs(b-words.length/2)<Math.abs(a-words.length/2)?b:a);lines=[words.slice(0,mid),words.slice(mid+1)];}const hw=Math.max(...lines.map(l=>ctx.measureText(l).width))/2+10,lx=Math.max(hw,Math.min(W-hw,cx*W));lines.forEach((l,i)=>ctx.fillText(l,lx,ly-(lines.length-1-i)*14));ctx.fillStyle=hex(COL[k],.7);ctx.fillText(n[k]+(n[k]===1?' source':' sources'),lx,ly+15);});
  if(hov&&mouse){const s=hov.x.s;showTip({clientX:mouse.cx,clientY:mouse.cy},`<b>[${s.number}] ${esc(s.authors_or_body).slice(0,70)} · ${esc((s.publication_date||'').slice(0,4))}</b>${esc(s.title)}<br><span style="color:${COL[hov.x.c]};font-weight:600">${esc(NAME[hov.x.c])}</span>`);cv.style.cursor='pointer';}else{if(mouse&&!document.querySelector('.lc:hover,.hc:hover'))hideTip();cv.style.cursor='default';}
  if(!reduced)requestAnimationFrame(frame);}
 requestAnimationFrame(frame);})();
