of them {{S08-007}}, and Korinek shows how economists can use AI for mathematical derivations {{S06-001}}. For a review, AI can also propose ways of grouping findings into themes that the authors then test against the studies.", "source_ids": ["S08-007", "S06-001"], "evidence": "adjacent"}, {"id": "theory_review-analysis-2", "kind": "opportunity", "label": "Counterexamples and contrary studies", "text": "Korinek demonstrates how AI can supply counterarguments {{S06-001}}, and researchers can likewise ask AI for counterexamples to a proposition or for studies that contradict a proposed synthesis, which shows them which steps of the argument still need support.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "theory_review-analysis-3", "kind": "opportunity", "label": "Steps explained for learners", "text": "A researcher who is still learning a formal technique or an unfamiliar literature can ask AI for hints on a step without asking for the answer. In a high-school mathematics trial, an AI tutor designed with teachers largely avoided the harm that unrestricted AI help did to students’ later work without AI {{S09-004}}.", "source_ids": ["S09-004"], "evidence": "adjacent"}, {"id": "theory_review-analysis-4", "kind": "risk", "label": "Convincing arguments with invalid steps", "text": "In a test of research-level mathematics, expert graders of the AI-written solutions found difficult steps asserted without justification and references that did not support the claims they were cited for {{S08-007}}. In conceptual and review work, AI can likewise fit a plausible story to a pattern after the fact {{S13-301}} or join studies that use one word for concepts that are not equivalent {{S06-006}}.", "source_ids": ["S08-007", "S13-301", "S06-006"], "evidence": "adjacent"}, {"id": "theory_review-analysis-5", "kind": "risk", "label": "Arguments the author cannot fully defend", "text": "Messeri and Crockett argue that AI can leave scientists overestimating how well they understand a problem, which they call an illusion of understanding {{S06-014}}. In an experiment, programmers who learned an unfamiliar library with AI help also scored lower afterwards on a test of concepts and debugging than programmers without AI {{S09-003}}, which suggests that researchers who let AI derive or synthesise may be less able to defend the resulting argument.", "source_ids": ["S06-014", "S09-003"], "evidence": "adjacent"}, {"id": "theory_review-analysis-6", "kind": "risk", "label": "More arguments for supervisors to check", "text": "Hochberg and Thrall warn that science may build up what they call a verification debt when research output grows faster than researchers’ capacity to check it carefully {{S13-304}}. Supervisors, whose job profiles include guiding staff and PhD candidates {{S09-015}} {{S09-016}}, carry much of the checking of candidates’ AI-assisted derivations and syntheses.", "source_ids": ["S13-304", "S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-analysis-7", "kind": "risk", "label": "AI role in the argument unreported", "text": "European guidance asks authors to report AI use that meaningfully shapes their results according to the rules of their journal or discipline {{S03-006}}, so authors whose derivation or central mechanism came from AI would need to say so.", "source_ids": ["S03-006"], "evidence": "reasoned"}], "source_locators": {"S08-007": "First Proof Second Batch report, p. 4 Summary and Discussion of Results, pp. 4–5 on unjustified steps and citation failures, pp. 7–10 selection, testing and grading", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10 and 17–19, randomised unfamiliar-library task, learning quiz and limitations", "S13-304": "Hochberg and Thrall, PNAS original PDF pp. 1–4, especially p. 3 on verification debt; opinion, not a measured trend", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, "theory_review-writing": {"task_scope": "AI drafts substantial manuscript sections or reviewer responses from the researchers’ premises, sources and outline; the researchers check that the argument follows from them and what the paper adds to existing theory.", "impacts": [{"id": "theory_review-writing-1", "kind": "opportunity", "label": "Drafting time freed for the argument", "text": "In a randomised experiment on short professional writing tasks, AI assistance cut the time needed and raised the rated quality of the texts {{S05-007}}. Drafts of sections or reviewer replies built from the authors’ own premises, sources, and outline may likewise free time for developing the central argument.", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "theory_review-writing-2", "kind": "opportunity", "label": "Clearer drafts and explanations", "text": "In a three-month field experiment, patent drafts written with AI received better blind ratings, especially those of junior lawyers {{S13-101}}, and AI drafts can help authors translate a model’s assumptions and causal logic into the plain language that formal theory needs to reach its readers {{S13-306}}.", "source_ids": ["S13-101", "S13-306"], "evidence": "adjacent"}, {"id": "theory_review-writing-3", "kind": "risk", "label": "Fluent text with weak support", "text": "Cornelissen warns that coherent prose and new construct names can give a text the look of theory without a validated mechanism behind it {{S13-301}}. AI drafts can also cite work that does not support a claim or does not exist, which European guidance makes researchers responsible for checking {{S03-006}} and which an audit of biomedical papers found in the published record {{S06-019}}.", "source_ids": ["S13-301", "S03-006", "S06-019"], "evidence": "adjacent"}, {"id": "theory_review-writing-4", "kind": "risk", "label": "Authors’ own judgement weakened", "text": "In a three-month trial, junior patent lawyers who had drafted with AI did no better on average than junior controls when they later edited a flawed patent without it, whereas lawyers with at least seven years in patent law did better than their controls {{S13-101}}. Other experiments found that deliberately biased AI writing suggestions shifted users’ views and that agreeable AI responses made people surer they were right {{S13-001}} {{S13-002}}, which could leave authors less critical of a draft or of a reply to reviewers.", "source_ids": ["S13-101", "S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "theory_review-writing-5", "kind": "risk", "label": "More drafts for others to check", "text": "Organization Science received 42 percent more submissions after ChatGPT appeared than in a comparable earlier period, and its editors link the disproportionate rise to AI use, which they measured with a detector {{S06-020}}. Supervisors and co-authors may likewise receive more AI-assisted chapters, revisions, and replies to check.", "source_ids": ["S06-020"], "evidence": "adjacent"}, {"id": "theory_review-writing-6", "kind": "risk", "label": "Unpublished work and disclosure", "text": "European guidance asks researchers not to upload unpublished work, whether their own or a colleague’s, to external AI systems without assurances about its reuse, and to disclose substantial AI use {{S03-006}}, while RUG limits external AI tools to public information {{S03-004}}.", "source_ids": ["S03-006", "S03-004"], "evidence": "reasoned"}], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining and limits; senior means at least seven years in patent law", "S13-306": "Makadok, original AMR PDF pp. 193–198, assumptions, omitted elements, derivations and accessibility", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81, methods and limitations; cause of fabricated references unknown", "S13-001": "Williams-Ceci et al., original PDF pp. 3–4 and 7–10, results, warning conditions and limitations", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S06-020": "Organization Science original PDF pp. 2 and 5–10, submission volume and AI-detector analyses, and p. 19 endnote 8", "S03-004": "RUG AI Office FAQ on Vibe, last modified 9 September 2026, general FAQ on external tools and research question on uploading a PDF; checked 4 October 2026"}}}, "department_forms": {"departments": {"HRM&OB": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 1, "Theory/Review": 6, "Mixed": 1, "Unclear": 0}}, "Marketing": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 0, "Theory/Review": 7, "Mixed": 1, "Unclear": 0}}, "IM&S": {"n": 25, "counts": {"Quantitative": 13, "Qualitative": 8, "Theory/Review": 4, "Mixed": 0, "Unclear": 0}}, "Operations": {"n": 25, "counts": {"Quantitative": 4, "Qualitative": 7, "Theory/Review": 13, "Mixed": 0, "Unclear": 1}}, "GEM": {"n": 25, "counts": {"Quantitative": 21, "Qualitative": 1, "Theory/Review": 2, "Mixed": 1, "Unclear": 0}}, "Accounting": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 2, "Theory/Review": 4, "Mixed": 1, "Unclear": 1}}, "EEF": {"n": 25, "counts": {"Quantitative": 16, "Qualitative": 0, "Theory/Review": 8, "Mixed": 1, "Unclear": 0}}}}, "slides": [{"id": "opening", "chapter": "Introduction", "layout": "title", "title": "Using AI well in research", "lead": "A follow-up to the research day", "visual": {"type": "title", "meta": "Joost van de Brake · October 2026", "note": "This presentation is interactive, so you can click on the tabs, on every cell of the heatmaps to read the reasoning behind its colour, and on the numbers in square brackets, which open the sources."}, "footnote": {"text": "If you are interested in the larger societal risks of rapid AI development, I recommend watching “[[link]]” by Kurzgesagt.", "link": {"text": "AI Just Crossed the Terrifying Line - Now What?", "url": "https://www.youtube.com/watch?v=ujkD4SxPKOI"}}}, {"id": "followup", "chapter": "Introduction", "title": "After the research day", "lead": "At the research day I showed what AI can do in research and where it goes wrong. Several of you asked what this means for your own work, and this follow-up tries to answer that. FEB is preparing a plan for AI in research this year, so I would also like to hear what you think. {{S01-001}}", "visual": {"type": "agenda", "cols": [{"label": "In this follow-up", "tone": "now", "items": [{"text": "I start with what we want to achieve with AI in our research.", "jump": "ambition"}, {"text": "I then look at how AI changes research by project stage, research form, and career position.", "jump": "dimensions"}, {"text": "The heatmaps combine the three dimensions and show where AI helps most and where we need to be careful.", "jump": "map-overview"}, {"text": "I end with what happens next and how you can help shape FEB’s plan.", "jump": "next"}]}], "method_label": "What I did", "method": "Over the past year I collected 280 sources on AI and research, 189 of them academic publications and the others FEB and university documents, job profiles, European guidelines, and reports from other universities. I used Claude and Codex to help analyse them and to estimate how AI affects research by project stage, research form, and career position, and I checked and reworked everything carefully myself. With this analysis I hope to develop support for FEB researchers who use AI, starting from the four principles on the next slide."}}, {"id": "ambition", "chapter": "Introduction", "title": "What we want to achieve", "visual": {"type": "statement", "principles_label": "Four principles", "principles": [{"title": "Quality and impact", "text": "We use AI where it improves the quality or impact of research and the gain is worth the total effort. {{S01-001}}", "jump": "quality", "link": "Quality and impact"}, {"title": "Human oversight", "text": "Researchers stay responsible for what AI produces. They check it, can explain it, and decide what goes into their work. {{S03-006}}", "jump": "stages", "link": "Research stages"}, {"title": "Preserving learning", "text": "We use AI in ways that support skill formation, so that anyone new to a method, PhD candidates included, still learns it themselves. {{S09-003}}", "jump": "positions", "link": "Career positions"}, {"title": "Equal access", "text": "AI tools and support are available in every department and at every career stage, so that good use of AI does not depend on personal budgets. {{S01-001}}"}]}, "lead": "We want AI to help FEB researchers do better research. Everyone should be able to use AI where it improves their work, check what it produces, and keep learning the craft of research."}, {"id": "quality", "chapter": "FEB’s strategy and research", "title": "FEB’s goals for research", "lead": "The strategic plan keeps research time and output per researcher stable and puts FEB’s ambitions in the quality and impact of research. AI is most useful to FEB where it helps researchers reach the three goals below. {{S01-001}}", "visual": {"type": "goals", "ai_label": "Where AI can help", "items": [{"figure": "AIP ≥ 95", "label": "Top-journal publications", "plan": "FEB researchers keep publishing in top economics and business journals, which FEB’s career criteria recognise by their Article Influence Score Percentile. {{S01-002}}{{S01-004}}", "ai": "AI can make a study more ambitious, for example by running complex analyses on large datasets that a team could not do on its own. {{S07-06}}"}, {"figure": "+20% by 2031", "label": "Prestigious grants", "plan": "Funding from prestigious grants should rise every year, to 20 percent above the 2023–2025 average by 2031. {{S01-001}}", "ai": "AI can play a critical reviewer before submission, testing the proposal’s argument against the funder’s criteria and the objections a panel is likely to raise. In a study at an Austrian funder, though, GPT-4o was biased against novel proposals. {{S14-605}}"}, {"figure": "Valued more", "label": "Societal impact", "plan": "FEB wants to reward impact on business, policy, and society more, through impact cases and an impact career track. {{S01-001}}", "ai": "AI can turn a paper into a policy brief, a dashboard, or a tool that partners can use themselves, and analyse their documents at scale within the data agreement."}]}}, {"id": "dimensions", "chapter": "Three dimensions", "layout": "divider", "title": "Three dimensions", "dimension": "overview", "lead": "The same AI tools, from chat assistants such as ChatGPT and Claude to coding agents and literature tools such as Elicit, can help one researcher and hurt another. Whether they help depends on three dimensions. The next slides look at each of them, and the heatmap at the end combines them to weigh opportunities and risks.", "visual": {"type": "divider", "items": [{"title": "Research stage", "text": "Where in a project AI is used, from the question to the final paper."}, {"title": "Research form", "text": "Whether the research is quantitative, qualitative, or theory and review, because AI output needs different checks in each form."}, {"title": "Career position", "text": "Whether the researcher is a PhD candidate, a postdoc, or an assistant, associate, or full professor, because each position has different tasks."}]}}, {"id": "stages", "chapter": "Three dimensions", "opener": {"number": "1", "kicker": "Dimension 1"}, "title": "Research stages", "dimension": "cycle", "lead": "AI can now contribute to every stage of a research project, from the first idea to the reply to reviewers, but how much of the work it can take on differs a lot by stage.", "visual": {"type": "xstages", "items": [{"key": "question", "name": "Question & theory", "desc": "Deciding what the study should explain and why that adds to what is known.", "ai": ["Suggest rival explanations, counterexamples, and related work from neighbouring fields. In a large study with NLP researchers, experts first rated research ideas from AI as more novel than human ideas, but once researchers carried the ideas out, the AI ideas lost more of their rating than the human ideas. {{S06-001}}{{S14-101}}{{S14-102}}"], "check": ["Whether an AI-generated idea is new at all. In a study in which 13 experts examined 50 research proposals written by AI, about a quarter turned out to paraphrase or borrow heavily from existing work without saying so. {{S14-110}}", "Whether the alternatives really differ. In a reanalysis of brainstorming experiments, ideas produced with ChatGPT were less diverse than ideas produced without it. {{S14-104}}"], "extent": {"level": 1, "short": "AI can suggest alternatives, but AI-generated research ideas tend to be weak", "why": "AI can suggest rival explanations and related work, but AI-generated research ideas tend to be weak. In a large study with NLP researchers, AI ideas first looked more novel than human ideas but lost more of their rating once researchers carried them out, and in a study in which 13 experts examined 50 research proposals written by AI, about a quarter paraphrased or borrowed heavily from existing work. {{S14-101}}{{S14-102}}{{S14-110}}"}}, {"key": "literature", "name": "Literature", "desc": "Finding, screening, and reading earlier work.", "ai": ["Search the literature and answer questions about it with citations. In a test of the retrieval system OpenScholar, experts preferred OpenScholar’s answers to answers written by other experts in 51 to 70 percent of comparisons, depending on the version. {{S08-020}}"], "check": ["Whether the cited studies exist and include those a specialist would expect. In the same test, GPT-4o hallucinated many titles when it cited from memory, and a study of GPT-4o’s reference suggestions found a bias towards highly cited work. {{S08-020}}{{S08-017}}", "Whether an AI summary says what the original papers say. Even OpenScholar, the best system in that test, sometimes missed representative papers or added information its sources did not support. {{S08-020}}"], "extent": {"level": 4, "short": "AI searches, screens, and summarises many papers with citations", "why": "AI can search, screen, and summarise many papers with citations. In a test of the retrieval system OpenScholar, experts preferred OpenScholar’s answers to answers written by other experts in 51 to 70 percent of comparisons, and in a living review in mental health, a tuned screening prompt missed none of the studies that were eventually included. {{S08-020}}{{S06-012}}"}}, {"key": "design", "name": "Design", "desc": "Choosing the comparison groups, the cases, the measures, or the model.", "ai": ["Rehearse a survey or experiment before data are collected, for example with simulated respondents, known as silicon samples. In a study of 70 survey experiments with representative US samples, GPT-4 forecasts correlated strongly with the real effects, although the forecast effects were too large. {{S07-11}}{{S14-107}}"], "check": ["Whether the identification strategy supports the causal claim. In a benchmark of 174 causal questions taken from real studies, a reasoning model named the right family of designs in 81 percent of cases but gave a fully correct identification in 38 percent. {{S14-108}}", "Whether the team can reach the people, firms, or records that the design needs. {{S06-004}}"], "extent": {"level": 2, "short": "AI drafts designs and simulates respondents, but often gets causal identification wrong", "why": "AI can draft designs and simulate respondents, but it often gets the causal identification wrong. In a benchmark of 174 causal questions taken from real studies, a reasoning model gave a fully correct identification in 38 percent of cases. {{S14-107}}{{S14-108}}"}}, {"key": "data", "name": "Data / sources", "desc": "Obtaining and preparing data and documents.", "ai": ["Retrieve and combine online datasets and archives, extract information from filings and reports, and transcribe or conduct interviews. With AI, a larger panel or a new text-based measure becomes feasible where collecting and coding by hand would have cost too much. {{S06-023}}{{S07-08}}{{S14-401}}"], "check": ["Whether the data provider allows the data to be processed with an AI tool at all. {{S06-021}}", "Whether measurement error in AI-generated variables biases the estimate. In a study of job postings that AI had classified, correcting for nine false positives in a sample of 1,000 moved a regression coefficient from 0.364 to 0.641. {{S07-07}}"], "extent": {"level": 4, "short": "AI retrieves, combines, and codes archives and online data", "why": "AI makes online datasets, archives, filings, and reports far easier to retrieve, combine, and turn into variables. Researchers have used language models to extract ownership information from corporate documents, and a hand-coded validation sample can correct the errors in such measures. {{S06-023}}{{S07-08}}{{S08-013}}"}}, {"key": "analysis", "name": "Analysis & interpretation", "desc": "Producing results and deciding what they mean.", "ai": ["Write and run analysis code, try alternative specifications, and reproduce published results from the original materials. {{S08-010}}"], "check": ["Whether the code does what the paper says it does. In a survey in which 506 researchers described a coding task they had done with AI, about half mentioned running the code to check it, 3 percent automated tests, and 2 percent a code review by someone else. {{S14-205}}", "Whether the estimand (the quantity being estimated) and the assumptions support the interpretation. In a study of seven-hour reproduction games, teams without AI found more major coding errors than teams with AI. {{S07-01}}"], "extent": {"level": 3, "short": "AI writes and runs analysis code and reproduces published results", "why": "AI can write and run analysis code and reproduce published results. In a test with the original materials of 54 social science papers, the better of two coding agents reproduced 93 percent of 221 tasks, while deciding what a result means stays with the researcher. {{S08-010}}"}}, {"key": "writing", "name": "Writing & review", "desc": "Writing up the study, revising it, and sharing it.", "ai": ["Draft and edit text faster, which helps authors who write in a second language. A study of preprint servers found that authors who started using AI went on to post more preprints than comparable authors who did not, although the study cannot show that AI caused the increase. {{S14-204}}"], "check": ["Whether fluent AI-assisted text still shows the authors’ reasoning. At Organization Science, the editors found that submissions rose after late 2022 and that manuscripts with higher AI-detector scores were more often rejected without review. {{S06-020}}", "Whether a manuscript that looks finished holds up under review. When the developers of a fully automated research system submitted three of the system’s papers to a workshop that accepted 70 percent of submissions, one passed review, and the developers documented weak ideas, coding errors, and inaccurate citations. {{S14-109}}"], "extent": {"level": 4, "short": "AI drafts and edits text and replies to reviewers", "why": "AI can draft and edit whole sections and replies to reviewers. In a writing experiment with professionals, people who used ChatGPT finished in about 40 percent less time than those without it, and their texts were rated higher. {{S05-007}}"}}], "note": "Researchers often move back and forth between stages. Conceptual papers collect no new data, and reviews treat published studies as their data.", "xtitle": "How much of the work AI can now take on", "xexplain": "A darker shade means AI can take on more of the work, whether that turns out well or badly. The heatmaps later in the presentation weigh the opportunities and risks."}}, {"id": "forms", "chapter": "Three dimensions", "opener": {"number": "2", "kicker": "Dimension 2"}, "title": "Research forms", "dimension": "forms", "lead": "Each form of research uses AI for different tasks and has its own standard for whether a finding can be trusted. Many papers combine forms.", "visual": {"type": "xforms", "items": [{"key": "quantitative", "name": "Quantitative", "desc": "Estimating effects and patterns from numerical evidence, including statistical meta-analysis.", "can": ["Treat text as data by turning reports, filings, and news into variables, so that datasets too costly to code by hand become feasible. {{S07-08}}", "Write and run estimation code and reproduce published results. In a test with the original materials of 54 social science papers, the better of two coding agents reproduced 93 percent of 221 tasks. {{S08-010}}"], "defend": "A sample that covers the population studied, construct validity, a credible identification strategy, and inference that allows for measurement error in AI-generated variables. {{S06-002}}{{S08-013}}", "wrong": "Trying prompts until one gives the desired result is a new form of specification search. In a finance study that measured sentiment with AI, twelve plausible combinations of model and prompt gave slopes from 0.083 to 0.226. {{S14-301}}{{S08-013}}", "chart": {"label": "Results reproduced in seven-hour reproduction games {{S07-01}}", "unit": "%", "bars": [{"label": "Teams without AI", "value": 94, "text": "31 of 33"}, {"label": "Teams assisted by AI", "value": 91, "text": "32 of 35"}, {"label": "Teams led by AI", "value": 37, "text": "13 of 35"}], "note": "Teams without AI also found more major coding errors than teams with AI."}, "defend_label": "Validity"}, {"key": "qualitative", "name": "Qualitative", "desc": "Understanding experiences, meanings, and practices through interviews, observation, and documents.", "can": ["Conduct online interviews that adapt to each answer. In a study of 766 online interviews led by AI, the AI interviewer drew out about five times as many distinct themes as a single fixed open question. {{S14-401}}", "Transcribe recordings and apply a codebook. In a blinded test on one focus group, newer models coded as consistently as human analysts with a fixed codebook, although only one did so for inductive themes drawn from the data. {{S14-404}}{{S14-405}}"], "defend": "Who took part and why, faithful records of what people said and in what context, and an interpretation that can be traced to passages, including negative cases that contradict it. {{S06-024}}{{S07-15}}", "wrong": "In a small study that compared five AI interviews with six human interviews, the AI interviewer missed more chances to probe surprising answers, and participants interviewed by AI were less keen to repeat the interview. {{S14-402}}", "chart": {"label": "Preferred interviewer for a future interview, after an AI interview {{S14-401}}", "unit": "%", "bars": [{"label": "AI", "value": 53, "text": "53%"}, {"label": "No preference", "value": 26, "text": "26%"}, {"label": "Human", "value": 21, "text": "21%"}], "note": "A selected US online panel, without the people who declined the AI interview.", "stacked": true}, "defend_label": "Trustworthiness"}, {"key": "theory_review", "name": "Theory / review", "desc": "Developing formal or conceptual arguments and synthesising existing studies, including integrative reviews.", "can": ["Screen titles and abstracts for a systematic review. In a living review in mental health, tuned prompts wrongly excluded none of the studies that were eventually included. {{S06-012}}", "Propose mechanisms and counterexamples, and prove some stated theorems. In a benchmark of 200 graduate-level mathematics problems, the best AI agent wrote formally verified proofs for a third of them. {{S14-505}}"], "defend": "A transparent search or a justified set of assumptions, accurate sources and derivations, and a theoretical contribution that changes how the field explains the phenomenon studied. {{S13-305}}{{S13-306}}", "wrong": "AI makes HARKing cheap, that is, hypothesising after the results are known. In a demonstration, two finance researchers used AI to generate hundreds of paper drafts that attached theories to predictors of stock returns mined from accounting data. {{S13-307}}", "chart": {"label": "Sensitivity, the share of included studies that each search found, in four evidence syntheses {{S14-506}}", "unit": "%", "bars": [{"label": "Original searches", "value": 94.5, "text": "94.5%"}, {"label": "AI review tool", "value": 39.5, "text": "39.5%"}], "note": "The AI tool had far higher precision (the share of found studies that were included), 42 against 8 percent."}, "defend_label": "Rigour and contribution"}], "extent": {"title": "How much of the work AI can now take on", "explain": "A darker shade means AI can take on more of the work, whether that turns out well or badly. The heatmaps later in the presentation weigh the opportunities and risks.", "levels": {"quantitative": [1, 4, 2, 4, 4, 4], "qualitative": [1, 3, 2, 4, 2, 3], "theory_review": [1, 4, 2, 3, 2, 4]}, "why": {"quantitative-question": "AI can propose questions and rival explanations to compare, but in a large study with NLP researchers, AI ideas lost more of their rating than human ideas once researchers carried them out. The researcher still has to find and justify a good question. {{S06-001}}{{S14-102}}", "quantitative-literature": "AI can screen the results of large searches and answer questions that need several papers, with citations. In a living review in mental health, a tuned screening prompt missed none of the studies that were eventually included. {{S06-012}}{{S08-020}}", "quantitative-design": "AI can draft designs and simulation code that tests an estimator before any data are collected. In a benchmark of 174 causal questions taken from real studies, however, a reasoning model gave a fully correct identification in only 38 percent of cases. {{S13-203}}{{S14-108}}", "quantitative-data": "AI makes online datasets, filings, and reports far easier to retrieve, combine, and turn into variables. Researchers have used language models to extract ownership information from corporate documents, and a hand-coded validation sample can correct the errors in such measures. {{S06-023}}{{S07-08}}{{S08-013}}", "quantitative-analysis": "AI can write and run complex models on large datasets that would take a team weeks by hand. In a test with the original materials of 54 social science papers, the better of two coding agents reproduced 93 percent of 221 tasks. {{S08-010}}{{S06-018}}", "quantitative-writing": "AI can draft sections and replies to reviewers from the authors’ outline and tables. In a writing experiment with professionals, ChatGPT cut the time needed by about 40 percent. {{S05-007}}", "qualitative-question": "AI can suggest concepts and explanations from neighbouring fields, but a good question for qualitative research comes from knowing the people and organisations under study. In a study in which 13 experts examined 50 research proposals written by AI, about a quarter paraphrased or borrowed heavily from existing work. {{S13-103}}{{S14-110}}", "qualitative-literature": "AI can search with several terms across fields, screen and summarise many studies, and set them side by side. In a living review in mental health, a tuned screening prompt missed none of the included studies, while a researcher still has to read closely to see how the studies differ in theory. {{S07-21}}{{S06-012}}", "qualitative-design": "AI can draft interview guides, sampling plans, and information letters. In a large test of an AI feature in Google Forms, users who adopted it spent about 27 percent less time editing their forms, while the researcher still judges whether the questions suit the participants and are ethical. {{S05-012}}", "qualitative-data": "AI transcribes recordings and sorts interviews, field notes, documents, and archives, which leaves more time for fieldwork and reading. In a web-survey experiment with 1,800 participants, AI follow-up questions also drew fuller answers. {{S07-15}}{{S06-026}}", "qualitative-analysis": "AI can apply a fixed codebook to more transcripts and documents than a team could code by hand. In a study of one deductive coding task, GPT-3 reached fair to substantial agreement with expert codes, and in a blinded test on one focus group only one model matched human analysts for inductive themes drawn from the data. {{S07-02}}{{S14-405}}", "qualitative-writing": "AI can turn an interpretive outline into a full draft and organise replies to reviewers. In a writing experiment with professionals ChatGPT cut the time needed, while the researcher still checks each quotation against the full interview or document. {{S05-007}}", "theory_review-question": "AI can suggest ways to frame a question and objections to a first idea, but AI-generated research ideas tend to be weak. In a study in which 13 experts examined 50 research proposals written by AI, about a quarter paraphrased or borrowed heavily from existing work without saying so. {{S06-001}}{{S14-110}}", "theory_review-literature": "AI can search neighbouring literatures that use other terms, screen abstracts in a first pass, and explain unfamiliar research traditions. In a living review in mental health, a tuned screening prompt missed none of the studies that were eventually included. {{S06-006}}{{S06-012}}{{S08-020}}", "theory_review-design": "AI can draft alternative model assumptions, conceptual frameworks, or review procedures and list the premises they rest on, while the researcher still judges whether the chosen design can yield new theory. {{S07-05}}{{S13-306}}", "theory_review-data": "For integrative reviews, AI can collect the studies, remove duplicates, and extract data from each study. In a comparison across four evidence syntheses in health, however, the AI review tool Elicit found only 39.5 percent of the included studies, against 94.5 percent for the original searches. {{S13-305}}{{S06-012}}{{S14-506}}", "theory_review-analysis": "AI can propose derivations, syntheses of earlier studies, and counterexamples. In a test with ten new research-level mathematics problems, public AI systems together produced at least one solution that expert graders passed for seven of them, and each proof still needed expert checking. {{S08-007}}{{S06-001}}", "theory_review-writing": "AI can draft sections from the authors’ premises, sources, and outline. In a three-month field experiment with patent lawyers, drafts written with AI received better blind ratings than drafts without it. {{S05-007}}{{S13-101}}"}}}}, {"id": "positions", "chapter": "Three dimensions", "opener": {"number": "3", "kicker": "Dimension 3"}, "title": "Career positions", "dimension": "positions", "lead": "Research also trains the people who carry out later projects. The university’s UFO job profiles describe what each position does, and AI changes the work of each position in different ways.", "visual": {"type": "xpositions", "items": [{"key": "phd", "name": "PhD candidate", "ufo": "UFO profile Promovendus", "job": "Works out a research plan with the supervisor, carries out and checks the research, publishes, and writes and defends a dissertation. The candidate receives doctoral guidance and may teach when this is assigned. The research is also training, because the candidate has to learn to explain the question, the methods, and the conclusions. {{S09-012}}", "ai": "AI can speed up searches, code, transcription, and drafting, and it can answer a small question when the supervisor is not available. When candidates leave the reasoning to AI, their work can also contain choices they cannot yet explain. In a randomised study of skill formation, people who learned an unfamiliar programming library with AI scored lower on a quiz without AI straight afterwards than people who learned without it. {{S09-003}} In an experiment in high school mathematics, an AI tutor built to give hints largely avoided that drop. {{S09-004}} A supervisor who sees only finished sections also sees less of what the candidate understands."}, {"key": "postdoc", "name": "Postdoc", "ufo": "UFO profile Onderzoeker", "job": "Postdoc is not one UFO profile. The Onderzoeker profile has four levels, from research under supervision to independent work, coordinating linked projects, and directing a programme. Acquiring funding and guiding PhD candidates belong to the higher levels or to particular appointments. Most postdocs work on a fixed-term project and need publications or results that others can recognise as their own. {{S09-013}}", "ai": "AI can shorten searches, data preparation, code, and drafting, which leaves room to test an alternative explanation or to start a separate paper. With AI, a postdoc can also fill a fixed-term contract with more manuscripts and grant drafts than one person can check. In a three-month trial, patent lawyers wrote better drafts with an AI tool, but on a later test without the tool only the experienced lawyers had improved on average. {{S13-101}} A postdoc who knows the newest AI methods may also become the group’s helpdesk, at the expense of their own research."}, {"key": "ud", "name": "Assistant professor", "ufo": "UFO profile Universitair docent (UD)", "job": "Combines research and teaching. At UD2 the research follows a defined and approved proposal, and at UD1 the assistant professor conducts research independently, helps acquire external funding, and guides research staff. The profile also includes supervising students, coaching colleagues, and guiding PhD candidates as copromotor in consultation with the promotor. {{S09-014}}", "ai": "An assistant professor may use AI as an author, a teacher, and a supervisor in the same week, so time saved in one task need not lower the total workload. In their own research, AI can take over much of the legwork, from finding sources to writing code and replying to reviewers, but a fluent answer does not show that the tool understood the problem. In a field experiment with consultants at Boston Consulting Group, those who used AI did better on tasks that AI handles well and worse on a task beyond AI’s abilities, a boundary the authors call the jagged frontier. {{S05-009}} A study of US federal grant proposals found that proposals with more AI involvement used wording closer to previously funded work. {{S14-604}}"}, {"key": "uhd", "name": "Associate professor", "ufo": "UFO profile Universitair hoofddocent (UHD)", "job": "Initiates, conducts, and publishes research, develops projects, and acquires funding. At UHD2 the associate professor coordinates linked projects within a programme, and at UHD1 a whole programme or a multiyear specialist project, sometimes with leadership of a group. The profile also includes guiding research staff and PhD candidates and developing teaching. {{S09-015}}", "ai": "AI can make coordination easier by comparing sources, deadlines, analyses, and grant requirements across projects, as long as someone checks the AI summaries before the team relies on them. {{S14-603}} The associate professor still decides which projects belong together and whether a finding changes the research programme. When every project member drafts faster, more analyses reach the coordinator for checking. In a study of 139 proposals at an Austrian research funder, GPT-4o agreed with the funder’s decision in 87 cases but showed a bias against novelty. {{S14-605}}"}, {"key": "prof", "name": "Full professor", "ufo": "UFO profile Hoogleraar", "job": "Develops the research programme of the chair, conducts research, and publishes. The professor sets priorities, acquires funding, allocates resources, recruits and develops staff, and makes sure that PhD supervision is good. The professor is also responsible for research quality and integrity in the chair and represents it. {{S09-016}}", "ai": "A professor can save time in their own literature work, analysis, and grant writing, and their deep knowledge of a debate lets them use AI as a sparring partner. AI can prepare overviews for decisions about staff and the research programme, but research on algorithmic management finds that such systems rarely replace the manager’s decision. {{S14-602}} When everyone in the chair works faster, more papers, analyses, and grant ideas reach the professor for checking. If colleagues take routine questions to AI, the professor may also hear later where they are stuck. {{S07-27}}"}], "note": "The profiles describe the duties of a job, and individual researchers divide their time over them in different ways. {{S09-017}} The heatmap later groups the five positions into three career groups.", "extent": {"title": "How much AI changes this part of the job", "explain": "A darker shade means AI changes more of this part of the job. The heatmaps later in the presentation weigh the opportunities and risks for each career group.", "cols": [{"key": "own", "label": "Own research"}, {"key": "check", "label": "Supervising and checking"}, {"key": "lead", "label": "Funding and coordination"}], "cells": {"phd": {"own": {"level": 4, "why": "AI can now take on much of the hands-on work that fills a PhD candidate’s days, such as searching the literature, writing code, transcribing, and drafting, and this research is the core of the job. {{S09-012}}"}, "check": {"level": 1, "why": "PhD candidates do not supervise others in their profile, so AI changes little here, apart from any teaching they are assigned. {{S09-012}}"}, "lead": {"level": 1, "why": "Acquiring funding and coordinating projects are not part of the PhD profile, so AI changes little here. {{S09-012}}"}}, "postdoc": {"own": {"level": 4, "why": "AI can shorten the searches, data preparation, code, and drafting that fill most of a postdoc’s fixed-term project. {{S09-013}}"}, "check": {"level": 2, "why": "Postdocs guide PhD candidates only at the higher levels of the profile. AI adds some checking work, for example when a postdoc who knows the newest AI tools becomes the group’s helpdesk. {{S09-013}}"}, "lead": {"level": 2, "why": "Acquiring funding belongs to the higher levels of the profile or to particular appointments. For postdocs who apply for grants, AI can speed up the drafting. {{S09-013}}"}}, "ud": {"own": {"level": 3, "why": "AI can speed up finding sources, writing code, framing a paper, and replying to reviewers in an assistant professor’s own research, which shares the week with teaching. {{S09-014}}"}, "check": {"level": 3, "why": "As supervisor of students and copromotor of PhD candidates, an assistant professor now receives more work that was drafted or analysed with AI and has to check whether students and candidates understand what they hand in. {{S09-014}}"}, "lead": {"level": 2, "why": "At UD1 the assistant professor helps acquire funding. AI can draft parts of a proposal, although a study of US federal grants found that proposals with more AI involvement used wording closer to previously funded work. {{S09-014}}{{S14-604}}"}}, "uhd": {"own": {"level": 3, "why": "An associate professor still initiates and conducts research, and AI can save time on hands-on tasks such as coding and drafting. {{S09-015}}"}, "check": {"level": 4, "why": "An associate professor coordinates linked projects and guides research staff and PhD candidates. When every project member drafts and analyses faster with AI, more analyses and texts reach the associate professor for checking. {{S09-015}}"}, "lead": {"level": 3, "why": "AI can prepare the comparisons of sources, deadlines, analyses, and grant requirements that coordinating linked projects and acquiring funding involve, while the associate professor still decides which projects belong together. {{S09-015}}{{S14-603}}"}}, "prof": {"own": {"level": 2, "why": "A full professor still conducts research, and AI changes hands-on tasks such as coding and drafting most, but these tasks make up a smaller share of a job that also includes leading the chair. {{S09-016}}"}, "check": {"level": 4, "why": "A full professor is responsible for research quality and integrity in the chair. When everyone in the chair drafts and analyses faster with AI, more papers, analyses, and grant ideas reach the professor for checking. {{S09-016}}"}, "lead": {"level": 3, "why": "AI can prepare overviews for setting priorities, acquiring funding, and allocating resources, although research on algorithmic management finds that such systems rarely replace the manager’s decision. {{S09-016}}{{S14-602}}"}}}}}}, {"id": "map-overview", "chapter": "The combined assessment", "layout": "overview", "title": "Combined assessment of opportunities and risks", "lead": "For each research form and stage, we defined one AI task and listed the benefits and risks that studies report for it. For each career group, we then judged whether the benefits outweigh the costs of checking and the effects on researchers’ learning, and every cell explains why.", "cohort_notes": {"phd": "PhD candidates can gain from AI-assisted data preparation, but letting AI carry out the main analysis takes away the practice in analysis that the dissertation is meant to provide. {{S09-012}}{{S09-003}}", "postdoc_ap": "Postdocs and assistant professors gain most where they decide the design and interpret the results themselves, provided their contract or workload leaves time to validate what AI produces. {{S09-013}}{{S09-014}}", "senior": "Associate and full professors can save time in their own research, while more AI-assisted papers and analyses from their teams add to what they have to check. {{S09-015}}{{S09-016}}"}, "cohort_notes_supported": {"phd": "With support, PhD candidates gain in most tasks if they first carry out the main steps of a method themselves, while design and analysis stay mixed in every research form. {{S09-012}}{{S09-003}}", "postdoc_ap": "With time to check what AI produces, postdocs and assistant professors gain in every task except the data and analysis stages of qualitative research. {{S09-013}}{{S09-014}}", "senior": "When colleagues share the checking, associate and full professors gain in every task except the data, analysis, and writing stages of qualitative research. {{S09-015}}{{S09-016}}"}}, {"id": "programme", "chapter": "The combined assessment", "title": "What a faculty AI support programme could change", "lead": "Each cell names the support that could change its judgment, such as a validation sample or an independent review of code. With that support, at a reasonable cost in time, 27 of the 36 mixed judgments would become opportunities and the four risk judgments would become mixed.", "visual": {"type": "programme", "maps": [{"scenario": "ordinary", "label": "Without a faculty AI programme"}, {"scenario": "supported", "label": "With a faculty AI support programme"}], "axes": "Columns are the six research stages, from question and theory to writing and review, and each block of three rows, one per research form, is one career group. Select a cell to see its judgment and the support that could change it.", "support_label": "What the support involves", "rows": [["Access", "Researchers get methods advice and access to the right tools for their task, including secure tools for sensitive data. {{S03-015}}{{S03-014}}"], ["Learning", "Researchers who are learning a method, PhD candidates included, practise it and reconstruct a main result themselves. {{S09-004}}"], ["Checking", "Teams use validation samples, independent code reviews, and audits of excluded studies, and count the time these take."], ["Sharing", "Prompts, code checks, and validation procedures that work are shared across projects."]], "caption": "The colours with support assume that the support is available, used, and worth its cost, and FEB has not yet tested these assumptions."}}, {"id": "next", "chapter": "Next steps", "title": "What happens next", "lead": "In the coming months I would like to try out some of the support described above, starting with researchers who are learning a new method, while basic guidance on using AI is available to everyone.", "visual": {"type": "nextsteps2", "cols": [{"rating": "wine", "title": "Where we could start", "text": "The heatmaps suggest starting with tasks in which researchers can check what AI produces, such as preparing data with a validation sample. AI-assisted interviews and qualitative coding need small trials before wider use. {{S14-301}}{{S14-401}}"}, {"rating": "wine", "title": "What I would like to hear from you", "text": "Before FEB settles its plan, I would like to know which research tasks you already use AI for, where support would help you most, and what worries you."}], "closing": "For each trial we will look at the quality of the analyses and texts, the time that checking took, and what researchers can still explain without AI.", "cta": {"label": "Send your input by email", "href": "mailto:h.j.van.de.brake@rug.nl?subject=Input%20on%20AI%20in%20research", "note": "Or use the Contact tab of this dashboard."}}}], "cells": [{"id": "quantitative-question-phd", "cohort": "phd", "research_type": "quantitative", "stage": "question", "bundle": "quantitative-question", "headline": "Candidates must still learn to frame their research question", "headline_supported": "Candidates who first write their own question gain from AI", "rating": "mixed", "supported_rating": "opportunity", "rationale": "AI can give a PhD candidate rival hypotheses to consider, but a candidate who is still learning the field may choose an appealing question that the available data cannot answer. The candidate may also lose practice in framing the research problem of their own dissertation.", "support": "Before using AI, the candidate writes down a question and the comparison in the data that would answer it, and then discusses the hypotheses that AI suggests and the available measures with the supervisor.", "sensitivity": "HARKing, that is, hypotheses generated after the results are known and presented as earlier predictions, moves the judgment towards risk, while a candidate who can defend the chosen question moves it towards opportunity.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-103", "S09-012"], "inventory_source_ids": ["S06-001", "S06-014", "S13-103", "S13-301", "S13-307"], "source_locators": {"S01-002": "FEB Career Tracks 2025 update for new hires, PDF cover p. 1 and Research Profile promotion criteria pp. 15–16", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52 and Figure 1 on illusions of understanding; perspective, not outcome evaluation", "S09-008": "OECD, Reducing the precarity of academic research careers, career development discussion and policy recommendations, PDF p. 47", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, quality of individuals with AI and idea generation versus selection", "S13-301": "Cornelissen local accepted manuscript PDF pp. 6–8 (manuscript pp. 5–7)", "S13-307": "AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable"}}, {"id": "quantitative-literature-phd", "cohort": "phd", "research_type": "quantitative", "stage": "literature", "bundle": "quantitative-literature", "headline": "AI summaries can hide the debates a candidate must learn", "headline_supported": "Candidates who track conflicting studies learn the debates", "rating": "mixed", "supported_rating": "opportunity", "rationale": "When AI screens the search results, a PhD candidate gains time to read the original papers. Learning a field, though, includes noticing where studies disagree and which designs are weak, and AI summaries may smooth over those disagreements and weaknesses.", "support": "The candidate keeps a reading map that pairs each claim the dissertation relies on with a conflicting study and a passage from the original paper.", "sensitivity": "If the candidate accepts the AI’s final list of studies without checking which relevant studies the AI missed, the judgment turns to risk, especially in a statistical meta-analysis.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S06-012", "S08-020", "S09-012"], "inventory_source_ids": ["S03-004", "S06-001", "S06-011", "S06-012", "S07-20", "S07-32", "S08-017", "S08-020"], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S06-012": "Homiar et al., PubMed abstract Methods/Results on calibrated screening and simulated workload", "S07-20": "Clark et al. evidence-synthesis systematic review, PubMed abstract Methods and Results", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "quantitative-design-phd", "cohort": "phd", "research_type": "quantitative", "stage": "design", "bundle": "quantitative-design", "headline": "Candidates must still learn to defend design choices", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "A PhD candidate can learn about design by comparing the different quantities a study could estimate and the checks that AI proposes. Yet a specification drafted by AI can hide assumptions that the candidate must learn to explain and defend.", "support": "Before any code is written, the candidate defends the design on one page, stating what the study estimates, which observations it needs, and when the design would give a wrong answer.", "sensitivity": "The judgment can move to opportunity when the candidate explains and tests the alternative designs from AI, and to risk if the candidate cannot defend the specification without AI.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S09-012", "S07-07"], "inventory_source_ids": ["S03-003", "S06-002", "S06-003", "S06-010", "S06-021", "S07-07", "S08-013", "S09-003", "S13-203"], "source_locators": {"S03-003": "RUG Safe and Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026", "S06-002": "Angrist and Pischke, Journal of Economic Perspectives, abstract/introduction on credible empirical design", "S06-003": "Nevo and Whinston, Journal of Economic Perspectives publisher abstract on structural modelling and assumptions", "S06-010": "DeCelles et al., AMJ transparency editorial pp. 1009–10 on disclosing how analyses evolved", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-203": "Horton, Filippas and Manning, revised NBER working paper PDF pp. 2–4, 14 and 29–31 on simulated economic agents and the limits of fit"}}, {"id": "quantitative-data-phd", "cohort": "phd", "research_type": "quantitative", "stage": "data", "bundle": "quantitative-data", "headline": "Candidates learn the data by checking what AI extracts", "headline_supported": null, "rating": "opportunity", "supported_rating": "opportunity", "rationale": "With AI preparing the data, a PhD candidate can build a larger panel or a text-based measure that would take too long by hand. Checking what AI extracted against the original documents also deepens the candidate’s knowledge of the data.", "support": "The candidate checks by hand a sample that covers different firms, years, and ambiguous passages, and explains each error the AI made.", "sensitivity": "If the candidate never looks at the raw records, or if the generated measure misses the intended construct, the judgment changes to risk.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S07-08", "S08-013", "S09-012"], "inventory_source_ids": ["S03-004", "S06-009", "S06-021", "S06-023", "S07-07", "S07-08", "S07-32", "S08-013", "S13-303"], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-009": "AEA Data and Code Policies and Guidance page, lines 6–24 on documented data and code", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S06-023": "SEC EDGAR API overview, submissions, XBRL, and Programmatic API Access", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S07-08": "Levich and Knust, accounting annual-report ownership extraction, publisher abstract and methods summary", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-303": "Messeri and Crockett, Nature comment, original PDF printed pp. 675–676"}}, {"id": "quantitative-analysis-phd", "cohort": "phd", "research_type": "quantitative", "stage": "analysis", "bundle": "quantitative-analysis", "headline": "AI can produce results before the candidate can check them", "headline_supported": "Candidates learn more if they rebuild one result by hand", "rating": "risk", "supported_rating": "mixed", "rationale": "An AI coding tool can write the main estimation code and return a plausible table before a PhD candidate has learned to diagnose faulty data merges, wrong assumptions, or coding errors. Code that runs without errors does not by itself show that the conclusion drawn from the table is valid.", "support": "The candidate codes or calculates by hand one main result, explains each change in the specification, and independently tests the extra analyses that the AI tool adds.", "sensitivity": "With a simple estimator specified in advance and an independent replication, AI-written code can become an opportunity, but it remains a risk if the AI’s interpretation is accepted as proof of the finding.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S09-003", "S09-012", "S07-01"], "inventory_source_ids": ["S06-018", "S08-009", "S08-010", "S09-003", "S09-004", "S09-005"], "source_locators": {"S06-018": "Aygün et al., local PDF pp. 2–10, Results and Discussion; Nature version", "S08-009": "Brodeur et al., PNAS p. 5 Table 1 and Results section 2.2 on reproduction and errors; PDF pp. 5–6 and Tables 1–2 on time to reproduction", "S08-010": "Alizadeh et al., preprint HTML sections 2.1, 2.4, 5.1–5.3 and Figures 1 and 5", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-004": "Bastani et al., local author-version PDF pp. 1–5, 9–11 and Table 1; discussion pp. 19–20", "S09-005": "Kestin et al., Scientific Reports, Methods (design and participants), Results and Discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "quantitative-writing-phd", "cohort": "phd", "research_type": "quantitative", "stage": "writing", "bundle": "quantitative-writing", "headline": "AI drafting gives less practice in stating what results show", "headline_supported": "Candidates who state their claims first can draft with AI", "rating": "mixed", "supported_rating": "opportunity", "rationale": "When AI drafts substantial parts of a dissertation chapter, a PhD candidate can have the chapter ready to discuss with the supervisors sooner. But formulating a claim from a result is part of how the candidate learns what the results support.", "support": "The candidate writes the first explanation of the results and an outline linking each main claim to its result, and then uses AI for the remaining text. The supervisor checks the claims against the results tables.", "sensitivity": "The judgment moves to risk if the candidate cannot defend the argument without the AI draft, and to opportunity if the candidate spends the time saved on working out what the results show.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S05-007", "S09-012", "S09-003"], "inventory_source_ids": ["S05-007", "S05-009", "S06-019", "S06-020", "S13-001", "S13-002"], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S05-009": "Dell’Acqua et al., published original PDF pp. 2, 7–9, 11–13 and Tables 4, 7, 9: inside/outside frontier and persuasive wrong answers", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81 methods and limitations; erratum exists", "S06-020": "Gartenberg et al., Organization Science original PDF pp. 2, 5–10 (printed pp. 1, 4–9), Figure 1, Table 1", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 limitations and methods", "S13-002": "Cheng et al., PDF pp. 5 and 7–8 (article pp. 4 and 6–7)"}}, {"id": "qualitative-question-phd", "cohort": "phd", "research_type": "qualitative", "stage": "question", "bundle": "qualitative-question", "headline": "Candidates may adopt an AI question before fieldwork", "headline_supported": "Candidates test AI questions against early field notes", "rating": "mixed", "supported_rating": "opportunity", "rationale": "Rival questions from AI can help a PhD candidate compare possible studies, but a fluent suggestion can set the project’s direction before the candidate knows the people or organisations studied well enough to challenge it. Choosing and defending an option still gives practice, and the balance depends on whether the candidate first develops a question and tests alternatives in early fieldwork.", "support": "The candidate writes an initial question before seeing any AI suggestions. In a scheduled supervision meeting, candidate and supervisor then compare the AI’s alternatives with notes from the first interviews or observations.", "sensitivity": "If a polished suggestion fixes the research question before any fieldwork, or if confidential field notes go into an unapproved AI tool, the judgment stays mixed or turns to risk.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-103", "S14-102", "S06-024", "S09-012"], "inventory_source_ids": ["S01-002", "S03-004", "S05-016", "S06-001", "S06-004", "S06-014", "S06-024", "S09-012", "S13-103"], "source_locators": {"S13-103": "Dell’Acqua et al., published PDF pp. 2–4, 12–18 and 20–22, stage decomposition showing larger AI gains in idea generation than in selection", "S06-001": "Korinek, published PDF pp. 1281–84, use cases including background research and ideation", "S06-004": "Edmondson and McManus, original PDF pp. 1155–56 and Table 1 on methodological fit", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S06-014": "Messeri and Crockett 2024, Nature printed p. 54 on monocultures of knowing and questions that need attention to subjectivity; Box 1 p. 50", "S05-016": "Doshi and Hauser, PMC full text Results and Discussion, 293-writer short-story experiment", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S01-002": "FEB Career Tracks 2025, PDF cover p. 1 and pp. 15–16, Research Profile promotion criteria for new hires from 1 January 2026", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), general FAQ on external tools and research FAQ on personal data, page last modified 9 September 2026"}}, {"id": "qualitative-literature-phd", "cohort": "phd", "research_type": "qualitative", "stage": "literature", "bundle": "qualitative-literature", "headline": "Candidates may miss research traditions a search skipped", "headline_supported": "A librarian helps candidates spot missing traditions", "rating": "mixed", "supported_rating": "opportunity", "rationale": "A broad first overview of studies and quicker summaries can help a PhD candidate learn a research area. While that knowledge is still forming, a missing research tradition or an inaccurate summary is hard to notice, and ordinary supervision catches some of these gaps and errors, though not all.", "support": "A librarian helps the candidate build search strings, and the candidate follows up citations and keeps a log of excluded studies. Candidate and supervisor then discuss, from the full texts, the studies the topic rests on and those with contrary findings.", "sensitivity": "The judgment moves to risk if the candidate treats the studies an AI search returns as the full literature or relies on summaries without reading the studies.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S06-011", "S08-020", "S09-012"], "inventory_source_ids": ["S03-004", "S06-011", "S06-012", "S07-15", "S07-21", "S08-017", "S08-020", "S13-303"], "source_locators": {"S07-21": "Tran et al., PubMed abstract Methods and Results, five reviews and 22,665 citations", "S06-012": "Homiar et al., PubMed abstract Methods and Results, sensitivity and simulated workload reduction in one living review", "S08-020": "Asai et al. (OpenScholar), Nature main text opening, Table 1 and Methods baseline-model section, including citation fabrication without retrieval", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S08-017": "Algaba et al., arXiv abstract, experiment and results on citation recommendation bias", "S07-15": "Braun and Clarke, printed pp. 94–95 on the mismatch between theoretical framework and analytic claims, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on literature work as training for early-career researchers", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), question on uploading PDFs of articles, page last modified 9 September 2026"}}, {"id": "qualitative-design-phd", "cohort": "phd", "research_type": "qualitative", "stage": "design", "bundle": "qualitative-design", "headline": "Candidates must still learn to arrange access and consent", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "AI-drafted sampling plans and interview guides are useful to a PhD candidate, but the candidate must learn to arrange access to participants, obtain their consent and ask questions that do not steer their answers. Because the supervisor reviews the study design as usual, the balance is uncertain, and harm does not follow automatically.", "support": "Before recruitment starts, the candidate justifies each participant group and pilots the AI-drafted interview guide with a qualitative methods adviser.", "sensitivity": "If fieldwork starts from a polished AI plan, with no pilot and no talks with the organisations about access, the judgment turns to risk. Few studies have directly examined complete designs drafted by AI.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S06-004", "S06-024", "S09-012"], "inventory_source_ids": ["S03-010", "S05-012", "S06-024", "S06-025", "S09-012"], "source_locators": {"S05-012": "Strand et al., primary PDF pp. 6–8, Google Forms experiment on editing time (local average treatment effect among feature users)", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S03-010": "GDPR Articles 6, 9(2)(j) and 89 on lawful basis and research safeguards", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}}, {"id": "qualitative-data-phd", "cohort": "phd", "research_type": "qualitative", "stage": "data", "bundle": "qualitative-data", "headline": "AI interviews can change who takes part and what they say", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "Corrected AI transcription and indexing save a PhD candidate time and can help the candidate get to know the interviews. AI interviews may, however, change who agrees to take part (self-selection) as well as what people say and which surprising replies get a follow-up (mode effects), and ordinary supervision does not settle how these gains and risks balance.", "support": "The candidate uses approved transcription and checks it against the audio. Where AI conducts interviews, the candidate pilots them with the guide a human interviewer would use, logs who accepts and who drops out, and reviews with the supervisor the replies the AI failed to follow up.", "sensitivity": "Using AI mainly for transcription may be an opportunity, while AI-led interviews on sensitive workplace issues may be a risk if they change who takes part or how people answer. Studies find neither general refusal nor universal acceptance of AI interviews.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-401", "S14-402", "S14-404", "S09-012"], "inventory_source_ids": ["S03-004", "S06-025", "S06-026", "S07-15", "S13-303"], "source_locators": {"S07-15": "Braun and Clarke, printed pp. 87–88, phase 1 familiarisation and transcription, read in the local original PDF", "S06-026": "Barari et al., journal abstract, PDF pp. 161–64, Results and Discussion", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), research questions on processing transcripts and transcribing audio files, page last modified 9 September 2026", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating interviews and the analysis of qualitative data"}}, {"id": "qualitative-analysis-phd", "cohort": "phd", "research_type": "qualitative", "stage": "analysis", "bundle": "qualitative-analysis", "headline": "AI themes can replace a candidate’s reading of interviews", "headline_supported": "Candidates learn by coding some interviews alone first", "rating": "risk", "supported_rating": "mixed", "rationale": "A first round of AI coding with a fixed codebook may help a PhD candidate. When the project centres on interpretation, however, AI themes that arrive early can replace the candidate’s own first close reading of the interviews and field notes, and ordinary supervision does not necessarily make up for that lost practice.", "support": "The candidate first analyses a purposive sample of interviews alone, then compares the AI’s coding on difficult passages, and defends each theme against the full interviews and against cases that contradict it.", "sensitivity": "A project that mostly applies fixed codes, with the AI’s coding errors checked, may become an opportunity. Handing reflexive, interpretive analysis to AI can remain a risk even when the AI’s codes agree closely with human coding.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S14-405", "S07-15", "S09-012"], "inventory_source_ids": ["S07-02", "S07-15", "S07-16", "S07-17", "S07-18", "S07-19", "S13-303"], "source_locators": {"S07-02": "Xiao et al., author PDF pp. 2–3 (printed pp. 76–77) and Figure 1, kappa values for GPT-3 and expert coders", "S07-18": "Wise, Gresalfi and Spencer-Smith, abstract and sections on core commitments of qualitative inquiry", "S07-16": "Matta et al., Methods, Case and Discussion, missed context in interview analysis", "S07-19": "Goretzki and Mahlendorf, publisher abstract and introduction on surface patterns and situated meaning", "S07-15": "Braun and Clarke, printed p. 91 on reviewing themes against coded extracts and the whole data set and pp. 94–95 on weak analysis, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating the analysis of qualitative data", "S07-17": "Jowsey, Braun, Clarke et al., position article abstract and methodological argument"}}, {"id": "qualitative-writing-phd", "cohort": "phd", "research_type": "qualitative", "stage": "writing", "bundle": "qualitative-writing", "headline": "Quotations in AI drafts need checking against transcripts", "headline_supported": null, "rating": "mixed", "supported_rating": "mixed", "rationale": "Drafts written by AI from a PhD candidate’s own interview excerpts, field notes and interpretive outline can give the supervisor a chapter to discuss sooner. The candidate still needs practice in linking claims to interview evidence, and checking quotations and contrary passages can use up the time saved. If AI had supplied the first interpretation, the risk would be greater.", "support": "Before AI drafts anything, the candidate writes the core interpretive passage and an outline linking claims to excerpts. Afterwards, the candidate checks every quotation against the transcript and discusses contrary cases with the supervisor.", "sensitivity": "The risk is smaller if the chapter’s argument is already the candidate’s own, and larger if smooth AI prose stands in for an answer to a referee’s substantive objection.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S05-007", "S14-406", "S07-15", "S09-012"], "inventory_source_ids": ["S03-006", "S05-007", "S06-020", "S07-15", "S13-001", "S13-002", "S13-101"], "source_locators": {"S05-007": "Noy and Zhang, Science published abstract, 453 professionals in short writing tasks", "S07-15": "Braun and Clarke, Table 1 p. 87 and printed pp. 93–95 on producing the report as the final phase of analysis and on claims the extracts do not support, read in the local original PDF", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 methods and limitations", "S13-002": "Cheng et al., PDF pp. 5 and 7–8, experimental results", "S13-101": "Autor et al., NBER original PDF pp
