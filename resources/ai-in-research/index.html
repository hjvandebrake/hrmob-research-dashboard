 and inaccurate citations. {{S14-109}}"]}], "note": "Researchers often move back and forth between stages. Conceptual papers collect no new data, and reviews treat published studies as their data."}}, {"id": "forms", "chapter": "Three dimensions", "opener": {"number": "2", "kicker": "Dimension 2"}, "title": "Research forms", "dimension": "forms", "lead": "Quantitative, qualitative, and theory or review research ask AI to do different work, and each form has its own test of whether a claim still holds once AI has done part of it. Many papers combine forms.", "visual": {"type": "forms2", "items": [{"key": "quantitative", "name": "Quantitative", "desc": "Estimating effects and patterns from numerical evidence, including statistical meta-analysis.", "can": ["Treat text as data by turning reports, filings, and news into variables, which makes larger or new datasets feasible. {{S07-08}}", "Write and run estimation code and reproduce results. In a test with the original materials of 54 social science papers, the better of two coding agents reproduced 93 percent of 221 tasks. {{S08-010}}"], "defend": "Coverage of the population, construct validity, a credible identification strategy, and inference that allows for measurement error in AI-generated variables. {{S06-002}}{{S08-013}}", "wrong": "Prompt choice adds a new form of specification search. In a finance study that measured sentiment with AI, twelve plausible combinations of model and prompt gave slopes from 0.083 to 0.226. {{S14-301}}{{S08-013}}", "chart": {"label": "Results reproduced in seven-hour reproduction games {{S07-01}}", "unit": "%", "bars": [{"label": "Teams without AI", "value": 94, "text": "31 of 33"}, {"label": "Teams assisted by AI", "value": 91, "text": "32 of 35"}, {"label": "Teams led by AI", "value": 37, "text": "13 of 35"}], "note": "Teams without AI also found more major coding errors."}, "defend_label": "Validity"}, {"key": "qualitative", "name": "Qualitative", "desc": "Understanding experiences, meanings, and practices through interviews, observation, and documents.", "can": ["Conduct adaptive interviews online. In a study of 766 online interviews led by AI, the AI interviewer drew out about five times as many distinct themes as a single fixed open question. {{S14-401}}", "Transcribe recordings and apply a codebook. In a blinded test on one focus group, newer models coded as consistently as human analysts with a fixed codebook, although only one did so for inductive themes. {{S14-404}}{{S14-405}}"], "defend": "Who took part and why, faithful records of what people said and in what context, and an interpretation that can be traced to passages, including negative cases. {{S06-024}}{{S07-15}}", "wrong": "In a small study that compared five AI interviews with six human interviews, the AI interviewer missed more chances to probe surprising answers, and participants were less keen to repeat the interview. {{S14-402}}", "chart": {"label": "Preferred interviewer for a future interview, after an AI interview {{S14-401}}", "unit": "%", "bars": [{"label": "AI", "value": 53, "text": "53%"}, {"label": "No preference", "value": 26, "text": "26%"}, {"label": "Human", "value": 21, "text": "21%"}], "note": "A selected US online panel, without the people who declined the AI interview.", "stacked": true}, "defend_label": "Trustworthiness"}, {"key": "theory_review", "name": "Theory / review", "desc": "Developing formal or conceptual arguments and synthesising existing studies, including integrative reviews.", "can": ["Screen studies for a systematic review. In a living review in mental health, tuned prompts wrongly excluded none of the studies that were eventually included. {{S06-012}}", "Propose mechanisms and counterexamples, and prove some stated theorems. In a benchmark of 200 graduate-level mathematics problems, the best AI agent wrote formally verified proofs for a third of them. {{S14-505}}"], "defend": "A transparent search or a justified set of assumptions, accurate sources and derivations, and a theoretical contribution that changes what the field understands. {{S13-305}}{{S13-306}}", "wrong": "AI makes HARKing cheap, that is, hypothesising after the results are known. In a demonstration, two finance researchers used AI to generate hundreds of paper drafts that attached theories to predictors mined from data. {{S13-307}}", "chart": {"label": "Sensitivity, the share of included studies that each search found, in four evidence syntheses {{S14-506}}", "unit": "%", "bars": [{"label": "Original searches", "value": 94.5, "text": "94.5%"}, {"label": "AI review tool", "value": 39.5, "text": "39.5%"}], "note": "The AI tool had far higher precision, 42 against 8 percent."}, "defend_label": "Rigour and contribution"}]}}, {"id": "positions", "chapter": "Three dimensions", "opener": {"number": "3", "kicker": "Dimension 3"}, "title": "Career positions", "dimension": "positions", "lead": "Research produces papers, but it also trains the people who carry out later projects. The UFO job profiles that the university uses describe what each position is expected to do, and AI changes those tasks in different ways for each of them.", "visual": {"type": "positions", "items": [{"key": "phd", "name": "PhD candidate", "ufo": "UFO profile Promovendus", "job": "Works out a research plan with the supervisor, carries out and checks the research, publishes, and writes and defends a dissertation. The candidate receives doctoral guidance and may teach when this is assigned. The research is also training, because the candidate has to learn to explain the question, the methods, and the conclusions. {{S09-012}}", "ai": "AI can speed up searches, code, transcription, and drafting, and it can answer a small question when the supervisor is not available. When candidates offload the reasoning, it can also hide a choice they cannot yet explain. In a randomised study of skill formation, people who learned an unfamiliar programming library with AI scored lower on a quiz without AI straight afterwards. {{S09-003}} In an experiment in high school mathematics, a tutor designed for learning largely avoided that drop. {{S09-004}} A supervisor who sees only finished sections also sees less of what the candidate understands."}, {"key": "postdoc", "name": "Postdoc", "ufo": "UFO profile Onderzoeker", "job": "Postdoc is not one UFO profile. The Onderzoeker profile has four levels, from research under supervision to independent work, coordinating linked projects, and directing a programme. Acquiring funding and guiding PhD candidates belong to the higher levels or to particular appointments. Most postdocs work on a fixed-term project and need a recognisable contribution of their own. {{S09-013}}", "ai": "AI can shorten searches, data preparation, code, and drafting, which leaves room to test an alternative explanation or to start a separate paper. It can also fill a fixed contract with more manuscripts and grant drafts than one person can check. In a three-month trial, patent lawyers wrote better drafts with an AI tool, but on a later test without the tool only the experienced lawyers had improved on average. {{S13-101}} A postdoc who knows the newest AI methods may also become the group’s helpdesk, at the expense of their own research."}, {"key": "ud", "name": "Assistant professor", "ufo": "UFO profile Universitair docent (UD)", "job": "Combines research and teaching. At UD2 the research follows a defined and approved proposal, and at UD1 the assistant professor conducts research independently, helps acquire external funding, and guides research staff. The profile also includes supervising students, coaching colleagues, and guiding PhD candidates as copromotor in consultation with the promotor. {{S09-014}}", "ai": "An assistant professor may use AI as an author, a teacher, and a supervisor in the same week, so time saved in one task need not lower the total workload. In their own research, AI helps with sources, code, framing, and replies to reviewers, but a fluent answer does not show that the tool understood the problem. In a field experiment with consultants at Boston Consulting Group, those who used AI did better on tasks inside its jagged frontier of capabilities and worse on a task outside it. {{S05-009}} A study of US federal grant proposals found that proposals with more AI involvement read closer to previously funded work. {{S14-604}}"}, {"key": "uhd", "name": "Associate professor", "ufo": "UFO profile Universitair hoofddocent (UHD)", "job": "Initiates, conducts, and publishes research, develops projects, and acquires funding. At UHD2 the associate professor coordinates linked projects within a programme, and at UHD1 a whole programme or a multiyear specialist project, sometimes with leadership of a group. The profile also includes guiding research staff and PhD candidates and developing teaching. {{S09-015}}", "ai": "Algorithmic management can make coordination easier by comparing sources, deadlines, analyses, and grant requirements across projects, as long as a confident summary does not replace work that someone has checked. {{S14-603}} The associate professor still decides which projects belong together and whether a finding changes the programme. When every project member drafts faster, more analyses reach the coordinator for checking. In a study of 139 proposals at an Austrian research funder, GPT-4o agreed with the funder’s decision in 87 cases but showed a bias against novelty. {{S14-605}}"}, {"key": "prof", "name": "Full professor", "ufo": "UFO profile Hoogleraar", "job": "Develops the research programme of the chair, conducts research, and publishes. The professor sets priorities, acquires funding, allocates resources, recruits and develops staff, and makes sure that PhD supervision is good. The professor is also responsible for research quality and integrity in the chair and represents it. {{S09-016}}", "ai": "A professor can save time in their own literature work, analysis, and grant writing, and deep knowledge of a debate makes AI a useful sparring partner. AI can prepare material for decisions about people and the programme, but research on algorithmic management finds that such systems rarely replace the manager’s decision. {{S14-602}} When everyone in the chair works faster, more papers, analyses, and grant ideas reach the professor for checking. If colleagues take routine questions to AI, the professor may also hear later where they are stuck. {{S07-27}}"}], "note": "The profiles describe the duties of a job, and individual researchers divide their time over these duties in different ways. {{S09-017}} Expertise follows the task more than the title, and in a study of 140 radiologists, years of experience did not predict who benefited from AI advice. {{S09-030}} The assessment groups the five positions as PhD candidates, postdocs and assistant professors, and associate and full professors."}}, {"id": "map-overview", "chapter": "The combined assessment", "layout": "overview", "title": "Combined assessment of opportunities and risks", "lead": "For each combination of research form and stage, we defined one AI task and listed the benefits and risks that the literature reports for it. For each career group, we then judged whether the benefits are likely to outweigh the costs of checking and the effects on learning, and every cell explains that judgment.", "cohort_notes": {"phd": "PhD candidates can gain from AI-assisted data preparation, but letting AI carry out the main analysis takes away the practice that the dissertation is meant to provide. {{S09-012}}{{S09-003}}", "postdoc_ap": "Postdocs and assistant professors gain most where they control the design and the results, provided their contract or workload leaves time to validate what AI produces. {{S09-013}}{{S09-014}}", "senior": "Associate and full professors can save time in their own work, while more AI-assisted work from others adds to what they have to check. {{S09-015}}{{S09-016}}"}, "cohort_notes_supported": {"phd": "With support, PhD candidates gain in most tasks if they do the central steps themselves first, while design and analysis stay mixed in every form. {{S09-012}}{{S09-003}}", "postdoc_ap": "With time to check what AI produces, postdocs and assistant professors gain in every task except qualitative data and analysis. {{S09-013}}{{S09-014}}", "senior": "When colleagues share the checking, associate and full professors gain in every task except qualitative data, analysis, and writing. {{S09-015}}{{S09-016}}"}}, {"id": "programme", "chapter": "The combined assessment", "title": "What a faculty AI support programme could change", "lead": "Each cell of the heatmap names the support that could change its judgment, such as a validation sample, an independent review of code, or protected practice for PhD candidates. If FEB offered that support at a reasonable cost in time, 27 of the 36 mixed judgments would become opportunities and the four risks would become mixed.", "visual": {"type": "programme", "maps": [{"scenario": "ordinary", "label": "Without a faculty AI programme"}, {"scenario": "supported", "label": "With a faculty AI support programme"}], "axes": "Columns are the six research stages, from question and theory to writing and review, and each block of three rows is one career group. Select a cell to see the judgment and the support it assumes.", "support_label": "What the support involves", "rows": [["Access", "Researchers with a specific task get methods advice and a suitable tool environment. {{S03-015}}{{S03-014}}"], ["Learning", "Researchers who are learning a method, PhD candidates included, practise it and reconstruct a main result themselves. {{S09-004}}"], ["Checking", "Teams use validation samples, independent code reviews, and audits of excluded studies, and count the time these take."], ["Sharing", "Procedures that work are shared across projects."]], "caption": "The colours with support assume that the support is available, used, and worth its cost, which FEB has not yet measured."}}, {"id": "next", "chapter": "Next steps", "title": "What happens next", "lead": "In the coming months I would like to try out a few forms of support with researchers who want to take part, starting with PhD candidates and others who are learning a new method, while basic guidance is available to everyone.", "visual": {"type": "nextsteps2", "cols": [{"rating": "wine", "title": "Where we could start", "text": "The heatmaps suggest starting with tasks in which researchers can check what AI produces, such as preparing data with a validation sample or searching the literature against studies we already know. AI-assisted interviews and qualitative coding need small trials first, because we do not yet know how they change who takes part or what a theme rests on. {{S14-301}}{{S14-401}}"}, {"rating": "wine", "title": "What I would like to hear from you", "text": "Before FEB settles its plan, I would like to know which research tasks you already use AI for and where support would help you most. I would also like to hear what worries you, about your own research or about supervision."}], "closing": "For each trial we will look at the quality of the finished work and the time that checking took, and at what the researchers can still explain without AI, so that we can decide together what to continue.", "cta": {"label": "Send your input by email", "href": "mailto:h.j.van.de.brake@rug.nl?subject=Input%20on%20AI%20in%20research", "note": "Or use the Contact tab of this dashboard."}}}], "cells": [{"id": "quantitative-question-phd", "cohort": "phd", "research_type": "quantitative", "stage": "question", "bundle": "quantitative-question", "headline": "Candidates still need to learn to frame the question", "headline_supported": "Candidates who first write their own question gain from AI", "rating": "mixed", "supported_rating": "opportunity", "rationale": "AI can give a PhD candidate rival hypotheses to consider, but a candidate who is still learning the field may choose an appealing question that the data cannot settle. The candidate may also lose practice in framing the dissertation’s own problem.", "support": "Before using AI, the candidate writes down a question and the comparison in the data that would answer it, and then discusses the AI’s alternatives and the available measures with the supervisor.", "sensitivity": "HARKing, that is, hypotheses generated after the results are known and presented as earlier predictions, moves the judgment towards risk, while a candidate who can defend the chosen question moves it towards opportunity.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S13-103", "S09-012"], "inventory_source_ids": ["S06-001", "S06-014", "S13-103", "S13-301", "S13-307"], "source_locators": {"S01-002": "FEB Career Tracks 2025 update for new hires, PDF cover p. 1 and Research Profile promotion criteria pp. 15–16", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52 and Figure 1 on illusions of understanding; perspective, not outcome evaluation", "S09-008": "OECD, Reducing the precarity of academic research careers, career development discussion and policy recommendations, PDF p. 47", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, quality of individuals with AI and idea generation versus Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026", "S06-002": "Angrist and Pischke, Journal of Economic Perspectives, abstract/introduction on credible empirical design", "S06-003": "Nevo and Whinston, Journal of Economic Perspectives publisher abstract on structural modelling and assumptions", "S06-010": "DeCelles et al., AMJ transparency editorial pp. 1009–10 on disclosing how analyses evolved", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-203": "Horton, Filippas and Manning, revised NBER working paper PDF pp. 2–4, 14 and 29–31 on simulated economic agents and the limits of fit"}}, {"id": "quantitative-data-phd", "cohort": "phd", "research_type": "quantitative", "stage": "data", "bundle": "quantitative-data", "headline": "Candidates learn the data by checking what AI extracts", "headline_supported": null, "rating": "opportunity", "supported_rating": "opportunity", "rationale": "With AI preparing the data, a PhD candidate can build a larger panel or a text-based measure that would otherwise not be feasible. Checking the AI’s output against the source passages also deepens the candidate’s knowledge of the data.", "support": "The candidate checks by hand a sample that covers different firms, years, and ambiguous passages, and explains each error the AI made.", "sensitivity": "If the candidate never looks at the raw records, or if the generated measure misses the intended construct, the judgment changes to risk.", "confidence": "moderate", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S07-08", "S08-013", "S09-012"], "inventory_source_ids": ["S03-004", "S06-009", "S06-021", "S06-023", "S07-07", "S07-08", "S07-32", "S08-013", "S13-303"], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-009": "AEA Data and Code Policies and Guidance page, lines 6–24 on documented data and code", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S06-023": "SEC EDGAR API overview, submissions, XBRL, and Programmatic API Access", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S07-08": "Levich and Knust, accounting annual-report ownership extraction, publisher abstract and methods summary", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-303": "Messeri and Crockett, Nature comment, original PDF printed pp. 675–676"}}, {"id": "quantitative-analysis-phd", "cohort": "phd", "research_type": "quantitative", "stage": "analysis", "bundle": "quantitative-analysis", "headline": "AI can produce results before the candidate can check them", "headline_supported": "Candidates learn more if they rebuild one result by hand", "rating": "risk", "supported_rating": "mixed", "rationale": "An AI coding tool can write the main estimation code and return a plausible table before a PhD candidate has learned to diagnose faulty merges, wrong assumptions, or coding errors. The code may run without errors, but that alone does not show that the claim is valid.", "support": "The candidate implements or calculates by hand one core result, explains each change in the specification, and independently tests the extensions that the AI tool adds.", "sensitivity": "With a narrow estimator specified in advance and an independent replication, this use can become an opportunity, but it remains a risk if the AI’s interpretation is accepted as proof.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S09-003", "S09-012", "S07-01"], "inventory_source_ids": ["S06-018", "S08-009", "S08-010", "S09-003", "S09-004", "S09-005"], "source_locators": {"S06-018": "Aygün et al., local PDF pp. 2–10, Results and Discussion; Nature version", "S08-009": "Brodeur et al., PNAS p. 5 Table 1 and Results section 2.2 on reproduction and errors; PDF pp. 5–6 and Tables 1–2 on time to reproduction", "S08-010": "Alizadeh et al., preprint HTML sections 2.1, 2.4, 5.1–5.3 and Figures 1 and 5", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-004": "Bastani et al., local author-version PDF pp. 1–5, 9–11 and Table 1; discussion pp. 19–20", "S09-005": "Kestin et al., Scientific Reports, Methods (design and participants), Results and Discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, {"id": "quantitative-writing-phd", "cohort": "phd", "research_type": "quantitative", "stage": "writing", "bundle": "quantitative-writing", "headline": "Drafting help means less practice in stating claims", "headline_supported": "Candidates who state their claims first can draft with AI", "rating": "mixed", "supported_rating": "opportunity", "rationale": "When AI drafts substantial parts of a dissertation chapter, a PhD candidate can have the chapter ready for discussion sooner. But formulating a claim from a result is part of how the candidate learns what the evidence supports.", "support": "The candidate writes the first explanation and an outline linking each main claim to its result, and then uses AI for supporting prose. The supervisor checks the claims against the tables.", "sensitivity": "The judgment moves to risk if the candidate cannot defend the argument without the AI draft, and to opportunity if the candidate spends the time saved on substantive reasoning.", "confidence": "low", "evidence_status": "This is a reasoned judgment for FEB. No study has measured the effect for this combination of stage, research form, and position.", "applicability": "It applies to the task described above, not to every use of AI at this stage.", "source_ids": ["S05-007", "S09-012", "S09-003"], "inventory_source_ids": ["S05-007", "S05-009", "S06-019", "S06-020", "S13-001", "S13-002"], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S05-009": "Dell’Acqua et al., published original PDF pp. 2, 7–9, 11–13 and Tables 4, 7, 9: inside/outside frontier and persuasive wrong /* AI and research at FEB: presentation application, v8 (5 October 2026).
   Fourteen slides; tabs for criteria, stages, forms, departments and positions; one overview and one detailed heatmap.
   Colours are the directional judgments of the 5 October background assessment (RUBRIC.md v5); the v7 weights and sums are retired. */
const DATA=JSON.parse(document.getElementById('presentation-data').textContent);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const STAGES=[['question','Question & theory'],['literature','Literature'],['design','Design'],['data','Data / sources'],['analysis','Analysis & interpretation'],['writing','Writing & review']];
const TYPES=[['quantitative','Quantitative','Numerical evidence and statistical methods'],['qualitative','Qualitative','Interviews, observation and documents in context'],['theory_review','Theory/Review','Formal or conceptual arguments and literature synthesis']];
const COHORTS={phd:'PhD candidates',postdoc_ap:'Postdocs & assistant professors',senior:'Associate & full professors'};
const COHORTS_IN={phd:'PhD candidates',postdoc_ap:'postdocs and assistant professors',senior:'associate and full professors'};
const RATINGS={opportunity:'Opportunity',mixed:'Mixed',risk:'Risk'};
const RATING_TEXT={opportunity:'A net benefit is more plausible once the costs of checking and the effects on learning are counted. Risks remain.',mixed:'Benefits and costs compete, or the task includes uses that point in different directions. The explanation names the difference.',risk:'The main threat to the research or to learning is likely to outweigh the gain under the stated use. A narrower use may still help.'};
const SHADES=['opportunity','mixed','risk'];
const SCEN={ordinary:'Without a faculty AI programme',supported:'With a faculty AI support programme'};
const N=DATA.slides.length;
let current=0,scrollMode=false,fluid=false,supported=false,lastCell=null,chromeTimer=null,detailCohort='phd';

/* ---------- helpers ---------- */
function src(id){return DATA.sources[id];}
function cite(text){return esc(text).replace(/\{\{([^}]+)\}\}/g,(_,id)=>{const s=src(id);return s?`<button class="citation" data-source="${esc(id)}" aria-label="Source ${s.number}: ${esc(s.title)}">[${s.number}]</button>`:`<span class="missing-source">[${esc(id)}]</span>`;});}
function paras(arr){return (Array.isArray(arr)?arr:[arr]).filter(Boolean).map(p=>`<p>${cite(p)}</p>`).join('');}
function cellAt(cohort,type,stage){return DATA.cells.find(c=>c.cohort===cohort&&c.research_type===type&&c.stage===stage);}
function rating(c){return supported?c.supported_rating:c.rating;}
function headline(c){return supported&&c.headline_supported?c.headline_supported:c.headline;}
function typeName(t){return TYPES.find(x=>x[0]===t)[1];}
function stageName(t){return STAGES.find(x=>x[0]===t)[1];}
function cellLabel(c){return `${COHORTS[c.cohort]} · ${typeName(c.research_type)} · ${stageName(c.stage)}: ${RATINGS[rating(c)]}. ${headline(c)}`;}
function counts(list,key){const o={opportunity:0,mixed:0,risk:0};list.forEach(c=>o[key?c[key]:rating(c)]++);return o;}
function srcButtons(ids,cellId){const seen=new Set();return ids.map(sid=>{const s=src(sid);if(!s||seen.has(s.number))return '';seen.add(s.number);return `<button class="evidence-source" data-source="${esc(sid)}" ${cellId?`data-cell-source="${esc(cellId)}"`:''} title="${esc(s.title)}">[${s.number}]</button>`;}).join(' ');}
function bar(o){return `<div class="bar" role="img" aria-label="${SHADES.map(k=>o[k]+' '+RATINGS[k].toLowerCase()).join(', ')}">${SHADES.map(k=>o[k]?`<span class="${k}" style="flex:${o[k]} 1 0" title="${RATINGS[k]}: ${o[k]}">${o[k]}</span>`:'').join('')}</div>`;}
function legend(){return `<div class="legend" aria-label="Colour key">${Object.entries(RATINGS).map(([k,l])=>`<span><i class="dot ${k}" aria-hidden="true"></i>${l}</span>`).join('')}</div>`;}
function footnote(f){if(!f)return '';const [x,y]=f.text.split('[[link]]');return `<p class="s-footnote">${esc(x)}<a href="${esc(f.link.url)}" target="_blank" rel="noopener">${esc(f.link.text)}</a>${esc(y||'')}</p>`;}
function list(items){return `<ul class="plain${items.length===1?' single':''}">${items.map(t=>`<li>${cite(t)}</li>`).join('')}</ul>`;}
/* tabs: buttons and panels share a key; the first is shown */
function tabs(id,items,btn,panel,cls=''){return `<div class="tabs-wrap ${cls}" data-tabs="${esc(id)}"><div class="tablist" role="tablist">${items.map((it,k)=>`<button class="tab" role="tab" data-tab="${esc(it.key)}" aria-selected="${k===0}">${btn(it,k)}</button>`).join('')}</div><div class="panels">${items.map((it,k)=>`<div class="tabpanel" role="tabpanel" data-panel="${esc(it.key)}" ${k?'hidden':''}>${panel(it,k)}</div>`).join('')}</div></div>`;}

/* ---------- slide shell ---------- */
function head(s){return `<div class="s-head"><img src="${DATA.logo}" alt="University of Groningen, Faculty of Economics and Business"><span class="s-chapter">${esc(s.chapter)}</span></div>`;}
function foot(s,i){const dm=s.dimension&&DATA.dimensions&&DATA.dimensions[s.dimension];const sec=dm?`<button class="to-report" data-dimension="${esc(s.dimension)}" title="Open the detailed analysis of this dimension">Detailed analysis: ${esc(dm.title)} →</button>`:s.section_id?`<button class="to-report" data-report="${esc(s.section_id)}" title="Open the background report at this topic">Background: ${esc(s.section.replace(/^\d\.\s*(Dimension \d:\s*)?/,''))} →</button>`:'';return `<div class="s-foot"><span>${esc(DATA.meta.footer)}</span>${sec}<span class="s-num">${pad(i+1)} / ${N}</span></div>`;}
function opener(s){return s.opener?`<div class="opener"><span class="num">${esc(s.opener.number)}</span><span class="okick">${esc(s.opener.kicker)}</span></div>`:'';}
function shell(s,i,inner,cls=''){return `<div class="frame" data-index="${i}"><section class="slide ${cls} ${s.opener?'has-opener':''}" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="${i+1} of ${N}: ${esc(s.title)}">${head(s)}<div class="s-body">${opener(s)}<h2 class="s-title">${esc(s.title)}</h2>${s.lead?`<p class="s-lead">${cite(s.lead)}</p>`:''}<div class="s-content">${inner}</div>${footnote(s.footnote)}</div>${foot(s,i)}</section></div>`;}
function titleSlide(s,i){return `<div class="frame" data-index="${i}"><section class="slide title-slide v6 ${s.footnote?'has-fn':''}" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="1 of ${N}: ${esc(s.title)}">${head({chapter:'October 2026'})}<div class="s-body"><div class="t-center"><h1>${esc(s.title)}</h1><p class="t-sub">${esc(s.lead)}</p><p class="t-meta">${esc(s.visual.meta)}</p>${s.visual.note?`<p class="t-note">${esc(s.visual.note)}</p>`:''}<div class="t-actions"><button class="btn primary" data-next>Start →</button>${DATA.meta.has_report?'<button class="btn" data-report="">Background report</button>':'<button class="btn" data-dimension="overview">Detailed analysis</button>'}</div></div>${footnote(s.footnote)}</div>${foot({},i)}</section></div>`;}
function dividerSlide(s,i){return `<div class="frame" data-index="${i}"><section class="slide divider-slide" id="slide-${esc(s.id)}" aria-roledescription="slide" aria-label="${i+1} of ${N}: ${esc(s.title)}">${head(s)}<div class="s-body"><h2 class="s-title">${esc(s.title)}</h2><p class="s-lead">${cite(s.lead)}</p><div class="dv">${s.visual.items.map((it,k)=>`<button data-jump="${['stages','forms','positions'][k]}"><span class="dvn">${k+1}</span><strong>${esc(it.title)}</strong><span>${cite(it.text)}</span></button>`).join('')}</div></div>${foot(s,i)}</section></div>`;}

/* ---------- visuals ---------- */
const R={};
R.goal=v=>`<div class="goal2"><div class="gtl">${v.timeline_label?`<div class="kicker">${esc(v.timeline_label)}</div>`:''}<div class="gline">${v.timeline.map(t=>`<div class="gpt"><b>${esc(t.when)}</b><span>${cite(t.text)}</span></div>`).join('')}</div></div><div class="gmem"><div><div class="kicker">${esc(v.members_label)}</div><p>${cite(v.members_text)}</p></div><ul class="gdeps">${v.departments.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div></div>${v.outline?`<div class="strip"><b>This first analysis</b><span>${cite(v.outline)}</span></div>`:''}`;
R.agenda=v=>(v.cols.length===1?`<div class="ag-wrap"><div class="kicker">${esc(v.cols[0].label)}</div><div class="ag-cards">${v.cols[0].items.map((it,k)=>`<button class="ag-card" data-jump="${esc(it.jump)}"><span class="ag-num">${k+1}</span><span class="ag-text">${esc(it.text)}</span><span class="ag-go" aria-hidden="true">→</span></button>`).join('')}</div></div>`:`<div class="agenda">${v.cols.map(c=>`<div class="agenda-col ${esc(c.tone||'')}"><div class="kicker">${esc(c.label)}</div><ul class="plain">${c.items.map(it=>typeof it==='string'?`<li>${cite(it)}</li>`:`<li><button class="linkish agenda-link" data-jump="${esc(it.jump)}">${esc(it.text)}</button></li>`).join('')}</ul></div>`).join('')}</div>`)+(v.method?`<div class="strip agenda-method"><b>${esc(v.method_label||'')}</b><span>${cite(v.method)}</span></div>`:'');
R.goals=v=>`<div class="goals4">${v.items.map(it=>`<div class="goal"><div class="g-fig">${esc(it.figure)}</div><h3>${esc(it.label)}</h3><p class="g-plan">${cite(it.plan)}</p><div class="g-ai"><div class="lab ai">${esc(v.ai_label)}</div><p>${cite(it.ai)}</p></div></div>`).join('')}</div>`;
R.statement=v=>`<div class="tests-wrap"><div class="kicker">${esc(v.principles_label)}</div><div class="tests">${v.principles.map((t,k)=>`<div class="test"><span class="tn">${k+1}</span><h3>${esc(t.title)}</h3><p>${cite(t.text)}</p>${t.jump?`<button class="linkish" data-jump="${esc(t.jump)}">${esc(t.link)} →</button>`:''}</div>`).join('')}</div></div>`;
R.strategy=v=>`<div class="strat2"><figure class="pq"><span class="pq-intro">${esc(v.quote_intro)}</span><blockquote>“${esc(v.quote)}”</blockquote><figcaption>${cite(v.quote_source)}</figcaption></figure><div class="prose">${v.paras.map(p=>`<p>${cite(p)}</p>`).join('')}</div></div>${v.closing?`<div class="strip"><b>${esc(v.closing_label||'')}</b><span>${cite(v.closing)}</span></div>`:''}`;
R.criteria=v=>`<div class="crit-grid ${v.side?'':'solo'}">${tabs('criteria',v.items,it=>`<span class="tfig">${esc(it.figure)}</span><span class="tlab">${esc(it.label)}</span>`,it=>`<p class="cdef">${cite(it.def)}</p><div class="aiw"><div class="aiw-a"><div class="lab ai">How AI can contribute</div>${list(it.ai)}</div><div class="aiw-w"><div class="lab you">What to check</div>${list(it.watch)}</div></div>`,'vertical')}${v.side?`<aside class="side-box"><div class="kicker">${esc(v.side_label)}</div>${v.side.map(x=>`<div class="cap"><strong>${esc(x.value)}</strong><span>${cite(x.text)}</span></div>`).join('')}</aside>`:''}</div>`;
const FORMCLS={Quantitative:'fq',Qualitative:'fl',['Theory/Review']:'ft',Mixed:'fm',Unclear:'fu'};
R.deptforms=v=>{const F=DATA.department_forms;const prof=Object.fromEntries(DATA.department_profiles.departments.map(d=>[d.department,d]));const order=['Quantitative','Qualitative','Theory/Review','Mixed','Unclear'];
 const deps=Object.keys(prof).map(k=>({key:k,counts:(F&&F.departments&&F.departments[k]&&F.departments[k].counts)||{},n:(F&&F.departments&&F.departments[k]&&F.departments[k].n)||0}));
 const barOf=d=>`<span class="fbar">${order.filter(f=>d.counts[f]).map(f=>`<i class="${FORMCLS[f]}" style="flex:${d.counts[f]} 1 0" title="${f}: ${d.counts[f]} of ${d.n}">${d.counts[f]}</i>`).join('')}</span>`;
 return `<div class="fkey">${order.map(f=>`<span><i class="${FORMCLS[f]}"></i>${f}</span>`).join('')}<span class="fnote">${esc(v.sample_note||'')}</span></div>`+tabs('deptforms',deps,d=>`<span class="fdep">${esc(d.key)}</span>${barOf(d)}`,d=>{const pr=prof[d.key];return `<h3>${esc(pr.name)}</h3><p class="dtyp">${esc(pr.typical)}</p><div class="kicker">Most frequent journals, 2016–2025</div><ol class="jl">${pr.journals.slice(0,5).map(j=>`<li><span>${esc(j.journal)}</span></li>`).join('')}</ol>`;},'vertical depf')+`<p class="caption" style="margin-top:10px">${cite(v.caption)}</p>`;};
R.stages=v=>tabs('stages',v.items,(it,k)=>`<span class="snum">${k+1}</span><span>${esc(it.name)}</span>`,it=>`<p class="sdesc">${esc(it.desc)}</p><div class="aiw"><div class="aiw-a"><div class="lab ai">What AI can do</div>${list(it.ai)}</div><div class="aiw-w"><div class="lab you">What researchers still need to check</div>${list(it.check)}</div></div>`,'top stages')+`<p class="caption" style="margin-top:12px">${cite(v.note)}</p>`;
function hbars(ch){const max=Math.max(100,...ch.bars.map(b=>b.value));return `<div class="hbars"><div class="kicker">${cite(ch.label)}</div>${ch.stacked?`<div class="hstack">${ch.bars.map((b,k)=>`<span class="hs hs${k}" style="flex:${b.value}"><b>${esc(b.text)}</b>${esc(b.label)}</span>`).join('')}</div>`:ch.bars.map(b=>`<div class="hb"><span>${esc(b.label)}</span><div class="ht"><i style="width:${(b.value/max*100).toFixed(1)}%"></i></div><b>${esc(b.text)}</b></div>`).join('')}${ch.note?`<p class="caption">${cite(ch.note)}</p>`:''}</div>`;}
R.forms2=v=>tabs('forms',v.items,it=>esc(it.name),it=>`<p class="sdesc">${esc(it.desc)}</p><div class="fgrid"><div class="fside"><div class="aiw-a"><div class="lab ai">What AI can now do</div>${list(it.can)}</div>${hbars(it.chart)}</div><div class="fside"><div class="aiw-w"><div class="lab you">${esc(it.defend_label||'What the study still has to show')}</div><p>${cite(it.defend)}</p><div class="lab you sub">What can go wrong</div><p>${cite(it.wrong)}</p></div></div></div>`,'top forms')+(v.note?`<p class="caption" style="margin-top:10px">${cite(v.note)}</p>`:'');
R.positions=v=>tabs('positions',v.items,it=>esc(it.name),it=>`<div class="pos2"><div class="pjob"><div class="lab">What the job involves</div><div class="ufo">${esc(it.ufo)}</div><p>${cite(it.job)}</p></div><div class="aiw-a pai"><div class="lab ai">How AI changes this work</div><p>${cite(it.ai)}</p></div></div>`,'top positions')+`<p class="caption" style="margin-top:10px">${cite(v.note)}</p>`;
R.scenarios=v=>{const w=counts(DATA.cells,'rating'),p=counts(DATA.cells,'supported_rating');return `<div class="scen"><div class="scen-table"><div></div><div class="h without">${esc(v.columns[1])}</div><div class="h with">${esc(v.columns[2])}</div>${v.rows.map(r=>`<div class="issue">${esc(r[0])}</div><div class="w">${cite(r[1])}</div><div class="p">${cite(r[2])}</div>`).join('')}</div><div class="scen-chart"><h3>The 54 assessments</h3><div class="count-row">${esc(SCEN.ordinary)}${bar(w)}</div><div class="count-row">${esc(SCEN.supported)}${bar(p)}</div><div class="legend">${SHADES.map(k=>`<span><i class="dot ${k}" aria-hidden="true"></i>${RATINGS[k]}</span>`).join('')}</div><p class="caption">${cite(v.caption)}</p><button class="linkish" data-map-overview style="align-self:flex-start">Compare the heatmaps</button></div></div>`;};
R.nextsteps2=v=>`<div class="ns2">${v.cols.map(c=>`<div class="ns2-col ${esc(c.rating||'')}"><h3>${esc(c.title)}</h3>${c.text?`<p class="ns2-text">${cite(c.text)}</p>`:''}${c.items?`<ul class="plain">${c.items.map(t=>`<li>${cite(t)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>${v.timeline?`<div class="ns2-tl">${v.timeline.map(t=>`<div><b>${esc(t.when)}</b><span>${cite(t.text)}</span></div>`).join('')}</div>`:''}${v.closing?`<p class="ns2-close">${cite(v.closing)}</p>`:''}${v.cta?`<div class="qcta"><a class="btn primary" href="${esc(v.cta.href)}">${esc(v.cta.label)}</a><span>${cite(v.cta.note||'')}</span></div>`:''}`;

/* ---------- heatmaps ---------- */
function scenarioSeg(){return `<div class="seg scenario" role="group" aria-label="Scenario">${Object.entries(SCEN).map(([k,l])=>`<button data-assessment="${k}" aria-pressed="${(k==='supported')===supported}">${l}</button>`).join('')}</div>`;}
function cohortSeg(cohort){return `<div class="seg" role="group" aria-label="Career group"><button data-map-overview aria-pressed="${!cohort}">All groups</button>${Object.entries(COHORTS).map(([c,l])=>`<button data-cohort="${c}" aria-pressed="${c===cohort}">${l}</button>`).join('')}</div>`;}
function cellButton(c,compact){return `<button class="heat-cell ${compact?'compact-cell':'full-cell'} ${rating(c)}" data-cell="${esc(c.id)}" aria-label="${esc(cellLabel(c))}" ${compact?`title="${esc(cellLabel(c))}"`:''}>${compact?'':`<span>${esc(headline(c))}</span>`}</button>`;}
function stageHead(){return STAGES.map(([,n])=>`<th scope="col">${esc(n)}</th>`).join('');}
function overview(){
 return `<div class="map-bar">${cohortSeg(null)}</div><div class="overview-grid"><div class="matrix-scroll"><table class="matrix overview-matrix"><colgroup><col style="width:150px"><col style="width:120px">${STAGES.map(()=>'<col>').join('')}</colgroup><caption class="sr-only">Assessment of opportunities and risks for all career groups. Select a cell for its explanation and sources.</caption><thead><tr><th scope="col">Career group</th><th scope="col">Research form</th>${stageHead()}</tr></thead>${Object.entries(COHORTS).map(([cohort,label])=>`<tbody class="cohort-group">${TYPES.map(([type,name],k)=>`<tr>${k===0?`<th class="cohort-label" scope="rowgroup" rowspan="3">${esc(label)}</th>`:''}<th class="type-label" scope="row">${esc(name)}</th>${STAGES.map(([st])=>`<td>${cellButton(cellAt(cohort,type,st),true)}</td>`).join('')}</tr>`).join('')}</tbody><tbody aria-hidden="true"><tr class="gap-row"><td colspan="8"></td></tr></tbody>`).join('')}</table><p class="map-note">Theory/Review × Data / sources concerns the literature used in reviews, because a purely theoretical paper has no empirical data-collection task. Statistical meta-analysis is part of Quantitative. <button class="linkish" data-rubric>What the colours mean</button></p></div><aside class="peek" aria-live="polite">${peekDefault()}</aside></div>`;
}
function peekDefault(){return `<div class="kicker">${esc(supported?SCEN.supported:SCEN.ordinary)}</div><div class="legend vertical">${Object.entries(RATINGS).map(([k,l])=>`<span><i class="dot ${k}" aria-hidden="true"></i>${l}</span>`).join('')}</div><div class="counts">${Object.entries(COHORTS).map(([c,l])=>`<div class="count-row">${esc(l)}${bar(counts(DATA.cells.filter(x=>x.cohort===c)))}</div>`).join('')}<div class="count-row" style="margin-top:6px;font-weight:700">All 54 assessments${bar(counts(DATA.cells))}</div></div><p class="hint">Point at a cell to preview it, or select it for the full explanation and sources.</p>`;}
function peekCell(c){return `<div class="kicker">${esc(COHORTS[c.cohort])} · ${esc(typeName(c.research_type))} · ${esc(stageName(c.stage))}</div><span class="pill ${rating(c)}">${RATINGS[rating(c)]}</span><h3>${esc(headline(c))}</h3><p>${supported?`<b>With support</b>${esc(c.support)}`:esc(c.rationale)}</p><p class="hint">Select the cell for the full reasoning, the support that could change it, and the sources.</p>`;}
function plain(t){return String(t||'').replace(/\{\{[^}]+\}\}/g,'').replace(/\s+([.,])/g,'$1').trim();}
function cohortNote(s,cohort){return ((supported&&s.cohort_notes_supported)||s.cohort_notes)[cohort]||'';}
function heatmap(cohort,s){
 const note=s&&s.cohort_notes?`<p class="cohort-note" data-cohort-note="${esc(cohort)}">${cite(cohortNote(s,cohort))}</p>`:'';
 return `<div class="map-bar">${cohortSeg(cohort)}</div>${note}<div class="matrix-scroll"><table class="matrix"><colgroup><col style="width:210px">${STAGES.map(()=>'<col>').join('')}</colgroup><caption class="sr-only">Assessment of opportunities and risks for ${esc(COHORTS[cohort])}. Select a cell for its explanation.</caption><thead><tr><th scope="col">Research form</th>${stageHead()}</tr></thead><tbody>${TYPES.map(([type,label,sub])=>`<tr><th class="row-label" scope="row">${esc(label)}<small>${esc(sub)}</small></th>${STAGES.map(([st])=>`<td>${cellButton(cellAt(cohort,type,st),false)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="map-bar" style="margin:12px 0 0">${legend()}<p class="map-note" style="margin:0">The colours are reasoned assessments for FEB that draw on the cited studies. <button class="linkish" data-rubric>What the colours mean</button></p></div>`;
}
function refreshCells(){
 $$('.heat-cell[data-cell]').forEach(b=>{const c=DATA.cells.find(x=>x.id===b.dataset.cell);if(!c)return;b.classList.remove(...SHADES);b.classList.add(rating(c));b.setAttribute('aria-label',cellLabel(c));if(b.hasAttribute('title'))b.title=cellLabel(c);const sp=b.querySelector('span');if(sp)sp.textContent=headline(c);});
 $$('[data-assessment]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.assessment==='supported')===supported)));
 $$('.peek').forEach(p=>p.innerHTML=peekDefault());
 const ns=DATA.slides.find(x=>x.cohort_notes);if(ns)$$('[data-cohort-note]').forEach(p=>p.innerHTML=cite(cohortNote(ns,p.dataset.cohortNote)));
}

/* ---------- render ---------- */
function bodyFor(s){
 if(s.layout==='overview')return overview();
 if(s.layout==='heatmap')return heatmap(detailCohort,s);
 const v=s.visual;if(v&&R[v.type])return R[v.type](v,s);
 return '';
}
function render(){
 $('#stage').innerHTML=DATA.slides.map((s,i)=>s.layout==='title'?titleSlide(s,i):s.layout==='divider'?dividerSlide(s,i):shell(s,i,bodyFor(s),['overview','heatmap'].includes(s.layout)?'compact':'')).join('');
 buildSegments();fit();update();
}
const CHAPTERS=[];DATA.slides.forEach((s,i)=>{const c=CHAPTERS.at(-1);if(c&&c.name===s.chapter)c.end=i;else CHAPTERS.push({name:s.chapter,start:i,end:i});});
function buildSegments(){$('#segments').innerHTML=CHAPTERS.map(c=>`<button style="--n:${c.end-c.start+1}" data-slide="${c.start}" title="${esc(c.name)}" aria-label="Go to: ${esc(c.name)}"><span></span></button>`).join('');}
function update(){
 $$('.frame').forEach((f,i)=>f.classList.toggle('active',i===current));
 $('#prev').disabled=current===0;$('#next').disabled=current===N-1;
 const s=DATA.slides[current];$('#chapter-name').textContent=s.chapter;$('#position').textContent=`${pad(current+1)} / ${N}`;
 $$('#segments button').forEach((b,k)=>{const c=CHAPTERS[k];const f=current>c.end?100:current<c.start?0:(current-c.start+1)/(c.end-c.start+1)*100;b.firstElementChild.style.width=f+'%';});
}
function go(i,opts={}){
 current=Math.max(0,Math.min(N-1,i));update();
 history.replaceState(null,'','#'+DATA.slides[current].id);
 if((scrollMode||fluid)&&!opts.fromScroll)$(`.frame[data-index="${current}"]`).scrollIntoView({block:'start',behavior:opts.smooth?'smooth':'auto'});
 $('#announcement').textContent=`Slide ${current+1}: ${DATA.slides[current].title}`;
}
function jumpTo(id){const i=DATA.slides.findIndex(s=>s.id===id||s.layout===id);if(i>=0){closeAll();go(i);}}
function showOverview(){const i=DATA.slides.findIndex(s=>s.layout==='overview');if(i<0)return;const el=$(`.frame[data-index="${i}"] .s-content`);if(el)el.innerHTML=overview();closeAll();if(current!==i)go(i);}
function showCohort(c){detailCohort=c;let i=DATA.slides.findIndex(s=>s.layout==='heatmap');if(i<0)i=DATA.slides.findIndex(s=>s.layout==='overview');if(i<0)return;const el=$(`.frame[data-index="${i}"] .s-content`);if(el)el.innerHTML=heatmap(c,DATA.slides[i]);closeAll();if(current!==i)go(i);$('#announcement').textContent=`Detailed heatmap: ${COHORTS[c]}`;}
function fit(){
 fluid=innerWidth<760;document.body.classList.toggle('fluid',fluid);
 const fs=document.body.classList.contains('fs');let sc;
 if(scrollMode)sc=Math.min((innerWidth-80)/1600,1.1);
 else{const aw=innerWidth-(fs?0:56),ah=innerHeight-(fs?0:52+58+36);sc=Math.min(aw/1600,ah/900);}
 document.documentElement.style.setProperty('--scale',Math.max(.2,sc).toFixed(4));
}

/* ---------- panels ---------- */
function openPanel(kicker,html,wide=false){$('#panel-kicker').textContent=kicker;$('#panel-body').innerHTML=html;const p=$('#panel');p.classList.toggle('wide',wide);if(!p.open)p.showModal();p.scrollTop=0;}
function closeAll(){$$('dialog[open]').forEach(d=>d.close());}
let panelScen=null;
function miniMap(sc){const sup=sc==='supported';return `<div class="pm-grid"><div></div>${STAGES.map(([,n],k)=>`<div class="pm-head" title="${esc(n)}">${k+1}</div>`).join('')}${Object.entries(COHORTS).map(([co,l],g)=>`${g?'<div class="pm-gap"></div>':''}<div class="pm-group">${esc(l)}</div>${TYPES.map(([t])=>STAGES.map(([st])=>{const c=cellAt(co,t,st),r=sup?c.supported_rating:c.rating,h=sup&&c.headline_supported?c.headline_supported:c.headline;return `<button class="mini-cell ${r}" data-cell="${esc(c.id)}" data-scen="${sc}" title="${esc(`${COHORTS[co]} · ${typeName(t)} · ${stageName(st)}: ${RATINGS[r]}. ${h}`)}" aria-label="${esc(`${COHORTS[co]} · ${typeName(t)} · ${stageName(st)}: ${RATINGS[r]}`)}"></button>`;}).join('')).join('')}`).join('')}</div>`;}

 openPanel(COHORTS[c.cohort],`<div class="cell-top"><div><div class="crumbs">${esc(typeName(c.research_type))} · ${esc(stageName(c.stage))}</div><h2 id="panel-title">${esc(headline(c))}</h2></div><div><div class="locator" aria-hidden="true">${loc}</div><div class="locator-cap">Position in the map for ${esc(COHORTS_IN[c.cohort])}</div></div></div>

 <div class="why"><h3>Without a faculty programme <span class="pill ${c.rating}">${RATINGS[c.rating]}</span></h3><p>${esc(c.rationale)} ${srcButtons(c.source_ids,c.id)}</p></div>`:`<div class="why"><h3>Why this colour for ${esc(COHORTS_IN[c.cohort])}</h3><p>${esc(c.rationale)} ${srcButtons(c.source_ids,c.id)}</p></div>
 <div class="why sup"><h3>With faculty support <span class="pill ${c.supported_rating}">${RATINGS[c.supported_rating]}</span></h3><p>${esc(c.support)}</p></div>`}

 <div class="peers"><div class="kicker">The same task for each career group</div><div class="peer-row">${peers.map(pc=>`<button class="peer ${rating(pc)} ${pc.id===c.id?'me':''}" data-cell="${esc(pc.id)}" ${pc.id===c.id?'aria-current="true"':''}><span>${esc(COHORTS[pc.cohort])}</span><b>${RATINGS[rating(pc)]}</b><small>${esc(headline(pc))}</small></button>`).join('')}</div></div>
 <p class="access-note conf"><strong>Confidence in the evidence: ${esc(c.confidence)}.</strong> ${esc(c.evidence_status)} ${esc(c.applicability)}</p>
 <details><summary>Benefits and risks reported for this task</summary><p class="access-note">The same list applies to every career group. The colour is a judgment about which of these dominates for the group, and it does not count the items. <button class="linkish" data-rubric>How the assessment works</button></p><div class="inv"><div><div class="lab ai">Benefits</div><ul class="plain">${inv('opportunity')}</ul></div><div><div class="lab you">Risks</div><ul class="plain">${inv('risk')}</ul></div></div></details>
 <details><summary>All sources for this cell</summary><p>${srcButtons([...c.source_ids,...c.inventory_source_ids],c.id)}</p></details>

 if(dim==='stage'){const V=xvis('stages'),it=V.items.find(x=>x.key===a);return {kick:'Research stage',title:it.name,lv:it.extent.level,why:it.extent.why,scale:V.xtitle};}
 if(dim==='form'){const V=xvis('forms'),it=V.items.find(x=>x.key===a);return {kick:'Research form',title:it.name,why:it.desc,scale:V.extent.title};}
 if(dim==='forms'){const V=xvis('forms'),key=`${a}-${b}`;return {kick:typeName(a),title:stageName(b),lv:V.extent.levels[a][STAGES.findIndex(x=>x[0]===b)],why:V.extent.why[key],scale:V.extent.title};}
 if(dim==='pos'){const V=xvis('positions'),it=V.items.find(x=>x.key===a);return {kick:'Career position',title:it.name,why:it.job,scale:V.extent.title};}
 if(dim==='positions'){const V=xvis('positions'),it=V.items.find(x=>x.key===a),col=V.extent.cols.find(c=>c.key===b),x=V.extent.cells[a][b];return {kick:it.name,title:col.label,lv:x.level,why:x.why,scale:V.extent.title};}}

 const head=`<div class="crumbs">${esc(i.kick)}</div><h2 id="panel-title">${esc(i.title)}</h2>${i.lv?`<p class="xp-row"><span class="xpill x${i.lv}">${EXT[i.lv]}</span><span class="xp-note">${esc(i.scale)}</span></p>`:''}`;

 if(dim==='forms'){const B=DATA.bundles[`${a}-${b}`];const li=k=>B.impacts.filter(x=>x.kind===k).map(x=>`<li><strong>${esc(x.label)}</strong> ${cite(x.text)}</li>`).join('');return openPanel('Research forms',`${head}<p class="access-note"><strong>AI task assessed:</strong> ${cite(B.task_scope)}</p><div class="why"><h3>Why this shade</h3><p>${cite(i.why)}</p></div><div class="inv"><div><div class="lab ai">What AI can do here</div><ul class="plain">${li('opportunity')}</ul></div><div><div class="lab you">What to watch</div><ul class="plain">${li('risk')}</ul></div></div>${back}`);}

function showRubric(){lastCell=null;openPanel('Reading the heatmaps',`<h2 id="panel-title">How the assessment works</h2><p>The assessment covers 18 combinations of research form and research stage. For each combination we defined one AI task, for example letting AI write the main estimation code while the researcher checks what it produces, and kept that task the same for every career group. Ordinary supervision is part of every cell.</p><p>We first listed the benefits and risks that the literature reports for each task. For each career group we then judged whether the benefit is likely to outweigh the cost of checking it and the effect on learning, considering the tasks and responsibilities that the UFO profiles give the group. The colour is that judgment, and each cell explains it and names what could change it.</p><p>The colours do not add up the listed benefits and risks. One problem can be split into several items, and a sum then changes without any change in the evidence. An earlier version of these heatmaps did add them up, and because the lists contained more risks than benefits, its colours leaned towards risk for that reason alone.</p><div class="br" style="grid-template-columns:1fr">${SHADES.map(k=>`<section class="${k==='opportunity'?'b':k==='risk'?'r':'m'}"><h3><span class="pill ${k}">${RATINGS[k]}</span></h3><p>${RATING_TEXT[k]}</p></section>`).join('')}</div><h3>Confidence</h3><p>Each cell also records our confidence in the evidence behind it, which is low for 35 cells and moderate for 19. Confidence does not change the colour. No study has measured these effects at FEB, and the comparison between career groups is provisional in every cell.</p><h3>The two scenarios</h3><p><strong>${SCEN.ordinary}</strong> assumes permitted AI use with ordinary supervision.</p><p><strong>${SCEN.supported}</strong> assumes that the support described in the cell is available and used, and that its full cost in staff, supervision, and coauthor time stays in proportion to the benefit. FEB has not estimated that cost yet, so the pilots need to measure it. A licence or a general training session does not count as this support.</p><h3>How to read the differences</h3><p>The colours are reasoned judgments for FEB that draw on the cited studies, because no study has measured these effects at FEB. A researcher’s knowledge of a particular method or dataset can count for more than their position, and an actual project can turn a cell in either direction.</p>`);}

document.addEventListener('mousemove',()=>{if(!document.body.classList.contains('fs'))return;document.body.classList.add('chrome');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>document.body.classList.remove('chrome'),2200);});
addEventListener('resize',fit);
const io=new IntersectionObserver(es=>{if(!(scrollMode||fluid))return;const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(vis){const i=Number(vis.target.dataset.index);if(i!==current){current=i;update();history.replaceState(null,'','#'+DATA.slides[i].id);}}},{rootMargin:'-40% 0px -55% 0px'});
$('#contents').onclick=showContents;$('#maps').onclick=showOverview;$('#report').onclick=()=>showReport(DATA.slides[current].section_id);$('#sources').onclick=showSources;$('#help').onclick=showHelp;
$('#mode').onclick=()=>setScroll(!scrollMode);$('#fullscreen').onclick=toggleFs;$('#prev').onclick=()=>go(current-1,{smooth:true});$('#next').onclick=()=>go(current+1,{smooth:true});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){const w=b.closest('.tabs-wrap');w.querySelectorAll(':scope>.tablist>.tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)));w.querySelectorAll(':scope>.panels>.tabpanel').forEach(p=>p.hidden=p.dataset.panel!==d.tab);return;}
 if(d.extent)return openExtent(d.extent);
 if(d.close)return $('#'+d.close).close();
 if(d.dimension!==undefined)return showDimension(d.dimension);
 if(d.reportJump!==undefined){const el=$('#panel').querySelector('#'+CSS.escape(d.reportJump));if(el)el.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(d.report!==undefined)return showReport(d.report);
 if(d.source)return showSource(d.source,d.cellSource||($('#panel').open?lastCell:null));
 if(d.cell){panelScen=d.scen||(b.closest('#panel')?panelScen:null);return openCell(d.cell);}
 if(d.otherCell){const i=DATA.cells.findIndex(c=>c.id===lastCell);return openCell(DATA.cells[(i+Number(d.otherCell)+DATA.cells.length)%DATA.cells.length].id);}
 if(d.cohort)return showCohort(d.cohort);
 if(d.assessment)return setSupport(d.assessment==='supported');
 if(b.hasAttribute('data-rubric'))return showRubric();
 if(d.slide!==undefined){closeAll();return go(Number(d.slide));}
 if(b.hasAttribute('data-next'))return go(current+1);
 if(b.hasAttribute('data-map-overview'))return showOverview();
 if(d.jump)return jumpTo(d.jump);
});
function peekHandler(e){const b=e.target.closest('.overview-matrix .heat-cell');const peek=e.target.closest('.slide')?.querySelector('.peek');if(!peek)return;if(b){const c=DATA.cells.find(x=>x.id===b.dataset.cell);if(c)peek.innerHTML=peekCell(c);}}
document.addEventListener('mouseover',peekHandler);document.addEventListener('focusin',peekHandler);
document.addEventListener('mouseout',e=>{const m=e.target.closest('.overview-matrix');if(m&&!m.contains(e.relatedTarget)){const p=m.closest('.slide').querySelector('.peek');if(p)p.innerHTML=peekDefault();}});
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
 const panelOpen=$('#panel').open,srcOpen=$('#source-panel').open;
 if(panelOpen&&lastCell&&!srcOpen&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const i=DATA.cells.findIndex(c=>c.id===lastCell);openCell(DATA.cells[(i+(e.key==='ArrowRight'?1:-1)+DATA.cells.length)%DATA.cells.length].id);return;}
 if(e.key==='?'){e.preventDefault();return showHelp();}
 if(panelOpen||srcOpen)return;
 const k=e.key.toLowerCase();
 if(k==='g'){e.preventDefault();return showContents();}
 if(k==='r'){e.preventDefault();return DATA.meta.has_report?showReport(DATA.slides[current].section_id):showDimension(DATA.slides[current].dimension||'overview');}
 if(k==='h'){e.preventDefault();return jumpTo('overview');}
 if(k==='f'){e.preventDefault();return toggleFs();}
 if(k==='v'){e.preventDefault();return setScroll(!scrollMode);}
 if(scrollMode||fluid)return;
 if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!e.target.closest('button,summary'))){e.preventDefault();go(current+1);}
 if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1);}
 if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(N-1);}
});
for(const d of $$('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
$('#panel').addEventListener('close',()=>{panelScen=null;$$('.heat-cell.peeked').forEach(b=>b.classList.remove('peeked'));});
const initial=DATA.slides.findIndex(s=>s.id===decodeURIComponent(location.hash.slice(1)));if(initial>=0)current=initial;
render();$$('.frame').forEach(f=>io.observe(f));if(fluid&&current)go(current);
if(location.hash==='#report'&&DATA.meta.has_report)showReport('');
if(!DATA.meta.has_report)$('#report').hidden=true;
if(location.hash==='#analysis')showDimension('overview');
addEventListener('hashchange',()=>{const i=DATA.slides.findIndex(s=>s.id===decodeURIComponent(location.hash.slice(1)));if(i>=0&&i!==current)go(i);});
</script>
</body></html>
