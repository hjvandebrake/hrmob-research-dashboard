-306\" aria-label=\"Source 41\">[41]<\/button> In all three, fluent prose can give a reader the impression that the main intellectual work is complete. The relevant test is whether the paper’s new claim follows from the sources, assumptions and reasoning that the authors actually provide.<\/p>\n<p>AI already handles a substantial portion of a bounded literature-synthesis task. OpenScholar searches passages from 45 million open-access papers and answers scientific questions with citations. In the Nature study’s 108-question expert comparison, human judges preferred its answers to expert-written answers in 51% of cases with the system’s 8B generator and 70% when it used GPT-4o. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button> This is stronger evidence than a demonstration of fluent paragraphs: experts assessed coverage and organization in answers that drew on several papers. Yet those questions concerned mostly computer science and natural-science fields, and an answer to a defined question is a smaller task than choosing and defending the scope of an integrative review. The same article shows why source retrieval changes the result: tested models without retrieval frequently supplied nonexistent titles, whereas a system tied to retrieved passages produced more reliable citations.<\/p>\n<p>LiRA tests the writing of review articles more directly. Its agent workflow analyzes the available papers, constructs an outline, drafts sections, edits and reviews. Across 125 computer-science reviews and 125 ScienceDirect reviews spanning 23 subject areas, including business, it improved several writing and citation measures over tested survey-writing systems. Its reported citation-quality F1 was .76 and .73 across the two sets, using an <strong>automated model judgment against abstracts<\/strong>, rather than independent verification of every claim. Most comparisons supplied the agent with the target human article’s reference list; human assessors judged outlines and section snippets, not entire papers. When the authors substituted retrieved references, most measured scores held up, while coverage and recall of article entities fell. <button class=\"citation\" data-source=\"S14-508\" aria-label=\"Source 97\">[97]<\/button> This is credible evidence for substantial automation of review assembly and drafting. It does not measure whether the system can choose a worthwhile topic, recover an entire field, reconcile incompatible findings or produce a contribution that survives editorial review.<\/p>\n<p>Broader “deep research” agents can also investigate a question and assemble a long cited report. DeepResearch Bench evaluates such output on 100 expert-designed tasks across 22 fields and two languages. Its report-quality and claim–URL assessments rely heavily on model judges, validated in a smaller expert comparison; the resulting scores compare tested systems rather than measuring how much of a publishable disciplinary review has been completed. <button class=\"citation\" data-source=\"S14-502\" aria-label=\"Source 122\">[122]<\/button> For FEB researchers, these systems can provide a first map across economics, accounting, management or information systems when a problem crosses literatures. The researcher then needs to inspect the original work and decide what the map has left out or collapsed under a convenient label.<\/p>\n<p>A review that claims comprehensive coverage needs to show how its search identifies the relevant studies. Lau and Golder compared Elicit Pro’s 2025 Review mode with four health-related evidence syntheses. Elicit averaged 39.5% sensitivity in finding known included studies, compared with 94.5% for the original searches; its precision was much higher, 41.8% against 7.55%, and it located some eligible studies the original teams had missed. <button class=\"citation\" data-source=\"S14-506\" aria-label=\"Source 43\">[43]<\/button> A focused AI search can therefore be an efficient way to identify promising material and complementary references while being a poor substitute for a documented high-recall strategy in that tested setting. The result belongs to four reviews and one dated product configuration, so it cannot settle the performance of every current tool or FEB database.<\/p>\n<p>Screening, by contrast, can be substantially delegated when the criteria are clear and checked. Homiar and colleagues iteratively tuned GPT-4o prompts in a living mental-health review, then assessed them on the baseline records and two updates. No ultimately included study was wrongly excluded in that case, and the authors simulated a 65.72% baseline screening-workload reduction; they did not time an implemented fully automated workflow. <button class=\"citation\" data-source=\"S06-012\" aria-label=\"Source 38\">[38]<\/button> A broader systematic review by Clark and colleagues found widely varying omission, exclusion and extraction errors across 19 studies, with many studies at unclear or high risk of bias. <button class=\"citation\" data-source=\"S07-20\" aria-label=\"Source 64\">[64]<\/button> The different results are compatible. A team can reduce repetitive screening in a well-defined corpus while retaining a separate obligation to test search recall, rare-study exclusions and extracted information. A structured FEB review should state the search protocol and check the cases where an error would change its answer. An exploratory review may use AI’s breadth differently, as a source of candidate literatures rather than a claim that none were missed.<\/p>\n<p>An integrative review faces an additional contribution test. Elsbach and van Knippenberg define its value through the perspective that develops <em>from<\/em> reading, comparing and critiquing representative literatures. Cronin and George distinguish synthesis aimed at settling a question from synthesis that redirects research by connecting communities. <button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 40\">[40]<\/button><button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 92\">[92]<\/button> Ramaul and colleagues’ review of how organization and management scholars theorize AI shows what this can entail. The authors began with a wide search, narrowed the sample through a question about theoretical treatment, added papers through citations and colleagues, then examined assumptions about rationality and anthropomorphism through close reading and discussion. <button class=\"citation\" data-source=\"S14-501\" aria-label=\"Source 103\">[103]<\/button> An AI assistant could identify recurring terms, retrieve adjacent literatures and propose several ways to group the papers. The contribution, however, depends on whether the chosen grouping reveals something that the original texts and the organizational phenomenon actually support. A longer list of studies can make a weak grouping look comprehensive without making its inference stronger.<\/p>\n<h3 id=\"forms-conceptual-arguments-become-easier-to-generate-and-harder-to-distinguish\">Conceptual arguments become easier to generate and harder to distinguish<\/h3>\n<p>AI can also suggest constructs, relationships, mechanisms and boundaries for a new theoretical argument. Si, Yang and Hashimoto found that, in a blinded comparison of 49 human and 49 AI proposals in seven NLP topics, expert reviewers gave the AI ideas a higher mean novelty score per idea, 5.62 versus 4.86 on a ten-point scale; the authors did not execute the proposals. <button class=\"citation\" data-source=\"S14-101\" aria-label=\"Source 10\">[10]<\/button> This finding deserves to be taken seriously: AI can help a researcher search more widely among plausible ideas in addition to revising an idea already chosen. It does not establish that these proposals would produce better completed studies, nor that their advantage transfers unchanged to management theory or economic modelling.<\/p>\n<p>The same ability can improve a scholar’s reasoning when it is used to challenge an early explanation. Suppose a FEB researcher observes employees deferring to algorithmic advice. An assistant can propose that they trust the model’s accuracy, shift accountability to it, or see deference as part of their professional role. The researcher can then ask what each mechanism would predict in interviews, decisions or organizational records, and look for cases where one mechanism fails. The gain lies in comparing alternatives against the phenomenon; selecting the most polished account would turn option generation into premature closure. Ramaul’s review offers a related warning that common metaphors for AI, including assumptions of rationality or human likeness, may guide scholars toward explanations they should first examine. <button class=\"citation\" data-source=\"S14-501\" aria-label=\"Source 103\">[103]<\/button><\/p>\n<p>There is a stronger critical argument about the supply of theory. Cornelissen contends that systems which produce complete-looking packages of constructs, relationships and theoretical motivation may commodify theory and encourage authors to attach a plausible narrative after inspecting a result. <button class=\"citation\" data-source=\"S13-301\" aria-label=\"Source 61\">[61]<\/button> Messeri and Crockett describe a related illusion of understanding when a researcher mistakes an accessible synthesis for comprehension of its subject. <button class=\"citation\" data-source=\"S06-014\" aria-label=\"Source 62\">[62]<\/button> These are conceptual diagnoses rather than measured rates of bad papers. Novy-Marx and Velikov’s finance demonstration gives the concern a more concrete form: mining more than 30,000 predictor candidates allowed them to generate hundreds of paper drafts with different theoretical justifications, illustrating how cheaply a result can acquire a story. The demonstration concerns generated drafts and the risk of hypothesizing after results are known; it does not establish that the papers were accepted. <button class=\"citation\" data-source=\"S13-307\" aria-label=\"Source 42\">[42]<\/button><\/p>\n<p>The scholarly setting may amplify that mechanism. An <em>Organization Science<\/em> editorial reports more submissions, rising AI-detected writing and associations between detector scores and weaker manuscript outcomes in one journal, as well as shifts in reviewers’ attention. The detector is a proxy and the observational study does not show that AI caused the differences. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button> Elsbach and van Knippenberg make a separate point about integrative reviews: a given body of literature cannot yield endlessly many distinct syntheses unless new evidence or a new question changes what can be learned. <button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 40\">[40]<\/button> Taken together, these sources support a plausible forecast that cheaper paper-shaped theory and review output will put greater pressure on authors and editors to establish novelty, source fidelity and the reason a new framework is needed. They do not support treating every AI-assisted paper as weak. Researchers who use AI to test alternatives and verify them may be better placed to meet that higher bar.<\/p>\n<h3 id=\"forms-formal-models-allow-stronger-checks-of-some-steps\">Formal models allow stronger checks of some steps<\/h3>\n<p>Formal work separates a result’s validity from its research value more sharply. AI can translate an intuition into equations, examine comparative statics, search for a counterexample, code a simulation and sometimes prove a stated theorem. FormalProofBench supplied both informal and Lean-formalized statements for 200 advanced undergraduate and graduate mathematics problems. The best tested agent submitted checker-accepted proofs for 33.5% of them within the allowed tool-using process. <button class=\"citation\" data-source=\"S14-505\" aria-label=\"Source 39\">[39]<\/button> A proof checker can certify the particular derivation, which gives this task a stronger automatic correctness test than a fluent conceptual paragraph has. Most tasks still defeated the agents, and the benchmark did not ask them to formulate the theorem or decide whether it explains an economic or organizational problem.<\/p>\n<p>Liang’s forthcoming <em>Journal of Economic Literature<\/em> article explains why that distinction is needed in economics. A model’s value may lie in an interpretable mechanism, restrictions that rule out some outcomes and portability across settings, even when a more flexible algorithm predicts the original dataset better. Machine learning can help locate where an existing model fails, reveal a regularity or combine flexible measurement with economic structure; Liang also considers language models for hypothesis generation and explanation. Much of the article reviews machine learning broadly rather than measured autonomous generative-AI model construction. <button class=\"citation\" data-source=\"S14-507\" aria-label=\"Source 102\">[102]<\/button> A behavioural economist could use an agent to find games where a theory predicts poorly and then collect new observations. The model contribution would be the revised mechanism that explains those choices and survives other games, not the code that found a difficult case.<\/p>\n<p>Management formal theory faces a related, though not identical, standard. Makadok argues that explicit assumptions and sound derivations can reveal implications researchers did not anticipate, while authors also need to show readers why those assumptions suit the motivating question and which ones are essential. <button class=\"citation\" data-source=\"S13-306\" aria-label=\"Source 41\">[41]<\/button> An AI-generated derivation can be mathematically correct yet concern an implausible decision rule or an unimportant boundary. It can also help a scholar by revealing that a conclusion depends on a convenient assumption that should be relaxed. Here the relevant quality check moves in two directions: verify the algebra or code, and return to the institution, behaviour or organizational process the model was built to explain.<\/p>\n<p>Whole-paper automation is already visible in an adjacent, more programmable field. Nature’s AI Scientist study describes an agent that proposed machine-learning ideas, ran computer experiments and wrote manuscripts. Researchers manually selected three outputs for submission, without editing them. One reached the ICLR 2025 workshop’s acceptance threshold; none reached main-conference quality, and the authors report naive ideas, implementation errors and inaccurate references. The workshop’s acceptance rate was 70%. <button class=\"citation\" data-source=\"S14-109\" aria-label=\"Source 30\">[30]<\/button> This establishes that an automated computational project can sometimes produce a manuscript judged acceptable at a workshop. It gives no basis for treating a lower-threshold ML workshop result as an estimate of how often an AI-generated economic model, conceptual theory paper or integrative review would meet its field’s standards.<\/p>\n<p>For FEB theory and review, the largest immediate gain is likely to be in producing and checking alternatives: another framing of a result, a rival assumption, a literature the researcher had overlooked or a candidate synthesis of two streams. A doctoral researcher who knows a narrow field well may use that breadth effectively; a senior scholar may be quicker to reject false novelty in a familiar area but can still be misled outside it. Rank alone does not supply the relevant expertise. Repeatedly accepting a model’s first coherent explanation may also remove the practice through which researchers learn to build and criticise arguments; Messeri and Crockett raise that apprenticeship concern without estimating a rank-specific effect. <button class=\"citation\" data-source=\"S13-303\" aria-label=\"Source 72\">[72]<\/button> The researcher’s substantive work is to choose a question, examine the sources or assumptions behind a proposed answer, and show why the resulting explanation adds to what the field already knows.<\/p>\n<h2 id=\"forms-what-the-three-forms-have-in-common\">What the three forms have in common<\/h2>\n<div class=\"table-wrap\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Research form<\/th>\n<th>Work AI can now carry far<\/th>\n<th>What makes the paper’s claim defensible<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Quantitative<\/td>\n<td>Reading records into data, generating measures, coding and reproducing specified analyses, extracting estimates for a meta-analysis. <button class=\"citation\" data-source=\"S14-301\" aria-label=\"Source 32\">[32]<\/button><button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 25\">[25]<\/button><button class=\"citation\" data-source=\"S14-306\" aria-label=\"Source 117\">[117]<\/button><\/td>\n<td>Coverage and access, validated measurement, a justified comparison or identification strategy, and inference that accounts for generated-data error.<\/td>\n<\/tr>\n<tr>\n<td>Qualitative<\/td>\n<td>Adaptive online interviews, transcription and indexing, applying a defined codebook, proposing themes across transcripts. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button><button class=\"citation\" data-source=\"S14-404\" aria-label=\"Source 33\">[33]<\/button><button class=\"citation\" data-source=\"S14-405\" aria-label=\"Source 34\">[34]<\/button><\/td>\n<td>Who participated and why, the interview relationship, fidelity to speech and setting, and an interpretation traceable to passages and negative cases.<\/td>\n<\/tr>\n<tr>\n<td>Theory/Review<\/td>\n<td>Cited answers, long review drafts, rival conceptual arguments, model stress tests and some checked proofs. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button><button class=\"citation\" data-source=\"S14-508\" aria-label=\"Source 97\">[97]<\/button><button class=\"citation\" data-source=\"S14-505\" aria-label=\"Source 39\">[39]<\/button><\/td>\n<td>A justified corpus or assumption set, accurate sources and derivations, and a contribution that changes understanding rather than only presenting a coherent text.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>These distinctions concern the work a project asks AI to perform, not a fixed ranking of the forms. A quantitative project may hinge on a contested construct, a qualitative project may use numerical comparisons, and a theory paper may contain code. In each, lower costs can support a stronger study if researchers spend the released time on coverage, alternatives and verification. The same lower costs can also produce more weak studies if speed becomes the output target. Which direction dominates will depend on the question, the available evidence, the investigator’s expertise and the incentives under which the work is assessed.<\/p>\n", "toc": [{"id": "forms-the-form-of-the-research-changes-what-ai-can-do", "text": "The form of the research changes what AI can do", "level": 1}, {"id": "forms-quantitative-research", "text": "Quantitative research", "level": 2}, {"id": "forms-qualitative-research", "text": "Qualitative research", "level": 2}, {"id": "forms-theory-and-review-research", "text": "Theory and review research", "level": 2}, {"id": "forms-what-the-three-forms-have-in-common", "text": "What the three forms have in common", "level": 2}]}, "positions": {"title": "Researcher positions", "html": "<h1 id=\"positions-researcher-position-work-learning-and-responsibility\">Researcher position: work, learning and responsibility<\/h1>\n<p>A research project produces a paper, but it also develops researchers and draws on people who acquire funds, teach methods, check one another&#39;s work and decide which projects a group will pursue. AI can help with any one of those activities without improving all of them. A draft may be completed sooner while its author has learned less about the analysis; a professor may finish a grant comparison quickly while spending longer checking the growing number of drafts from a group. To understand who benefits, FEB needs to look at the researcher&#39;s position alongside the particular task and the work that follows from it. <button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><button class=\"citation\" data-source=\"S05-013\" aria-label=\"Source 123\">[123]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>The University of Groningen uses the Dutch universities&#39; UFO system to classify positions. The profiles describe the purpose of a job, its possible result areas and level criteria. They are useful because they identify who is expected to conduct research, develop others, coordinate projects and remain responsible for decisions. They do not state how many hours a particular employee spends on each activity. <em>Onderzoeker<\/em>, which can include a postdoctoral appointment, has four levels; <em>universitair docent<\/em> and <em>universitair hoofddocent<\/em> each have two. A postdoc is therefore not a single UFO category, and title alone cannot establish contract conditions or research independence. The national classification manual expressly allows variation in which listed duties apply to an appointment. <button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><button class=\"citation\" data-source=\"S09-017\" aria-label=\"Source 56\">[56]<\/button><button class=\"citation\" data-source=\"S09-018\" aria-label=\"Source 124\">[124]<\/button><button class=\"citation\" data-source=\"S09-020\" aria-label=\"Source 125\">[125]<\/button><\/p>\n<div class=\"table-wrap\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Position<\/th>\n<th>Research the person conducts<\/th>\n<th>Work involving other people and resources<\/th>\n<th>Where AI changes the task<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>PhD candidate<\/strong><\/td>\n<td>Develops a proposal and plan with a supervisor, conducts and checks research, publishes and writes a dissertation.<\/td>\n<td>Receives doctoral guidance; may teach or guide students when assigned.<\/td>\n<td>Rapid explanations, code and drafts can help a project while changing which decisions the candidate learns to make and defend. <button class=\"citation\" data-source=\"S09-012\" aria-label=\"Source 44\">[44]<\/button><button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Postdoctoral researcher<\/strong><\/td>\n<td>May work from an approved plan or lead more independent research, depending on actual <em>Onderzoeker<\/em> level and appointment.<\/td>\n<td>Higher researcher levels add grant acquisition, coordination and guidance; these are not duties of every postdoc.<\/td>\n<td>AI can expand what one researcher can prepare, but the person still needs a recognisable contribution and time to validate it. <button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 47\">[47]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Assistant professor (UD)<\/strong><\/td>\n<td>Conducts and publishes research alongside teaching; UD1 carries stronger independent-research and acquisition criteria than UD2.<\/td>\n<td>May guide PhDs in consultation with a promotor, coach colleagues and coordinate assigned research.<\/td>\n<td>The same tool may save time in a personally led project yet add checks in teaching or supervision. <button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S05-013\" aria-label=\"Source 123\">[123]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Associate professor (UHD)<\/strong><\/td>\n<td>Initiates, conducts and publishes research; UHD2 coordinates linked projects, while UHD1 can direct a programme or long specialist project.<\/td>\n<td>Acquires projects, guides research staff and PhDs, develops teaching and can take delegated management duties.<\/td>\n<td>AI can assist comparison and coordination across projects; it cannot by itself establish the quality of each contribution. <button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><button class=\"citation\" data-source=\"S14-603\" aria-label=\"Source 52\">[52]<\/button><\/td>\n<\/tr>\n<tr>\n<td><strong>Professor (hoogleraar)<\/strong><\/td>\n<td>Develops the chair&#39;s programme, conducts research and writes publications.<\/td>\n<td>Acquires funding; directs resources and staff; ensures doctoral supervision and research quality; represents the chair.<\/td>\n<td>AI may save time in own work and preparation for decisions, while faster output from others can increase review and mentoring demands. <button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 60\">[60]<\/button><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The table compares responsibilities, not a ladder of AI ability. Many economics papers use alphabetical author order, and conventions vary across FEB fields; neither first nor last authorship is a dependable proxy for these UFO positions. Nor does an established title guarantee knowledge of a new data source or method. A doctoral candidate can be the best person in a team to catch an error in unfamiliar software, while a professor may be best placed to see why the research question fails to address a long-running debate. The relevant distinction is who knows the material, who must learn it, and who is accountable for the decision. <button class=\"citation\" data-source=\"S09-017\" aria-label=\"Source 56\">[56]<\/button><button class=\"citation\" data-source=\"S09-030\" aria-label=\"Source 57\">[57]<\/button><button class=\"citation\" data-source=\"S09-033\" aria-label=\"Source 126\">[126]<\/button><\/p>\n<h2 id=\"positions-phd-candidate-doing-the-research-and-learning-how-to-do-it\">PhD candidate: doing the research and learning how to do it<\/h2>\n<p>The <em>Promovendus<\/em> profile starts with a research plan worked out with a supervisor and runs through data collection or theoretical analysis, publication and the dissertation. The candidate may receive help, but has to explain the question, the choices behind the method and the conclusions in a defence. AI can make literature searches, code preparation, transcription or drafting faster. It may also give a candidate an immediate explanation at a moment when a supervisor is unavailable. Those are useful possibilities, especially when the alternative is a long wait for help with a small obstacle. <button class=\"citation\" data-source=\"S09-012\" aria-label=\"Source 44\">[44]<\/button><button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><\/p>\n<p>What the candidate learns depends on how the tool is used. In a randomised study of programmers learning an unfamiliar library, participants with AI scored lower on an immediate unaided knowledge quiz, without a statistically significant time gain. The researchers&#39; exploratory screen-recording analysis suggested that repeatedly asking for complete code and fixes differed from asking questions and resolving errors oneself, though the study did not randomly assign those ways of using AI. This was a short coding exercise rather than doctoral research. It nevertheless identifies a practical issue: a correct script can conceal that the researcher cannot explain why the estimator, sample or specification was chosen. <button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><\/p>\n<p>The opposite outcome is also possible. Studies of AI-supported mathematics and physics instruction show that the design of the assistance changes what students learn. In one mathematics experiment, a relatively unconstrained chatbot made practice easier but left students less able to work unaided, whereas a tutor designed around learning largely avoided that decline. A different physics experiment found strong immediate learning with a purpose-built tutor. Neither is a recipe for an original FEB dissertation, but both show why “allow AI” and “ban AI” are too blunt for a learning question. A candidate can ask the system to compare assumptions, then make and defend the methodological choice; or accept a finished analysis before seeing the problem. <button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 45\">[45]<\/button><button class=\"citation\" data-source=\"S09-005\" aria-label=\"Source 74\">[74]<\/button><\/p>\n<p>The doctoral research setting also depends on what the supervisor can see. If a candidate brings a generated literature map to a meeting, they can discuss which sources were actually read, why one debate is important and where the map misses a counterargument. If the candidate instead submits a polished section without its evidential trail, the supervisor must reconstruct what was done and may miss a gap in understanding. Reif and Cummings propose that people who take routine advice from AI may consult colleagues less often. That is a theory, not an observed decline in PhD supervision, but it points to a concrete risk: a supervisor can no longer correct a misunderstanding that never surfaces in conversation. The professor&#39;s profile makes the quality and intensity of daily doctoral guidance an explicit responsibility; ordinary supervision is already present, whether FEB adds an AI programme or not. <button class=\"citation\" data-source=\"S07-27\" aria-label=\"Source 55\">[55]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>Doctoral learning is not simply a reason to make candidates perform every mechanical step. Automatic transcription might let a qualitative researcher spend more time comparing conflicting accounts, and routine code generation might free a quantitative researcher to test why an assumption fails. A useful check is whether the candidate can reconstruct an important decision and identify what evidence would change it. That check should concern the stage where the claim is made: a generated theory paragraph needs a defensible argument, while a generated data-cleaning script needs an auditable transformation. The question is what practice AI removes and what more valuable practice it permits. <button class=\"citation\" data-source=\"S06-008\" aria-label=\"Source 36\">[36]<\/button><button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><button class=\"citation\" data-source=\"S07-32\" aria-label=\"Source 65\">[65]<\/button><\/p>\n<p>AI assistance can also alter a candidate&#39;s relationship with others. A generated critique may arrive faster than a supervisor&#39;s response, but the candidate still needs feedback that identifies a real weakness and explains how to work through it. Experiments outside universities show that AI can help people write text others rate as empathic. They do not show that warm wording detects a flawed identification strategy, knows a candidate&#39;s history or takes responsibility for a difficult assessment. A supervisor may use AI to draft the form of a comment, then has to judge its content and hear the candidate&#39;s answer. <button class=\"citation\" data-source=\"S14-704\" aria-label=\"Source 127\">[127]<\/button><button class=\"citation\" data-source=\"S14-705\" aria-label=\"Source 128\">[128]<\/button><button class=\"citation\" data-source=\"S13-002\" aria-label=\"Source 78\">[78]<\/button><\/p>\n<p>Doctoral researchers need not be passive recipients of an older scholar&#39;s expertise. A study of French STEM theses and later supervisor publications found associations consistent with AI-topic knowledge passing from students to supervisors as well as from supervisors to students. This predates today&#39;s generative assistants and measures research-topic knowledge through documents rather than observed meetings. It is still a useful corrective to the assumption that skill always flows down a hierarchy: a candidate who has learned a new method may teach it to a supervisor while relying on that supervisor to shape the paper and navigate a career. <button class=\"citation\" data-source=\"S14-702\" aria-label=\"Source 129\">[129]<\/button><\/p>\n<h2 id=\"positions-postdoctoral-researcher-independence-varies-time-is-finite\">Postdoctoral researcher: independence varies, time is finite<\/h2>\n<p>A postdoctoral researcher often occupies the period in which independent work and a visible contribution become urgent, but the UFO title alone does not specify the job. The <em>Onderzoeker<\/em> profile covers supervised execution at level 4, independently structured work at level 3, coordination of linked projects at level 2 and programme direction at level 1. Funding acquisition also moves from absent in the level-4 criteria to contributing at level 3 and initiating or acquiring funding for own and others&#39; work at levels 2 and 1. Doctoral guidance and contract acquisition appear as variant result areas. FEB should therefore read the actual appointment rather than treat every postdoc as an apprentice to a professor or as an independent group leader. <button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S09-017\" aria-label=\"Source 56\">[56]<\/button><button class=\"citation\" data-source=\"S09-018\" aria-label=\"Source 124\">[124]<\/button><\/p>\n<p>For a postdoc working on an approved project, AI might shorten literature search, data preparation, analysis code and drafting. That can create room to test an alternative explanation or develop a distinct paper. It can also fill a fixed term with more manuscripts, grant drafts and collaborator requests than the researcher can properly check. The effect of speed on a CV therefore depends on the quality of the resulting work, the postdoc&#39;s identifiable intellectual contribution and the time left to pursue it. Existing evidence on insecure academic careers predates this AI wave; it documents a constraint, not an AI-caused deterioration. <button class=\"citation\" data-source=\"S09-008\" aria-label=\"Source 130\">[130]<\/button><button class=\"citation\" data-source=\"S05-009\" aria-label=\"Source 49\">[49]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 47\">[47]<\/button><\/p>\n<p>A three-month field trial with patent lawyers illustrates why an assisted output and later skill should be kept separate. Both junior and senior lawyers produced better work with a custom AI drafting tool. On a later unaided editing assessment, treated senior lawyers showed clearer average improvement, while treated junior lawyers had no average gain and more dispersed results. The researchers lacked a baseline unaided-skill measure and did not randomly allocate ways of using the tool. Patent drafting is not a journal article, and “junior lawyer” is not “postdoc”; the result instead warns against assuming that better drafts automatically yield better independent judgement, or that every early-career user is harmed. <button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 47\">[47]<\/button><\/p>\n<p>A postdoc&#39;s strongest protection may come from expertise in the actual material, not from avoiding AI. Collins&#39;s study of laboratory laser construction showed that published instructions left out conditions that practitioners learned through visits, calls and skilled colleagues. Research datasets and field sites can also have exceptions that an outsider misses. A postdoc who has assembled the data or conducted the interviews may be best placed to judge whether a plausible AI summary is wrong. Conversely, someone early in a new field may rely too readily on a persuasive answer. Studies of diagnostic AI show that contextual knowledge can improve decisions, while years of professional experience alone do not reliably identify who benefits from assistance. These are analogies about judgement; they do not estimate FEB output by rank. <button class=\"citation\" data-source=\"S09-033\" aria-label=\"Source 126\">[126]<\/button><button class=\"citation\" data-source=\"S09-029\" aria-label=\"Source 131\">[131]<\/button><button class=\"citation\" data-source=\"S09-030\" aria-label=\"Source 57\">[57]<\/button><\/p>\n<p>For a postdoc with grant or project-coordination duties, AI can prepare call comparisons, draft standard sections and track work across collaborators. The researcher still must decide whether the project is original, feasible and sufficiently theirs to lead. A study of US NIH and NSF proposals associates greater statistically inferred LLM involvement with language closer to recently funded work. It finds a positive association with NIH funding and early non-hit publication output, but not comparable NSF results. The use indicator comes from text, not observed behaviour, so this cannot be read as AI causing grant success. It does suggest a tension for a researcher building an independent agenda: tools that make a proposal easier to articulate may also make its framing more conventional. <button class=\"citation\" data-source=\"S14-604\" aria-label=\"Source 50\">[50]<\/button><\/p>\n<p>The same postdoc may also be the person who knows the newest AI method in the group. Assigning that person all tool experimentation and every colleague&#39;s troubleshooting may expand their service work without advancing their own research. A sensible local arrangement would name the methodological contribution and reserve time for the postdoc&#39;s own question and authorship. That is a proposed response to role and learning mechanisms, not a benefit automatically delivered by an AI licence. <button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S14-702\" aria-label=\"Source 129\">[129]<\/button><\/p>\n<h2 id=\"positions-assistant-professor-own-research-teaching-and-growing-guidance\">Assistant professor: own research, teaching and growing guidance<\/h2>\n<p>The UD profile combines research and teaching. The UD2 research criterion describes work from a defined, approved proposal; UD1 independently conducts research, contributes to acquiring external funds and guides scientific personnel. Both levels have teaching responsibilities, and the profile also describes student guidance, coaching and PhD guidance in consultation with the promotor. An assistant professor may therefore use AI as an author, a teacher and a supervisor within the same week. Saving time in one activity does not show that the overall workload falls. <button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><\/p>\n<p>In own research, AI may help an assistant professor gather candidate sources, write code, compare alternative framings or prepare a response to reviewers. Because the person is building a research programme and a record of independent decisions, the useful output is not simply a polished document. The author needs to know why the question was chosen, which observations carry the conclusion, and how to answer a referee who challenges the method. The consulting experiment by Dell&#39;Acqua and colleagues shows that AI helped on selected tasks within its capability frontier and harmed correctness on a harder strategy task outside it. An assistant professor cannot infer from a fluent answer that the tool has understood the boundary of the research problem. <button class=\"citation\" data-source=\"S05-009\" aria-label=\"Source 49\">[49]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><\/p>\n<p>Teaching and supervision introduce a second effect. AI may help prepare examples, comments or an initial check on a student&#39;s or candidate&#39;s code. The UD still has to decide what the learner needs to attempt independently and whether the feedback is true. The coding and tutoring studies show that the structure of assistance changes learning, while an AI-generated friendly comment can be scientifically wrong. If the assistant professor must review more AI-assisted submissions, the saved preparation time may be offset by checking and individual explanation. The exact balance depends on the course or project; the UFO profile identifies the combined duties but no common time share. <button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 45\">[45]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S13-002\" aria-label=\"Source 78\">[78]<\/button><\/p>\n<p>Some assistants already guide PhDs; the profile specifies work as copromotor after consultation with the promotor. The UD can use AI to prepare for a meeting, compare the candidate&#39;s draft with previous feedback or locate an inconsistent reference. The supervisor still needs to ask how the candidate built the argument, identify a missing test and decide with the candidate what to do next. If tool feedback keeps the candidate from showing incomplete reasoning, that conversation becomes harder. This is one way that fewer exchanges with a knowledgeable colleague could affect supervision, although the effect has not been measured here. <button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S07-27\" aria-label=\"Source 55\">[55]<\/button><\/p>\n<p>Funding creates a further choice. UD1 contributes to acquisition, and contract-research acquisition is a listed variant task. An AI application assistant can lower the cost of assembling a proposal, but funding bodies have different aims and review practices. As the US funding evidence shows, a UD cannot assume that a gain reported for one funder applies to another. An assistant professor trying to establish an independent research line still has to specify why the idea is worth pursuing rather than merely closer to previously funded language. <button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S14-604\" aria-label=\"Source 50\">[50]<\/button><\/p>\n<h2 id=\"positions-associate-professor-several-projects-and-other-people-s-development\">Associate professor: several projects and other people&#39;s development<\/h2>\n<p>The UHD profile adds substantial coordination to own teaching and research. UHD2 coordinates linked projects that form a significant part of a programme; UHD1 coordinates a programme or takes responsibility for a multiyear specialist project. The profile also lists project development, grant acquisition, publications, guidance of research staff and doctoral candidates, and educational work. Some UHD1 positions include group leadership or delegated management. These are differences in assigned responsibility, not evidence that an associate professor has stopped writing papers. <button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><\/p>\n<p>AI can make coordination more tractable when several projects need comparable source maps, deadlines, analytic checks or grant requirements. Koehler and Sauermann document algorithmic allocation, direction, coordination, motivation and learning support in crowd-science projects, demonstrating that scientific management includes tasks amenable to automation. Their setting involves distributed contributors and often platforms; it does not test whether an AI system can run an economics research group. The relevant FEB question is narrower: can an associate professor see a project&#39;s state sooner and direct attention to a real bottleneck? If the system supplies only a confident summary of unverified work, it may hide the bottleneck instead. <button class=\"citation\" data-source=\"S14-603\" aria-label=\"Source 52\">[52]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><\/p>\n<p>The UHD often has to connect projects intellectually, not merely keep them on schedule. Two manuscripts may use the same measure differently, compete for a dataset or make incompatible claims about a phenomenon. AI might expose duplicate references or suggest a common analysis plan, but a researcher must decide which projects belong together and whether a finding changes the programme&#39;s direction. The one-day <em>Cybernetic Teammate<\/em> experiment found that an individual with AI could match a two-person team without AI on evaluated innovation proposals. It supports a bounded gain from assistance; it says little about a programme&#39;s accumulation of evidence or months of coauthor disagreement. <button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 60\">[60]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><\/p>\n<p>Grant acquisition and portfolio choice sharpen this responsibility. An associate professor can use AI to compare calls and prepare a proposal for linked projects, but should ask whether the easier drafting is drawing the programme toward familiar questions. Machado tested GPT-4o as a counterfactual selector for 139 Austrian natural-science proposals: its choices agreed with the funder in 87 cases, and higher expert-rated novelty predicted cases the human process funded but the model rejected. The US writing study and Austrian selection study examine different points in the funding process. Together they give a programme leader reason to ask whether an elegant proposal or AI review has obscured what is new, risky or methodologically necessary. <button class=\"citation\" data-source=\"S14-604\" aria-label=\"Source 50\">[50]<\/button><button class=\"citation\" data-source=\"S14-605\" aria-label=\"Source 7\">[7]<\/button><\/p>\n<p>Guiding a PhD candidate or postdoc is a different task from checking a proposal. The UHD profile includes doctoral progress and professional development. A supervisor can use AI to prepare comments, but the person needs to see how the candidate is reasoning and whether an apparent weakness reflects inexperience, a hidden data problem or a new idea. Evidence from non-academic support settings shows that AI can improve the wording people rate as empathic. It does not establish that a model recognises a researcher&#39;s needs over several years or can take responsibility for an assessment. The interaction should leave room for the junior researcher to disagree and teach the supervisor something the supervisor did not know. <button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><button class=\"citation\" data-source=\"S14-704\" aria-label=\"Source 127\">[127]<\/button><button class=\"citation\" data-source=\"S14-705\" aria-label=\"Source 128\">[128]<\/button><button class=\"citation\" data-source=\"S14-702\" aria-label=\"Source 129\">[129]<\/button><\/p>\n<p>An associate professor could also inherit more review work as AI makes every member&#39;s drafting faster. The Microsoft field trial found less Outlook session time but no clear reduction in meeting time; it did not measure scientific quality or supervisory hours. This makes a simple accounting question salient: if four project members each generate another plausible analysis, who checks the assumptions, traces the data and decides what can be published? An AI coordination aid is valuable when it directs the right person to the right check, rather than treating more completed documents as the sole sign of progress. <button class=\"citation\" data-source=\"S05-013\" aria-label=\"Source 123\">[123]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><\/p>\n<h2 id=\"positions-professor-own-scholarship-and-responsibility-for-a-chair\">Professor: own scholarship and responsibility for a chair<\/h2>\n<p>The professor&#39;s UFO profile assigns a chair&#39;s research programme, funding, people, quality, doctoral training and public representation. It also explicitly lists preparing publications. A professor may save time in personal literature work, analysis, grant drafting or correspondence and redirect it toward a paper; the role is not merely an administrative layer above other authors. At the same time, the professor has to choose priorities, allocate resources, recruit and develop staff, ensure that PhD supervision is sufficiently good and oversee research integrity. No profile states that all professors have the same balance of these activities. <button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>On the professor&#39;s own research, a deep knowledge of a debate or dataset can make AI useful as a fast sparring partner: the researcher may recognise an omitted boundary condition and press for a better argument. That is a possible complement, not a property conferred by title. The tacit-practice and diagnostic studies discussed above show why relevant context and awareness of uncertainty can help with checking. A professor using a new method may need a postdoc&#39;s or candidate&#39;s technical critique as much as the candidate needs disciplinary guidance. <button class=\"citation\" data-source=\"S09-033\" aria-label=\"Source 126\">[126]<\/button><button class=\"citation\" data-source=\"S09-029\" aria-label=\"Source 131\">[131]<\/button><button class=\"citation\" data-source=\"S09-030\" aria-label=\"Source 57\">[57]<\/button><button class=\"citation\" data-source=\"S09-031\" aria-label=\"Source 132\">[132]<\/button><button class=\"citation\" data-source=\"S14-702\" aria-label=\"Source 129\">[129]<\/button><\/p>\n<p>For programme direction, AI can assemble recent work, compare calls, draft agendas, check requirements and make possible project combinations visible. The professor still decides whether the programme has a coherent question, which risky line deserves scarce resources and which team can carry it out. An LLM may make an application sound aligned with a call without improving its underlying contribution. The funding studies discussed above address proposal preparation and selection separately, and neither establishes how FEB&#39;s funders would respond. A professor&#39;s task is to judge the portfolio beyond whichever draft reads most fundable. <button class=\"citation\" data-source=\"S14-604\" aria-label=\"Source 50\">[50]<\/button><button class=\"citation\" data-source=\"S14-605\" aria-label=\"Source 7\">[7]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>A professor can delegate preparation for personnel decisions while remaining responsible for the decisions themselves. Kellogg and colleagues&#39; review distinguishes using algorithms to recommend or restrict work, record or rate it, and reward or replace workers. Keegan and Meijerink find that fully prescriptive systems replacing managers are rare in conventional organisations, even though algorithms can help managers describe or predict work. A professor could use AI to organise documented work for an appraisal or to notice that a candidate has not received the promised feedback. Deciding whether someone has grown intellectually, resolving an unfair division of credit and hearing their response require contextual judgement and institutional accountability. A dashboard may concentrate attention on what is easy to count and leave quiet mentoring invisible. <button class=\"citation\" data-source=\"S14-601\" aria-label=\"Source 133\">[133]<\/button><button class=\"citation\" data-source=\"S14-602\" aria-label=\"Source 54\">[54]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>The person receiving AI-assisted feedback may also have less room to act if it is treated as a neutral verdict. A fintech field experiment found that an AI feedback channel, a human channel, parallel channels and AI feedback relayed through a manager produced different worker responses; simply adding a human and an algorithm together could create confusion. The task was customer-service performance, not academic development. A pharmaceutical-sales experiment likewise found that an AI system worked better when authority, procedures and training were adapted to its users than when the system was dropped into existing work. In a separate company case, a tool introduced to support service workers became a means of closer managerial control. These settings differ from a university, but they show why FEB should decide who can inspect, challenge and act on AI-generated assessments before using them in supervision or personnel decisions. <button class=\"citation\" data-source=\"S14-707\" aria-label=\"Source 134\">[134]<\/button><button class=\"citation\" data-source=\"S14-708\" aria-label=\"Source 135\">[135]<\/button><button class=\"citation\" data-source=\"S14-709\" aria-label=\"Source 136\">[136]<\/button><\/p>\n<p>AI can already help prepare sensitive feedback. In one peer-support study, AI assistance improved an automated score of expressed empathy, and independent users preferred some of the assisted responses. In separate vignette experiments, outside readers sometimes rated AI responses above human ones. Yet the original support seekers did not evaluate the first study&#39;s drafted responses, and neither study observed a continuing relationship. Other communication experiments show that believing a person used automated replies can change how that person is judged. A promotor must know the candidate&#39;s work, give warranted criticism, hear their account and remain responsible for their development. Well-written comments can help, but their use may also change the candidate&#39;s trust in the exchange. <button class=\"citation\" data-source=\"S14-704\" aria-label=\"Source 127\">[127]<\/button><button class=\"citation\" data-source=\"S14-705\" aria-label=\"Source 128\">[128]<\/button><button class=\"citation\" data-source=\"S14-706\" aria-label=\"Source 137\">[137]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>The professor&#39;s net time is therefore open in both directions. An AI-assisted individual can produce a strong result on a bounded innovation task, while a chair whose members all draft faster may receive more articles, grant ideas and analyses to check. If staff also take routine questions to AI, the professor may learn less about where they are stuck and need longer conversations when a problem finally surfaces. The group would need to observe checked work and actual review and mentoring time to know whether AI increased capacity. <button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 60\">[60]<\/button><button class=\"citation\" data-source=\"S07-27\" aria-label=\"Source 55\">[55]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<h2 id=\"positions-expertise-crosses-position-boundaries\">Expertise crosses position boundaries<\/h2>\n<p>UFO responsibilities tell us <strong>who must act<\/strong>; they do not tell us <strong>who is best informed<\/strong> about every AI-assisted task. The latter depends on method, domain, data, experience with the tool and awareness of what one does not know. A seasoned professor can detect a missing theoretical condition that a language model presents smoothly. A doctoral candidate who built the data pipeline can detect a join error that the professor misses. The diagnostic studies discussed above show why task knowledge and the ability to combine uncertain advice deserve more weight than years in a position. In a FEB project, the researcher who knows a particular method or dataset should check the relevant AI output, regardless of rank. <button class=\"citation\" data-source=\"S09-029\" aria-label=\"Source 131\">[131]<\/button><button class=\"citation\" data-source=\"S09-030\" aria-label=\"Source 57\">[57]<\/button><button class=\"citation\" data-source=\"S09-033\" aria-label=\"Source 126\">[126]<\/button><\/p>\n<p>The same distinction applies to learning. A candidate learning an unfamiliar method needs enough opportunity to attempt, fail, diagnose and explain it; a professor new to that method may need the same opportunity. A postdoc expert in the method may gain more from rapid routine preparation and spend more time checking the difficult edge cases. The coding and patent-law experiments show how assisted quality and later unaided performance can separate, while the designed-tutor studies show that assistance can be structured to teach. The role changes why independent competence is needed and what happens if it is absent; the learning mechanism follows the task. <button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 47\">[47]<\/button><button class=\"citation\" data-source=\"S09-004\" aria-label=\"Source 45\">[45]<\/button><button class=\"citation\" data-source=\"S09-005\" aria-label=\"Source 74\">[74]<\/button><\/p>\n<p>AI may also alter whose knowledge travels through a research group. If researchers ask a tool every routine question, colleagues may have fewer openings to discover problems or learn a new method from one another. If the tool removes needless formatting and search work, it may instead give them more time for conversations about research choices. Reif and Cummings set out the first mechanism as theory; the French doctoral study found associations consistent with knowledge passing from students to supervisors as well as the reverse. Neither source determines the net effect for FEB, but they identify what a supervisor should preserve: occasions for candidates to show how they reason and for seniors to hear where their own knowledge is incomplete. <button class=\"citation\" data-source=\"S07-27\" aria-label=\"Source 55\">[55]<\/button><button class=\"citation\" data-source=\"S14-702\" aria-label=\"Source 129\">[129]<\/button><\/p>\n<h2 id=\"positions-what-feb-could-examine-in-a-supported-project\">What FEB could examine in a supported project<\/h2>\n<p>A faculty support programme can help people use AI at the points where the work benefits, while making the checks and learning obligations visible. A candidate and supervisor might agree which stages the candidate will attempt unaided, which AI suggestions require source or data verification, and how the candidate will explain the choices in a meeting. For a postdoc or UD, the programme could provide methods support and clear contribution records so that faster output does not bury independent work under extra checking or service. For a UHD or professor, it could supply reliable tools for organising project material and reserve time for human review, career feedback and decisions about a research programme. These are proposed arrangements; the studies above do not show that this particular FEB programme will improve careers or publications. <button class=\"citation\" data-source=\"S09-003\" aria-label=\"Source 3\">[3]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n<p>Support also needs clear agreements about who can see AI-use records or generated assessments, who may challenge them, and how they may be used. A tool introduced for feedback can otherwise become a way to monitor performance. The allocation of checking work deserves the same attention: if AI creates more drafts, the people who validate them need time and recognition for that work. These are proposed choices for FEB, informed by research on algorithmic control and managerial use of support tools. <button class=\"citation\" data-source=\"S14-601\" aria-label=\"Source 133\">[133]<\/button><button class=\"citation\" data-source=\"S14-709\" aria-label=\"Source 136\">[136]<\/button><\/p>\n<p>The pilot should look at the <strong>finished research and the people who made it<\/strong>. Did the analysis withstand an independent check? Could the author explain a key choice after using AI? How much time did coauthors and supervisors spend correcting an attractive but unsupported result? Did the candidate receive criticism they could act on, and did the project leader see problems early enough to help? A before-and-after comparison of drafts alone would miss whether faster work improved the research or shifted the burden of checking and learning onto someone else. <button class=\"citation\" data-source=\"S05-013\" aria-label=\"Source 123\">[123]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 47\">[47]<\/button><button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 60\">[60]<\/button><\/p>\n<p>The five UFO positions give FEB a defensible reason to expect different <strong>kinds<\/strong> of benefit and burden. The PhD candidate&#39;s research is also training. The postdoc&#39;s independence and grant work vary substantially by appointment. The UD combines own scholarship with teaching and developing supervision. The UHD coordinates linked projects and other researchers while continuing to publish. The professor conducts scholarship and carries chair-wide responsibility for funding, staff, doctoral guidance and quality. AI can help each position with parts of that work, while shifting the work of checking and learning across the group. Which consequence dominates should be assessed for the task and the actual appointment, rather than read from rank alone. <button class=\"citation\" data-source=\"S09-012\" aria-label=\"Source 44\">[44]<\/button><button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 46\">[46]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 48\">[48]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 51\">[51]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 53\">[53]<\/button><\/p>\n", "toc": [{"id": "positions-researcher-position-work-learning-and-responsibility", "text": "Researcher position: work, learning and responsibility", "level": 1}, {"id": "positions-phd-candidate-doing-the-research-and-learning-how-to-do-it", "text": "PhD candidate: doing the research and learning how to do it", "level": 2}, {"id": "positions-postdoctoral-researcher-independence-varies-time-is-finite", "text": "Postdoctoral researcher: independence varies, time is finite", "level": 2}, {"id": "positions-assistant-professor-own-research-teaching-and-growing-guidance", "text": "Assistant professor: own research, teaching and growing guidance", "level": 2}, {"id": "positions-associate-professor-several-projects-and-other-people-s-development", "text": "Associate professor: several projects and other people's development", "level": 2}, {"id": "positions-professor-own-scholarship-and-responsibility-for-a-chair", "text": "Professor: own scholarship and responsibility for a chair", "level": 2}, {"id": "positions-expertise-crosses-position-boundaries", "text": "Expertise crosses position boundaries", "level": 2}, {"id": "positions-what-feb-could-examine-in-a-supported-project", "text": "What FEB could examine in a supported project", "level": 2}]}}, "dimension_date": "2026-10-05", "bundles": {"quantitative-question": {"task_scope": "AI proposes research questions, mechanisms and hypotheses for the project's subject and plausible evidence; the researcher selects and justifies the question.", "impacts": [{"id": "quantitative-question-1", "kind": "opportunity", "label": "More candidate questions and mechanisms", "text": "Korinek illustrates how economists can ask AI to brainstorm research ideas and raise counterarguments {{S06-001}}, and in a field experiment on product innovation, individuals who worked with AI developed solutions of similar quality to pairs who worked without it {{S13-103}}. A researcher can then weigh more mechanisms and comparisons, including some from neighbouring fields, before committing to a question.", "source_ids": ["S06-001", "S13-103"], "evidence": "adjacent"}, {"id": "quantitative-question-2", "kind": "opportunity", "label": "Rival explanations named early", "text": "When asked for counterarguments, AI can name rival explanations for a favoured hypothesis {{S06-001}}. A researcher who then works out what each explanation predicts may see sooner which comparison would tell them apart and can state the hypothesis more sharply.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "quantitative-question-3", "kind": "opportunity", "label": "Possible data and comparisons suggested", "text": "AI can also point a researcher to datasets or policy changes that could test a proposed question, and such suggestions may reveal a feasible comparison that the researcher had not considered.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-question-4", "kind": "risk", "label": "Appealing questions the data cannot answer", "text": "In a field experiment on product innovation, AI helped professionals generate ideas more clearly than it helped them select the best one {{S13-103}}, so a researcher may settle on an attractive question before checking whether the suggested data can be obtained and measure the intended construct.", "source_ids": ["S13-103"], "evidence": "adjacent"}, {"id": "quantitative-question-5", "kind": "risk", "label": "Hypotheses written to fit known results", "text": "Cornelissen warns that AI makes it cheap to write several theoretical stories for a pattern that is already in the data {{S13-301}}, and a finance demonstration used AI to produce many complete papers with different theoretical justifications for selected signals {{S13-307}}. A researcher who asks AI for hypotheses after seeing the results may present exploratory findings as predictions.", "source_ids": ["S13-301", "S13-307"], "evidence": "adjacent"}, {"id": "quantitative-question-6", "kind": "risk", "label": "Weaker judgement in choosing the question", "text": "Messeri and Crockett argue that AI can give researchers the impression that they understand more, and explore more widely, than they do {{S06-014}}. A researcher who mainly chooses among AI proposals also gets less practice in developing a question from a puzzle in the literature or the data, and may find it harder to defend the question as their own.", "source_ids": ["S06-014"], "evidence": "reasoned"}], "source_locators": {"S01-002": "FEB Career Tracks 2025 update for new hires, PDF cover p. 1 and Research Profile promotion criteria pp. 15–16", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52 and Figure 1 on illusions of understanding; perspective, not outcome evaluation", "S09-008": "OECD, Reducing the precarity of academic research careers, career development discussion and policy recommendations, PDF p. 47", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, quality of individuals with AI and idea generation versus selection", "S13-301": "Cornelissen local accepted manuscript PDF pp. 6–8 (manuscript pp. 5–7)", "S13-307": "AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable"}}, "quantitative-literature": {"task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage and reads the pivotal originals.", "impacts": [{"id": "quantitative-literature-1", "kind": "opportunity", "label": "Faster screening of large searches", "text": "In one living mental-health review, a prompt-tuned model identified every study that was eventually included, and the authors simulated a workload reduction of 65 to 85 percent {{S06-012}}. Researchers who screen thousands of records, for example before a statistical meta-analysis, may reach the relevant studies sooner and keep more time for reading them.", "source_ids": ["S06-012"], "evidence": "direct"}, {"id": "quantitative-literature-2", "kind": "opportunity", "label": "Wider comparison of measures and designs", "text": "In tests in fields outside economics and business, a retrieval-based system that cites the passages it draws on answered questions that required several papers better than GPT-4o did {{S08-020}}. Such a system could help researchers compare how more studies, including some in neighbouring fields, have measured and estimated the same relationship.", "source_ids": ["S08-020"], "evidence": "direct"}, {"id": "quantitative-literature-3", "kind": "opportunity", "label": "Quicker orientation in an unfamiliar field", "text": "A researcher who enters a new field, or who links economics with a business discipline that uses other terms for the same process, can ask AI to explain those terms and summarise the background {{S06-001}}, and may then see sooner which papers deserve close reading.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "quantitative-literature-4", "kind": "risk", "label": "Missed studies and bias towards prominent work", "text": "In one evaluation, GPT-4’s screening performance fell once chance agreement and imbalance were adjusted for and varied with the task {{S06-011}}, and a systematic review of nineteen studies found wide error ranges in AI searching and screening {{S07-20}}. GPT-4o’s citation recommendations also favoured highly cited papers {{S08-017}}, so a smaller research stream that challenges the main finding may drop out of the comparison.", "source_ids": ["S06-011", "S07-20", "S08-017"], "evidence": "direct"}, {"id": "quantitative-literature-5", "kind": "risk", "label": "Findings misstated or wrongly compared", "text": "Without retrieval, GPT-4o fabricated most of the citations it gave for recent literature in the OpenScholar tests {{S08-020}}. Even accurate summaries may treat estimates as comparable when the studies measure different constructs or use different samples, and because a statistical meta-analysis combines results extracted from earlier studies {{S07-32}}, such estimates would enter the pooled effect.", "source_ids": ["S08-020", "S07-32"], "evidence": "direct"}, {"id": "quantitative-literature-6", "kind": "risk", "label": "Weak sources hard to recognise", "text": "An AI search returns working papers and articles from journals of very different standing side by side, and a researcher who does not yet know a field’s journals and debates may not be able to tell which studies deserve weight. Relying on summaries instead of reading the studies also gives that researcher fewer chances to learn how researchers in the field judge studies and journals.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-literature-7", "kind": "risk", "label": "Licensed articles used outside their terms", "text": "RUG guidance for its contracted AI service says that subscription articles may not be uploaded unless the publisher’s licence permits it {{S03-004}}. A researcher who wants AI to compare full texts may therefore breach a licence or have the tool work only from abstracts and open-access versions.", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S06-012": "Homiar et al., PubMed abstract Methods/Results on calibrated screening and simulated workload", "S07-20": "Clark et al. evidence-synthesis systematic review, PubMed abstract Methods and Results", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "quantitative-design": {"task_scope": "AI drafts a substantive design or model specification and alternative checks; the researcher assesses the estimand, assumptions and feasibility.", "impacts": [{"id": "quantitative-design-1", "kind": "opportunity", "label": "Alternative designs compared early", "text": "Empirical economists put the credibility of the comparison first, whereas structural modellers ask which assumptions let data inform a counterfactual {{S06-002}}{{S06-003}}. AI can draft both kinds of design for the same question, so a researcher can compare what each would estimate before committing time and data to one.", "source_ids": ["S06-002", "S06-003"], "evidence": "reasoned"}, {"id": "quantitative-design-2", "kind": "opportunity", "label": "Designs tried out before data collection", "text": "A researcher can ask AI for simulation code that shows, before any data are collected, whether an estimator recovers a known effect under the planned design. In a working paper, Horton and colleagues also used language-model agents to simulate simple economic experiments, although they caution that a good fit cannot by itself show that a theory of human behaviour is true {{S13-203}}.", "source_ids": ["S13-203"], "evidence": "adjacent"}, {"id": "quantitative-design-3", "kind": "opportunity", "label": "Analysis plan written down early", "text": "When AI turns a drafted design into a written plan of the estimand and the planned checks before any estimation, researchers can later report how their analyses developed, which an Academy of Management Journal editorial asks authors to disclose {{S06-010}}.", "source_ids": ["S06-010"], "evidence": "reasoned"}, {"id": "quantitative-design-4", "kind": "risk", "label": "Designs that estimate the wrong quantity", "text": "Angrist and Pischke explain that what an empirical result can support depends on the credibility of the comparison behind it {{S06-002}}. An AI-drafted design may look plausible while comparing the wrong cases or relying on an assumption that the setting does not meet, and a researcher without experience in the method may not notice.", "source_ids": ["S06-002"], "evidence": "reasoned"}, {"id": "quantitative-design-5", "kind": "risk", "label": "Generated measures without a validation plan", "text": "When a design relies on variables that AI will generate from text or other documents, errors in those variables can bias the estimates {{S07-07}}, and valid inference requires a hand-coded validation sample that the design has to provide for {{S08-013}}. A drafted design that leaves out such a sample can make the later results hard to defend.", "source_ids": ["S07-07", "S08-013"], "evidence": "adjacent"}, {"id": "quantitative-design-6", "kind": "risk", "label": "Less practice in defending a design", "text": "In a randomised experiment, programmers who learned an unfamiliar library with AI help performed worse on a later test of its concepts {{S09-003}}. A researcher who adopts an AI-drafted design may likewise learn less about why its assumptions hold, which supervisors and reviewers expect the researcher to explain.", "source_ids": ["S09-003"], "evidence": "adjacent"}, {"id": "quantitative-design-7", "kind": "risk", "label": "Data access and permissions overlooked", "text": "An AI-drafted design may assume records that the project cannot obtain or a tool that it may not use. CBS microdata, for example, require institutional and project authorisation and can be analysed only in a controlled environment {{S06-021}}, and RUG staff must request new AI software through a central process {{S03-003}}.", "source_ids": ["S06-021", "S03-003"], "evidence": "reasoned"}], "source_locators": {"S03-003": "RUG Safe and Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026", "S06-002": "Angrist and Pischke, Journal of Economic Perspectives, abstract/introduction on credible empirical design", "S06-003": "Nevo and Whinston, Journal of Economic Perspectives publisher abstract on structural modelling and assumptions", "S06-010": "DeCelles et al., AMJ transparency editorial pp. 1009–10 on disclosing how analyses evolved", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-203": "Horton, Filippas and Manning, revised NBER working paper PDF pp. 2–4, 14 and 29–31 on simulated economic agents and the limits of fit"}}, "quantitative-data": {"task_scope": "For material the project is permitted to use, AI retrieves, extracts, cleans and links records or study results; the researcher validates measures and transformations. Data-access rights remain a separate constraint.", "impacts": [{"id": "quantitative-data-1", "kind": "opportunity", "label": "More records prepared for analysis", "text": "Researchers can retrieve public SEC filings through documented interfaces {{S06-023}}, and language models have been used to extract ownership information from corporate documents {{S07-08}}. With such tools, a team can prepare more records than it could by hand, and the same applies to the results that a statistical meta-analysis extracts from earlier studies {{S07-32}}.", "source_ids": ["S06-023", "S07-08", "S07-32"], "evidence": "direct"}, {"id": "quantitative-data-2", "kind": "opportunity", "label": "New measures from documents and text", "text": "Ludwig and colleagues show that labels produced by a language model can support rigorous estimates when researchers hand-code a small validation sample and use it to correct the labels’ errors {{S08-013}}. Researchers may therefore measure constructs in filings or annual reports that were too costly to code by hand.", "source_ids": ["S08-013"], "evidence": "direct"}, {"id": "quantitative-data-3", "kind": "opportunity", "label": "Preparation recorded in code", "text": "When AI writes the cleaning and linking steps as code instead of editing files by hand, a collea
