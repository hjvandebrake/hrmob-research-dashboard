<script type="application/json" id="presentation-data">{"meta": {"variant": "department", "title": "Using AI well in research", "footer": "Using AI well in research · October 2026", "has_report": false}, "assessment": {"version": "2026-10-05-background-proposal", "scenarios": {"ordinary": "Permitted AI use with ordinary supervision; no additional faculty AI programme assumed.", "supported": "The cell-specific intervention is available and used, and its full human cost remains proportionate to the benefit. This is an assumption to test: FEB staff, supervision and coauthor time have not been estimated."}, "ratings": {"opportunity": "A net benefit is more plausible under the stated conditions, after checking costs and learning consequences.", "mixed": "Benefits and consequential costs compete, or the broad task contains branches with different directions.", "risk": "The dominant failure or learning mechanism is likely to outweigh gains under the stated use."}, "confidence_note": "Confidence concerns the evidence supporting the task mechanism and transfer. Every cohort comparison remains provisional; confidence does not determine colour.", "comparison": "Same substantive AI task and ordinary researcher checking across cohorts."}, "dimensions": {"overview": {"title": "Overview", "html": "<h1 id=\"overview-ai-and-research-at-feb-the-three-dimensions\">AI and research at FEB: the three dimensions<\/h1>\n<p>AI is changing the work through which research is produced. It can help researchers explore a question, process material, write code and prepare a manuscript. Whether these changes improve a study depends on what the system does well, what the researcher delegates, and what happens to the work that follows. The Organization Science editorial on “more versus better” describes the central concern: faster production can increase submissions while leaving the reasoning and scrutiny needed for a good paper under pressure. Its evidence concerns writing and editorial outcomes; its warning about the loss of research craft is an argument about how those changes could develop. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button><\/p>\n<p>For FEB, the analysis therefore begins with the work itself. An economist reconstructing an empirical analysis, a marketing researcher interviewing consumers and a management scholar developing a theoretical explanation face different decisions. A doctoral candidate also has to learn from those decisions, while a professor may be responsible for the quality of several people&#39;s work. These differences help explain why the same tool can create an opportunity in one situation and a problem in another.<\/p>\n<h2 id=\"overview-the-three-dimensions\">The three dimensions<\/h2>\n<div class=\"table-wrap\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Dimension<\/th>\n<th>What the chapter examines<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>The research cycle<\/strong><\/td>\n<td>Question and theory; literature; design; data and sources; analysis and interpretation; writing and review. Which tasks become faster, which new studies become feasible, and which intellectual steps might receive less attention?<\/td>\n<\/tr>\n<tr>\n<td><strong>Forms of research<\/strong><\/td>\n<td>Quantitative, Qualitative and Theory/Review. What changes when the task involves numerical inference, participants&#39; experiences, formal arguments or synthesis of existing work? Statistical meta-analysis is included in Quantitative.<\/td>\n<\/tr>\n<tr>\n<td><strong>Researcher positions<\/strong><\/td>\n<td>PhD candidates, postdocs, assistant professors, associate professors and full professors. How do changes to research tasks affect learning, independent scholarship, grants, supervision and leadership? The responsibilities are grounded in the UFO profiles used by the university.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The chapters examine each dimension separately. They explain observed capabilities and failures, then consider their implications for economics and business research. Examples describe possible FEB applications unless they explicitly refer to a faculty study. Evidence from other occupations is used to investigate mechanisms, such as learning or supervisory feedback, with the original setting kept visible.<\/p>\n<h2 id=\"overview-capability-acceptance-and-research-quality\">Capability, acceptance and research quality<\/h2>\n<p>A technically successful task can have an unwanted consequence. An AI interviewer may elicit more text, but researchers also need to establish whether the people they want to hear from will participate and speak freely. Existing findings on participant experience differ across settings. A coding agent may reproduce a result without detecting a mistaken assumption, and a supervisor may save time preparing feedback while receiving more drafts to assess. The analysis considers these consequences alongside demonstrated benefits. It also distinguishes empirical findings from critical arguments about scientific understanding, professional autonomy and the organisation of research.<\/p>\n<p>The evidence does not support a single ranking in which one research form or career group always benefits most. The result depends on the task, evidence, expertise and working arrangement. Each chapter develops these conditions before the dimensions are combined.<\/p>\n<h2 id=\"overview-the-combined-assessment\">The combined assessment<\/h2>\n<p>The <button class=\"link-button\" data-map-overview>proposed combined assessment<\/button> now applies this research to 54 combinations of stage, form and career cohort. Each explanation identifies the expected benefit or harm, the additional support that could change it, and the conditions that could reverse the judgment. The <button class=\"link-button\" data-report=\"\">integrated report<\/button> summarizes the resulting expectations for FEB. These are conditional assessments; the literature reviewed here does not establish a measured three-way interaction at the faculty.<\/p>\n<p>This is a targeted academic evidence review, supplemented by methodological and institutional sources. It is not an exhaustive systematic review. Numbered references open the original publications; detailed search records, claim checks and the UFO task mapping are retained in the research dossier.<\/p>\n", "toc": [{"id": "overview-ai-and-research-at-feb-the-three-dimensions", "text": "AI and research at FEB: the three dimensions", "level": 1}, {"id": "overview-the-three-dimensions", "text": "The three dimensions", "level": 2}, {"id": "overview-capability-acceptance-and-research-quality", "text": "Capability, acceptance and research quality", "level": 2}, {"id": "overview-the-combined-assessment", "text": "The combined assessment", "level": 2}]}, "cycle": {"title": "The research cycle", "html": "<h1 id=\"cycle-how-ai-changes-the-research-cycle\">How AI changes the research cycle<\/h1>\n<p>Researchers at FEB can already ask AI to suggest a question, map a literature, propose a design, extract observations, write code, and revise a manuscript. The breadth of this assistance can make a project feel as though it is advancing continuously. Yet a research project also depends on decisions that connect these products. An interesting question must survive contact with available evidence. A useful literature map must include work that could change the argument. A clean estimate must answer the question the paper asks. The effects of AI on research quality will therefore depend on which decisions become easier and which are skipped as work accelerates.<\/p>\n<p>The six stages below describe kinds of work rather than a fixed sequence. Economists often revisit a question after identifying the available variation; management scholars may revise a proposed mechanism after fieldwork; and a literature review may treat published studies as its primary data. Established methodological accounts in economics and management emphasize this movement between question, evidence, design, and contribution. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 6\">[6]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 67\">[67]<\/button> <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> The same AI operation can also have different consequences across research forms. Extracting a number from a filing, interpreting a participant’s account, and deriving a formal implication all produce text, but they call for different checks.<\/p>\n<p>The most credible evidence concerns bounded operations under specified conditions. Some systems are already capable of retrieving source-backed answers, improving code against a score, and helping human reviewers make their reports more informative. Other findings identify errors that can change a conclusion when researchers treat an output as evidence. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button> <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 73\">[73]<\/button> <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 106\">[106]<\/button> What follows separates present capability from likely changes to FEB practice. The latter are reasoned expectations that depend on the model, the available evidence, and how researchers use the time they save.<\/p>\n<h2 id=\"cycle-question-and-theory\">Question and theory<\/h2>\n<p>AI makes it easier to explore a question before a team commits to it. A researcher can ask for alternative explanations of a pattern, counterexamples to a proposed mechanism, or neighboring fields that describe a similar phenomenon. Korinek identified such ideation and feedback tasks for economists, alongside background research, coding, data analysis, and writing. His article provides examples of useful microtasks, rather than a measured increase in the quality of completed economic papers. <button class=\"citation\" data-source=\"S06-001\" aria-label=\"Source 9\">[9]<\/button> The practical gain is that a researcher can compare more candidate explanations early enough to revise the project.<\/p>\n<p>The first question is whether those candidates would test different explanations. Si and colleagues built a Claude 3.5 Sonnet ideation agent that retrieved relevant papers, generated many proposals, removed near-duplicates, and ranked the remainder. In a blind comparison across seven NLP prompting topics, expert reviewers rated its proposals more novel than matched human proposals. They did not rate the AI proposals significantly better on feasibility or overall quality when each idea was the unit of analysis. <button class=\"citation\" data-source=\"S14-101\" aria-label=\"Source 10\">[10]<\/button> The study is strong evidence that a carefully constructed system can propose ideas that <em>look<\/em> novel to specialists. It says less about whether a scholar will want to pursue them once access, measures, baselines, and the likely contribution become concrete.<\/p>\n<p>The agent&#39;s own workflow shows how much filtering lies between generation and choice. It produced 4,000 seed proposals per topic, yet only about 200 per topic were nonduplicates under the study&#39;s similarity threshold. Tested AI rankers agreed weakly with the expert ordering of ideas. Even the best tested pairwise ranker attained 53.3% balanced agreement in this difficult task, compared with 56.1% agreement among expert reviewers. <button class=\"citation\" data-source=\"S14-101\" aria-label=\"Source 10\">[10]<\/button> More proposals therefore increase the demand for judgment as well as the supply of options. If a researcher accepts the most polished suggestion, the generation stage can displace the slower comparison of premises, practical constraints, and alternative explanations.<\/p>\n<p>A follow-up study tested what happened when the ideas became projects. Forty-three expert NLP researchers were randomly assigned an anonymized AI or human idea, worked for about 103 hours on average, and submitted code and a short paper for blind review. The AI ideas lost significantly more of their initial rating after execution on novelty, excitement, effectiveness, and overall quality. The final AI–human score difference was <em>not<\/em> statistically significant when each of the 43 projects was treated as the independent unit. <button class=\"citation\" data-source=\"S14-102\" aria-label=\"Source 11\">[11]<\/button> Thus the result identifies an ideation–execution gap, rather than proving that human ideas finish better. It is especially relevant to FEB because the appealing part of a proposal can be the part that becomes hardest to sustain: a field relationship that cannot be accessed, a comparison group that is not comparable, or a theoretical distinction that the proposed evidence cannot reveal. The tested projects concerned NLP prompting over a three-month window; those specific failure rates should not be carried into a multi-year social-science study.<\/p>\n<p>There is also evidence that AI-generated hypotheses can cross an initial validation threshold. Google&#39;s Gemini-based Co-Scientist worked from human-specified biomedical goals and proposed candidates for selected drug-repurposing, liver-fibrosis, and antimicrobial-resistance problems. Experts selected candidates for laboratory work; some showed activity in cell lines or organoids, and one proposed mechanism matched a contemporaneous, then-unpublished experimental discovery. <button class=\"citation\" data-source=\"S06-013\" aria-label=\"Source 107\">[107]<\/button> These results are more informative than a model-generated list of hypotheses. They show what happens when a candidate faces an external test. They also preserve the scientists&#39; role in defining the problem, selecting what to test, and interpreting the result. In FEB, an analogous test might be a small pilot with actual respondents, a search for a critical archival case, or an explicit comparison between a proposed mechanism and a rival one. None has yet been shown to work at the rate observed in the selected biomedical cases.<\/p>\n<p>The effect of AI on the diversity of questions remains conditional. In experiments on everyday and product ideas, GPT-3.5 assistance increased the average human-rated creativity of individual suggestions, particularly for incrementally new ideas. A subsequent reanalysis of those data found lower diversity across the pool of AI-assisted suggestions. <button class=\"citation\" data-source=\"S14-103\" aria-label=\"Source 108\">[108]<\/button> <button class=\"citation\" data-source=\"S14-104\" aria-label=\"Source 13\">[13]<\/button> Doshi and Hauser observed a related individual-gain/collective-diversity pattern in short-story writing. <button class=\"citation\" data-source=\"S05-016\" aria-label=\"Source 79\">[79]<\/button> Yet a separate dynamic experiment found that <em>high passive exposure<\/em> to AI examples increased the semantic diversity of people&#39;s alternative-use ideas without raising individual creativity. <button class=\"citation\" data-source=\"S14-105\" aria-label=\"Source 109\">[109]<\/button> These studies vary in whether people actively ask AI for ideas, merely see examples, or receive particular starting points. They also measure different kinds of originality. The defensible FEB implication is to inspect the <em>set<\/em> of candidate questions and explanations, including those that challenge a comfortable framing. A large stack of similar proposals does not provide that diversity by itself.<\/p>\n<p>Theory development requires a further step. An economist may ask whether the proposed mechanism implies a pattern that competing accounts would not predict. A management scholar may ask which observations would distinguish learning, selection, and retrospective justification in a firm&#39;s account of change. AI can produce candidate counterarguments, but it does not establish that the constructs are distinct or that a study can observe the necessary process. Edmondson and McManus describe the fit among question, prior theory, data, and contribution as a central requirement of organizational field research. <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> AI is most useful here when it gives the scholar a more demanding question to answer, rather than a more fluent version of the answer already preferred.<\/p>\n<h2 id=\"cycle-literature\">Literature<\/h2>\n<p>Literature work begins before writing a review section. Researchers identify candidate records, decide which belong in the inquiry, read the relevant passages, and determine what each paper contributes to the argument. A tool can improve one of these tasks while leaving the others untouched. A source-backed summary, for example, can be accurate about the papers it retrieved while omitting a study that would change the novelty claim. At FEB, a search confined to one discipline can miss relevant work in economics, management, marketing, information systems, or psychology because these fields use different names for related phenomena.<\/p>\n<p>Retrieval-backed synthesis is already useful on tested tasks. OpenScholar searches an open corpus of roughly 45 million papers, retrieves passages, and generates cited scientific answers. On its benchmark, specialized 8B and GPT-4o-based variants outperformed GPT-4o without retrieval on aspects of multi-paper correctness and citation accuracy. Domain experts preferred the OpenScholar variants to expert-written answers in 51% and 70% of pairwise comparisons for the tested systems. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button> These are substantial results for answering bounded questions with a source trail. The comparison involved 108 questions and 16 expert evaluators; the benchmark covered computer science, biomedicine, physics, and neuroscience, not FEB&#39;s core fields. OpenScholar&#39;s authors also report missed representative papers, occasional unsupported information, and lack of license-protected papers at inference. A scholar can benefit from a rapid first map while still needing to inspect whether that map contains the decisive literature.<\/p>\n<p>The model&#39;s access route changes the problem. In OpenScholar&#39;s recent-literature tests, GPT-4o asked to cite from memory fabricated many paper titles, whereas retrieval-backed systems performed better. The reported 78–90% title-fabrication range belongs to those prompts and model versions. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button> An independent citation study asked memory-only GPT-4o to suggest references for 10,000 existing articles. Among the suggestions that matched actual papers, the model favored highly cited work more than the original reference lists did, even while suggesting semantically relevant material. <button class=\"citation\" data-source=\"S08-017\" aria-label=\"Source 15\">[15]<\/button> The latter study did not test interactive search or a retrieval-enabled assistant, so its pattern cannot be assigned to every contemporary literature tool. It does show a possible selection mechanism: prominent, familiar references arrive early, and a researcher who stops there can reinforce an established citation hierarchy while overlooking less visible evidence.<\/p>\n<p>Screening provides another distinct benefit. LEADS, a specialized 7-billion-parameter model trained on medical systematic-review material, helped clinicians rank and inspect candidate studies. In a pilot that presented 30 citations per review topic, expert-plus-LEADS screening reached recall of 0.81 versus 0.78 for expert-only work, with about 21% less time per study. <button class=\"citation\" data-source=\"S14-106\" aria-label=\"Source 110\">[110]<\/button> The gain came from a collaborative workflow; difficult middle-ranked cases still required closer human review. The same paper&#39;s larger search evaluation showed how much work occurs upstream: single-pass top-K recall was about 25% for publications and 32% for trials under its benchmark, and aggregating multiple generated queries raised coverage. <button class=\"citation\" data-source=\"S14-106\" aria-label=\"Source 110\">[110]<\/button> A system can therefore rank records effectively once they are in view without having found the full relevant set. Clinical trial inclusion rules, data sources, and specialist training also differ from a management or economics review.<\/p>\n<p>For FEB, the most likely change is a faster first map of concepts, methods, and disagreements. That map can help a researcher decide where to read deeply. It may also create a false stopping point if a coherent paragraph substitutes for examining the source boundary. The scholar should be able to explain why a search included a discipline, database, period, or type of evidence, and should inspect the original papers that carry the argument&#39;s main claims. In an integrative review, this goes further: published studies are the corpus and the contribution lies in how their findings are compared and recombined, not in how quickly their abstracts are summarized. <button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 92\">[92]<\/button> When a crucial paper is absent or its claim is misread, a well-written synthesis can make the error harder to notice.<\/p>\n<h2 id=\"cycle-design\">Design<\/h2>\n<p>AI can help researchers rehearse a design before collecting expensive data. It can propose manipulations, comparison groups, instruments, sampling approaches, interview prompts, and threats to validity. The capacity to list such options is valuable because it may reveal a weakness while a project is still cheap to change. Yet design quality rests on a specific warrant: what variation or observation permits the promised inference? A broad label, such as an experiment or a difference-in-differences design, cannot supply that warrant on its own.<\/p>\n<p>A recent social-science study illustrates the benefit of inexpensive rehearsal. Ashokkumar and colleagues asked GPT-4 to simulate responses to experimental stimuli and used the simulated differences to forecast real effects from 70 preregistered, nationally representative US survey experiments. The archive included 469 effects and 119,330 participants. Forecasts correlated strongly with observed effects, including for studies unavailable by the model&#39;s training-data cutoff, and performed similarly to pooled human forecasts. At the same time, the predicted effects were systematically too large; correlations were lower in a second archive of 15 megastudies. <button class=\"citation\" data-source=\"S14-107\" aria-label=\"Source 17\">[17]<\/button> This provides evidence for triaging possible interventions and preparing pilots. A simulated effect is a forecast about respondents in the source setting, not a measurement of how a new population or firm will actually respond. Earlier work on synthetic survey respondents likewise shows both reproduction of some aggregate patterns and risks for subgroup variation. <button class=\"citation\" data-source=\"S07-11\" aria-label=\"Source 16\">[16]<\/button> <button class=\"citation\" data-source=\"S07-12\" aria-label=\"Source 111\">[111]<\/button><\/p>\n<p>The distinction between recognizing a method and specifying its identifying detail can be measured directly. Sawarni and colleagues assembled 174 causal questions across 139 real datasets in published work and textbooks. With a question, metadata, and data available, a GPT-5.3 reasoning baseline identified the broad design family in 81.0% of cases, but produced a fully correct identification specification in 37.9%. Errors included omitted and post-treatment controls, wrong treatment or outcome variables, incorrect estimands, and treating an observational comparison as an experiment. <button class=\"citation\" data-source=\"S14-108\" aria-label=\"Source 18\">[18]<\/button> This is a retrospective benchmark on known designs, rather than a prospective test of AI-designed FEB studies. Its error pattern nevertheless points to the exact place where an apparently competent assistant can mislead: the model names a familiar strategy and supplies code, while the treatment, timing, assignment, instrument, or target effect does not match the paper&#39;s claim.<\/p>\n<p>Economic and management traditions describe these design obligations in different terms. The credibility revolution in empirical economics centers the source of identifying variation and the assumptions needed to interpret it; structural approaches use theoretical restrictions to answer other counterfactual questions. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 6\">[6]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 67\">[67]<\/button> Organizational field research asks whether the state of prior theory, the research question, the evidence, and the intended contribution fit together, often with revision during field engagement. <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> A researcher using AI to propose an instrument therefore still has to defend the exclusion restriction in the setting. A field researcher asking AI to draft an interview guide still has to determine whose account could reveal the process and which contrary case could refute the proposed explanation. Those judgments depend on institutions, relationships, and access that a generic design template does not contain.<\/p>\n<p>The FEB opportunity is earlier and more varied criticism of a design. An applied economist could ask for alternative estimands and threats to parallel trends, then test them against the policy&#39;s actual timing and the data structure. A behavioral researcher could compare predicted message effects before an inexpensive human pilot, while accounting for the forecast&#39;s tendency to exaggerate magnitudes. A management researcher could use AI to propose discrepant cases and then decide whether the organization can supply records or interviews that distinguish the candidate mechanisms. Such work may reduce avoidable starts. It improves research only when the suggested objection changes a real choice about sampling, measurement, comparison, or interpretation.<\/p>\n<h2 id=\"cycle-data-and-sources\">Data and sources<\/h2>\n<p>Once a study is designed, AI can turn some previously costly material into analyzable records. A team may parse public corporate filings, transcribe permitted interviews, locate passages in annual reports, or classify descriptions of work. These operations can expand the feasible corpus. They also expose a distinction between acquiring material and having a valid measure. SEC interfaces permit automated retrieval of public filings; CBS microdata are subject to a restricted environment and access conditions. The technical possibility of sending a file to an external model does not determine whether a researcher is authorized to process it there. <button class=\"citation\" data-source=\"S06-023\" aria-label=\"Source 20\">[20]<\/button> <button class=\"citation\" data-source=\"S06-021\" aria-label=\"Source 23\">[23]<\/button> <button class=\"citation\" data-source=\"S06-022\" aria-label=\"Source 112\">[112]<\/button><\/p>\n<p>AI can now collect some of the material, too. In 766 online interviews on two economic topics, an adaptive AI interviewer elicited substantially more distinct themes than the researchers&#39; fixed open-text survey questions. A separate randomized experiment with 2,243 online respondents found more specific reasons than fixed questions, without a detected rise in survey abandonment; the conversation also changed some subsequent attitude answers. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> <button class=\"citation\" data-source=\"S14-305\" aria-label=\"Source 98\">[98]<\/button> These are gains relative to survey questions, not demonstrations that AI matches a skilled human field interviewer. The exchange can improve elicitation and simultaneously change what is being measured.<\/p>\n<p>The evidence on willingness is mixed rather than a story of general resistance. In Chopra and Haaland&#39;s separate experiment with 500 online panelists rating hypothetical invitations, 89% said they would accept a survey and 90% an AI interview when each was described first. Among people who had completed one of their AI interviews on stock-market participation, 53% preferred AI for a future interview, 21% preferred a human, and 26% were neutral. Neither result measures take-up among people outside the panel or the views of those who declined the original interview. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> In a direct comparison involving six human and five AI interviews with students, coders rated answer quality similarly overall, but the AI missed more cues to probe surprising replies; its interviewees found the exchange less interesting and less appealing to repeat. <button class=\"citation\" data-source=\"S14-402\" aria-label=\"Source 37\">[37]<\/button> A FEB team interviewing managers, employees, or consumers would therefore have to check who agrees to an AI-mediated conversation and whether the mode changes what they say. Seventeen interviewers in a simulated assistant-supported interview also raised concerns about divided attention, off-target probes, respect, and privacy; these were perceptions, rather than measured participant harms. <button class=\"citation\" data-source=\"S14-409\" aria-label=\"Source 113\">[113]<\/button> Recruitment, respondent experience, and the kind of account elicited belong in the comparison alongside transcript length or number of themes.<\/p>\n<p>The quality of an extracted dataset depends on which fields support the central finding. Yisha and colleagues compared ChatGPT-4 and Claude 3 Opus with verified items from 105 randomized-trial reports in two medical reviews. The models correctly extracted binary-outcome group sizes in 91–94% of cases, but event counts in 57–71%; mean and standard-deviation extraction for continuous outcomes was lower still. <button class=\"citation\" data-source=\"S14-201\" aria-label=\"Source 114\">[114]<\/button> These are May 2024 model and clinical-report results, not expected error rates for FEB. They illustrate why a team should validate the fields used to define its outcome, comparison, or denominator. Firm names might be easy, while event dates, denominator choices, amended disclosures, or the distinction between an intention and a completed action might decide the analysis.<\/p>\n<p>A mislabeled record can alter an estimate. Christensen and Hansen examine AI/ML-generated covariates used in economic analysis. In their remote-work illustration, nine of 1,000 sampled postings were false positives, and a coefficient in a regression on log posted salary changed from 0.364 to 0.641 under their specified correction, with nonoverlapping 95% intervals. This is an illustration of inferential sensitivity, not a causal estimate of remote work&#39;s salary effect. Their correction rests on an explicit model of classification error and supporting information; it is not a universal adjustment for generated labels. <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> Even a small share of false positives across all records can change the estimated relationship when the generated label defines a treatment or control. A researcher should plan the validation sample, error estimate, and inferential treatment as part of measurement, rather than run a polished regression first and audit the labels afterward.<\/p>\n<p>An archival FEB project could retain a trace from each extracted value to the source passage, document version, extraction method, transformation, and review decision. It could oversample ambiguous items for validation and count omissions as well as false positives. This would make a disagreement between model and researcher inspectable, and it would allow corrections to propagate through the analysis. <button class=\"citation\" data-source=\"S14-201\" aria-label=\"Source 114\">[114]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> In interview-based work, the corresponding record may be a transcript segment and a decision about its meaning; in administrative-data work, it may be an access-approved code path and metadata. The check should fit what the research claim depends on, rather than merely prove that an extraction script ran.<\/p>\n<h2 id=\"cycle-analysis-and-interpretation\">Analysis and interpretation<\/h2>\n<p>AI can conduct many analyses once a task has a score or formal output. Aygün and colleagues&#39; ERA system generates and rewrites scientific code, tests alternatives, and selects variants that improve an explicit metric. On selected public tasks, it produced 40 single-cell analysis methods above the previous leaderboard leader and 14 hospitalization forecasts above compared CDC forecasts. <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 73\">[73]<\/button> This is real computational progress. The optimization target also defines the boundary of the result: a higher benchmark score shows better performance on that benchmark, while a scientific paper must still explain why the benchmark, population, comparison, and interpretation answer its question.<\/p>\n<p>Researchers already use AI for routine scientific programming. O&#39;Brien, Milewicz, and Eisty examined free-text accounts from research programmers about one recalled AI-assisted coding episode. Among 506 usable narratives, 52.8% mentioned running generated code to assess it, whereas only 3% mentioned an automated test and 2% another person&#39;s review. <button class=\"citation\" data-source=\"S14-205\" aria-label=\"Source 26\">[26]<\/button> These are selected self-reports, not observations of the researchers&#39; complete verification practices or a measurement of code correctness. They nevertheless make a practical distinction visible. “The script ran” establishes that it executed. It does not establish that a join preserved the intended population, that the right outcome was coded, or that the reported coefficient has the claimed meaning.<\/p>\n<p>Interpretation varies more across FEB research forms than the computational step suggests. In a quantitative paper, AI can produce specifications, plots, and robustness tables while the author decides whether the estimand, selection process, and assumptions support a causal or descriptive claim. In qualitative fieldwork, it can retrieve passages and propose codes while researchers decide what participants meant and whether an awkward case changes the emerging explanation. In a formal or conceptual paper, it can suggest a derivation or counterexample while the scholar tests whether the inference follows from the stated premises. In an integrative review, it can extract statements while the author explains what apparent disagreement among studies reveals. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 6\">[6]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 67\">[67]<\/button> <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> <button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 92\">[92]<\/button> These tasks have different validation standards, but the common work is to connect an output to an argument that a reader can examine.<\/p>\n<p>AI can help with that connection if it is used to challenge a result. A researcher may ask it to find a possible coding error, state a rival interpretation, or identify a case that does not fit the preferred mechanism. The next step is to check that challenge against the data, not to ask the same system to certify its own answer. A held-out calculation, source-linked validation sample, proof check, or colleague&#39;s substantive review can reveal errors that a self-consistent model response leaves in place. <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 73\">[73]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> <button class=\"citation\" data-source=\"S06-010\" aria-label=\"Source 69\">[69]<\/button> The likely FEB effect is therefore conditional: the same speed gain can fund more serious validation, or it can produce more analysis variants without resolving the question.<\/p>\n<h2 id=\"cycle-writing-and-review\">Writing and review<\/h2>\n<p>Writing is the stage at which a researcher has to state what the evidence shows and where the argument stops. AI can reduce the effort needed to draft and edit prose. In a randomized study of short professional-writing tasks, AI assistance improved speed and ratings, though those tasks were not research manuscripts. <button class=\"citation\" data-source=\"S05-007\" aria-label=\"Source 75\">[75]<\/button> A large study of preprints inferred AI-writing use from abstracts and found that detected adoption was followed by higher monthly output relative to comparison authors across arXiv, bioRxiv, and SSRN. The authors expressly cautioned that adoption was not random and the detection measure imperfect, so these associations are not an estimate of AI&#39;s causal effect on scientific productivity. <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 28\">[28]<\/button> Faster drafting can be useful to a researcher writing in a second language; it can also reduce the time in which a weak claim becomes visible to its author.<\/p>\n<p>The writing signal itself has changed. In the same preprint study, linguistically complex AI-signature prose was negatively associated with later publication or ICLR review scores, whereas complexity had a positive association among human-signature papers. Those outcomes are proxies for evaluation, not direct tests of truth. <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 28\">[28]<\/button> The result cautions against treating fluency or complexity as evidence that the underlying analysis is strong. A clear paragraph may accurately express a finding, but it may also make a gap between result and claim harder for a hurried reader to see.<\/p>\n<p>Evidence from a management journal shows why the response should focus on substance. Gartenberg and colleagues examined 6,957 initial submissions and 10,389 text-entered reviews at <em>Organization Science<\/em> through February 2026. They observed higher submission volume after late 2022 and associations between stronger AI-writing detector signatures, lower readability, and less favorable editorial outcomes. In an author-fixed-effects model, the association with editorial decisions weakened to statistical insignificance. The authors themselves used AI for parts of their editorial and then revised it heavily; its detector score was low. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button> A detector score therefore gives neither a reliable account of a researcher&#39;s process nor a verdict on the research. The editorial&#39;s deeper claim is that easy prose production may displace deep reading, field immersion, empirical revision, or sustained theory development. Those are proposed mechanisms; the study observed text, topic words, and editorial outcomes, not whether these activities were skipped. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button><\/p>\n<p>The same distinction applies to review. In the <em>Organization Science<\/em> sample, reviews with higher detector scores were less readable and emphasized theory more than data by the study&#39;s word-frequency measure. The analysis compares some reviews of the same manuscript and includes reviewer effects, but topic words cannot reveal whether a reviewer actually missed a design flaw. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button> By contrast, a randomized intervention at ICLR 2025 gave optional AI feedback to human reviewers on half of 44,831 reviews. Reviews that received the feedback were more often revised than controls, and rebuttal engagement increased; acceptance rates did not change significantly. Human judges preferred revised reports in a selected blind comparison of 100 review pairs, a result that should not be generalized to all reviews in the trial. <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 106\">[106]<\/button> The intervention helped reviewers improve their own reports. It did not ask the system to replace their judgment.<\/p>\n<p>For FEB authors and reviewers, the useful question is whether AI assistance makes a criticism or response more specific and better checked. An author could ask which sentence lacks support and then reopen the data or source. A reviewer could ask whether a report names the exact missing comparison, provided the venue permits such use and confidential material is handled accordingly. A generated full referee report raises a different question: whether it identifies the assumptions or evidence on which the paper&#39;s conclusion depends, without inventing flaws. The evidence does not justify treating those two uses as equivalent. <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 106\">[106]<\/button> <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button><\/p>\n<h2 id=\"cycle-what-changes-across-the-whole-cycle\">What changes across the whole cycle<\/h2>\n<p>When the cost of each operation falls, researchers can attempt more projects and more versions of a project. This creates opportunities for exploration. It also increases the amount of material that must be selected and checked. The <em>Organization Science<\/em> editorial reports increasing submissions across its comparison periods, and the cross-field preprint study observed more output following detected AI adoption. Neither design isolates how much of that change AI caused. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 29\">[29]<\/button> <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 28\">[28]<\/button> The observed pressure on review systems is nevertheless relevant to FEB: faster production can move work from the author to supervisors, collaborators, editors, and referees unless the extra output is matched by effective scrutiny.<\/p>\n<p>An end-to-end system marks a useful boundary for thinking about that pressure. Lu and colleagues&#39; <em>AI Scientist<\/em> generated ideas, code, experiments, figures, a manuscript, and an automated review in computational machine-learning settings. Researchers selected three outputs for a consented workshop trial. One passed the workshop&#39;s review threshold and was withdrawn under the study protocol; the workshop accepted 70% of submissions, and the authors judged none of the three ready for a main-conference paper. They documented weak ideas, implementation errors, and inaccurate citations. <button class=\"citation\" data-source=\"S14-109\" aria-label=\"Source 30\">[30]<\/button> This is evidence that a complete computational paper can sometimes pass a particular review bar after output selection. It says little about research requiring organizational relationships, restricted records, measurement of social constructs, or contested interpretations. It does show why counting an apparently complete manuscript is weaker than examining the work and standards that produced it.<\/p>\n<p>Messeri and Crockett describe a related epistemic risk: when tools make answers and outputs easy to obtain, researchers can acquire an <em>illusion of understanding<\/em> and converge on methods or questions that the tools handle readily. Their argument identifies a mechanism to examine, not an observed decline in FEB research quality. <button class=\"citation\" data-source=\"S06-014\" aria-label=\"Source 62\">[62]<\/button> The creativity experiments above show why neither convergence nor diversity is a universal outcome of AI assistance, and the preprint evidence also suggests that AI-supported work may bring some less prominent sources into view. <button class=\"citation\" data-source=\"S14-104\" aria-label=\"Source 13\">[13]<\/button> <button class=\"citation\" data-source=\"S14-105\" aria-label=\"Source 109\">[109]<\/button> <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 28\">[28]<\/button> The relevant question is whether a project exposes its assumptions and alternative accounts more clearly after AI has helped generate and organize them.<\/p>\n<p>Across the six stages, AI may improve research when faster generation leaves more time for the few checks on which a contribution rests: comparing an explanation with a rival, searching for the omitted paper, piloting a manipulation with actual respondents, validating a measure on which the estimate depends, rerunning an analysis on a held-out case, or revising a claim after review. The very same speed gain may lower quality if it is spent mainly on another proposal, another specification, or another polished submission. That conditional effect is more useful for FEB than a single impact score for a stage. It identifies the decision a researcher and a faculty support programme can change, and it keeps the quality of the completed contribution distinct from the volume of material AI can produce. <button class=\"citation\" data-source=\"S14-102\" aria-label=\"Source 11\">[11]<\/button> <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 14\">[14]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 106\">[106]<\/button><\/p>\n", "toc": [{"id": "cycle-how-ai-changes-the-research-cycle", "text": "How AI changes the research cycle", "level": 1}, {"id": "cycle-question-and-theory", "text": "Question and theory", "level": 2}, {"id": "cycle-literature", "text": "Literature", "level": 2}, {"id": "cycle-design", "text": "Design", "level": 2}, {"id": "cycle-data-and-sources", "text": "Data and sources", "level": 2}, {"id": "cycle-analysis-and-interpretation", "text": "Analysis and interpretation", "level": 2}, {"id": "cycle-writing-and-review", "text": "Writing and review", "level": 2}, {"id": "cycle-what-changes-across-the-whole-cycle", "text": "What changes across the whole cycle", "level": 2}]}, "forms": {"title": "Forms of research", "html": "<h1 id=\"forms-the-form-of-the-research-changes-what-ai-can-do\">The form of the research changes what AI can do<\/h1>\n<p>FEB researchers study different questions with different kinds of evidence. In one project, the central task is to estimate an effect from firm records; in another, it is to understand how employees experience a change in their work; in a third, it is to develop a model or bring several literatures into a new relationship. We group these projects as Quantitative, Qualitative, and Theory/Review because these forms place different demands on an AI-generated output. Many papers combine them. An interview study may count coded responses, and a theoretical paper may use simulations. The grouping helps us ask which part of a study has become cheaper and which part determines whether its claim holds. Statistical meta-analysis belongs with Quantitative research because its central result is an estimate calculated from comparable effects in earlier studies. <button class=\"citation\" data-source=\"S07-32\" aria-label=\"Source 65\">[65]<\/button><button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 40\">[40]<\/button><\/p>\n<p>Across the three forms, AI can now do more than tidy a manuscript. It can turn records into variables, run code, conduct adaptive interviews, propose codes and themes, answer questions across many papers, draft a review, suggest an explanatory mechanism and solve some stated mathematical proofs. The evaluations document successful automation of defined tasks. Their outcomes differ, however: agreement with a codebook, successful execution, expert preference for a written answer and a verified proof measure different aspects of research quality. We therefore consider the form of the claim before asking how much of the work can be delegated.<\/p>\n<h2 id=\"forms-quantitative-research\">Quantitative research<\/h2>\n<h3 id=\"forms-more-records-can-become-usable-data\">More records can become usable data<\/h3>\n<p>Many FEB quantitative projects begin with records that were collected for purposes other than research. Annual reports have different layouts, news coverage is uneven, and documents in several languages may describe the same transaction or organizational feature in different words. Researchers can ask AI to extract specified fields, link text to entities and produce a processing script. Levich and Knust examine ownership-information extraction from multilingual corporate reports and show both what an extraction system can do and where reporting differences create missed information. <button class=\"citation\" data-source=\"S07-08\" aria-label=\"Source 21\">[21]<\/button> These tasks make a larger panel or a new comparison feasible when manual reading would have been the binding cost.<\/p>\n<p>The gain may change the research question. A researcher studying corporate disclosure could include smaller firms, earlier years or several countries; an operations researcher might connect regulatory documents to transaction records that previously sat in separate formats. Yet the resulting data can be precise for the wrong population. A tool may extract fields accurately from available English reports while missing firms whose reporting follows another convention. It may also assign the same label to different practices across countries. The team therefore needs to know which records entered the sample, which could not be processed and whether the new variable means the same thing in each group. More observations reduce sampling uncertainty only after those measurement and coverage decisions have been defended. <button class=\"citation\" data-source=\"S07-08\" aria-label=\"Source 21\">[21]<\/button><button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 31\">[31]<\/button><\/p>\n<p>Access remains part of that decision. Public SEC APIs provide a lawful route to filings under their access conditions, while restricted administrative microdata require project authorization, named users and an approved environment. <button class=\"citation\" data-source=\"S06-023\" aria-label=\"Source 20\">[20]<\/button><button class=\"citation\" data-source=\"S06-021\" aria-label=\"Source 23\">[23]<\/button> An AI agent can help collect and process data after those conditions have been met; it does not give an investigator a right to retrieve confidential records or move them into an external service. For FEB teams working with company data, survey panels or administrative partners, planning the AI workflow alongside the access agreement is a research-design issue. It determines what data can be compared and what another scholar could later reproduce.<\/p>\n<h3 id=\"forms-generated-variables-change-the-estimate\">Generated variables change the estimate<\/h3>\n<p>A further change occurs when text, images or speech become a measure used in an analysis. A finance scholar may rate earnings-call sentiment, a marketing scholar may classify product claims, and a labour economist may infer a job attribute from vacancies. The model output is then treated as a regressor, outcome or moderator, even though it is an estimate of the underlying concept. Christensen and Hansen show that error in an AI-generated covariate can bias the target coefficient and invalidate a conventional confidence interval; their proposed correction works under specified statistical assumptions. <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> Thus, a high classification score is not enough if the errors cluster in the firms or periods that carry the substantive comparison.<\/p>\n<p>Ludwig, Mullainathan and Rambachan distinguish two validation jobs that are easily conflated. A model used to <em>predict<\/em> an outcome should be assessed on cases protected from training leakage. A model used to <em>measure<\/em> a concept for later estimation needs comparison with a reference measurement procedure on a deliberately selected sample. Their working-paper examples show that changing a prompt or model can change a downstream estimate, sometimes its size, significance or direction. <button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 31\">[31]<\/button> If a researcher can try many prompts and then retain the one with the most attractive coefficient, the new flexibility becomes another route to specification search. Conversely, keeping a held-out human-labelled sample and recording the tried prompts can make that flexibility useful: the researcher can choose a prompt for measurement performance rather than for the result it happens to produce.<\/p>\n<p>Duan and Pelger provide a concrete finance case. They processed roughly 260,000 firm-news headlines into stock-month sentiment and obtained twelve different naive slopes, from 0.083 to 0.226, from plausible model–prompt combinations. They then used about 5,320 human-labelled stock-month observations and multiple generated measures to calibrate a sentiment covariate. Their corrected slope was 0.312, and its reported confidence interval was roughly half as long as the interval using only the labelled subsample. <button class=\"citation\" data-source=\"S14-301\" aria-label=\"Source 32\">[32]<\/button> Those numbers describe the tested stock-return specification; they do not establish a causal effect of sentiment or tell other researchers to use the same correction. They show how a relatively small verification sample can recover information from a much larger AI-processed collection when the calibration assumptions fit. For a FEB project, the reference concept, label sample, subgroup errors and estimation method need to be chosen before the attractive regression result becomes the criterion for success.<\/p>\n<h3 id=\"forms-experiments-and-surveys-still-need-people\">Experiments and surveys still need people<\/h3>\n<p>AI can make an experiment more interactive without replacing its participants. Becker and colleagues used customized agents as leaders, coworkers or subordinates in three studies with 789 human participants, including incentivized behaviour. <button class=\"citation\" data-source=\"S07-09\" aria-label=\"Source 115\">[115]<\/button> Compared with a fixed script, an agent can respond to what a participant says while preserving a designed role. The researcher still has to establish what treatment was delivered, whether the model acted consistently enough across conditions and whether the measured behaviour answers the original question. A prompt written once is not necessarily a stable treatment when the underlying model or deployment changes.<\/p>\n<p>Adaptive surveys create a similar opportunity and a new measurement problem. In a randomized online experiment with 2,243 respondents, Austin and colleagues found that an AI interview elicited more specific reasons than fixed survey questions, with extra time but little detected increase in dropout. Some respondents gave more polarized answers to a later closed question after they had explained an earlier position. <button class=\"citation\" data-source=\"S14-305\" aria-label=\"Source 98\">[98]<\/button> A marketing or behavioural-economics researcher could use such an interview to learn how consumers explain a choice. If the aim is to estimate an attitude as it stood before the interaction, however, the interview can change the answer being measured. The comparison is with fixed questions in a US online panel, rather than with an expert human interviewer or every survey setting.<\/p>\n<p>Simulated respondents offer a cheaper way to pilot questions, but they pose a stronger inferential claim when used in place of people. Argyle and colleagues report resemblance for selected political-survey subgroups, whereas Bisbee and colleagues find that plausible averages can coexist with too little individual variation, unstable coefficients and sensitivity to the prompt and period. <button class=\"citation\" data-source=\"S07-11\" aria-label=\"Source 16\">[16]<\/button><button class=\"citation\" data-source=\"S07-12\" aria-label=\"Source 111\">[111]<\/button> In two US panel datasets, Krsteski and colleagues reduce bias in population estimates by correcting synthetic responses with a small set of real human responses; they distinguish that result from the harder task of predicting what a particular person would answer. <button class=\"citation\" data-source=\"S14-302\" aria-label=\"Source 116\">[116]<\/button> A FEB team can therefore use synthetic respondents to inspect questionnaire wording or explore possible response patterns. Estimating how real consumers, employees or managers behave requires validation for that population and outcome, and even the constructive correction study retains human observations.<\/p>\n<h3 id=\"forms-agents-can-execute-an-analysis-without-deciding-its-meaning\">Agents can execute an analysis without deciding its meaning<\/h3>\n<p>Coding and computational replication show how far task automation has moved. Aygün and colleagues’ ERA system searches for software that improves a defined score across Kaggle and domain tasks, including forecasting and numerical integration. <button class=\"citation\" data-source=\"S07-06\" aria-label=\"Source 73\">[73]<\/button> That is useful when an implementation can be scored, such as a data-linkage routine or estimator. The score does not tell a researcher whether the variable captures governance, whether a treatment was as-if randomly assigned or whether the estimated contrast is a meaningful welfare comparison.<\/p>\n<p>Brodeur and colleagues tested a different task in seven-hour reproduction games with 288 researchers in 103 teams. Human-only teams reproduced 31 of 33 assigned results, assisted teams 32 of 35 and AI-led teams 13 of 35. Human-only teams also found more major coding errors. <button class=\"citation\" data-source=\"S07-01\" aria-label=\"Source 27\">[27]<\/button> More recent agents do well on selected executable tasks. Alizadeh and colleagues report that, in their distinct setups, Claude Code reproduced 93.4% and Codex 62.1% of 221 tasks from 54 papers with supplied materials; the two agents received different repair guidance. <button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 25\">[25]<\/button> Kohler and colleagues gave agents methods descriptions and data but withheld author code and target results across 48 reproducible economics and political-science papers; their best system recovered the sign of 91.1% of coefficients <strong>it produced<\/strong>, excluding missing coefficients from that denominator. <button class=\"citation\" data-source=\"S14-304\" aria-label=\"Source 99\">[99]<\/button> These percentages are not a single leaderboard. They show that agents can complete a substantial share of selected executable tasks. Their different task selection, assistance and success criteria prevent a direct comparison of performance across the studies.<\/p>\n<p>The same studies clarify what a team should check after an agent reproduces a table. Reproduction means that code can recover a result from particular inputs. Robustness tests ask whether reasonable alternative processing or specifications change it. Measurement asks whether the variables represent the intended concepts, and identification asks whether the contrast supports the causal or descriptive claim. An AI system may succeed at execution while giving a weak answer to the last two questions. Alizadeh and colleagues also show that a prompt rewarding agreement with the published result made agents more willing to supply an answer when data were missing in a small adversarial set. <button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 25\">[25]<\/button> If computation becomes cheap, a FEB team can run more checks, but it should preserve the principal estimand and a record of post-result exploration so that abundant alternative specifications do not become a disguised selection exercise.<\/p>\n<p>Statistical meta-analysis makes this separation especially clear. Researchers can ask AI to search, screen and extract numerical estimates, but the pooled result depends on which studies are eligible, which outcomes and comparators match, how dependent estimates are handled and whether publication bias is plausible. In six ongoing clinical reviews, Gartlehner and colleagues found that AI-initial extraction followed by human checking reached 91.0% accuracy across 9,341 data elements, compared with 89.0% for human-only extraction, and saved a median 41 minutes per study; one review took longer. <button class=\"citation\" data-source=\"S14-306\" aria-label=\"Source 117\">[117]<\/button> MetaSyn’s later benchmark, built from 422 Nature Portfolio meta-analyses with 86 held-out instances, found 91.7% of reference articles in a top-200 candidate pool but only 48.4–51.2% listed in tested systems’ final reports. It did not test pooled effect-size calculation end to end. <button class=\"citation\" data-source=\"S14-303\" aria-label=\"Source 118\">[118]<\/button> Clinical and medical-heavy settings limit direct transfer, yet economics and business meta-analyses also depend on selecting the appropriate evidence from the studies found.<\/p>\n<p>For FEB quantitative work, the researcher’s opportunity is to spend less time on repeated extraction and code while being able to ask questions that require a larger or differently structured dataset. The corresponding risk is that a convincing coefficient arrives before its measurement, sample and identification have been checked. The evidence supports neither a general claim that agents make quantitative studies better nor the view that they add only cosmetic speed. It points to specific places where a team can gain: expanding permitted records, calibrating model-derived variables, varying interactive treatments with real participants, and reproducing code. Whether those gains improve a paper depends on how the saved effort is used.<\/p>\n<h2 id=\"forms-qualitative-research\">Qualitative research<\/h2>\n<h3 id=\"forms-an-interview-is-more-than-an-answer-to-a-question\">An interview is more than an answer to a question<\/h3>\n<p>Qualitative studies may examine how managers interpret a restructuring, how consumers explain a financial choice or how work changes when employees must use an algorithm. Such projects need accounts from particular people in particular settings. They often use interviews, but also observations, documents, group discussion and repeated contact. AI can help the researcher prepare and examine these materials, and it can now conduct an adaptive interview itself. The value of that capability depends on what the interview is meant to reveal: a participant’s stated reason, a practice unfolding over time or an interpretation developed with people in the field. <button class=\"citation\" data-source=\"S07-15\" aria-label=\"Source 36\">[36]<\/button><button class=\"citation\" data-source=\"S06-024\" aria-label=\"Source 35\">[35]<\/button><\/p>\n<p>Chopra and Haaland’s economics working paper makes the collection opportunity concrete. They report 766 AI-led online interviews with US adults about stock-market non-participation and tariffs. The system asked open questions, responded to answers and probed. The resulting interviews yielded roughly five times as many distinct commonly occurring themes as one fixed open question in their benchmark surveys; several fixed questions or an AI exchange without dynamic probes closed at most half of that gap. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> Dynamic probing, rather than the ability to produce a transcript, did much of the work. It could help a FEB researcher explore the reasons consumers give for financial choices or why a group did not take up a policy. It does not show that an AI interviewer obtains deeper evidence than an experienced human interviewing those same people. The comparison with human-interview saturation used earlier studies rather than a simultaneously randomized human-interviewer arm.<\/p>\n<p>A small direct comparison exposes what transcript length misses. Wuttke and colleagues randomized students to six human-led and five GPT-4 Turbo-led interviews on democracy using the same guide. Human coders rated answer quality similarly and AI answers were longer, but the AI failed to follow up surprising or unclear replies more often, while human interviewers more often missed active-listening instructions. Participants found the AI conversation less interesting and were less inclined to repeat it, even though overall satisfaction looked similar; voice-system failures changed how several people responded. <button class=\"citation\" data-source=\"S14-402\" aria-label=\"Source 37\">[37]<\/button> These eleven interviews cannot determine which interviewer would be better in a management field study. They do identify two distinct qualities of an interview: following the participant’s unexpected meaning, and keeping the exchange sufficiently comfortable that the participant will continue to speak.<\/p>\n<p>The larger survey experiments reinforce the importance of the comparator. Austin and colleagues’ 2,243-respondent experiment found richer reason-giving than fixed questions. Barari and colleagues’ 1,803 completed AI-chat surveys found that some probing variants also elicited more detail, while a first elaboration or relevance probe increased immediate attrition by about two to three percentage points and completers gave slightly worse experience ratings. <button class=\"citation\" data-source=\"S14-305\" aria-label=\"Source 98\">[98]<\/button><button class=\"citation\" data-source=\"S06-026\" aria-label=\"Source 84\">[84]<\/button> These are comparisons within survey formats, not demonstrations of equivalence to skilled field interviewers. Jack, Cooper and Flower provide a different experience in interviews with 74 social scientists: respondents valued the convenience of a chatbot, yet the researchers judged many exchanges too short or shallow for their inquiry, with irrelevant or missed probes. Their subsequent model-assisted typology also included an unsupported age-related claim, which the team checked against quotations. <button class=\"citation\" data-source=\"S06-025\" aria-label=\"Source 82\">[82]<\/button> A method that elicits more words can therefore still miss the answer the researcher needed.<\/p>\n<h3 id=\"forms-people-decide-whether-and-how-to-take-part\">People decide whether and how to take part<\/h3>\n<p>Participant willingness is a substantive part of the research design, and the existing evidence argues against assuming that people generally reject AI interviewers. In Chopra and Haaland’s separate randomized-description study, 500 US Prolific adults considered invitations to a 40-minute survey, text-based AI interview and text-based human interview. Stated interest was 89% for a survey and 90% for an AI interview when each was described first. Among respondents who had already completed an AI interview on stock-market participation, 53% preferred AI for a future interview, 21% preferred a human and 26% were neutral. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> These are hypothetical invitations and ratings from completers, rather than actual take-up across workplaces. Wuttke’s eleven-person trial found equal overall satisfaction but lower willingness to repeat the AI interview, while Jack’s follow-up participants described positive, mixed and negative experiences. <button class=\"citation\" data-source=\"S14-402\" aria-label=\"Source 37\">[37]<\/button><button class=\"citation\" data-source=\"S06-025\" aria-label=\"Source 82\">[82]<\/button> Thus, an AI route may attract some respondents and lose others even when its average satisfaction score looks acceptable.<\/p>\n<p>That selection also changes what the transcript can show. Chopra and Haaland recruited online respondents for two economic topics, not employees during a conflict or managers negotiating confidential decisions. In two Hungarian telephone-attitude surveys, privacy concern and preference for human interaction were associated with lower <strong>stated<\/strong> willingness to answer a virtual interviewer, while curiosity and perceived lack of judgment were associated with higher willingness; overlapping question wording and the hypothetical outcome limit what the association can show. <button class=\"citation\" data-source=\"S14-411\" aria-label=\"Source 100\">[100]<\/button> A field researcher must establish who was invited, who declined and what people understood about recording, AI mediation and access to their words. In a proposed FEB project about restructuring, readily recruited online workers could reveal common descriptions of change; they would not stand for the affected workplace unless sampling and context supported that connection. <button class=\"citation\" data-source=\"S06-024\" aria-label=\"Source 35\">[35]<\/button><\/p>\n<p>Privacy controls can also affect the evidence after someone agrees to speak. In a 188-person all-chatbot preprint experiment on AI in job interviews, Li and colleagues found that AI-aided post-interview editing left fewer personally identifiable details in retained transcripts than unguided or no editing. The study did not compare disclosure with a human interviewer or show that every removed detail had been regretted. <button class=\"citation\" data-source=\"S14-412\" aria-label=\"Source 104\">[104]<\/button> It does show that participants’ control over the record is a design choice, rather than something guaranteed by consent at the start. For a study involving employees or identifiable managers, the team would need to explain who sees raw exchanges and give respondents workable ways to skip, stop or correct sensitive passages.<\/p>\n<p>Human interviewers are fallible too. They may miss probes, lead an answer or impose their categories, as Wuttke’s comparison also shows. <button class=\"citation\" data-source=\"S14-402\" aria-label=\"Source 37\">[37]<\/button> An AI interview could be valuable where a researcher needs a consistent exploratory guide across many respondents, provided the team checks probe relevance, participant experience, language and mode. The useful comparison is with the human or fixed-question procedure the project would otherwise use, and it should include recruitment and consent as outcomes as well as transcript content. In another project, preserving a relationship with participants may be central to understanding the phenomenon, so a human interviewer assisted by a tool is a different intervention from replacing that interviewer.<\/p>\n<h3 id=\"forms-text-preparation-and-coding-do-not-settle-interpretation\">Text preparation and coding do not settle interpretation<\/h3>\n<p>Once material has been collected, automatic transcription and indexing can release substantial time. Wollin-Giering and colleagues compared nine transcription systems with manual work on one English and one German interview. Automatic services saved time in their setting after correction, but errors and data-processing conditions varied, and researchers still had to listen back. <button class=\"citation\" data-source=\"S14-404\" aria-label=\"Source 33\">[33]<\/button> The required accuracy depends on the question. A word omitted from a factual interview about procurement can change a company name or a negation. In a study of organizational talk, pauses, overlap, laughter or a switch in language may themselves be evidence; a smooth summary can erase them. A FEB team could use AI to find passages about a disputed change and then return to the audio and adjacent turns before making a claim about what was said.<\/p>\n<p>Fixed-codebook coding is a narrower and more automatable job. Xiao and colleagues gave GPT-3 expert definitions for categories of 668 children’s questions. It reached Cohen’s κ of .61 for question complexity and .38 for syntactic structure against experts, below expert–expert agreement of .88 and .90. <button class=\"citation\" data-source=\"S07-02\" aria-label=\"Source 85\">[85]<\/button> Hill and colleagues later tested newer systems against two blinded coders on one healthcare focus-group transcript using an adjudicated ten-code book. Mean model and human agreement were 93.5% and 92.7%, with κ=.34 in both groups because many codes were rare; all tested models met that study’s non-inferiority criterion for <em>deductive<\/em> coding, while only one did so for its inductive-theme task. <button class=\"citation\" data-source=\"S14-405\" aria-label=\"Source 34\">[34]<\/button> These results show both progress and dependence on category, prevalence, text and scoring rule. A team coding a large collection of customer complaints or regulatory responses could use an audited AI first pass. Agreement with the chosen labels cannot tell it whether the labels describe the important process in the first place.<\/p>\n<p>Inductive analysis puts that choice at the centre. Researchers revise categories when a participant uses an unexpected distinction, compare accounts across settings and decide whether a theme helps explain the phenomenon. Parfenova and colleagues find that models can produce plausible open-code labels on straightforward sentences, whereas human coders receive stronger ratings on more complex material; their expert evaluators also disagree with one another at times. <button class=\"citation\" data-source=\"S14-408\" aria-label=\"Source 119\">[119]<\/button> A comparison on short labels is useful, but it does not measure whether the final paper offers a grounded account of how an organization works. The relevant advantage of AI may be that it proposes an alternative classification the researcher had not considered, which can then be tested against the full material rather than adopted as a finding.<\/p>\n<p>The tests of fuller analyses show why this check is necessary. Mehta and colleagues report that GPT-4o found relevant subthemes in focus groups with young women in rural Kenya, yet some proposed quotations were weak, altered or fabricated. <button class=\"citation\" data-source=\"S14-406\" aria-label=\"Source 90\">[90]<\/button> In 33 cancer-patient interviews, Levit and Saban find that model analyses draw out logistical and informational patterns while the investigator’s analysis attends more to identity disruption and emotional ambiguity; the team verified quotations and revised prompts. <button class=\"citation\" data-source=\"S14-407\" aria-label=\"Source 101\">[101]<\/button> An AI Co-Ethnographer pipeline produced codes and 151 findings from six interviews, but experts rated 66.0% of its code-to-text assignments relevant, compared with 77.3% for human assignments, and few codes yielded a high-quality finding under the authors’ rubric. <button class=\"citation\" data-source=\"S14-410\" aria-label=\"Source 105\">[105]<\/button> A complete-looking analysis can therefore be useful as a set of candidates while still losing the connection between claim and passage or missing what participants were trying to convey.<\/p>\n<p>Qualitative traditions set different tests for a good interpretation. Reflexive thematic analysis treats the researcher’s familiarization, positioning and revision of themes as part of the method; Jowsey, Braun and Clarke argue against delegating that practice to generative AI. Wise and colleagues instead argue that a carefully directed system may draw attention to neglected material. <button class=\"citation\" data-source=\"S07-15\" aria-label=\"Source 36\">[36]<\/button><button class=\"citation\" data-source=\"S07-17\" aria-label=\"Source 89\">[89]<\/button><button class=\"citation\" data-source=\"S07-18\" aria-label=\"Source 86\">[86]<\/button> These are methodological positions, rather than controlled comparisons of finished FEB studies. A team should therefore say whether AI applied a predefined code, suggested a rival reading, retrieved a negative case or drafted a passage. When an assistant proposes a theme, the investigator can ask which interviews resist it, inspect the original sequence around each quote and compare interview evidence with observations or documents. Three model summaries of one transcript are still one source of evidence.<\/p>\n<p>Fieldwork makes the boundary especially visible. An agent can align dated notes with meeting documents and flag a disagreement between a manager’s account and an employee’s. It cannot recover an unrecorded silence, the circumstances under which a participant trusted the researcher or the practice that unfolded outside the interview merely by reading transcripts. The Co-Ethnographer study evaluated recorded interview text, not participation in a field setting. <button class=\"citation\" data-source=\"S14-410\" aria-label=\"Source 105\">[105]<\/button> In an operations case study with observation and documents, or a marketing focus group whose meaning depends on group turns, the assistant’s ability to process more text is valuable only if the researcher retains the route back to events, speakers and the conditions under which they were observed. <button class=\"citation\" data-source=\"S11-004\" aria-label=\"Source 120\">[120]<\/button><button class=\"citation\" data-source=\"S11-008\" aria-label=\"Source 121\">[121]<\/button><\/p>\n<p>For FEB qualitative research, AI may allow researchers to hear from more people, prepare recordings faster and inspect alternative readings of a large corpus. It can also change who will speak, what they say and what is later treated as a finding. A good use therefore depends on the kind of claim: audit coverage and probe quality when collecting interviews; compare errors on rare and difficult categories when applying a codebook; and require a trace from interpretation to original material, negative cases and field context when explaining a practice. These are different checks because the form includes relationships with participants as well as work on text.<\/p>\n<h2 id=\"forms-theory-and-review-research\">Theory and review research<\/h2>\n<h3 id=\"forms-reviews-can-be-drafted-quickly-but-their-claims-differ\">Reviews can be drafted quickly, but their claims differ<\/h3>\n<p>Theory and review share a reliance on prior knowledge, but they ask an AI system to do different work. A structured review must justify its search, selection and synthesis; an integrative review must explain what can be learned by reading several streams together. A conceptual theory paper may use selected literature to develop an argument, while a formal model starts from explicit assumptions and derives implications. <button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 40\">[40]<\/button><button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 92\">[92]<\/button><button class=\"citation\" data-source=\"S13
