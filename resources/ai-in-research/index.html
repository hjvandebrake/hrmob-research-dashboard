gue can inspect and rerun each transformation. Such a record also helps authors meet journal rules on documented data and code, such as those of the American Economic Association {{S06-009}}.", "source_ids": ["S06-009"], "evidence": "reasoned"}, {"id": "quantitative-data-4", "kind": "risk", "label": "Wrong links and extraction errors", "text": "A wrong match between records, or an error repeated across many extracted values, can pass unnoticed into a plausible-looking variable, and Christensen and Hansen show that ignoring errors in generated variables can bias estimates and invalidate inference {{S07-07}}.", "source_ids": ["S07-07"], "evidence": "direct"}, {"id": "quantitative-data-5", "kind": "risk", "label": "Generated measures that miss the construct", "text": "Changing the model or the prompt can change estimates based on model-produced measures in sign, size, or significance {{S08-013}}, and company documents differ in language and reporting standards {{S07-08}}, so even an accurate extraction may measure something other than the construct the study needs.", "source_ids": ["S08-013", "S07-08"], "evidence": "direct"}, {"id": "quantitative-data-6", "kind": "risk", "label": "Data processed outside its terms", "text": "A researcher who is allowed to use a dataset is not thereby allowed to send it to any AI tool. RUG guidance limits external AI tools to public information {{S03-004}}, and CBS microdata can be analysed only inside a controlled environment {{S06-021}}.", "source_ids": ["S03-004", "S06-021"], "evidence": "reasoned"}, {"id": "quantitative-data-7", "kind": "risk", "label": "Less familiarity with the raw data", "text": "Messeri and Crockett argue that automating entry-level research work may remove routes to tacit judgement, although they concede that some of that work may prove unnecessary {{S13-303}}. A researcher who never prepares the data may not learn why a measure changed or where records are thin, and may miss such problems in the analysis.", "source_ids": ["S13-303"], "evidence": "reasoned"}], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-009": "AEA Data and Code Policies and Guidance page, lines 6–24 on documented data and code", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S06-023": "SEC EDGAR API overview, submissions, XBRL, and Programmatic API Access", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S07-08": "Levich and Knust, accounting annual-report ownership extraction, publisher abstract and methods summary", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-303": "Messeri and Crockett, Nature comment, original PDF printed pp. 675–676"}}, "quantitative-analysis": {"task_scope": "AI produces the main estimation or synthesis code, robustness analyses and proposed interpretation; the researcher checks execution, errors and what the result can establish.", "impacts": [{"id": "quantitative-analysis-1", "kind": "opportunity", "label": "Robustness checks that were too costly", "text": "An AI system helped scientists write expert-level empirical software for tasks whose results could be scored {{S06-018}}, and researchers may use such help to run additional estimators and robustness checks that would otherwise take too long. Such checks improve a study when they address a real weakness in the inference.", "source_ids": ["S06-018"], "evidence": "adjacent"}, {"id": "quantitative-analysis-2", "kind": "opportunity", "label": "Quick checks that results reproduce", "text": "In a 2026 preprint, the strongest coding agent tested reproduced most selected social-science results from complete replication packages {{S08-010}}. A researcher can use such an agent to check before submission that a package runs from start to finish, and a supervisor or coauthor can rerun it without rebuilding the analysis.", "source_ids": ["S08-010"], "evidence": "direct"}, {"id": "quantitative-analysis-3", "kind": "opportunity", "label": "Explanations that help learn a method", "text": "A purpose-built AI tutor improved immediate learning in a university physics course {{S09-005}}, and a tutor designed with teachers largely avoided the learning loss that open-ended help caused in school mathematics {{S09-004}}. A researcher who asks AI to explain each step of the generated code may learn a new method faster.", "source_ids": ["S09-005", "S09-004"], "evidence": "adjacent"}, {"id": "quantitative-analysis-4", "kind": "risk", "label": "Coding errors behind plausible tables", "text": "In a randomised reproduction exercise with social-science researchers, teams with AI assistance reproduced results about as often as human-only teams but found fewer major coding errors {{S08-009}}, so a table that looks right may still rest on a mistake in the code.", "source_ids": ["S08-009"], "evidence": "direct"}, {"id": "quantitative-analysis-5", "kind": "risk", "label": "Results claimed beyond what they show", "text": "When coding agents in a 2026 preprint were nudged towards the published result, they recognised less often that a task with missing material could not be reproduced {{S08-010}}. A researcher who asks AI for many specifications and an interpretation may also report the most persuasive result without saying which analyses were planned or what the design can establish.", "source_ids": ["S08-010"], "evidence": "direct"}, {"id": "quantitative-analysis-6", "kind": "risk", "label": "Less practice in finding errors", "text": "Programmers who used AI while learning an unfamiliar library scored lower on a later test of debugging and concepts {{S09-003}}, and open-ended help in school mathematics improved practice but lowered later unaided performance {{S09-004}}. A researcher who lets AI write and fix the code may also get less practice in diagnosing errors.", "source_ids": ["S09-003", "S09-004"], "evidence": "adjacent"}, {"id": "quantitative-analysis-7", "kind": "risk", "label": "More output to review", "text": "In a randomised reproduction exercise in the social sciences, AI assistance did not significantly shorten the time teams needed to reproduce results {{S08-009}}. Every extra script and specification that AI produces still has to be checked, by the researcher or by the colleagues who supervise and coauthor the work.", "source_ids": ["S08-009"], "evidence": "reasoned"}], "source_locators": {"S06-018": "Aygün et al., local PDF pp. 2–10, Results and Discussion; Nature version", "S08-009": "Brodeur et al., PNAS p. 5 Table 1 and Results section 2.2 on reproduction and errors; PDF pp. 5–6 and Tables 1–2 on time to reproduction", "S08-010": "Alizadeh et al., preprint HTML sections 2.1, 2.4, 5.1–5.3 and Figures 1 and 5", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-004": "Bastani et al., local author-version PDF pp. 1–5, 9–11 and Table 1; discussion pp. 19–20", "S09-005": "Kestin et al., Scientific Reports, Methods (design and participants), Results and Discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "quantitative-writing": {"task_scope": "AI drafts substantial manuscript sections or reviewer responses from the project's evidence and outline; the researchers assess the argument and final claims.", "impacts": [{"id": "quantitative-writing-1", "kind": "opportunity", "label": "First drafts written sooner", "text": "In a short professional-writing experiment, participants who used AI finished in about 40 percent less time and their texts were rated higher {{S05-007}}, so authors who start from their own outline and result tables may reach a draft of a methods or results section sooner.", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "quantitative-writing-2", "kind": "opportunity", "label": "Reviewer comments tracked one by one", "text": "AI can set out each reviewer comment beside the passage and analysis it concerns and draft a reply to each, so that authors are less likely to leave a criticism unanswered in a long revision.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-3", "kind": "opportunity", "label": "Clearer English for second-language authors", "text": "Authors who write in a second language may find it easier to explain a design or answer a reviewer in clear English when AI drafts from their own outline.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-4", "kind": "risk", "label": "Overstated claims and faulty citations", "text": "In a consulting experiment, AI help made answers more persuasive even when they were wrong {{S05-009}}, and an audit of biomedical papers found fabricated references, although it could not show that AI produced them {{S06-019}}. An author who works from a fluent draft may not notice that a qualified estimate has become a causal claim, or that a paper is cited for something it does not show.", "source_ids": ["S05-009", "S06-019"], "evidence": "adjacent"}, {"id": "quantitative-writing-5", "kind": "risk", "label": "Drafts that steer the argument", "text": "Deliberately biased AI writing suggestions shifted the views that people expressed on societal issues {{S13-001}}, and agreeable AI responses about interpersonal conflicts made people more convinced that they were right {{S13-002}}. In research writing, an AI-drafted reply to reviewers may sound responsive while leaving the main objection unanswered, and the author may come to accept the draft’s framing of the contribution.", "source_ids": ["S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "quantitative-writing-6", "kind": "risk", "label": "Less practice in building the argument", "text": "Researchers often find out what they can claim while they explain a result in writing, so authors who let AI draft substantial sections get less of that practice and may find it harder to defend the argument as their own.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-7", "kind": "risk", "label": "More text for coauthors and reviewers", "text": "At Organization Science, submissions rose by 42 percent between the editors’ comparison periods, and manuscripts with higher AI-detector scores were less readable and fared worse editorially, although the editors could not show that AI caused these differences {{S06-020}}. When drafting becomes easier, coauthors, supervisors, and reviewers receive more text whose claims they have to check.", "source_ids": ["S06-020"], "evidence": "adjacent"}], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S05-009": "Dell’Acqua et al., published original PDF pp. 2, 7–9, 11–13 and Tables 4, 7, 9: inside/outside frontier and persuasive wrong answers", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81 methods and limitations; erratum exists", "S06-020": "Gartenberg et al., Organization Science original PDF pp. 2, 5–10 (printed pp. 1, 4–9), Figure 1, Table 1", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 limitations and methods", "S13-002": "Cheng et al., PDF pp. 5 and 7–8 (article pp. 4 and 6–7)"}}, "qualitative-question": {"task_scope": "AI proposes questions, concepts and possible explanations for the project's setting; the researcher judges their relevance and fit with inquiry in that setting.", "impacts": [{"id": "qualitative-question-1", "kind": "opportunity", "label": "Rival explanations brought into view", "text": "AI can suggest explanations and concepts that the researcher had not considered, including ideas from neighbouring fields, and these may lead the researcher to ask participants about a practice that the first interviews missed. In a field experiment on product innovation, AI helped professionals more with generating ideas than with choosing the best one. {{S13-103}}", "source_ids": ["S13-103"], "evidence": "adjacent"}, {"id": "qualitative-question-2", "kind": "opportunity", "label": "Faster orientation in a new setting", "text": "A researcher who enters an unfamiliar industry or discipline can ask AI to explain its vocabulary and debates and so arrive at the first conversations in the field better prepared. Korinek counts background research and ideation among the uses of AI in economic research. {{S06-001}}", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "qualitative-question-3", "kind": "risk", "label": "Questions that do not fit the setting", "text": "A question can sound promising in general and still ask about things that participants cannot discuss or that the researcher’s access does not reach. Qualitative researchers need to fit the question to the state of prior work and to the evidence they can gather {{S06-004}}, and what they can gather depends on access that develops through relationships in the field. {{S06-024}}", "source_ids": ["S06-004", "S06-024"], "evidence": "reasoned"}, {"id": "qualitative-question-4", "kind": "risk", "label": "Narrower and more familiar questions", "text": "Suggestions that draw on common framings may steer researchers towards questions that many others already ask. Messeri and Crockett argue that questions which need attention to subjectivity and nuance risk being sidelined when researchers rely on AI {{S06-014}}, and in an experiment with 293 writers, stories written with AI ideas were rated more creative but resembled one another more. {{S05-016}}", "source_ids": ["S06-014", "S05-016"], "evidence": "adjacent"}, {"id": "qualitative-question-5", "kind": "risk", "label": "Less practice in forming a question", "text": "Choosing a question and explaining why it fits the setting is part of learning qualitative research, and a researcher who adopts an AI suggestion may find that explanation harder to give. Doctoral candidates develop their research plan with a supervisor {{S09-012}}, and FEB’s career track for new assistant professors assesses the originality of their research. {{S01-002}}", "source_ids": ["S09-012", "S01-002"], "evidence": "reasoned"}, {"id": "qualitative-question-6", "kind": "risk", "label": "Early field notes shared with tools", "text": "To get suggestions that fit the setting, researchers may give a tool early field notes or details of a partner organisation that their access agreement protects. RUG’s AI Office limits external AI tools to public information and sets conditions for personal data in its contracted tool. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S13-103": "Dell’Acqua et al., published PDF pp. 2–4, 12–18 and 20–22, stage decomposition showing larger AI gains in idea generation than in selection", "S06-001": "Korinek, published PDF pp. 1281–84, use cases including background research and ideation", "S06-004": "Edmondson and McManus, original PDF pp. 1155–56 and Table 1 on methodological fit", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S06-014": "Messeri and Crockett 2024, Nature printed p. 54 on monocultures of knowing and questions that need attention to subjectivity; Box 1 p. 50", "S05-016": "Doshi and Hauser, PMC full text Results and Discussion, 293-writer short-story experiment", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S01-002": "FEB Career Tracks 2025, PDF cover p. 1 and pp. 15–16, Research Profile promotion criteria for new hires from 1 January 2026", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), general FAQ on external tools and research FAQ on personal data, page last modified 9 September 2026"}}, "qualitative-literature": {"task_scope": "AI searches, screens, summarises and compares relevant studies; the researcher assesses coverage, theoretical differences and pivotal originals.", "impacts": [{"id": "qualitative-literature-1", "kind": "opportunity", "label": "Wider search across terms and fields", "text": "AI search can bring up qualitative studies that describe a similar process in other words or in a neighbouring discipline. In a test on five systematic reviews, an AI screening model identified some studies that human reviewers had missed, although it also flagged many irrelevant ones. {{S07-21}}", "source_ids": ["S07-21"], "evidence": "adjacent"}, {"id": "qualitative-literature-2", "kind": "opportunity", "label": "Less time screening and summarising", "text": "AI can screen titles and abstracts and summarise many studies in the time a researcher needs for a few. In one living systematic review, a tuned prompt found every study that was eventually included, and a simulation suggested that it could reduce the screening workload by 65 to 85 percent. {{S06-012}}", "source_ids": ["S06-012"], "evidence": "adjacent"}, {"id": "qualitative-literature-3", "kind": "opportunity", "label": "Studies compared side by side", "text": "AI can set out the settings, participants, and claims of many studies next to each other, which may show the researcher where a debate divides. A retrieval-based system gave better answers than a general model to questions that drew on several scientific papers. {{S08-020}}", "source_ids": ["S08-020"], "evidence": "adjacent"}, {"id": "qualitative-literature-4", "kind": "risk", "label": "Relevant studies missed or skewed", "text": "AI screening and recommendations can leave out relevant work, and qualitative studies published as books or in less-cited outlets may be among the first to drop out. GPT-4’s screening agreement looked weaker once chance and imbalance were adjusted for and varied across tasks {{S06-011}}, and GPT-4o’s citation suggestions favoured highly cited papers. {{S08-017}}", "source_ids": ["S06-011", "S08-017"], "evidence": "adjacent"}, {"id": "qualitative-literature-5", "kind": "risk", "label": "Findings compared out of context", "text": "A summary can set two interview findings side by side without the site, participants, or analytic approach that gave each its meaning, so that studies using the same term appear to agree. Braun and Clarke point out that analyses built on different theoretical assumptions make different kinds of claims about what people say. {{S07-15}}", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-literature-6", "kind": "risk", "label": "Sources newcomers cannot yet judge", "text": "Without retrieval, GPT-4o invented citations in 78 to 90 percent of tested questions about recent literature {{S08-020}}, and a researcher who is still learning a field may not be able to tell whether a recommended study exists, says what the summary claims, or appeared in a credible outlet. Messeri and Crockett argue that searching and reading studies oneself is how trainees build that sense of a field, while granting that some of this work may prove unnecessary. {{S13-303}}", "source_ids": ["S08-020", "S13-303"], "evidence": "direct"}, {"id": "qualitative-literature-7", "kind": "risk", "label": "Licensed articles in AI tools", "text": "Comparing studies closely often means giving a tool their full texts, but RUG’s AI Office states that subscription articles may not be uploaded to its contracted tool unless the publisher’s licence allows it, and it reports that no publisher had yet given that permission. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S07-21": "Tran et al., PubMed abstract Methods and Results, five reviews and 22,665 citations", "S06-012": "Homiar et al., PubMed abstract Methods and Results, sensitivity and simulated workload reduction in one living review", "S08-020": "Asai et al. (OpenScholar), Nature main text opening, Table 1 and Methods baseline-model section, including citation fabrication without retrieval", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S08-017": "Algaba et al., arXiv abstract, experiment and results on citation recommendation bias", "S07-15": "Braun and Clarke, printed pp. 94–95 on the mismatch between theoretical framework and analytic claims, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on literature work as training for early-career researchers", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), question on uploading PDFs of articles, page last modified 9 September 2026"}}, "qualitative-design": {"task_scope": "AI drafts a sampling approach, interview guide or observational plan; the researcher assesses fit with the setting, ethics and emerging question.", "impacts": [{"id": "qualitative-design-1", "kind": "opportunity", "label": "Options to compare before fieldwork", "text": "An AI draft gives the researcher several sampling choices and probes to compare before anyone is approached, and it may point to a group of participants or a line of questioning that the first plan left out.", "source_ids": [], "evidence": "reasoned"}, {"id": "qualitative-design-2", "kind": "opportunity", "label": "Quicker first drafts of guides and plans", "text": "Starting from a full draft of an interview guide, sampling plan, or information letter can save the researcher time. In a large test of an AI feature in Google Forms, users who adopted it spent about 27 percent less time editing their forms, although the test did not assess the quality of the questions. {{S05-012}}", "source_ids": ["S05-012"], "evidence": "adjacent"}, {"id": "qualitative-design-3", "kind": "risk", "label": "Leading or ill-fitting interview questions", "text": "An interview question that reads well on paper may lead participants towards an answer or miss how work in this setting actually happens, and the researcher may notice only after it has shaped several interviews. When a chatbot conducted adaptive interviews with social scientists, the researchers observed leading questions and missed probes. {{S06-025}}", "source_ids": ["S06-025"], "evidence": "adjacent"}, {"id": "qualitative-design-4", "kind": "risk", "label": "Plans that assume access and consent", "text": "A complete-looking plan can take for granted access to people and consent that have not yet been negotiated, including consent for any AI tool that will process participants’ words. Access in qualitative research develops through relationships with a site {{S06-024}}, and research use of personal data still requires a lawful basis and safeguards. {{S03-010}}", "source_ids": ["S06-024", "S03-010"], "evidence": "reasoned"}, {"id": "qualitative-design-5", "kind": "risk", "label": "Less practice in design judgement", "text": "Researchers learn how a qualitative method works in a setting by deciding whom to approach and how to ask, and someone who adopts an AI draft may not be able to explain those choices to a supervisor or committee. Doctoral candidates develop their research plan with a supervisor and collect, analyse, and interpret the data under supervision. {{S09-012}}", "source_ids": ["S09-012"], "evidence": "reasoned"}], "source_locators": {"S05-012": "Strand et al., primary PDF pp. 6–8, Google Forms experiment on editing time (local average treatment effect among feature users)", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S03-010": "GDPR Articles 6, 9(2)(j) and 89 on lawful basis and research safeguards", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}}, "qualitative-data": {"task_scope": "With access and consent addressed, AI transcribes and organises supplied interviews, observations or documents and can assist a specified collection procedure; the researcher checks the record and its context.", "impacts": [{"id": "qualitative-data-1", "kind": "opportunity", "label": "Less time transcribing and organising", "text": "Transcription takes a great deal of time {{S07-15}}, so AI that transcribes recordings and sorts interviews, field notes, and documents may leave the researcher more time for fieldwork and reading.", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-data-2", "kind": "opportunity", "label": "Fuller answers from AI follow-ups", "text": "When a study builds AI follow-up questions into a specified procedure, participants may give fuller answers, as a web-survey experiment with 1,800 participants found for AI probes on open questions. {{S06-026}} A chatbot has also conducted adaptive interviews with 74 social scientists whom researchers had recruited. {{S06-025}}", "source_ids": ["S06-026", "S06-025"], "evidence": "direct"}, {"id": "qualitative-data-3", "kind": "risk", "label": "Transcripts that change the meaning", "text": "An automatic transcript may drop words, confuse speakers, or punctuate an answer so that it says something else. Braun and Clarke note that punctuation alone can change what a passage means and that transcripts should always be checked against the recording. {{S07-15}}", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-data-4", "kind": "risk", "label": "AI interviewers change the conversation", "text": "When a tool asks the questions, it becomes part of the encounter that produces the evidence. Researchers who let a chatbot interview social scientists observed missed probes, leading questions, and interruptions {{S06-025}}, and the web-survey experiment found trade-offs in coding accuracy and in participants’ experience alongside the fuller answers. {{S06-026}}", "source_ids": ["S06-025", "S06-026"], "evidence": "direct"}, {"id": "qualitative-data-5", "kind": "risk", "label": "Confidential recordings in unsuitable tools", "text": "Interview recordings and transcripts often contain personal and sometimes special-category data, and the tools that researchers are permitted to use differ in what they may receive. RUG’s AI Office allows transcripts with ordinary personal data in its contracted chat tool only with certain functions switched off, excludes special-category content, and recommends transcription on RUG infrastructure for the most sensitive audio. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}, {"id": "qualitative-data-6", "kind": "risk", "label": "Less familiarity with the material", "text": "Transcribing is one way in which researchers come to know their material, and Braun and Clarke advise those who receive ready-made transcripts to spend more time familiarising themselves with the data. {{S07-15}} Messeri and Crockett note that some researchers consider their own reading and analysis of qualitative material necessary for understanding what participants experienced. {{S13-303}}", "source_ids": ["S07-15", "S13-303"], "evidence": "reasoned"}], "source_locators": {"S07-15": "Braun and Clarke, printed pp. 87–88, phase 1 familiarisation and transcription, read in the local original PDF", "S06-026": "Barari et al., journal abstract, PDF pp. 161–64, Results and Discussion", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), research questions on processing transcripts and transcribing audio files, page last modified 9 September 2026", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating interviews and the analysis of qualitative data"}}, "qualitative-analysis": {"task_scope": "AI applies a codebook where appropriate, compares passages and proposes themes or interpretations; the researcher judges these against the original material, context and stated qualitative approach.", "impacts": [{"id": "qualitative-analysis-1", "kind": "opportunity", "label": "Faster coding with a fixed codebook", "text": "Where a study uses a defined codebook, AI can apply codes and retrieve passages across more material than a team could code by hand. In one deductive coding task, GPT-3 reached fair to substantial agreement with expert codes (κ = .61 and .38), although the experts agreed with each other more closely (κ = .88 and .90). {{S07-02}}", "source_ids": ["S07-02"], "evidence": "direct"}, {"id": "qualitative-analysis-2", "kind": "opportunity", "label": "Rival readings and overlooked passages", "text": "AI can set passages side by side and suggest readings that the researcher had not considered, which may lead the researcher back to material that challenges an early interpretation. Wise and colleagues argue that prompts used within a human-led inquiry can sharpen what researchers notice and how they reflect on their own role. {{S07-18}}", "source_ids": ["S07-18"], "evidence": "reasoned"}, {"id": "qualitative-analysis-3", "kind": "risk", "label": "Themes that miss situated meaning", "text": "AI-proposed themes can capture what is said often and miss what a remark means in its setting, as one interview study found and as a commentary on management accounting research warns. {{S07-16}}{{S07-19}} A researcher who starts from such themes may also give too little weight to passages that contradict them, which Braun and Clarke treat as a sign of weak analysis. {{S07-15}}", "source_ids": ["S07-16", "S07-19", "S07-15"], "evidence": "direct"}, {"id": "qualitative-analysis-4", "kind": "risk", "label": "Less practice in interpretation", "text": "Researchers learn to interpret qualitative material by working through it and reviewing themes against the coded extracts and the whole data set {{S07-15}}, and a candidate who mainly checks AI themes may not develop that skill. Messeri and Crockett describe a disagreement among researchers about whether one’s own reading and analysis of such material is needed to understand participants’ experiences. {{S13-303}}", "source_ids": ["S07-15", "S13-303"], "evidence": "reasoned"}, {"id": "qualitative-analysis-5", "kind": "risk", "label": "Use beyond the approach or consent", "text": "Jowsey, Braun, Clarke, and colleagues reject generative AI for reflexive qualitative research on methodological and ethical grounds {{S07-17}}, whereas Wise and colleagues describe analysis with AI in the loop. {{S07-18}} A researcher whose stated approach or participants’ consent does not cover AI processing may face objections from reviewers or examiners and may go beyond what participants agreed to.", "source_ids": ["S07-17", "S07-18"], "evidence": "reasoned"}, {"id": "qualitative-analysis-6", "kind": "risk", "label": "More AI output to verify", "text": "Each AI-proposed code or theme has to be traced back to the passages behind it, and Braun and Clarke describe theme review as rereading the coded extracts and then the whole data set. {{S07-15}} Supervisors and co-authors who receive analyses built on AI themes face the same rereading for material they did not code themselves.", "source_ids": ["S07-15"], "evidence": "reasoned"}], "source_locators": {"S07-02": "Xiao et al., author PDF pp. 2–3 (printed pp. 76–77) and Figure 1, kappa values for GPT-3 and expert coders", "S07-18": "Wise, Gresalfi and Spencer-Smith, abstract and sections on core commitments of qualitative inquiry", "S07-16": "Matta et al., Methods, Case and Discussion, missed context in interview analysis", "S07-19": "Goretzki and Mahlendorf, publisher abstract and introduction on surface patterns and situated meaning", "S07-15": "Braun and Clarke, printed p. 91 on reviewing themes against coded extracts and the whole data set and pp. 94–95 on weak analysis, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating the analysis of qualitative data", "S07-17": "Jowsey, Braun, Clarke et al., position article abstract and methodological argument"}}, "qualitative-writing": {"task_scope": "AI drafts substantial accounts or reviewer responses from the project's material and interpretive outline; the researcher checks whether claims and quotations preserve context and contrary evidence.", "impacts": [{"id": "qualitative-writing-1", "kind": "opportunity", "label": "Faster drafting and revision", "text": "AI can turn an interpretive outline into a full draft and organise reviewer comments, so the authors spend less time on first versions and replies. In a short professional-writing experiment, AI assistance cut completion time and raised rated quality, although a journal article makes different demands. {{S05-007}}", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "qualitative-writing-2", "kind": "opportunity", "label": "Clearer case narratives", "text": "A draft can help authors present a long case so that readers can follow how the evidence supports each claim, which may be of particular help to researchers who write in a second language.", "source_ids": [], "evidence": "reasoned"}, {"id": "qualitative-writing-3", "kind": "risk", "label": "Contrary evidence smoothed away", "text": "A fluent draft may drop a contrary case, move a quotation to where it seems to mean something else, or soften a reviewer’s criticism, and Braun and Clarke treat claims that the extracts do not support as a sign of weak analysis. {{S07-15}} In experiments outside research, biased writing suggestions shifted users’ attitudes, and flattering AI responses made people more certain that they were right. {{S13-001}}{{S13-002}}", "source_ids": ["S07-15", "S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "qualitative-writing-4", "kind": "risk", "label": "Less practice writing up interpretation", "text": "Writing up is the final phase of a qualitative analysis, in which researchers work out what their material shows {{S07-15}}, so a researcher who mainly edits AI drafts may skip part of that work. In a three-month trial with patent lawyers, AI improved assisted drafts, but on a later task without AI, junior lawyers did no better on average, whereas lawyers with at least seven years in patent law outperformed their controls. {{S13-101}}", "source_ids": ["S07-15", "S13-101"], "evidence": "adjacent"}, {"id": "qualitative-writing-5", "kind": "risk", "label": "More drafts for others to check", "text": "When drafting becomes cheap, more of the work moves to supervisors, co-authors, and reviewers, who have to compare more text with interview records they may not know. An Organization Science editorial reports a steep rise in submissions and finds that manuscripts with higher AI-detector scores were less readable and fared worse editorially, although this evidence comes from one journal and does not establish cause. {{S06-020}}", "source_ids": ["S06-020"], "evidence": "adjacent"}, {"id": "qualitative-writing-6", "kind": "risk", "label": "Undisclosed use and shared excerpts", "text": "The European Commission’s guidelines ask researchers to be open about substantial use of AI in their research {{S03-006}}, and drafting from the project’s material means giving a tool excerpts that participants shared in confidence.", "source_ids": ["S03-006"], "evidence": "reasoned"}], "source_locators": {"S05-007": "Noy and Zhang, Science published abstract, 453 professionals in short writing tasks", "S07-15": "Braun and Clarke, Table 1 p. 87 and printed pp. 93–95 on producing the report as the final phase of analysis and on claims the extracts do not support, read in the local original PDF", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 methods and limitations", "S13-002": "Cheng et al., PDF pp. 5 and 7–8, experimental results", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining; senior means at least seven years in patent law", "S06-020": "Gartenberg et al., Organization Science editorial, original PDF pp. 2 and 5–10 (printed pp. 1 and 4–9), Figure 1 and Table 1", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9 on researcher duties and disclosure"}}, "theory_review-question": {"task_scope": "AI proposes theoretical questions, concepts, mechanisms and review boundaries; the researcher selects and justifies the intellectual problem and intended contribution.", "impacts": [{"id": "theory_review-question-1", "kind": "opportunity", "label": "More framings to compare", "text": "Korinek shows how economists can use AI to brainstorm research ideas {{S06-001}}, and researchers can also ask it for rival mechanisms, concepts from neighbouring fields, or review boundaries to compare before they choose a problem. In a field experiment on product innovation, professionals who worked with AI produced better ideas that depended less on their own professional background {{S13-103}}.", "source_ids": ["S06-001", "S13-103"], "evidence": "adjacent"}, {"id": "theory_review-question-2", "kind": "opportunity", "label": "Early objections to a problem", "text": "Korinek also demonstrates how AI can supply counterarguments and feedback on research ideas {{S06-001}}, so a researcher can test a proposed question against objections and may notice a weak problem before much work has gone into it.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "theory_review-question-3", "kind": "risk", "label": "Familiar ideas presented as new", "text": "Cornelissen warns that authors can prompt AI to keep rephrasing until a construct seems new and to supply plausible stories for patterns after the fact {{S13-301}}, so a researcher may claim a contribution that earlier work already made. In finance, Novy-Marx and Velikov report generating many complete papers, each with its own theoretical justification, from a template built around selected signals {{S13-307}}.", "source_ids": ["S13-301", "S13-307"], "evidence": "adjacent"}, {"id": "theory_review-question-4", "kind": "risk", "label": "Less accurate choice among options", "text": "In a product-innovation experiment, professionals who worked with AI were less likely to pick their own best idea, although the ideas they selected were still of higher quality {{S13-103}}. In experiments on interpersonal advice, agreeable AI responses made people more convinced that they were right {{S13-002}}, which could make an appealing question feel settled too early.", "source_ids": ["S13-103", "S13-002"], "evidence": "adjacent"}, {"id": "theory_review-question-5", "kind": "risk", "label": "Less practice in framing problems", "text": "A PhD candidate plans and conducts the research under supervision and prepares a dissertation {{S09-012}}, and a conceptual article needs an explicit justification of the theories and concepts it brings together {{S07-33}}. A researcher who starts from AI framings may get less practice in building that justification, which candidates in particular still have to learn.", "source_ids": ["S09-012", "S07-33"], "evidence": "reasoned"}, {"id": "theory_review-question-6", "kind": "risk", "label": "Unclear credit and disclosure", "text": "European guidelines note that AI output may rest on other researchers’ work that needs citing, and they treat using AI to identify research gaps or to develop hypotheses as substantial use that researchers should disclose {{S03-006}}.", "source_ids": ["S03-006"], "evidence": "reasoned"}, {"id": "theory_review-question-7", "kind": "risk", "label": "Time spent weighing many framings", "text": "When AI makes framings cheap to produce, researchers spend more of their effort weighing them, and supervisors, whose profiles include guidance and doctoral supervision {{S09-015}} {{S09-016}}, may receive more AI-framed proposals to assess.", "source_ids": ["S09-015", "S09-016"], "evidence": "reasoned"}], "source_locators": {"S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, idea generation versus selection and functional background", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S13-307": "Novy-Marx and Velikov, AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "theory_review-literature": {"task_scope": "AI searches, screens, summarises and compares the relevant literature; the researcher judges coverage, competing traditions and the pivotal original studies.", "impacts": [{"id": "theory_review-literature-1", "kind": "opportunity", "label": "Reach into neighbouring literatures", "text": "Research communities that study the same topic often use different terms and develop in parallel, so authors have to look deliberately beyond their own field {{S06-006}}. AI search can cover such terms across fields, and in a benchmark a retrieval-based system answered questions that drew on several papers better than a general model did {{S08-020}}.", "source_ids": ["S06-006", "S08-020"], "evidence": "adjacent"}, {"id": "theory_review-literature-2", "kind": "opportunity", "label": "Faster first pass through the literature", "text": "In one living review in mental health, a carefully tested screening prompt found every study that was eventually included while sparing reviewers most of the screening work in a simulation {{S06-012}}, and researchers can spend the time saved on the studies that decide the argument.", "source_ids": ["S06-012"], "evidence": "direct"}, {"id": "theory_review-literature-3", "kind": "opportunity", "label": "Quicker orientation in unfamiliar traditions", "text": "Researchers can ask AI to explain unfamiliar concepts and to summarise another tradition’s debates before they read its central papers, uses that Korinek demonstrates for economic research {{S06-001}}. In a school mathematics trial, a tutor designed with teachers largely avoided the harm to later unaided work that unrestricted AI help caused {{S09-004}}.", "source_ids": ["S06-001", "S09-004"], "evidence": "adjacent"}, {"id": "theory_review-literature-4", "kind": "risk", "label": "Prominent work favoured over minority views", "text": "When GPT-4o was asked to recommend citations, it favoured highly cited papers {{S08-017}}, and Cronin and George warn that a preference for high-status journals or for one’s own research community can undermine the completeness and balance of a review {{S06-006}}.", "source_ids": ["S08-017", "S06-006"], "evidence": "adjacent"}, {"id": "theory_review-literature-5", "kind": "risk", "label": "Sources and summaries taken on trust", "text": "In one benchmark, a general model without retrieval invented citations most of the time when asked about recent literature {{S08-020}}, and even a correct citation can come with a wrong summary, which European guidance makes the researcher responsible for checking {{S03-006}}. A researcher new to a field may also be unable to tell whether a recommended article comes from a reputable outlet, in a literature of uneven quality that includes predatory publishers {{S06-014}}.", "source_ids": ["S08-020", "S03-006", "S06-014"], "evidence": "direct"}, {"id": "theory_review-literature-6", "kind": "risk", "label": "Less practice in reading a field", "text": "Messeri and Crockett argue that searching, reading, and summarising the literature gives trainees a sense of which areas are crowded and which findings are rare, and they consider it a gamble to assume that this work can be skipped {{S13-303}}.", "source_ids": ["S13-303"], "evidence": "reasoned"}, {"id": "theory_review-literature-7", "kind": "risk", "label": "Checking coverage and summaries takes time", "text": "Researchers who check AI summaries against the originals and look for missed studies spend time that can offset the saving, all the more because screening performance varied by task in one evaluation {{S06-011}}. Supervisors, whose profiles include guidance and doctoral supervision {{S09-015}} {{S09-016}}, may also have to check part of a candidate’s AI-assisted review.", "source_ids": ["S06-011", "S09-015", "S09-016"], "evidence": "reasoned"}], "source_locators": {"S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "theory_review-design": {"task_scope": "AI drafts a model's assumptions, a conceptual structure or an integrative-review procedure; the researcher tests whether the design can support a worthwhile contribution.", "impacts": [{"id": "theory_review-design-1", "kind": "opportunity", "label": "Alternative designs compared early", "text": "AI can draft several sets of model assumptions, conceptual structures, or review procedures, so a researcher can compare concrete options before committing a paper to one design. A framework that trains language models for optimisation modelling improved their performance in turning problem descriptions into formal models and solver code on benchmark tasks {{S07-05}}.", "source_ids": ["S07-05"], "evidence": "adjacent"}, {"id": "theory_review-design-2", "kind": "opportunity", "label": "Hidden premises made explicit", "text": "Makadok notes that formal models require authors to state simplifications that verbal theory can leave implicit {{S13-306}}, and a researcher can likewise ask AI to list the assumptions on which a conceptual structure depends, which may reveal a premise the argument needs.", "source_ids": ["S13-306"], "evidence": "reasoned"}, {"id": "theory_review-design-3", "kind": "risk", "label": "Designs that omit a decisive element", "text": "A formal model can omit a player, a constraint, or a whole causal mechanism that readers consider essential {{S13-306}}, and drafted inclusion rules can miss research communities that use different terms for the same construct {{S06-006}}. Success on modelling benchmarks does not show that an abstraction suits the research question.", "source_ids": ["S13-306", "S06-006"], "evidence": "reasoned"}, {"id": "theory_review-design-4", "kind": "risk", "label": "Designs adopted without being understood", "text": "Jaakkola argues that a conceptual article needs an explicit justification of the theories and concepts it combines {{S07-33}}. A researcher who adopts an AI structure without that justification may struggle to defend the design later and, if still in training, may not learn to build one.", "source_ids": ["S07-33"], "evidence": "reasoned"}, {"id": "theory_review-design-5", "kind": "risk", "label": "Design checks for supervisors and co-authors", "text": "Supervisors and co-authors need time to examine, premise by premise, a tidy design they did not build, and associate and full professors, whose profiles include guidance and doctoral supervision {{S09-015}} {{S09-016}}, may see a flawed design carried into several projects.", "source_ids": ["S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-design-6", "kind": "risk", "label": "Procedures that others cannot repeat", "text": "Integrative reviews should describe how the literature was selected so that others can follow the procedure {{S13-305}}, and European guidance asks researchers to disclose substantial AI use and to allow for the different output that the same prompt can give {{S03-006}}.", "source_ids": ["S13-305", "S03-006"], "evidence": "reasoned"}], "source_locators": {"S07-05": "ORLM, publisher abstract and benchmark description; benchmarks do not test the choice of a substantive abstraction", "S13-306": "Makadok, original AMR PDF pp. 193–198, assumptions, omitted elements, derivations and accessibility", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-305": "Elsbach and van Knippenberg, original PDF pp. 1277–1279 and 1287–1288, definition, methodology sections, thinly supported elements and studies as data", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, "theory_review-data": {"task_scope": "For integrative reviews, AI assembles, deduplicates and extracts information from a source corpus; the researcher checks omissions, inclusion decisions and extraction. Pure theory has no empirical data-acquisition task.", "impacts": [{"id": "theory_review-data-1", "kind": "opportunity", "label": "Corpus assembled and extracted faster", "text": "For an integrative review, whose included papers work much like data in an empirical study {{S13-305}}, AI can collect records, remove duplicates, and extract each study’s claims. In one living review in mental health, a tested screening prompt missed none of the studies that were eventually included, and a simulation suggested that it could spare reviewers most of the screening work {{S06-012}}.", "source_ids": ["S13-305", "S06-012"], "evidence": "direct"}, {"id": "theory_review-data-2", "kind": "opportunity", "label": "Broader search across research communities", "text": "Cronin and George define completeness in an integrative review as finding the range of research communities that study a topic, often under different names {{S06-006}}, and cheaper screening lets a team search more databases and terms than it could screen by hand.", "source_ids": ["S06-006"], "evidence": "reasoned"}, {"id": "theory_review-data-3", "kind": "opportunity", "label": "Extracted claims linked to their passages", "text": "A retrieval-based system that cites the passages it draws on produced far fewer invented citations than a model without retrieval {{S08-020}}, and an extraction table that links each claim to its passage makes a review corpus easier for a second reader to check.", "source_ids": ["S08-020"], "evidence": "adjacent"}, {"id": "theory_review-data-4", "kind": "risk", "label": "Incomplete or unbalanced corpus", "text": "A systematic review of 19 evaluations found widely varying errors when AI searched, screened, and extracted data for evidence syntheses, mostly in biomedicine {{S07-20}}. Models whose citation suggestions favour highly cited papers {{S08-017}} can also tilt a corpus away from minority views, which a balanced review has to represent {{S06-006}}.", "source_ids": ["S07-20", "S08-017", "S06-006"], "evidence": "direct"}, {"id": "theory_review-data-5", "kind": "risk", "label": "Less practice in appraising studies", "text": "Cronin and George note that a balanced review depends on judging the quality of findings from traditions with different standards {{S06-006}}. Messeri and Crockett regard this kind of work with the literature as part of how trainees learn a field {{S13-303}}, so leaving screening and extraction to AI can cost a researcher that practice.", "source_ids": ["S06-006", "S13-303"], "evidence": "reasoned"}, {"id": "theory_review-data-6", "kind": "risk", "label": "Checking the corpus takes time", "text": "Because AI makes errors in screening and extraction {{S07-20}}, the authors have to sample the exclusions and compare extracted claims with the original studies, and in a supervised review part of that work falls to supervisors, whose profiles include guidance and doctoral supervision {{S09-015}} {{S09-016}}.", "source_ids": ["S07-20", "S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-data-7", "kind": "risk", "label": "Licensed full texts and tool rules", "text": "The EU exception for text and data mining in research covers lawfully accessed works, but it does not by itself settle whether licensed full texts may be uploaded to a hosted AI service {{S03-012}}. RUG’s guidance for its Vibe service says that subscription articles may not be uploaded unless the publisher’s licence permits this use or the publisher agrees {{S03-004}}.", "source_ids": ["S03-012", "S03-004"], "evidence": "reasoned"}], "source_locators": {"S13-305": "Elsbach and van Knippenberg, original PDF pp. 1277–1279 and 1287–1288, definition, methodology sections, thinly supported elements and studies as data", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S07-20": "Clark et al., PubMed abstract Methods and Results, 19-study synthesis of GenAI errors", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S03-012": "Directive (EU) 2019/790, Arts 3(1)–(2) and 7(1), research text and data mining exception", "S03-004": "RUG AI Office FAQ on Vibe, last modified 9 September 2026, general FAQ on external tools and research question on uploading a PDF; checked 4 October 2026"}}, "theory_review-analysis": {"task_scope": "AI develops candidate derivations, mechanisms or a synthesis of studies; the researcher tests their validity, counterexamples and contribution against premises and sources.", "impacts": [{"id": "theory_review-analysis-1", "kind": "opportunity", "label": "Candidate derivations and syntheses", "text": "In an independent test with ten new research-level mathematics problems, public AI systems together produced at least one passing solution for seven of them {{S08-007}}, and Korinek shows how economists can use AI for mathematical derivations {{S06-001}}. For a review, AI can also propose ways of grouping findings into themes that the authors then test against the studies.", "source_ids": ["S08-007", "S06-001"], "evidence": "adjacent"}, {"id": "theory_review-analysis-2", "kind": "opportunity", "label": "Counterexamples and contrary studies", "text": "Korinek demonstrates how AI can supply counterarguments {{S06-001}}, and researchers can likewise ask for counterexamples to a proposition or for studies that contradict a proposed synthesis, which shows them where an argument still needs work.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "theory_review-analysis-3", "kind": "opportunity", "label": "Steps explained for learners", "text": "A researcher who is still learning a formal technique or an unfamiliar body of work can ask AI to explain a step without supplying it. In a school mathematics trial, a tutor designed with teachers largely avoided the harm to later unaided work that unrestricted AI help caused {{S09-004}}.", "source_ids": ["S09-004"], "evidence": "adjacent"}, {"id": "theory_review-analysis-4", "kind": "risk", "label": "Convincing arguments with invalid steps", "text": "Expert graders of AI-written solutions found difficult steps asserted without justification and references that did not support the claims they were cited for {{S08-007}}. In conceptual and review work, AI can likewise fit a plausible story to a pattern after the fact {{S13-301}} or join studies that use one word for concepts that are not equivalent {{S06-006}}.", "source_ids": ["S08-007", "S13-301", "S06-006"], "evidence": "adjacent"}, {"id": "theory_review-analysis-5", "kind": "risk", "label": "Arguments the author cannot fully defend", "text": "Messeri and Crockett argue that AI can leave scientists overestimating how well they understand a problem, which they call an illusion of understanding {{S06-014}}. Programmers who learned an unfamiliar library with AI help also scored lower on a test of concepts and debugging afterwards {{S09-003}}, which suggests that researchers who let AI derive or synthesise may be less able to defend the result.", "source_ids": ["S06-014", "S09-003"], "evidence": "adjacent"}, {"id": "theory_review-analysis-6", "kind": "risk", "label": "More arguments for supervisors to check", "text": "Hochberg and Thrall warn that science may build up what they call a verification debt when research output grows faster than the capacity for careful checking {{S13-304}}. Supervisors, whose profiles include guidance and doctoral supervision {{S09-015}} {{S09-016}}, carry much of the checking of candidates’ AI-assisted derivations and syntheses.", "source_ids": ["S13-304", "S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-analysis-7", "kind": "risk", "label": "AI role in the argument unreported", "text": "European guidance asks authors to report AI use that meaningfully shapes their results according to the rules of their journal or discipline {{S03-006}}, so authors whose derivation or central mechanism came from AI would need to say so.", "source_ids": ["S03-006"], "evidence": "reasoned"}], "source_locators": {"S08-007": "First Proof Second Batch report, p. 4 Summary and Discussion of Results, pp. 4–5 on unjustified steps and citation failures, pp. 7–10 selection, testing and grading", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10 and 17–19, randomised unfamiliar-library task, learning quiz and limitations", "S13-304": "Hochberg and Thrall, PNAS original PDF pp. 1–4, especially p. 3 on verification debt; opinion, not a measured trend", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, "theory_review-writing": {"task_scope": "AI drafts substantial manuscript sections or reviewer responses from the researchers' premises, sources and outline; the researchers assess whether the resulting argument and contribution are defensible.", "impacts": [{"id": "theory_review-writing-1", "kind": "opportunity", "label": "Drafting time freed for the argument", "text": "In a randomised experiment on short professional writing tasks, AI assistance cut the time needed and raised the rated quality of the texts {{S05-007}}. Drafts of sections or reviewer replies built from the authors’ own premises, sources, and outline may likewise free time for the central argument.", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "theory_review-writing-2", "kind": "opportunity", "label": "Clearer drafts and explanations", "text": "In a three-month field experiment, patent drafts written with AI received better blind ratings, especially those of junior lawyers {{S13-101}}, and AI drafts can help authors translate a model’s assumptions and causal logic into the plain language that formal theory needs to reach its readers {{S13-306}}.", "source_ids": ["S13-101", "S13-306"], "evidence": "adjacent"}, {"id": "theory_review-writing-3", "kind": "risk", "label": "Fluent text with weak support", "text": "Cornelissen warns that coherent prose and new construct names can give a text the look of theory without a validated mechanism behind it {{S13-301}}. AI drafts can also cite work that does not support a claim or does not exist, which European guidance makes researchers responsible for checking {{S03-006}} and which an audit of biomedical papers found in the published record {{S06-019}}.", "source_ids": ["S13-301", "S03-006", "S06-019"], "evidence": "adjacent"}, {"id": "theory_review-writing-4", "kind": "risk", "label": "Authors’ own judgement weakened", "text": "In a three-month trial, junior patent lawyers who had drafted with AI did no better on average than junior controls when they later edited a flawed patent without it, whereas lawyers with at least seven years in patent law did better than their controls {{S13-101}}. Other experiments found that deliberately biased AI writing suggestions shifted users’ views and that agreeable AI responses made people surer they were right {{S13-001}} {{S13-002}}, which could leave authors less critical of a draft or of a reply to reviewers.", "source_ids": ["S13-101", "S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "theory_review-writing-5", "kind": "risk", "label": "More drafts for others to check", "text": "Organization Science received 42 percent more submissions after ChatGPT appeared than in a comparable earlier period, and its editors link the disproportionate rise to AI use, which they measured with a detector {{S06-020}}. Supervisors and co-authors may likewise receive more AI-assisted chapters, revisions, and replies to check.", "source_ids": ["S06-020"], "evidence": "adjacent"}, {"id": "theory_review-writing-6", "kind": "risk", "label": "Unpublished work and disclosure", "text": "European guidance asks researchers not to upload unpublished work, whether their own or a colleague’s, to external AI systems without assurances about its reuse, and to disclose substantial AI use {{S03-006}}, while RUG limits external AI tools to public information {{S03-004}}.", "source_ids": ["S03-006", "S03-004"], "evidence": "reasoned"}], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining and limits; senior means at least seven years in patent law", "S13-306": "Makadok, original AMR PDF pp. 193–198, assumptions, omitted elements, derivations and accessibility", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81, methods and limitations; cause of fabricated references unknown", "S13-001": "Williams-Ceci et al., original PDF pp. 3–4 and 7–10, results, warning conditions and limitations", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S06-020": "Organization Science original PDF pp. 2 and 5–10, submission volume and AI-detector analyses, and p. 19 endnote 8", "S03-004": "RUG AI Office FAQ on Vibe, last modified 9 September 2026, general FAQ on external tools and research question on uploading a PDF; checked 4 October 2026"}}}, "department_forms": {"departments": {"HRM&OB": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 1, "Theory/Review": 6, "Mixed": 1, "Unclear": 0}}, "Marketing": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 0, "Theory/Review": 7, "Mixed": 1, "Unclear": 0}}, "IM&S": {"n": 25, "counts": {"Quantitative": 13, "Qualitative": 8, "Theory/Review": 4, "Mixed": 0, "Unclear": 0}}, "Operations": {"n": 25, "counts": {"Quantitative": 4, "Qualitative": 7, "Theory/Review": 13, "Mixed": 0, "Unclear": 1}}, "GEM": {"n": 25, "counts": {"Quantitative": 21, "Qualitative": 1, "Theory/Review": 2, "Mixed": 1, "Unclear": 0}}, "Accounting": {"n": 25, "counts": {"Quantitative": 17, "Qualitative": 2, "Theory/Review": 4, "Mixed": 1, "Unclear": 1}}, "EEF": {"n": 25, "counts": {"Quantitative": 16, "Qualitative": 0, "Theory/Review": 8, "Mixed": 1, "Unclear": 0}}}}, "slides": [{"id": "opening", "chapter": "Introduction", "layout": "title", "title": "Using AI well in research", "lead": "A follow-up to the research day", "visual": {"type": "title", "meta": "Joost van de Brake · October 2026", "note": "This presentation is interactive, so you can click on the tabs, on every cell of the heatmaps to read the reasoning behind its colour, and on the numbers in square brackets, which open the sources."}, "footnote": {"text": "If you are interested in the larger societal risks of rapid AI development, I recommend watching “[[link]]” by Kurzgesagt.", "link": {"text": "AI Just Crossed the Terrifying Line - Now What?", "url": "https://www.youtube.com/watch?v=ujkD4SxPKOI"}}}, {"id": "followup", "chapter": "Introduction", "title": "After the research day", "lead": "At the research day I showed what AI can already do in research and where it can go wrong, and several of you asked what this means for your own work. In this follow-up I try to give a first answer, and because FEB is preparing a plan for AI in research this academic year, I would also like to hear what you think. {{S01-001}}", "visual": {"type": "agenda", "cols": [{"label": "In this follow-up", "tone": "now", "items": [{"text": "What we want to achieve", "jump": "ambition"}, {"text": "How AI changes research along three dimensions", "jump": "dimensions"}, {"text": "Where AI helps most and where to be careful", "jump": "map-overview"}, {"text": "What happens next and how you can contribute", "jump": "next"}]}], "method_label": "What I did", "method": "Over the past year, since I started working on this topic, I collected 280 sources on AI and research. Most of them, 189 in total, are academic publications such as experiments and field studies of AI in research, learning, and work, and the others are FEB and university documents, job profiles, European guidelines, and reports from other universities. I used Claude and Codex to help me analyse these sources and estimate how AI affects research by project stage, research form, and career position, and I checked and reworked everything carefully myself. With this analysis I hope to develop support systems for our research, and it all starts with the four principles on the next slide."}}, {"id": "ambition", "chapter": "Introduction", "title": "What we want to achieve", "visual": {"type": "statement", "principles_label": "Four principles", "principles": [{"title": "Quality and impact", "text": "We use AI where it improves the quality or impact of research and the gain is worth the total effort, including the time spent checking. {{S01-001}}", "jump": "quality", "link": "Quality and impact"}, {"title": "Human oversight", "text": "Researchers stay responsible for what AI produces. They check it, can explain it, and decide what goes into their work. {{S03-006}}", "jump": "stages", "link": "Research stages"}, {"title": "Preserving learning", "text": "We use AI in ways that support skill formation. Researchers keep practising the skills their research depends on, and anyone new to a method, PhD candidates included, still learns it themselves. {{S09-003}}", "jump": "positions", "link": "Career positions"}, {"title": "Equal access", "text": "Tools and support are available in every department and at every career stage, so that good use of AI does not depend on personal budgets or widen existing inequalities. {{S01-001}}"}]}, "lead": "We want AI to help FEB researchers do better research. Researchers in every department and at every career stage should be able to use AI where it improves their work, check what it produces, and keep learning the craft of research. FEB helps them do so and shares what works."}, {"id": "quality", "chapter": "FEB’s strategy and research", "title": "FEB’s goals for research", "lead": "The strategic plan keeps research time and output per researcher stable and puts FEB’s ambitions in the quality and impact of research. AI is most useful to FEB where it helps with these four goals. {{S01-001}}", "visual": {"type": "goals", "ai_label": "Where AI can help", "items": [{"figure": "AIP ≥ 95", "label": "Top-journal publications", "plan": "FEB researchers keep publishing in top economics and business journals, which the career rules recognise by their Article Influence Score Percentile. {{S01-002}}{{S01-004}}", "ai": "AI can make a study more thorough, for example by running robustness checks that a team could not otherwise afford. {{S06-002}}"}, {"figure": "+20% by 2031", "label": "Prestigious grants", "plan": "Funding from prestigious grants should rise every year, to 20 percent above the 2023–2025 average by 2031. {{S01-001}}", "ai": "AI can check a draft against the funder’s criteria, although in a study at an Austrian funder GPT-4o was biased against novel proposals. {{S14-605}}"}, {"figure": "Valued more", "label": "Societal impact", "plan": "FEB wants to reward impact on business, policy, and society more, through impact cases and an impact career track. {{S01-001}}", "ai": "AI can turn findings into reports and tools for partners and analyse their documents at scale, within the data agreement."}, {"figure": "SEP 2027", "label": "Research evaluation", "plan": "FEB wants another very good result in the national research evaluation of 2027, with research time per researcher kept stable. {{S01-001}}", "ai": "AI can free time for more demanding research if the time spent checking is counted too. In a randomised study, experienced developers were slower with AI on their own code. {{S05-011}}"}]}}, {"id": "dimensions", "chapter": "Three dimensions", "layout": "divider", "title": "Three dimensions", "dimension": "overview", "lead": "AI tools come in many kinds, from chat assistants such as ChatGPT, Claude, and Gemini to coding agents such as Claude Code and GitHub Copilot, literature tools such as Elicit and Consensus, automatic transcription, and chatbots that interview participants. These tools can help one researcher and hurt another, depending on where in a project they are used, on the kind of research, and on the researcher’s position.", "visual": {"type": "divider", "items": [{"title": "Research stage", "text": "Where in a project AI is used, from formulating the question and reading the literature to analysing data and revising the paper."}, {"title": "Research form", "text": "Whether the research is quantitative, qualitative, or theory and review, because each form needs its own check on AI output."}, {"title": "Career position", "text": "Whether the researcher is a PhD candidate, postdoc, assistant professor, associate professor, or full professor, because the university’s job profiles give each position different tasks and responsibilities."}]}}, {"id": "stages", "chapter": "Three dimensions", "opener": {"number": "1", "kicker": "Dimension 1"}, "title": "Research stages", "dimension": "cycle", "lead": "AI can now contribute to every stage of a research project, and current systems do much more than edit text. Each stage still needs its own check, because an early error, such as a measure that misses the concept, carries through to the conclusions.", "visual": {"type": "stages", "items": [{"key": "question", "name": "Question & theory", "desc": "Deciding what the study should explain and why that adds to what is known.", "ai": ["Suggest rival explanations, counterexamples, and related work from neighbouring fields. In a large study with NLP researchers, experts first rated research ideas from AI as more novel than human ideas, but once researchers carried the ideas out, the AI ideas lost more of their rating. {{S06-001}}{{S14-101}}{{S14-102}}"], "check": ["Whether the idea is new at all. In a study in which 13 experts examined 50 research proposals written by AI, about a quarter turned out to paraphrase or borrow heavily from existing work without saying so. {{S14-110}}", "Whether the alternatives really differ. A reanalysis of brainstorming experiments found that ideas produced with ChatGPT were less diverse. {{S14-104}}"]}, {"key": "literature", "name": "Literature", "desc": "Finding, screening, and reading earlier work.", "ai": ["Search the literature and answer questions about it with citations. In a test of the retrieval system OpenScholar, experts preferred its answers to answers written by other experts in 51 to 70 percent of comparisons, depending on the version. {{S08-020}}"], "check": ["Whether the decisive studies are there. In the same test, GPT-4o hallucinated many titles when it cited from memory, and a study of its reference suggestions found a citation bias towards highly cited work. {{S08-020}}{{S08-017}}", "Whether a summary says what the original papers say. Even OpenScholar, the best system in that test, sometimes missed representative papers or added unsupported information. {{S08-020}}"]}, {"key": "design", "name": "Design", "desc": "Choosing the comparison, the cases, the measures, or the model.", "ai": ["Rehearse a design before data are collected, for example with simulated respondents, known as silicon samples. In a study of 70 survey experiments with representative US samples, GPT-4 forecasts correlated strongly with the real effects, although the forecast effects were too large. {{S07-11}}{{S14-107}}"], "check": ["Whether the identification strategy supports the claim. In a benchmark of 174 causal questions taken from real studies, a reasoning model named the right family of designs in 81 percent of cases but gave a fully correct identification in 38 percent. {{S14-108}}", "Whether the team can reach the people, firms, or records that the design needs. {{S06-004}}"]}, {"key": "data", "name": "Data / sources", "desc": "Obtaining and preparing the material.", "ai": ["Retrieve and combine online datasets and archives, extract information from filings and reports, and transcribe or conduct interviews. This makes a larger panel or a new text-based measure feasible where manual work would have been too costly. {{S06-023}}{{S07-08}}{{S14-401}}"], "check": ["Whether the team may process the data with that tool at all. {{S06-021}}", "Whether measurement error in AI-generated variables biases the estimate. In a study of job postings that AI had classified, correcting for nine false positives in a sample of 1,000 moved a regression coefficient from 0.364 to 0.641. {{S07-07}}"]}, {"key": "analysis", "name": "Analysis & interpretation", "desc": "Producing results and deciding what they mean.", "ai": ["Write and run analysis code, try alternative specifications, and reproduce published results from the original materials. {{S08-010}}"], "check": ["Whether the code does what the paper claims. In a survey in which 506 researchers described a coding task they had done with AI, about half mentioned running the code to check it, 3 percent automated tests, and 2 percent a code review by someone else. {{S14-205}}", "Whether the estimand and assumptions support the interpretation. In the study of seven-hour reproduction games, teams without AI found more major coding errors than teams with AI. {{S07-01}}"]}, {"key": "writing", "name": "Writing & review", "desc": "Explaining, revising, and sharing the work.", "ai": ["Draft and edit text faster, which helps authors who write in a second language. A study of preprint servers found that authors who started using AI went on to post more preprints than comparable authors, although it cannot show that AI caused this. {{S14-204}}"], "check": ["Whether fluent text still shows the reasoning. At Organization Science, the editors found that submissions rose after late 2022 and that manuscripts with higher AI-detector scores tended to fare worse. {{S06-020}}", "Whether a complete-looking manuscript holds up. When the developers of a fully automated research system submitted three of its papers to a workshop that accepted 70 percent of submissions, one passed review, and the developers documented weak ideas, coding errors,
