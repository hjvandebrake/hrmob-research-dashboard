l=\"Source 61\">[61]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 63\">[63]<\/button><\/p>\n<p>Support also needs clear agreements about who can see AI-use records or generated assessments, who may challenge them, and how they may be used. A tool introduced for feedback can otherwise become a way to monitor performance. The allocation of checking work deserves the same attention: if AI creates more drafts, the people who validate them need time and recognition for that work. These are proposed choices for FEB, informed by research on algorithmic control and managerial use of support tools. <button class=\"citation\" data-source=\"S14-601\" aria-label=\"Source 132\">[132]<\/button><button class=\"citation\" data-source=\"S14-709\" aria-label=\"Source 135\">[135]<\/button><\/p>\n<p>The pilot should look at the <strong>finished research and the people who made it<\/strong>. Did the analysis withstand an independent check? Could the author explain a key choice after using AI? How much time did coauthors and supervisors spend correcting an attractive but unsupported result? Did the candidate receive criticism they could act on, and did the project leader see problems early enough to help? A before-and-after comparison of drafts alone would miss whether faster work improved the research or shifted the burden of checking and learning onto someone else. <button class=\"citation\" data-source=\"S05-013\" aria-label=\"Source 122\">[122]<\/button><button class=\"citation\" data-source=\"S13-101\" aria-label=\"Source 54\">[54]<\/button><button class=\"citation\" data-source=\"S13-103\" aria-label=\"Source 46\">[46]<\/button><\/p>\n<p>The five UFO positions give FEB a defensible reason to expect different <strong>kinds<\/strong> of benefit and burden. The PhD candidate&#39;s research is also training. The postdoc&#39;s independence and grant work vary substantially by appointment. The UD combines own scholarship with teaching and developing supervision. The UHD coordinates linked projects and other researchers while continuing to publish. The professor conducts scholarship and carries chair-wide responsibility for funding, staff, doctoral guidance and quality. AI can help each position with parts of that work, while shifting the work of checking and learning across the group. Which consequence dominates should be assessed for the task and the actual appointment, rather than read from rank alone. <button class=\"citation\" data-source=\"S09-012\" aria-label=\"Source 55\">[55]<\/button><button class=\"citation\" data-source=\"S09-013\" aria-label=\"Source 57\">[57]<\/button><button class=\"citation\" data-source=\"S09-014\" aria-label=\"Source 58\">[58]<\/button><button class=\"citation\" data-source=\"S09-015\" aria-label=\"Source 61\">[61]<\/button><button class=\"citation\" data-source=\"S09-016\" aria-label=\"Source 63\">[63]<\/button><\/p>\n", "toc": [{"id": "positions-researcher-position-work-learning-and-responsibility", "text": "Researcher position: work, learning and responsibility", "level": 1}, {"id": "positions-phd-candidate-doing-the-research-and-learning-how-to-do-it", "text": "PhD candidate: doing the research and learning how to do it", "level": 2}, {"id": "positions-postdoctoral-researcher-independence-varies-time-is-finite", "text": "Postdoctoral researcher: independence varies, time is finite", "level": 2}, {"id": "positions-assistant-professor-own-research-teaching-and-growing-guidance", "text": "Assistant professor: own research, teaching and growing guidance", "level": 2}, {"id": "positions-associate-professor-several-projects-and-other-people-s-development", "text": "Associate professor: several projects and other people's development", "level": 2}, {"id": "positions-professor-own-scholarship-and-responsibility-for-a-chair", "text": "Professor: own scholarship and responsibility for a chair", "level": 2}, {"id": "positions-expertise-crosses-position-boundaries", "text": "Expertise crosses position boundaries", "level": 2}, {"id": "positions-what-feb-could-examine-in-a-supported-project", "text": "What FEB could examine in a supported project", "level": 2}]}}, "dimension_date": "2026-10-05", "bundles": {"quantitative-question": {"task_scope": "AI proposes research questions, mechanisms and hypotheses on the project’s topic, and data that could test them; the researcher selects and justifies the question.", "impacts": [{"id": "quantitative-question-1", "kind": "opportunity", "label": "More possible questions and mechanisms", "text": "In a Journal of Economic Literature article, Korinek illustrates how economists can ask AI to brainstorm research ideas and raise counterarguments {{S06-001}}, and in a field experiment on product innovation, individuals who worked with AI developed solutions of similar quality to pairs who worked without AI {{S13-103}}. A researcher can then weigh more mechanisms and ways to test them, including some from neighbouring fields, before committing to a question.", "source_ids": ["S06-001", "S13-103"], "evidence": "adjacent"}, {"id": "quantitative-question-2", "kind": "opportunity", "label": "Rival explanations named early", "text": "When asked for counterarguments, AI can name rival explanations for a favoured hypothesis {{S06-001}}. A researcher who then works out what each explanation predicts may see sooner which comparison in the data would tell the explanations apart, and can state the hypothesis more sharply.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "quantitative-question-3", "kind": "opportunity", "label": "Suggested datasets and policy changes", "text": "AI can also point a researcher to datasets or policy changes that could test a proposed question, and such suggestions may reveal a comparison that the researcher had not considered and that existing data can support.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-question-4", "kind": "risk", "label": "Appealing questions the data cannot answer", "text": "In a field experiment on product innovation, AI helped professionals generate ideas more clearly than it helped them select the best one {{S13-103}}, so a researcher may settle on an attractive question before checking whether the suggested data can be obtained and measure the intended construct.", "source_ids": ["S13-103"], "evidence": "adjacent"}, {"id": "quantitative-question-5", "kind": "risk", "label": "Hypotheses written to fit known results", "text": "In a conceptual essay, Cornelissen warns that AI makes it cheap to write several theoretical stories for a pattern that is already in the data {{S13-301}}, and a demonstration in finance research used AI to produce many complete papers with different theoretical justifications for selected predictors of stock returns {{S13-307}}. A researcher who asks AI for hypotheses after seeing the results may present exploratory findings as predictions.", "source_ids": ["S13-301", "S13-307"], "evidence": "adjacent"}, {"id": "quantitative-question-6", "kind": "risk", "label": "Weaker judgement in choosing the question", "text": "In a Nature perspective, Messeri and Crockett argue that AI can give researchers the impression that they understand more, and explore more widely, than they do {{S06-014}}. A researcher who mainly chooses among questions proposed by AI also gets less practice in developing a question from a puzzle in the literature or the data, and may find it harder to defend the question as their own.", "source_ids": ["S06-014"], "evidence": "reasoned"}], "source_locators": {"S01-002": "FEB Career Tracks 2025 update for new hires, PDF cover p. 1 and Research Profile promotion criteria pp. 15–16", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52 and Figure 1 on illusions of understanding; perspective, not outcome evaluation", "S09-008": "OECD, Reducing the precarity of academic research careers, career development discussion and policy recommendations, PDF p. 47", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, quality of individuals with AI and idea generation versus selection", "S13-301": "Cornelissen local accepted manuscript PDF pp. 6–8 (manuscript pp. 5–7)", "S13-307": "AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable"}}, "quantitative-literature": {"task_scope": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missed studies and reads in full those the project builds on.", "impacts": [{"id": "quantitative-literature-1", "kind": "opportunity", "label": "Faster screening of large searches", "text": "In one mental-health review that is updated as new studies appear, a language model with tuned prompts identified every study that was eventually included, and the authors simulated a 65 to 85 percent cut in screening work {{S06-012}}. Researchers who screen thousands of records, for example before a statistical meta-analysis, may reach the relevant studies sooner and keep more time for reading them.", "source_ids": ["S06-012"], "evidence": "direct"}, {"id": "quantitative-literature-2", "kind": "opportunity", "label": "Wider comparison of measures and designs", "text": "In tests in fields outside economics and business, OpenScholar, a system that retrieves papers and cites the passages it draws on, answered questions that required several papers better than GPT-4o did {{S08-020}}. Such a system could help researchers compare how more studies, including some in neighbouring fields, have measured and estimated the same relationship.", "source_ids": ["S08-020"], "evidence": "direct"}, {"id": "quantitative-literature-3", "kind": "opportunity", "label": "Quicker orientation in an unfamiliar field", "text": "A researcher who enters a new field, or who links economics with a business discipline that uses other terms for the same process, can ask AI to explain those terms and summarise the field’s main ideas {{S06-001}}, and may then see sooner which papers deserve close reading.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "quantitative-literature-4", "kind": "risk", "label": "Missed studies and bias towards highly cited work", "text": "In one evaluation, GPT-4’s screening performance fell once chance agreement and the small share of relevant records were adjusted for, and varied with the task {{S06-011}}, and a systematic review of nineteen studies found wide error ranges in AI searching and screening {{S07-20}}. In another test, GPT-4o’s citation recommendations favoured highly cited papers {{S08-017}}, so a smaller line of research that challenges the dominant finding may drop out of a review.", "source_ids": ["S06-011", "S07-20", "S08-017"], "evidence": "direct"}, {"id": "quantitative-literature-5", "kind": "risk", "label": "Findings misstated or wrongly compared", "text": "In the OpenScholar tests, GPT-4o without access to a literature search fabricated most of the citations it gave for recent literature {{S08-020}}. Even accurate AI summaries may treat estimates as comparable when the studies measure different constructs or use different samples, and because a statistical meta-analysis combines results extracted from earlier studies {{S07-32}}, such mismatched estimates would enter the pooled effect.", "source_ids": ["S08-020", "S07-32"], "evidence": "direct"}, {"id": "quantitative-literature-6", "kind": "risk", "label": "Weak sources hard to recognise", "text": "An AI search returns working papers and articles from journals of very different standing side by side, and a researcher who does not yet know a field’s journals and debates may not be able to tell which studies deserve weight. Relying on AI summaries without reading the studies also gives that researcher fewer chances to learn how researchers in the field judge studies and journals.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-literature-7", "kind": "risk", "label": "Licensed articles used outside their terms", "text": "RUG guidance for Vibe, its contracted AI service, says that subscription articles may not be uploaded unless the publisher’s licence permits it {{S03-004}}. A researcher who wants AI to compare full texts may therefore breach a licence or have the tool work only from abstracts and open-access versions.", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S06-012": "Homiar et al., PubMed abstract Methods/Results on calibrated screening and simulated workload", "S07-20": "Clark et al. evidence-synthesis systematic review, PubMed abstract Methods and Results", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "quantitative-design": {"task_scope": "AI drafts a study design or model specification with robustness checks; the researcher assesses what it estimates, its assumptions and whether the data allow it.", "impacts": [{"id": "quantitative-design-1", "kind": "opportunity", "label": "Alternative designs compared early", "text": "Empirical economists ask first whether the comparison of treated and untreated cases is credible, whereas structural modellers ask which assumptions let data predict outcomes never observed {{S06-002}}{{S06-003}}. AI can draft both kinds of design for the same question, so a researcher can compare what each would estimate before committing time and data to one.", "source_ids": ["S06-002", "S06-003"], "evidence": "reasoned"}, {"id": "quantitative-design-2", "kind": "opportunity", "label": "Designs tried out before data collection", "text": "A researcher can ask AI for simulation code that shows, before any data are collected, whether an estimator recovers a known effect under the planned design. In a working paper, Horton and colleagues also used language-model agents to simulate simple economic experiments, although they caution that a close match between simulated and human choices cannot by itself show that a theory of human behaviour is true {{S13-203}}.", "source_ids": ["S13-203"], "evidence": "adjacent"}, {"id": "quantitative-design-3", "kind": "opportunity", "label": "Analysis plan written before estimation", "text": "When AI turns a drafted design into a written plan of the estimand (the quantity to be estimated) and the planned checks before any estimation, researchers can later report how their analyses developed, which an Academy of Management Journal editorial asks authors to disclose {{S06-010}}.", "source_ids": ["S06-010"], "evidence": "reasoned"}, {"id": "quantitative-design-4", "kind": "risk", "label": "Designs that estimate the wrong quantity", "text": "In an article on research design, Angrist and Pischke explain that what an empirical result can support depends on the credibility of the comparison behind it {{S06-002}}. An AI-drafted design may look plausible while comparing the wrong cases or relying on an assumption that the firms or people studied do not meet, and a researcher without experience in the method may not notice.", "source_ids": ["S06-002"], "evidence": "reasoned"}, {"id": "quantitative-design-5", "kind": "risk", "label": "AI-generated measures without a validation plan", "text": "When a design relies on variables that AI will generate from text or other documents, errors in those variables can bias the estimates {{S07-07}}, and valid inference requires a hand-coded validation sample that the design has to provide for {{S08-013}}. An AI-drafted design that leaves out such a sample can make the later results hard to defend.", "source_ids": ["S07-07", "S08-013"], "evidence": "adjacent"}, {"id": "quantitative-design-6", "kind": "risk", "label": "Less practice in defending a design", "text": "In a randomised experiment, programmers who learned an unfamiliar programming library with AI help performed worse on a later test of the library’s concepts {{S09-003}}. A researcher who adopts an AI-drafted design may likewise understand less well why the design’s assumptions hold, which supervisors and reviewers expect the researcher to explain.", "source_ids": ["S09-003"], "evidence": "adjacent"}, {"id": "quantitative-design-7", "kind": "risk", "label": "Data access and permissions overlooked", "text": "An AI-drafted design may assume records that the project cannot obtain or an AI tool that the project may not use. CBS microdata, for example, require institutional and project authorisation and can be analysed only in a secure CBS environment {{S06-021}}, and RUG staff must request new AI software through a central process {{S03-003}}.", "source_ids": ["S06-021", "S03-003"], "evidence": "reasoned"}], "source_locators": {"S03-003": "RUG Safe and Responsible use of AI, “Guidelines Research” and “Using new AI tools” sections, checked 4 October 2026", "S06-002": "Angrist and Pischke, Journal of Economic Perspectives, abstract/introduction on credible empirical design", "S06-003": "Nevo and Whinston, Journal of Economic Perspectives publisher abstract on structural modelling and assumptions", "S06-010": "DeCelles et al., AMJ transparency editorial pp. 1009–10 on disclosing how analyses evolved", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-203": "Horton, Filippas and Manning, revised NBER working paper PDF pp. 2–4, 14 and 29–31 on simulated economic agents and the limits of fit"}}, "quantitative-data": {"task_scope": "For data the project may use, AI retrieves, extracts, cleans and links records or published study results; the researcher validates the measures and checks each cleaning step. The data’s access terms still decide which AI tools may process them.", "impacts": [{"id": "quantitative-data-1", "kind": "opportunity", "label": "More records prepared for analysis", "text": "Researchers can retrieve public SEC filings through the SEC’s documented programming interfaces {{S06-023}}, and in one study language models extracted ownership information from companies’ annual reports {{S07-08}}. With such tools, a team can prepare more records than it could by hand, and the same applies to the results that a statistical meta-analysis extracts from earlier studies {{S07-32}}.", "source_ids": ["S06-023", "S07-08", "S07-32"], "evidence": "direct"}, {"id": "quantitative-data-2", "kind": "opportunity", "label": "New measures from documents and text", "text": "In an Annual Review of Economics article, Ludwig and colleagues show that labels produced by a language model can support rigorous estimates when researchers hand-code a small validation sample and use it to correct the labels’ errors {{S08-013}}. Researchers may therefore measure constructs in filings or annual reports that were too costly to code by hand.", "source_ids": ["S08-013"], "evidence": "direct"}, {"id": "quantitative-data-3", "kind": "opportunity", "label": "Data preparation recorded in code", "text": "When AI writes all cleaning and linking steps as code, with no edits by hand, a colleague can inspect and rerun each step. Such code also helps authors meet journal rules on documented data and code, such as those of the American Economic Association {{S06-009}}.", "source_ids": ["S06-009"], "evidence": "reasoned"}, {"id": "quantitative-data-4", "kind": "risk", "label": "Wrong record links and extraction errors", "text": "A wrong match between records, or an error repeated across many extracted values, can pass unnoticed into a plausible-looking variable, and in a guide for empirical researchers, Christensen and Hansen show that ignoring errors in AI-generated variables can bias estimates and invalidate inference {{S07-07}}.", "source_ids": ["S07-07"], "evidence": "direct"}, {"id": "quantitative-data-5", "kind": "risk", "label": "AI-generated measures that miss the construct", "text": "Ludwig and colleagues show that changing the language model or the prompt can change estimates based on model-produced measures in sign, size, or significance {{S08-013}}, and company documents differ in language and reporting standards {{S07-08}}, so even an accurate AI extraction may measure something other than the construct the study needs.", "source_ids": ["S08-013", "S07-08"], "evidence": "direct"}, {"id": "quantitative-data-6", "kind": "risk", "label": "Data processed outside its terms", "text": "A researcher who is allowed to use a dataset is not thereby allowed to send the data to any AI tool. RUG guidance limits external AI tools to public information {{S03-004}}, and CBS microdata can be analysed only inside a secure CBS environment {{S06-021}}.", "source_ids": ["S03-004", "S06-021"], "evidence": "reasoned"}, {"id": "quantitative-data-7", "kind": "risk", "label": "Less familiarity with the raw data", "text": "In a Nature comment, Messeri and Crockett argue that automating entry-level research work may remove tasks in which researchers develop tacit judgement, although they concede that some of that work may prove unnecessary {{S13-303}}. A researcher who never prepares the data may not learn why a measure changed or where records are thin, and may miss such problems in the analysis.", "source_ids": ["S13-303"], "evidence": "reasoned"}], "source_locators": {"S03-004": "RUG Vibe FAQ, updated 9 September 2026, general FAQ lines 100–170 and the FAQ on uploading PDFs", "S06-009": "AEA Data and Code Policies and Guidance page, lines 6–24 on documented data and code", "S06-021": "CBS Microdata “How does it work?”, steps 1–4 on authorisation and controlled output", "S06-023": "SEC EDGAR API overview, submissions, XBRL, and Programmatic API Access", "S07-07": "Christensen and Hansen, AEA Papers and Proceedings, pp. 92–97: generated covariates, bias and valid inference.", "S07-08": "Levich and Knust, accounting annual-report ownership extraction, publisher abstract and methods summary", "S07-32": "Snyder, open publisher text sections 2.1–2.2 and Table 2 on review methods", "S08-013": "Ludwig, Mullainathan and Rambachan, Annual Review of Economics, introduction, §4 on estimation with LLM outputs, and concluding checklist", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-303": "Messeri and Crockett, Nature comment, original PDF printed pp. 675–676"}}, "quantitative-analysis": {"task_scope": "AI writes the main estimation or meta-analysis code and robustness analyses and proposes an interpretation; the researcher checks the code for errors and judges which claims the estimates support.", "impacts": [{"id": "quantitative-analysis-1", "kind": "opportunity", "label": "Robustness checks that were too costly", "text": "In a Google-led study, an AI system helped scientists write expert-level empirical software for tasks whose results could be scored {{S06-018}}, and researchers may use such help to run additional estimators and robustness checks that would otherwise take too long. Such checks improve a study when they test a real weakness in its main estimate.", "source_ids": ["S06-018"], "evidence": "adjacent"}, {"id": "quantitative-analysis-2", "kind": "opportunity", "label": "Quick checks that results reproduce", "text": "In a 2026 preprint, the strongest coding agent tested reproduced most selected social-science results from complete replication packages {{S08-010}}. A researcher can use such an agent to check before submission that the paper’s replication package runs from start to finish, and a supervisor or coauthor can rerun the package without rebuilding the analysis.", "source_ids": ["S08-010"], "evidence": "direct"}, {"id": "quantitative-analysis-3", "kind": "opportunity", "label": "Explanations that help learn a method", "text": "In a randomised trial, a purpose-built AI tutor improved immediate learning in a university physics course {{S09-005}}, and in high-school mathematics, a tutor designed with teachers largely avoided the learning loss that unrestricted AI help caused {{S09-004}}. A researcher who asks AI to explain each step of the generated code may learn a new method faster.", "source_ids": ["S09-005", "S09-004"], "evidence": "adjacent"}, {"id": "quantitative-analysis-4", "kind": "risk", "label": "Coding errors behind plausible tables", "text": "In a randomised reproduction exercise with social-science researchers, teams with AI assistance reproduced results about as often as human-only teams but found fewer major coding errors {{S08-009}}, so a table that looks right may still rest on a mistake in the code.", "source_ids": ["S08-009"], "evidence": "direct"}, {"id": "quantitative-analysis-5", "kind": "risk", "label": "Results claimed beyond what they show", "text": "When coding agents in a 2026 preprint were nudged towards the published result, they recognised less often that a task with missing data or code could not be reproduced {{S08-010}}. A researcher who asks AI for many specifications and an interpretation may also report the most persuasive result without saying which analyses were planned or which claims the design supports.", "source_ids": ["S08-010"], "evidence": "direct"}, {"id": "quantitative-analysis-6", "kind": "risk", "label": "Less practice in finding coding errors", "text": "In a randomised experiment, programmers who used AI while learning an unfamiliar software library scored lower on a later test of debugging and concepts {{S09-003}}, and in school mathematics, unrestricted AI help improved practice but lowered later unaided performance {{S09-004}}. A researcher who lets AI write and fix the code may also get less practice in diagnosing errors.", "source_ids": ["S09-003", "S09-004"], "evidence": "adjacent"}, {"id": "quantitative-analysis-7", "kind": "risk", "label": "More scripts and specifications to review", "text": "In a randomised reproduction exercise in the social sciences, AI assistance did not significantly shorten the time teams needed to reproduce results {{S08-009}}. Every extra script and specification that AI produces still has to be checked, by the researcher or by the colleagues who supervise and coauthor the paper.", "source_ids": ["S08-009"], "evidence": "reasoned"}], "source_locators": {"S06-018": "Aygün et al., local PDF pp. 2–10, Results and Discussion; Nature version", "S08-009": "Brodeur et al., PNAS p. 5 Table 1 and Results section 2.2 on reproduction and errors; PDF pp. 5–6 and Tables 1–2 on time to reproduction", "S08-010": "Alizadeh et al., preprint HTML sections 2.1, 2.4, 5.1–5.3 and Figures 1 and 5", "S09-003": "Shen and Tamkin, local original PDF pp. 1–2, 8–10, 17–19: randomized unfamiliar-library task, learning quiz and limitations", "S09-004": "Bastani et al., local author-version PDF pp. 1–5, 9–11 and Table 1; discussion pp. 19–20", "S09-005": "Kestin et al., Scientific Reports, Methods (design and participants), Results and Discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "quantitative-writing": {"task_scope": "AI drafts substantial manuscript sections or replies to reviewers from the authors’ outline and results; the authors check the argument and whether the results support each claim.", "impacts": [{"id": "quantitative-writing-1", "kind": "opportunity", "label": "First drafts written sooner", "text": "In a short professional-writing experiment, participants who used AI finished in about 40 percent less time and their texts were rated higher {{S05-007}}, so authors who start from their own outline and result tables may reach a draft of a methods or results section sooner.", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "quantitative-writing-2", "kind": "opportunity", "label": "Reviewer comments tracked one by one", "text": "AI can set out each reviewer comment beside the passage and analysis it concerns and draft a reply to each, so that authors are less likely to leave a criticism unanswered in a long revision.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-3", "kind": "opportunity", "label": "Clearer English for second-language authors", "text": "Authors who write in a second language may find it easier to explain a design or answer a reviewer in clear English when AI drafts from their own outline.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-4", "kind": "risk", "label": "Overstated claims and faulty citations", "text": "In an experiment with management consultants, AI help made answers more persuasive even when they were wrong {{S05-009}}, and an audit of biomedical papers found fabricated references, although it could not show that AI produced them {{S06-019}}. An author who works from a fluent AI draft may not notice that a cautiously worded estimate has become a causal claim, or that a paper is cited for something it does not show.", "source_ids": ["S05-009", "S06-019"], "evidence": "adjacent"}, {"id": "quantitative-writing-5", "kind": "risk", "label": "AI drafts that steer the argument", "text": "In two experiments, deliberately biased AI writing suggestions shifted the views that people expressed on societal issues {{S13-001}}, and in another study, agreeable AI responses about interpersonal conflicts made people more convinced that they were right {{S13-002}}. In research writing, an AI-drafted reply to reviewers may sound responsive while leaving the main objection unanswered, and the author may come to accept how the AI draft describes what the paper adds.", "source_ids": ["S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "quantitative-writing-6", "kind": "risk", "label": "Less practice in building the argument", "text": "Researchers often find out what they can claim while they explain a result in writing, so authors who let AI draft substantial sections get less of that practice and may find it harder to defend the argument as their own.", "source_ids": [], "evidence": "reasoned"}, {"id": "quantitative-writing-7", "kind": "risk", "label": "More text for coauthors and reviewers", "text": "In an Organization Science editorial, the editors report that submissions rose by 42 percent from 2022–2023 to 2024–2025 and that manuscripts with higher AI-detector scores were less readable and more often rejected without review, although they could not show that AI caused these differences {{S06-020}}. When drafting becomes easier, coauthors, supervisors, and reviewers receive more text whose claims they have to check.", "source_ids": ["S06-020"], "evidence": "adjacent"}], "source_locators": {"S05-007": "Noy and Zhang, Science 2023 published abstract; short professional-writing randomisation, not a research manuscript", "S05-009": "Dell’Acqua et al., published original PDF pp. 2, 7–9, 11–13 and Tables 4, 7, 9: inside/outside frontier and persuasive wrong answers", "S06-019": "Topaz et al., Lancet correspondence pp. 1779–81 methods and limitations; erratum exists", "S06-020": "Gartenberg et al., Organization Science original PDF pp. 2, 5–10 (printed pp. 1, 4–9), Figure 1, Table 1", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S09-014": "Universitair docent, research, publication and teaching result areas pp. 3–5; UD2/UD1 criteria p. 8", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 limitations and methods", "S13-002": "Cheng et al., PDF pp. 5 and 7–8 (article pp. 4 and 6–7)"}}, "qualitative-question": {"task_scope": "AI proposes questions, concepts and explanations for the organisations or people a project studies; the researcher judges which are worth pursuing and which fieldwork can answer.", "impacts": [{"id": "qualitative-question-1", "kind": "opportunity", "label": "Rival explanations brought into view", "text": "AI can suggest explanations and concepts that the researcher had not considered, including ideas from neighbouring fields, and these suggestions may lead the researcher to ask participants about a practice that the first interviews missed. In a field experiment on product innovation, AI helped professionals more with generating ideas than with choosing the best one. {{S13-103}}", "source_ids": ["S13-103"], "evidence": "adjacent"}, {"id": "qualitative-question-2", "kind": "opportunity", "label": "Faster orientation in a new industry", "text": "A researcher who enters an unfamiliar industry or discipline can ask AI to explain its vocabulary and debates and so arrive at the first conversations with participants better prepared. Korinek counts background research and ideation among the uses of AI in economic research. {{S06-001}}", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "qualitative-question-3", "kind": "risk", "label": "Questions the fieldwork cannot answer", "text": "A question can sound promising in general and still ask about things that participants cannot discuss or that the researcher’s access does not reach. Qualitative researchers need to fit the question to the state of prior work and to the evidence they can gather {{S06-004}}, and what they can gather depends on access that develops through relationships with the organisations and people they study. {{S06-024}}", "source_ids": ["S06-004", "S06-024"], "evidence": "reasoned"}, {"id": "qualitative-question-4", "kind": "risk", "label": "Narrower and more familiar questions", "text": "AI suggestions that draw on common framings of a topic may steer researchers towards questions that many others already ask. Messeri and Crockett argue that questions which need attention to subjectivity and nuance risk being sidelined when researchers rely on AI {{S06-014}}, and in an experiment with 293 writers, stories written with AI ideas were rated more creative but resembled one another more. {{S05-016}}", "source_ids": ["S06-014", "S05-016"], "evidence": "adjacent"}, {"id": "qualitative-question-5", "kind": "risk", "label": "Less practice in forming a question", "text": "Choosing a question and explaining why fieldwork with the chosen people or organisations can answer it is part of learning qualitative research, and a researcher who adopts an AI suggestion may find that explanation harder to give. Doctoral candidates develop their research plan with a supervisor {{S09-012}}, and FEB’s career track for new assistant professors assesses the originality of their research. {{S01-002}}", "source_ids": ["S09-012", "S01-002"], "evidence": "reasoned"}, {"id": "qualitative-question-6", "kind": "risk", "label": "Early field notes shared with AI tools", "text": "To get suggestions that suit the organisation they study, researchers may give an AI tool early field notes or details about the organisation that their access agreement protects. RUG’s AI Office limits external AI tools to public information and sets conditions for personal data in its contracted tool. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S13-103": "Dell’Acqua et al., published PDF pp. 2–4, 12–18 and 20–22, stage decomposition showing larger AI gains in idea generation than in selection", "S06-001": "Korinek, published PDF pp. 1281–84, use cases including background research and ideation", "S06-004": "Edmondson and McManus, original PDF pp. 1155–56 and Table 1 on methodological fit", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S06-014": "Messeri and Crockett 2024, Nature printed p. 54 on monocultures of knowing and questions that need attention to subjectivity; Box 1 p. 50", "S05-016": "Doshi and Hauser, PMC full text Results and Discussion, 293-writer short-story experiment", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S01-002": "FEB Career Tracks 2025, PDF cover p. 1 and pp. 15–16, Research Profile promotion criteria for new hires from 1 January 2026", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), general FAQ on external tools and research FAQ on personal data, page last modified 9 September 2026"}}, "qualitative-literature": {"task_scope": "AI searches, screens, summarises and compares studies on the topic; the researcher checks for missing studies and differing theories and reads central studies in full.", "impacts": [{"id": "qualitative-literature-1", "kind": "opportunity", "label": "Wider search across terms and fields", "text": "AI search can bring up qualitative studies that describe a similar process in other words or in a neighbouring discipline. In a test on five systematic reviews, an AI screening model identified some studies that human reviewers had missed, although it also flagged many irrelevant ones. {{S07-21}}", "source_ids": ["S07-21"], "evidence": "adjacent"}, {"id": "qualitative-literature-2", "kind": "opportunity", "label": "Less time screening and summarising", "text": "AI can screen titles and abstracts and summarise many studies in the time a researcher needs for a few. In one living systematic review, a tuned prompt found every study that was eventually included, and a simulation suggested that it could reduce the screening workload by 65 to 85 percent. {{S06-012}}", "source_ids": ["S06-012"], "evidence": "adjacent"}, {"id": "qualitative-literature-3", "kind": "opportunity", "label": "Studies compared side by side", "text": "AI can list where many studies were done, whom they studied, and what they claim, which may show the researcher where the studies disagree. In one evaluation, a system that searched scientific papers before answering did better than a general model on questions that drew on several papers. {{S08-020}}", "source_ids": ["S08-020"], "evidence": "adjacent"}, {"id": "qualitative-literature-4", "kind": "risk", "label": "Relevant studies missed or skewed", "text": "AI screening and recommendations can leave out relevant work, and qualitative studies published as books or in less-cited outlets may be among the first to drop out. In one study, GPT-4’s agreement with human screeners varied across tasks and looked weaker after adjusting for chance and for the rarity of eligible studies {{S06-011}}, and GPT-4o’s citation suggestions favoured highly cited papers. {{S08-017}}", "source_ids": ["S06-011", "S08-017"], "evidence": "adjacent"}, {"id": "qualitative-literature-5", "kind": "risk", "label": "Findings stripped of who was studied and how", "text": "A summary can set two interview findings side by side without the organisations, participants, or analytic approach that gave each finding its meaning, so that studies using the same term appear to agree. Braun and Clarke point out that analyses built on different theoretical assumptions make different kinds of claims about what people say. {{S07-15}}", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-literature-6", "kind": "risk", "label": "Sources newcomers cannot yet judge", "text": "Without retrieval, GPT-4o invented citations in 78 to 90 percent of tested questions about recent literature {{S08-020}}, and a researcher who is still learning a field may not be able to tell whether a recommended study exists, says what the summary claims, or appeared in a credible outlet. Messeri and Crockett argue that searching and reading studies oneself is how trainees build that sense of a field, while granting that some of this searching and reading may prove unnecessary. {{S13-303}}", "source_ids": ["S08-020", "S13-303"], "evidence": "direct"}, {"id": "qualitative-literature-7", "kind": "risk", "label": "Licensed articles in AI tools", "text": "Comparing studies closely often means giving a tool their full texts, but RUG’s AI Office states that subscription articles may not be uploaded to its contracted tool unless the publisher’s licence allows it, and it reports that no publisher had yet given that permission. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}], "source_locators": {"S07-21": "Tran et al., PubMed abstract Methods and Results, five reviews and 22,665 citations", "S06-012": "Homiar et al., PubMed abstract Methods and Results, sensitivity and simulated workload reduction in one living review", "S08-020": "Asai et al. (OpenScholar), Nature main text opening, Table 1 and Methods baseline-model section, including citation fabrication without retrieval", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S08-017": "Algaba et al., arXiv abstract, experiment and results on citation recommendation bias", "S07-15": "Braun and Clarke, printed pp. 94–95 on the mismatch between theoretical framework and analytic claims, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on literature work as training for early-career researchers", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), question on uploading PDFs of articles, page last modified 9 September 2026"}}, "qualitative-design": {"task_scope": "AI drafts a sampling plan, interview guide or observation plan; the researcher checks it against participant access, consent and the developing research question.", "impacts": [{"id": "qualitative-design-1", "kind": "opportunity", "label": "Options to compare before fieldwork", "text": "An AI draft gives the researcher several sampling choices and follow-up questions to compare before anyone is approached, and it may point to a group of participants or a line of questioning that the researcher’s first plan left out.", "source_ids": [], "evidence": "reasoned"}, {"id": "qualitative-design-2", "kind": "opportunity", "label": "Quicker first drafts of guides and plans", "text": "Starting from a full draft of an interview guide, sampling plan, or information letter can save the researcher time. In a large test of an AI feature in Google Forms, users who adopted it spent about 27 percent less time editing their forms, although the test did not assess the quality of the questions. {{S05-012}}", "source_ids": ["S05-012"], "evidence": "adjacent"}, {"id": "qualitative-design-3", "kind": "risk", "label": "Leading or unrealistic interview questions", "text": "An interview question that reads well on paper may lead participants towards an answer or miss how work in the organisation studied actually happens, and the researcher may notice only after the question has shaped several interviews. In a study in which a chatbot interviewed social scientists, the researchers observed leading questions and missed follow-ups. {{S06-025}}", "source_ids": ["S06-025"], "evidence": "adjacent"}, {"id": "qualitative-design-4", "kind": "risk", "label": "Plans that assume access and consent", "text": "A complete-looking AI plan can take for granted access to people and consent that have not yet been negotiated, including consent for any AI tool that will process participants’ words. Access in qualitative research develops through relationships with the organisations or communities studied {{S06-024}}, and research use of personal data still requires a lawful basis and safeguards. {{S03-010}}", "source_ids": ["S06-024", "S03-010"], "evidence": "reasoned"}, {"id": "qualitative-design-5", "kind": "risk", "label": "Less practice in planning fieldwork", "text": "Researchers learn how a qualitative method works in practice by deciding whom to approach and how to ask, and someone who adopts an AI draft may not be able to explain those choices to a supervisor or committee. Doctoral candidates develop their research plan with a supervisor and collect, analyse, and interpret the data under supervision. {{S09-012}}", "source_ids": ["S09-012"], "evidence": "reasoned"}], "source_locators": {"S05-012": "Strand et al., primary PDF pp. 6–8, Google Forms experiment on editing time (local average treatment effect among feature users)", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S06-024": "Riese, publisher abstract sentences 1–3 on evolving qualitative field access", "S03-010": "GDPR Articles 6, 9(2)(j) and 89 on lawful basis and research safeguards", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5"}}, "qualitative-data": {"task_scope": "With access and consent in place, AI transcribes and organises interviews, field notes or documents and can conduct or support interviews under a set procedure; the researcher checks the transcripts against the recordings and field notes.", "impacts": [{"id": "qualitative-data-1", "kind": "opportunity", "label": "Less time transcribing and organising", "text": "Transcription takes a great deal of time {{S07-15}}, so AI that transcribes recordings and sorts interviews, field notes, and documents may leave the researcher more time for fieldwork and reading.", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-data-2", "kind": "opportunity", "label": "Fuller answers from AI follow-ups", "text": "When a study builds AI follow-up questions into a set procedure, participants may give fuller answers, as a web-survey experiment with 1,800 participants found for AI follow-ups to open questions. {{S06-026}} In another study, a chatbot interviewed 74 social scientists whom researchers had recruited and adapted its questions to their answers. {{S06-025}}", "source_ids": ["S06-026", "S06-025"], "evidence": "direct"}, {"id": "qualitative-data-3", "kind": "risk", "label": "Transcripts that change the meaning", "text": "An automatic transcript may drop words, confuse speakers, or punctuate an answer so that it says something else. Braun and Clarke note that punctuation alone can change what a passage means and that transcripts should always be checked against the recording. {{S07-15}}", "source_ids": ["S07-15"], "evidence": "reasoned"}, {"id": "qualitative-data-4", "kind": "risk", "label": "AI interviewers change the conversation", "text": "When an AI tool conducts the interview, the tool’s questions and follow-ups shape what participants say. Researchers who let a chatbot interview social scientists observed missed follow-ups, leading questions, and interruptions {{S06-025}}, and the web-survey experiment found trade-offs in coding accuracy and in participants’ experience alongside the fuller answers. {{S06-026}}", "source_ids": ["S06-025", "S06-026"], "evidence": "direct"}, {"id": "qualitative-data-5", "kind": "risk", "label": "Confidential recordings in unsuitable tools", "text": "Interview recordings and transcripts often contain personal and sometimes special-category data, such as health information, and the tools that researchers are permitted to use differ in what they may receive. RUG’s AI Office allows transcripts with ordinary personal data in its contracted chat tool only with certain functions switched off, excludes special-category content, and recommends transcription on RUG infrastructure for the most sensitive audio. {{S03-004}}", "source_ids": ["S03-004"], "evidence": "reasoned"}, {"id": "qualitative-data-6", "kind": "risk", "label": "Less familiarity with the interviews", "text": "Transcribing is one way in which researchers come to know their interviews, and Braun and Clarke advise those who receive ready-made transcripts to spend more time familiarising themselves with the data. {{S07-15}} Messeri and Crockett note that some researchers consider their own reading and analysis of qualitative material necessary for understanding what participants experienced. {{S13-303}}", "source_ids": ["S07-15", "S13-303"], "evidence": "reasoned"}], "source_locators": {"S07-15": "Braun and Clarke, printed pp. 87–88, phase 1 familiarisation and transcription, read in the local original PDF", "S06-026": "Barari et al., journal abstract, PDF pp. 161–64, Results and Discussion", "S06-025": "Jack et al., Abstract, Recruitment and Application, Sample, Discussion, and Consent", "S03-004": "RUG AI Office, FAQ on Mistral Le Chat (Vibe), research questions on processing transcripts and transcribing audio files, page last modified 9 September 2026", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating interviews and the analysis of qualitative data"}}, "qualitative-analysis": {"task_scope": "AI applies a codebook where the study uses fixed codes, compares passages and proposes themes or interpretations; the researcher judges each against the full transcripts, field notes and the analysis method the study reports.", "impacts": [{"id": "qualitative-analysis-1", "kind": "opportunity", "label": "Faster coding with a fixed codebook", "text": "Where a study uses a defined codebook, AI can apply codes and retrieve passages across more transcripts than a team could code by hand. In one deductive coding task, GPT-3 reached fair to substantial agreement with expert codes (κ = .61 and .38), although the experts agreed with each other more closely (κ = .88 and .90). {{S07-02}}", "source_ids": ["S07-02"], "evidence": "direct"}, {"id": "qualitative-analysis-2", "kind": "opportunity", "label": "Rival readings and overlooked passages", "text": "AI can set passages side by side and suggest readings that the researcher had not considered, which may lead the researcher back to passages that challenge an early interpretation. Wise and colleagues argue that prompts used within an analysis that researchers lead can sharpen what researchers notice and how they reflect on their own role. {{S07-18}}", "source_ids": ["S07-18"], "evidence": "reasoned"}, {"id": "qualitative-analysis-3", "kind": "risk", "label": "Themes that miss what remarks meant", "text": "AI-proposed themes can capture what is said often and miss what a remark means given who made it and in what situation, as one interview study found and as a commentary on management accounting research warns. {{S07-16}}{{S07-19}} A researcher who starts from such themes may also give too little weight to passages that contradict them, which Braun and Clarke treat as a sign of weak analysis. {{S07-15}}", "source_ids": ["S07-16", "S07-19", "S07-15"], "evidence": "direct"}, {"id": "qualitative-analysis-4", "kind": "risk", "label": "Less practice in interpretation", "text": "Researchers learn to interpret qualitative material by working through it and reviewing themes against the coded extracts and the whole data set {{S07-15}}, and a candidate who mainly checks AI themes may not develop that skill. Messeri and Crockett describe a disagreement among researchers about whether one’s own reading and analysis of such material is needed to understand participants’ experiences. {{S13-303}}", "source_ids": ["S07-15", "S13-303"], "evidence": "reasoned"}, {"id": "qualitative-analysis-5", "kind": "risk", "label": "AI use beyond the stated method or consent", "text": "Jowsey, Braun, Clarke, and colleagues reject generative AI for reflexive qualitative research on methodological and ethical grounds {{S07-17}}, whereas Wise and colleagues describe analysis with AI in the loop. {{S07-18}} A researcher whose stated analysis method or participants’ consent does not cover AI processing may face objections from reviewers or examiners and may go beyond what participants agreed to.", "source_ids": ["S07-17", "S07-18"], "evidence": "reasoned"}, {"id": "qualitative-analysis-6", "kind": "risk", "label": "More AI output to verify", "text": "Each AI-proposed code or theme has to be traced back to the passages behind it, and Braun and Clarke describe theme review as rereading the coded extracts and then the whole data set. {{S07-15}} Supervisors and co-authors who receive analyses built on AI themes face the same rereading for material they did not code themselves.", "source_ids": ["S07-15"], "evidence": "reasoned"}], "source_locators": {"S07-02": "Xiao et al., author PDF pp. 2–3 (printed pp. 76–77) and Figure 1, kappa values for GPT-3 and expert coders", "S07-18": "Wise, Gresalfi and Spencer-Smith, abstract and sections on core commitments of qualitative inquiry", "S07-16": "Matta et al., Methods, Case and Discussion, missed context in interview analysis", "S07-19": "Goretzki and Mahlendorf, publisher abstract and introduction on surface patterns and situated meaning", "S07-15": "Braun and Clarke, printed p. 91 on reviewing themes against coded extracts and the whole data set and pp. 94–95 on weak analysis, read in the local original PDF", "S13-303": "Messeri and Crockett 2026, Nature comment printed p. 676 on automating the analysis of qualitative data", "S07-17": "Jowsey, Braun, Clarke et al., position article abstract and methodological argument"}}, "qualitative-writing": {"task_scope": "AI drafts paper sections or replies to reviewers from the project’s excerpts, field notes and interpretive outline; the researcher checks that claims and quotations keep their meaning and that contrary cases remain.", "impacts": [{"id": "qualitative-writing-1", "kind": "opportunity", "label": "Faster drafting and revision", "text": "AI can turn an interpretive outline into a full draft and organise reviewer comments, so the authors spend less time on first versions and replies. In a short professional-writing experiment, AI assistance cut completion time and raised rated quality, although a journal article makes different demands. {{S05-007}}", "source_ids": ["S05-007"], "evidence": "adjacent"}, {"id": "qualitative-writing-2", "kind": "opportunity", "label": "Clearer case narratives", "text": "An AI draft can help authors present a long case so that readers can follow how the interview evidence supports each claim, which may be of particular help to researchers who write in a second language.", "source_ids": [], "evidence": "reasoned"}, {"id": "qualitative-writing-3", "kind": "risk", "label": "Contrary evidence smoothed away", "text": "A fluent draft may drop a contrary case, move a quotation to where it seems to mean something else, or soften a reviewer’s criticism, and Braun and Clarke treat claims that the extracts do not support as a sign of weak analysis. {{S07-15}} In experiments outside research, biased writing suggestions shifted users’ attitudes, and flattering AI responses made people more certain that they were right. {{S13-001}}{{S13-002}}", "source_ids": ["S07-15", "S13-001", "S13-002"], "evidence": "adjacent"}, {"id": "qualitative-writing-4", "kind": "risk", "label": "Less practice writing up interpretation", "text": "Writing up is the final phase of a qualitative analysis, in which researchers work out what their interviews and observations show {{S07-15}}, so a researcher who mainly edits AI drafts may skip part of that interpretive work. In a three-month trial with patent lawyers, AI improved assisted drafts, but on a later task without AI, junior lawyers did no better on average, whereas lawyers with at least seven years in patent law outperformed their controls. {{S13-101}}", "source_ids": ["S07-15", "S13-101"], "evidence": "adjacent"}, {"id": "qualitative-writing-5", "kind": "risk", "label": "More drafts for others to check", "text": "When drafting becomes cheap, more of the checking moves to supervisors, co-authors, and reviewers, who have to compare more text with interview transcripts they may not know. An Organization Science editorial reports a steep rise in submissions and finds that manuscripts with higher AI-detector scores were less readable and fared worse editorially, although this evidence comes from one journal and does not establish cause. {{S06-020}}", "source_ids": ["S06-020"], "evidence": "adjacent"}, {"id": "qualitative-writing-6", "kind": "risk", "label": "Undisclosed use and shared excerpts", "text": "The European Commission’s guidelines ask researchers to be open about substantial use of AI in their research {{S03-006}}, and drafting from the project’s interviews means giving an AI tool excerpts that participants shared in confidence.", "source_ids": ["S03-006"], "evidence": "reasoned"}], "source_locators": {"S05-007": "Noy and Zhang, Science published abstract, 453 professionals in short writing tasks", "S07-15": "Braun and Clarke, Table 1 p. 87 and printed pp. 93–95 on producing the report as the final phase of analysis and on claims the extracts do not support, read in the local original PDF", "S13-001": "Williams-Ceci et al., PDF p. 4 Results and pp. 9–10 methods and limitations", "S13-002": "Cheng et al., PDF pp. 5 and 7–8, experimental results", "S13-101": "Autor et al., NBER original PDF pp. 2–5, 14, 17–19, 23–24 and 38–40, Tables 2 and 6, assisted drafting versus unassisted redlining; senior means at least seven years in patent law", "S06-020": "Gartenberg et al., Organization Science editorial, original PDF pp. 2 and 5–10 (printed pp. 1 and 4–9), Figure 1 and Table 1", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9 on researcher duties and disclosure"}}, "theory_review-question": {"task_scope": "AI proposes theoretical questions, concepts, mechanisms and what a review should cover; the researcher chooses the problem and explains what it adds to existing theories or reviews.", "impacts": [{"id": "theory_review-question-1", "kind": "opportunity", "label": "More framings to compare", "text": "In a guide for economists, Korinek shows how they can use AI to brainstorm research ideas {{S06-001}}, and researchers can also ask AI for rival mechanisms, concepts from neighbouring fields, or possible scopes for a review to compare before they choose a problem. In a field experiment on product innovation, professionals with AI produced higher-rated ideas than those without AI, ideas that depended less on their own professional background {{S13-103}}.", "source_ids": ["S06-001", "S13-103"], "evidence": "adjacent"}, {"id": "theory_review-question-2", "kind": "opportunity", "label": "Early objections to a problem", "text": "Korinek also demonstrates how AI can supply counterarguments and feedback on research ideas {{S06-001}}, so a researcher can test a proposed question against objections and may see that the question does not survive them before much work has gone into it.", "source_ids": ["S06-001"], "evidence": "reasoned"}, {"id": "theory_review-question-3", "kind": "risk", "label": "Familiar ideas presented as new", "text": "Cornelissen warns that authors can prompt AI to keep rephrasing until a construct seems new and to supply plausible stories for patterns after the fact {{S13-301}}, so a researcher may claim as new an idea that earlier work already proposed. In a demonstration in finance, Novy-Marx and Velikov used AI to generate many complete papers, each with its own theoretical justification, from a template built around selected stock-return predictors {{S13-307}}.", "source_ids": ["S13-301", "S13-307"], "evidence": "adjacent"}, {"id": "theory_review-question-4", "kind": "risk", "label": "Harder to pick the best of many ideas", "text": "In a product-innovation experiment, professionals who worked with AI were less likely to pick their own best idea, although the ideas they selected were still of higher quality than those chosen without AI {{S13-103}}. In experiments on interpersonal advice, agreeable AI responses made people more convinced that they were right {{S13-002}}, which could lead researchers to stop questioning an appealing research question too early.", "source_ids": ["S13-103", "S13-002"], "evidence": "adjacent"}, {"id": "theory_review-question-5", "kind": "risk", "label": "Less practice in framing problems", "text": "A PhD candidate plans and conducts the research under supervision and prepares a dissertation {{S09-012}}, and a conceptual article needs an explicit justification of the theories and concepts it brings together {{S07-33}}. A researcher who starts from AI framings may get less practice in building that justification, which candidates in particular still have to learn.", "source_ids": ["S09-012", "S07-33"], "evidence": "reasoned"}, {"id": "theory_review-question-6", "kind": "risk", "label": "Uncited sources and undisclosed AI use", "text": "European guidelines note that AI output may rest on other researchers’ work that needs citing, and they treat using AI to identify research gaps or to develop hypotheses as substantial use that researchers should disclose {{S03-006}}.", "source_ids": ["S03-006"], "evidence": "reasoned"}, {"id": "theory_review-question-7", "kind": "risk", "label": "Time spent weighing many framings", "text": "When AI makes problem framings cheap to produce, researchers spend more of their effort weighing them, and supervisors, whose job profiles include guiding staff and PhD candidates {{S09-015}} {{S09-016}}, may receive more AI-framed research proposals to assess.", "source_ids": ["S09-015", "S09-016"], "evidence": "reasoned"}], "source_locators": {"S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S13-103": "Dell’Acqua et al., original Organization Science PDF pp. 2–4 and 12–18, idea generation versus selection and functional background", "S13-301": "Cornelissen, local accepted manuscript PDF pp. 5–8 (manuscript pp. 4–7), construct labels and stories fitted after the fact; conceptual critique, not outcome data", "S13-307": "Novy-Marx and Velikov, AEA Journal of Economic Literature publisher abstract, DOI 10.1257/jel.20251821; full text unavailable", "S13-002": "Cheng et al., original PDF pp. 5 and 7–8 (article pp. 4 and 6–7), experiments on agreeable advice and discussion", "S09-012": "Promovendus UFO profile, result areas 1–7, PDF pp. 2–3; level description p. 5", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "theory_review-literature": {"task_scope": "AI searches, screens, summarises and compares studies; the researcher checks which studies and fields the search missed and reads the originals the argument rests on.", "impacts": [{"id": "theory_review-literature-1", "kind": "opportunity", "label": "Reach into neighbouring literatures", "text": "Cronin and George note that research communities studying the same topic often use different terms and develop in parallel, so authors have to look deliberately beyond their own field {{S06-006}}. AI search can cover such terms across fields, and in a benchmark a system that retrieves papers answered questions that drew on several papers better than a general model did {{S08-020}}.", "source_ids": ["S06-006", "S08-020"], "evidence": "adjacent"}, {"id": "theory_review-literature-2", "kind": "opportunity", "label": "Faster first pass through the literature", "text": "In one living review in mental health, updated as new studies appear, a carefully tested screening prompt found every study that was eventually included while sparing reviewers most of the screening work in a simulation {{S06-012}}, and researchers can spend the time saved on the studies that the review’s conclusions rest on.", "source_ids": ["S06-012"], "evidence": "direct"}, {"id": "theory_review-literature-3", "kind": "opportunity", "label": "Quicker orientation in unfamiliar fields", "text": "Researchers can ask AI to explain unfamiliar concepts and to summarise the debates in another field before they read that field’s main papers, uses that Korinek demonstrates for economic research {{S06-001}}. In a high-school mathematics trial, an AI tutor designed with teachers largely avoided the harm that unrestricted AI help did to students’ later work without AI {{S09-004}}.", "source_ids": ["S06-001", "S09-004"], "evidence": "adjacent"}, {"id": "theory_review-literature-4", "kind": "risk", "label": "Highly cited work favoured over minority views", "text": "In a study that asked GPT-4o to recommend citations, the model favoured highly cited papers {{S08-017}}, and Cronin and George warn that a preference for high-status journals or for one’s own research community can leave a review incomplete and one-sided {{S06-006}}.", "source_ids": ["S08-017", "S06-006"], "evidence": "adjacent"}, {"id": "theory_review-literature-5", "kind": "risk", "label": "Sources and summaries taken on trust", "text": "In one benchmark, a general language model that could not look up papers invented citations most of the time when asked about recent literature {{S08-020}}, and even a correct citation can come with a wrong summary, which European guidance makes the researcher responsible for checking {{S03-006}}. A researcher new to a field may also be unable to tell whether a recommended article comes from a reputable journal, in a literature of uneven quality that includes predatory publishers {{S06-014}}.", "source_ids": ["S08-020", "S03-006", "S06-014"], "evidence": "direct"}, {"id": "theory_review-literature-6", "kind": "risk", "label": "Less practice in reading a field", "text": "Messeri and Crockett argue that searching, reading, and summarising the literature gives trainees a sense of which areas are crowded and which findings are rare, and they consider it a gamble to assume that this work can be skipped {{S13-303}}.", "source_ids": ["S13-303"], "evidence": "reasoned"}, {"id": "theory_review-literature-7", "kind": "risk", "label": "Checking summaries and missed studies takes time", "text": "Researchers who check AI summaries against the original studies and look for missed studies spend time that can offset the time AI saves, all the more because GPT-4’s screening performance varied by task in one evaluation {{S06-011}}. Supervisors, whose job profiles include guiding staff and PhD candidates {{S09-015}} {{S09-016}}, may also have to check part of a candidate’s AI-assisted review.", "source_ids": ["S06-011", "S09-015", "S09-016"], "evidence": "reasoned"}], "source_locators": {"S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-001": "Korinek, Journal of Economic Literature, published PDF pp. 1281–84, use-case sections on ideation and feedback, background research, and mathematical derivations", "S09-004": "Bastani et al., author-version PDF pp. 1–5, 9–11 and 19–20 and Table 1, unrestricted assistance versus a teacher-designed tutor", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution", "S06-014": "Messeri and Crockett, Nature Perspective printed pp. 49–52, Oracle vision, uneven literature quality and Box 1 illusions of understanding", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S06-011": "Khraisha et al., PubMed abstract Results on screening agreement and task variation", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria"}}, "theory_review-design": {"task_scope": "AI drafts a model’s assumptions, a conceptual framework or an integrative-review procedure; the researcher tests whether the design can yield an insight existing theories or reviews lack.", "impacts": [{"id": "theory_review-design-1", "kind": "opportunity", "label": "Alternative designs compared early", "text": "AI can draft several sets of model assumptions, conceptual frameworks, or review procedures, so a researcher can compare concrete options before committing a paper to one design. In one study, a method for training language models to build optimisation models improved their ability to turn written problem descriptions into formal models and solver code on benchmark tasks {{S07-05}}.", "source_ids": ["S07-05"], "evidence": "adjacent"}, {"id": "theory_review-design-2", "kind": "opportunity", "label": "Hidden premises made explicit", "text": "In guidance on formal theory, Makadok notes that formal models make authors state simplifications that verbal theory can leave implicit {{S13-306}}, and a researcher can likewise ask AI to list the assumptions on which a conceptual framework depends, which may reveal an unstated premise that the argument needs.", "source_ids": ["S13-306"], "evidence": "reasoned"}, {"id": "theory_review-design-3", "kind": "risk", "label": "Designs that omit a mechanism or a field", "text": "A formal model can omit a player, a constraint, or a whole causal mechanism that readers consider essential {{S13-306}}, and AI-drafted inclusion rules for a review can miss research communities that use different terms for the same construct {{S06-006}}. Success on modelling benchmarks does not show that a model’s simplifications suit the research question.", "source_ids": ["S13-306", "S06-006"], "evidence": "reasoned"}, {"id": "theory_review-design-4", "kind": "risk", "label": "Designs adopted without being understood", "text": "Jaakkola argues that a conceptual article needs an explicit justification of the theories and concepts it combines {{S07-33}}. A researcher who adopts an AI-drafted framework without that justification may struggle to defend it later and, if still in training, may not learn to build one.", "source_ids": ["S07-33"], "evidence": "reasoned"}, {"id": "theory_review-design-5", "kind": "risk", "label": "Design checks for supervisors and co-authors", "text": "Supervisors and co-authors need time to examine, premise by premise, a tidy AI design they did not build, and associate and full professors, whose job profiles include guiding staff and PhD candidates {{S09-015}} {{S09-016}}, may see a flawed design carried into several projects of their group.", "source_ids": ["S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-design-6", "kind": "risk", "label": "Procedures that others cannot repeat", "text": "Elsbach and van Knippenberg argue that an integrative review should describe how the literature was selected so that others can follow the procedure {{S13-305}}, and European guidance asks researchers to disclose substantial AI use and to allow for the different output that the same prompt can give {{S03-006}}.", "source_ids": ["S13-305", "S03-006"], "evidence": "reasoned"}], "source_locators": {"S07-05": "ORLM, publisher abstract and benchmark description; benchmarks do not test the choice of a substantive abstraction", "S13-306": "Makadok, original AMR PDF pp. 193–198, assumptions, omitted elements, derivations and accessibility", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S07-33": "Jaakkola, Designing conceptual articles, open publisher text, methodological requirements, Table 1 and Conclusions", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S13-305": "Elsbach and van Knippenberg, original PDF pp. 1277–1279 and 1287–1288, definition, methodology sections, thinly supported elements and studies as data", "S03-006": "EC Living Guidelines, third edition May 2026, printed pp. 7–9, researcher responsibility, citation checks, disclosure, unpublished work and attribution"}}, "theory_review-data": {"task_scope": "For integrative reviews, AI collects the studies, removes duplicates and extracts information from them; the researcher checks for missed studies, wrong inclusion decisions and extraction errors. Purely theoretical papers collect no data at this stage.", "impacts": [{"id": "theory_review-data-1", "kind": "opportunity", "label": "Studies collected and extracted faster", "text": "For an integrative review, whose included papers work much like data in an empirical study {{S13-305}}, AI can collect records, remove duplicates, and extract each study’s claims. In one living review in mental health, updated as new studies appear, a tested screening prompt missed none of the studies that were eventually included, and a simulation suggested that the prompt could spare reviewers most of the screening work {{S06-012}}.", "source_ids": ["S13-305", "S06-012"], "evidence": "direct"}, {"id": "theory_review-data-2", "kind": "opportunity", "label": "Broader search across research communities", "text": "Cronin and George define completeness in an integrative review as finding the range of research communities that study a topic, often under different names {{S06-006}}, and cheaper AI screening lets a team search more databases and search terms than it could screen by hand.", "source_ids": ["S06-006"], "evidence": "reasoned"}, {"id": "theory_review-data-3", "kind": "opportunity", "label": "Extracted claims linked to their passages", "text": "In a benchmark, a system that retrieves papers and cites the passages it draws on produced far fewer invented citations than a model without retrieval {{S08-020}}, and an extraction table that links each claim to its source passage makes the review’s studies easier for a second reader to check.", "source_ids": ["S08-020"], "evidence": "adjacent"}, {"id": "theory_review-data-4", "kind": "risk", "label": "Incomplete or one-sided study selection", "text": "A systematic review of 19 evaluations found widely varying errors when AI searched, screened, and extracted data for evidence syntheses, mostly in biomedicine {{S07-20}}. Language models that favour highly cited papers when suggesting citations {{S08-017}} can also tilt the set of studies away from minority views, which a balanced review has to represent {{S06-006}}.", "source_ids": ["S07-20", "S08-017", "S06-006"], "evidence": "direct"}, {"id": "theory_review-data-5", "kind": "risk", "label": "Less practice in appraising studies", "text": "Cronin and George note that a balanced review depends on judging the quality of findings from research traditions that judge research by different standards {{S06-006}}. Messeri and Crockett regard searching and reading the literature as part of how trainees learn a field {{S13-303}}, so leaving screening and extraction to AI can cost a researcher that practice.", "source_ids": ["S06-006", "S13-303"], "evidence": "reasoned"}, {"id": "theory_review-data-6", "kind": "risk", "label": "Checking selected studies takes time", "text": "Because AI makes errors in screening and extraction {{S07-20}}, the authors have to check a sample of the excluded studies and compare extracted claims with the original studies, and in a PhD candidate’s review part of that work falls to supervisors, whose job profiles include guiding staff and PhD candidates {{S09-015}} {{S09-016}}.", "source_ids": ["S07-20", "S09-015", "S09-016"], "evidence": "reasoned"}, {"id": "theory_review-data-7", "kind": "risk", "label": "Licensed articles in AI tools", "text": "The EU exception for text and data mining in research covers lawfully accessed works, but it does not by itself settle whether licensed full texts may be uploaded to a hosted AI service {{S03-012}}. RUG’s guidance for its Vibe service says that subscription articles may not be uploaded unless the publisher’s licence permits this use or the publisher agrees {{S03-004}}.", "source_ids": ["S03-012", "S03-004"], "evidence": "reasoned"}], "source_locators": {"S13-305": "Elsbach and van Knippenberg, original PDF pp. 1277–1279 and 1287–1288, definition, methodology sections, thinly supported elements and studies as data", "S06-012": "Homiar et al., PubMed abstract Methods and Results on calibrated screening and simulated workload in one living mental-health review", "S06-006": "Cronin and George, original PDF pp. 168–170 and 176–181, completeness, balance, terminology across communities and thematic synthesis", "S08-020": "OpenScholar, Nature main opening, Table 1, Methods baseline models and limitations", "S07-20": "Clark et al., PubMed abstract Methods and Results, 19-study synthesis of GenAI errors", "S08-017": "Algaba et al., arXiv abstract, experiment sample and results on citation selection", "S13-303": "Messeri and Crockett, Nature Comment printed pp. 675–676, training, tacit knowledge and entry-level literature work", "S09-015": "UHD profile PDF pp. 4–7, result areas 6–12; p. 9 level criteria (directly served v10.0, 2021)", "S09-016": "Hoogleraar profile PDF pp. 2–6, result areas 1–3 and 5, 8–10; p. 8 level criteria", "S03-012": "Directive (EU) 2019/790, Arts 3(1)–(2) and 7(1), research text and data mining exception", "S03-004": "RUG AI Office FAQ on Vibe, last modified 9 September 2026, general FAQ on external tools and research question on uploading a PDF; checked 4 October 2026"}}, "theory_review-analysis": {"task_scope": "AI proposes derivations, mechanisms or a synthesis of studies; the researcher tests each step against premises and sources, seeks counterexamples and judges what the argument adds to existing theory.", "impacts": [{"id": "theory_review-analysis-1", "kind": "opportunity", "label": "AI-proposed derivations and syntheses", "text": "In an independent test with ten new research-level mathematics problems, public AI systems together produced at least one passing solution for seven
