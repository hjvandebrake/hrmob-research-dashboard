<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Using AI well in research · hybrid test version</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tint:#f6f7f8;--ink:#1f2a33;--body:#36424c;--muted:#66727c;--faint:#98a2aa;--line:#e2e6ea;
--red:#cc0000;--wine:#9e1630;--wine-pale:#f8ecee;--navy:#17365d;--navy-pale:#e9eef4;
--opp:#cfe6d6;--opp-ink:#1d5a3d;--opp-mid:#9fcfb0;--mix:#f6e5ad;--mix-ink:#6a4d0c;--mix-mid:#ecd27c;--risk:#f2cdc5;--risk-ink:#8a2b1d;--risk-mid:#e4a294;
--x1:#edf1f6;--x2:#c8d5e5;--x3:#88a3c6;--x4:#43679a;
--logo:#cc0000;--serif:'Open Sans','Helvetica Neue',Arial,sans-serif;--sans:'Open Sans','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
body{--oi:#1d5a3d;--mi:#6a4d0c;--ri:#8a2b1d}

/* top bar */
.top{position:fixed;inset:0 0 auto 0;height:66px;z-index:20;display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(226,230,234,.7)}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px;white-space:nowrap;color:var(--logo)}
.brand img{height:34px}
.brand span{padding-left:2px}
.dots{flex:1;display:flex;justify-content:center;gap:10px}
.dots button{width:9px;height:9px;border-radius:50%;background:#d3d8de;transition:all .3s;position:relative}
.dots button[aria-current=true]{background:var(--wine);width:28px;border-radius:6px}
.dots button:hover::after{content:attr(data-label);position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--body);background:#fff;box-shadow:0 4px 14px rgba(31,42,51,.12);padding:4px 8px;border-radius:6px}
.tools{display:flex;align-items:center;gap:4px}.tools .ttl{font-size:14px;color:var(--muted);padding:8px 14px 8px 0;margin-right:6px;border-right:1px solid var(--line)}.tools button{font-size:14px;color:var(--muted);padding:8px 10px;border-radius:9px;text-decoration:underline;text-decoration-color:#c3cad1;text-underline-offset:4px}.tools button:hover{color:var(--wine);text-decoration-color:var(--wine)}
/* scenes */
main{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.scene{position:relative;min-height:100vh;scroll-snap-align:start;padding:96px 7vw 44px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.scene.alt{background:var(--tint)}
.scene::after{content:"";position:absolute;right:-12vw;top:-18vh;width:46vw;height:46vw;border-radius:50%;background:radial-gradient(closest-side,rgba(158,22,48,.06),transparent);pointer-events:none}
.wrap{position:relative;max-width:1440px;width:100%;margin:0 auto}
.kick{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);margin-bottom:14px}
h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.015em}
h2{font-size:clamp(34px,3.5vw,54px);line-height:1.08;margin-bottom:16px;color:var(--wine)}
.lead{font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted);max-width:1060px;font-weight:300}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.in .reveal{opacity:1;transform:none}
.in .d1{transition-delay:.12s}.in .d2{transition-delay:.24s}.in .d3{transition-delay:.36s}.in .d4{transition-delay:.48s}.in .d5{transition-delay:.6s}
.cite{font-size:.62em;vertical-align:super;color:var(--wine);font-weight:700;padding:0 1px}.cite:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
.pill.opportunity{background:var(--opp);color:var(--opp-ink)}.pill.mixed{background:var(--mix);color:var(--mix-ink)}.pill.risk{background:var(--risk);color:var(--risk-ink)}
.pill.x1{background:var(--x1);color:#2f4257;box-shadow:inset 0 0 0 1px #d9e1ea}.pill.x2{background:var(--x2);color:#1f3247}.pill.x3{background:var(--x3);color:#fff}.pill.x4{background:var(--x4);color:#fff}
.hint{font-size:14px;color:var(--faint)}
.caption{font-size:15px;color:var(--muted);line-height:1.5;margin-top:12px;max-width:1240px}
.lsm{font-size:17px;max-width:1240px}
/* hero */
#hero{padding-bottom:120px}#hero .wrap{position:static}#hero::after{display:none}
#hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:relative;max-width:900px;pointer-events:none}
.hero-text h1{font-size:clamp(52px,6.4vw,100px);line-height:1;margin-bottom:22px;color:var(--wine);font-weight:700}
.hero-text h1 em{font-style:italic;font-weight:400}
.hero-sub{font-size:clamp(18px,1.6vw,24px);color:var(--body);font-weight:300;margin-bottom:10px}
.hero-meta{font-size:15px;color:var(--muted)}
.legendline{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:30px;font-size:14px;color:var(--muted)}
.legendline>span:first-child{margin-bottom:4px}
@media (max-width:900px){#stars{display:none}}
@media (max-height:780px){.hero-text h1{font-size:clamp(48px,5.8vw,86px);margin-bottom:16px}.legendline{margin-top:22px}}
.tools .ttl,.tools button{white-space:nowrap}
@media (max-width:1180px){.tools .ttl{display:none}}
@media (max-width:700px){.top{padding:0 12px;gap:8px}.brand img{height:24px}.tools{gap:0;margin-left:auto}.tools button{font-size:12.5px;padding:6px 5px}#fsBtn,#repBtn{display:none!important}}
.legendline i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.start{pointer-events:auto;margin-top:36px;display:inline-flex;align-items:center;gap:12px;background:var(--wine);color:#fff;font-weight:600;padding:13px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(158,22,48,.18);transition:transform .2s}
.start:hover{transform:translateY(-2px)}
.foot{position:absolute;left:7vw;bottom:24px;font-size:13.5px;color:var(--muted);max-width:820px}
.tip{position:fixed;z-index:30;pointer-events:none;max-width:400px;background:#fff;box-shadow:0 10px 30px rgba(31,42,51,.16);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--ink);opacity:0;transition:opacity .15s}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
/* follow-up */
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:7vw;align-items:start}
.journey{position:relative;display:flex;flex-direction:column;gap:24px;padding-left:46px}
.journey::before{content:"";position:absolute;left:15px;top:12px;bottom:12px;width:2px;background:var(--line)}
.step{position:relative;text-align:left;font-size:20px;line-height:1.45;color:var(--ink)}
.step::before{content:attr(data-n);position:absolute;left:-46px;top:0;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--wine);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--wine)}
.step:hover span{color:var(--wine);text-decoration:underline;text-underline-offset:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:0 8px 30px rgba(31,42,51,.05)}
.card .kick{color:var(--navy)}
.card p{font-size:16px;line-height:1.6;color:var(--body)}
/* principles */
.mission{font-weight:300;font-size:clamp(22px,2vw,31px);line-height:1.38;max-width:1180px;margin:6px 0 34px;color:var(--ink)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.pr{padding:22px 24px 26px;border-radius:6px 6px 16px 16px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--wine);box-shadow:0 8px 30px rgba(31,42,51,.05)}
.prn{font-size:32px;font-weight:300;color:var(--wine);line-height:1;margin-bottom:12px}
.pr h3{font-size:21px;margin-bottom:10px;color:var(--ink)}
.pr p{font-size:16px;line-height:1.55;color:var(--body)}
/* goals */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;margin-top:38px}
.goal .fig{font-size:clamp(38px,3.8vw,60px);line-height:1.05;font-weight:700;color:var(--wine);margin-bottom:10px;letter-spacing:-.02em}
.goal h3{font-family:var(--sans);font-size:19px;font-weight:600;margin-bottom:12px;letter-spacing:0}
.goal p{font-size:16.5px;line-height:1.55;color:var(--body)}
.goal .ai{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.goal .ai b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
/* extent visuals */
.x1{background:linear-gradient(145deg,#ffffff,#edf1f6);box-shadow:inset 0 0 0 1px #d9e1ea}.x2{background:linear-gradient(145deg,#e6edf6,#c8d5e5)}.x3{background:linear-gradient(145deg,#b7c9e0,#88a3c6)}.x4{background:linear-gradient(145deg,#7393c0,#43679a)}
.lc.x2{box-shadow:0 6px 16px rgba(67,103,154,.10)}.lc.x3{box-shadow:0 8px 22px rgba(67,103,154,.2)}.lc.x4{box-shadow:0 10px 28px rgba(67,103,154,.32)}
@keyframes glow3{0%,100%{box-shadow:0 8px 20px rgba(67,103,154,.16)}50%{box-shadow:0 11px 28px rgba(67,103,154,.3)}}
@keyframes glow4{0%,100%{box-shadow:0 10px 24px rgba(67,103,154,.22)}50%{box-shadow:0 13px 32px rgba(67,103,154,.38)}}
.in .lc.x3{animation:glow3 4.6s ease-in-out infinite}.in .lc.x4{animation:glow4 4.6s ease-in-out infinite}
.in .lc:nth-child(3n).x3,.in .lc:nth-child(3n).x4{animation-delay:-1.4s}.in .lc:nth-child(4n).x3,.in .lc:nth-child(4n).x4{animation-delay:-2.2s}
.pathbox{position:relative;margin-top:30px}
.pathbox svg{width:100%;height:auto;display:block;overflow:visible}
.station{cursor:pointer}
.station circle.core{transition:transform .5s cubic-bezier(.2,.9,.2,1.2);transform-box:fill-box;transform-origin:center;transform:scale(0);filter:drop-shadow(0 8px 16px rgba(23,54,93,.18))}
.in .station circle.core{transform:scale(1)}
.station:hover circle.core{stroke:var(--ink);stroke-width:3}
.station .halo{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes breathe2{0%,100%{opacity:.24;transform:scale(.97)}50%{opacity:.36;transform:scale(1.04)}}
@keyframes breathe3{0%,100%{opacity:.28;transform:scale(.96)}50%{opacity:.48;transform:scale(1.09)}}
@keyframes breathe4{0%,100%{opacity:.32;transform:scale(.95)}50%{opacity:.56;transform:scale(1.12)}}
.in .station.l2 .halo{animation:breathe2 4.6s ease-in-out infinite}
.in .station.l3 .halo{animation:breathe3 4.6s ease-in-out infinite}
.in .station.l4 .halo{animation:breathe4 4.6s ease-in-out infinite}
.in .station:nth-child(odd) .halo{animation-delay:-1.3s}
.flow{stroke:#8f9aa6;stroke-width:2;opacity:0;transition:opacity .6s}
.in .flow{opacity:1}
.back{fill:none;stroke:#b3bcc6;stroke-width:1.6;stroke-dasharray:5 6}
.backlab{font-size:15px;fill:var(--muted);text-anchor:middle;font-family:var(--sans)}
.cols6{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:8px}
.cols6 button{text-align:center;padding:6px;border-radius:12px}
.cols6 button:hover{background:var(--tint)}
.cols6 b{display:flex;align-items:flex-end;justify-content:center;min-height:2.6em;font-size:17px;font-weight:700;margin-bottom:6px;color:var(--ink);line-height:1.3}
.cols6 i{display:block;font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.cols6 span{display:block;font-size:14.5px;line-height:1.45;color:var(--muted)}
.xlegend{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--body);margin-top:22px;flex-wrap:wrap}
.xlegend i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:7px;vertical-align:-3px}
.lanes{display:grid;gap:10px;margin-top:28px}
.lanes.f{grid-template-columns:240px repeat(6,1fr)}
.lanes.p{grid-template-columns:260px repeat(3,1fr)}
.lanes .h{font-size:14px;font-weight:600;color:var(--body);align-self:end;padding-bottom:4px}
.lanes .rl{text-align:left;padding:6px 12px 6px 0}
.lanes .rl b{display:block;font-size:19px;font-weight:700;color:var(--ink)}
.lanes .rl small{font-size:13px;color:var(--muted)}
.lanes .rl:hover b{color:var(--wine)}
.lc{border-radius:14px;position:relative;transition:transform .25s,box-shadow .25s;opacity:0;transform:scale(.92)}
.lanes.f .lc{height:clamp(64px,8.4vh,84px)}.lanes.p .lc{height:clamp(44px,5.4vh,54px)}
.in .lc{opacity:1;transform:none;transition:opacity .6s,transform .6s,box-shadow .25s}
.lc:hover{transform:translateY(-3px);outline:3px solid var(--ink);outline-offset:0}
/* heatmap (original design) */
.hm-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-size:15px;color:var(--body)}
.seg button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:700;box-shadow:0 1px 4px rgba(31,42,51,.12)}
.hm-grid{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.ov{display:grid;grid-template-columns:160px 120px repeat(6,1fr);gap:5px 6px;align-items:center}
.ov .hh{font-size:14px;font-weight:700;color:var(--ink);align-self:end;padding:0 2px 4px;line-height:1.2}
.ov .co{grid-row:span 3;align-self:stretch;display:flex;align-items:center;font-size:15.5px;font-weight:700;color:var(--navy);background:var(--navy-pale);border-radius:10px;padding:0 12px;line-height:1.25}
.ov .ty{font-size:14.5px;color:var(--body);white-space:nowrap}
.ov .gap{grid-column:1/-1;height:6px}
.hc{width:100%;border-radius:7px;transition:background-color .6s,box-shadow .2s,transform .15s;cursor:pointer;position:relative}
.ov .hc{height:34px}
@keyframes cellin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.in .ov .hc{animation:cellin .5s both}
.hc.opportunity{background:var(--opp-mid)}.hc.mixed{background:var(--mix-mid)}.hc.risk{background:var(--risk-mid)}
.hc:hover,.hc.peeked{box-shadow:0 0 0 3px var(--ink);transform:translateY(-1px)}
.gv{display:grid;grid-template-columns:220px repeat(6,1fr);gap:8px}
.gv .hh{font-size:14px;font-weight:700;color:var(--ink);align-self:end;padding:0 2px 4px}
.gv .rlab{display:flex;flex-direction:column;justify-content:center;padding-right:10px}
.gv .rlab b{font-size:19px;font-weight:700}.gv .rlab small{font-size:13px;color:var(--muted)}
.gv .hc{min-height:124px;padding:14px 14px 26px;text-align:left;font-size:16px;line-height:1.3;font-weight:600}
.gv .hc.opportunity{background:var(--opp);color:var(--opp-ink)}.gv .hc.mixed{background:var(--mix);color:var(--mix-ink)}.gv .hc.risk{background:var(--risk);color:var(--risk-ink)}
.gv .hc::after{content:"\2192";position:absolute;right:12px;bottom:8px;opacity:.35}.gv .hc:hover::after{opacity:.85}
.cnote{font-size:17px;color:var(--body);margin:0 0 12px;line-height:1.45}
.peek{background:var(--tint);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:420px}
.scene.alt .peek{background:#fff;border:1px solid var(--line)}
.peek .kick{margin:0;color:var(--navy)}
.peek h3{font-size:22px;color:var(--ink);line-height:1.2}
.peek p{font-size:15px;line-height:1.5;color:var(--body)}
.peek .hint{margin-top:auto}
.legend{display:flex;gap:16px;font-size:14px;color:var(--body);align-items:center;flex-wrap:wrap}
.legend.v{flex-direction:column;align-items:flex-start;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:15px;height:15px;border-radius:4px}
.dot.opportunity{background:var(--opp-mid)}.dot.mixed{background:var(--mix-mid)}.dot.risk{background:var(--risk-mid)}
.crow{display:grid;gap:5px;font-size:13.5px;color:var(--body)}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar span{display:grid;place-items:center;font-size:12.5px;font-weight:700;transition:flex-grow .8s ease}
.bar .opportunity{background:var(--opp-mid);color:var(--oi)}.bar .mixed{background:var(--mix-mid);color:var(--mi)}.bar .risk{background:var(--risk-mid);color:var(--ri)}
.mapnote{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.45}
/* three dimensions */
.dims{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 56px 1.1fr;align-items:stretch;margin-top:34px}
.dim{text-align:left;padding:22px 22px 24px;border-radius:6px 6px 16px 16px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(18px);transition:opacity .7s calc(.3s + var(--k)*.35s),transform .7s calc(.3s + var(--k)*.35s),box-shadow .2s}
.in .dim{opacity:1;transform:none}
.dim:hover{box-shadow:0 10px 26px rgba(31,42,51,.12)}
.dim .dn{font-size:30px;font-weight:300;color:var(--navy);line-height:1}
.dim b{font-size:20px;color:var(--ink)}.dim span{font-size:15.5px;line-height:1.5;color:var(--body)}
.dim.combo{border-top-color:var(--wine)}
.glyph{display:grid;grid-template-columns:repeat(6,14px);gap:3px;margin-bottom:4px}
.glyph i{display:block;height:14px;border-radius:3px;opacity:0;transform:scale(.4);transition:opacity .4s,transform .4s}
.in .glyph i{opacity:1;transform:none}
.glyph i.opportunity{background:var(--opp-mid)}.glyph i.mixed{background:var(--mix-mid)}.glyph i.risk{background:var(--risk-mid)}
.op{display:grid;place-items:center;font-size:28px;color:var(--muted);opacity:0;transition:opacity .6s calc(.5s + var(--k,0)*.3s)}
.in .op{opacity:1}
/* programme */
.maps{display:grid;grid-template-columns:1fr 46px 1fr;gap:14px;align-items:start;margin-top:16px}
.pm{display:flex;flex-direction:column;gap:10px}
.pm-t{font-size:14.5px;font-weight:700;padding:7px 12px;border-radius:9px;text-align:center}
.pm-t.ordinary{background:var(--tint);color:var(--body)}.pm-t.supported{background:var(--navy);color:#fff}
.scene.alt .pm-t.ordinary{background:#fff;border:1px solid var(--line)}
.pmg{display:grid;grid-template-columns:150px repeat(6,1fr);gap:3px 4px}
.pmh{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:3px}
.pmc{grid-row:span 3;font-size:13px;font-weight:700;line-height:1.3;color:var(--navy);background:var(--navy-pale);border-radius:8px;padding:6px 10px;display:flex;align-items:center;margin-right:6px}
.pmgap{grid-column:1/-1;height:4px}
.pmg .hc{height:clamp(17px,2.3vh,24px);border-radius:4px}
.hc.changed::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;opacity:.95}
.arrow{align-self:center;font-size:32px;color:var(--muted);text-align:center;padding-top:28px}
.plegend{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.dot.chg{position:relative}.dot.chg::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff}
.support{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.support div{padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.support b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.support p{font-size:14px;line-height:1.45;color:var(--body)}

<header class="top"><div class="brand"><img id="logo" alt="University of Groningen, Faculty of Economics and Business"></div><nav class="dots" id="dots" aria-label="Sections"></nav><div class="tools"><span class="ttl" id="ttl"></span><button id="anaBtn">Detailed analysis</button><button id="repBtn" hidden>Background report</button><button id="srcBtn">Sources</button><button id="fsBtn">Present</button></div></header>

<script type="application/json" id="data">{"meta": {"variant": "department", "title": "Using AI well in research", "footer": "Using AI well in research · October 2026", "has_report": false}, "assessment": {"version": "2026-10-05-background-proposal", "scenarios": {"ordinary": "Permitted AI use with ordinary supervision; no additional faculty AI programme assumed.", "supported": "The cell-specific intervention is available and used, and its full human cost remains proportionate to the benefit. This is an assumption to test: FEB staff, supervision and coauthor time have not been estimated."}, "ratings": {"opportunity": "A net benefit is more plausible under the stated conditions, after checking costs and learning consequences.", "mixed": "Benefits and consequential costs compete, or the broad task contains branches with different directions.", "risk": "The dominant failure or learning mechanism is likely to outweigh gains under the stated use."}, "confidence_note": "Confidence concerns the evidence supporting the task mechanism and transfer. Every cohort comparison remains provisional; confidence does not determine colour.", "comparison": "Same substantive AI task and ordinary researcher checking across cohorts."}, "dimensions": {"overview": {"title": "Overview", "html": "<h1 id=\"overview-ai-and-research-at-feb-the-three-dimensions\">AI and research at FEB: the three dimensions<\/h1>\n<p>AI is changing the work through which research is produced. It can help researchers explore a question, process material, write code and prepare a manuscript. Whether these changes improve a study depends on what the system does well, what the researcher delegates, and what happens to the work that follows. The Organization Science editorial on “more versus better” describes the central concern: faster production can increase submissions while leaving the reasoning and scrutiny needed for a good paper under pressure. Its evidence concerns writing and editorial outcomes; its warning about the loss of research craft is an argument about how those changes could develop. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button><\/p>\n<p>For FEB, the analysis therefore begins with the work itself. An economist reconstructing an empirical analysis, a marketing researcher interviewing consumers and a management scholar developing a theoretical explanation face different decisions. A doctoral candidate also has to learn from those decisions, while a professor may be responsible for the quality of several people&#39;s work. These differences help explain why the same tool can create an opportunity in one situation and a problem in another.<\/p>\n<h2 id=\"overview-the-three-dimensions\">The three dimensions<\/h2>\n<div class=\"table-wrap\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Dimension<\/th>\n<th>What the chapter examines<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>The research cycle<\/strong><\/td>\n<td>Question and theory; literature; design; data and sources; analysis and interpretation; writing and review. Which tasks become faster, which new studies become feasible, and which intellectual steps might receive less attention?<\/td>\n<\/tr>\n<tr>\n<td><strong>Forms of research<\/strong><\/td>\n<td>Quantitative, Qualitative and Theory/Review. What changes when the task involves numerical inference, participants&#39; experiences, formal arguments or synthesis of existing work? Statistical meta-analysis is included in Quantitative.<\/td>\n<\/tr>\n<tr>\n<td><strong>Researcher positions<\/strong><\/td>\n<td>PhD candidates, postdocs, assistant professors, associate professors and full professors. How do changes to research tasks affect learning, independent scholarship, grants, supervision and leadership? The responsibilities are grounded in the UFO profiles used by the university.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The chapters examine each dimension separately. They explain observed capabilities and failures, then consider their implications for economics and business research. Examples describe possible FEB applications unless they explicitly refer to a faculty study. Evidence from other occupations is used to investigate mechanisms, such as learning or supervisory feedback, with the original setting kept visible.<\/p>\n<h2 id=\"overview-capability-acceptance-and-research-quality\">Capability, acceptance and research quality<\/h2>\n<p>A technically successful task can have an unwanted consequence. An AI interviewer may elicit more text, but researchers also need to establish whether the people they want to hear from will participate and speak freely. Existing findings on participant experience differ across settings. A coding agent may reproduce a result without detecting a mistaken assumption, and a supervisor may save time preparing feedback while receiving more drafts to assess. The analysis considers these consequences alongside demonstrated benefits. It also distinguishes empirical findings from critical arguments about scientific understanding, professional autonomy and the organisation of research.<\/p>\n<p>The evidence does not support a single ranking in which one research form or career group always benefits most. The result depends on the task, evidence, expertise and working arrangement. Each chapter develops these conditions before the dimensions are combined.<\/p>\n<h2 id=\"overview-the-combined-assessment\">The combined assessment<\/h2>\n<p>The <button class=\"link-button\" data-map-overview>proposed combined assessment<\/button> now applies this research to 54 combinations of stage, form and career cohort. Each explanation identifies the expected benefit or harm, the additional support that could change it, and the conditions that could reverse the judgment. The <button class=\"link-button\" data-report=\"\">integrated report<\/button> summarizes the resulting expectations for FEB. These are conditional assessments; the literature reviewed here does not establish a measured three-way interaction at the faculty.<\/p>\n<p>This is a targeted academic evidence review, supplemented by methodological and institutional sources. It is not an exhaustive systematic review. Numbered references open the original publications; detailed search records, claim checks and the UFO task mapping are retained in the research dossier.<\/p>\n", "toc": [{"id": "overview-ai-and-research-at-feb-the-three-dimensions", "text": "AI and research at FEB: the three dimensions", "level": 1}, {"id": "overview-the-three-dimensions", "text": "The three dimensions", "level": 2}, {"id": "overview-capability-acceptance-and-research-quality", "text": "Capability, acceptance and research quality", "level": 2}, {"id": "overview-the-combined-assessment", "text": "The combined assessment", "level": 2}]}, "cycle": {"title": "The research cycle", "html": "<h1 id=\"cycle-how-ai-changes-the-research-cycle\">How AI changes the research cycle<\/h1>\n<p>Researchers at FEB can already ask AI to suggest a question, map a literature, propose a design, extract observations, write code, and revise a manuscript. The breadth of this assistance can make a project feel as though it is advancing continuously. Yet a research project also depends on decisions that connect these products. An interesting question must survive contact with available evidence. A useful literature map must include work that could change the argument. A clean estimate must answer the question the paper asks. The effects of AI on research quality will therefore depend on which decisions become easier and which are skipped as work accelerates.<\/p>\n<p>The six stages below describe kinds of work rather than a fixed sequence. Economists often revisit a question after identifying the available variation; management scholars may revise a proposed mechanism after fieldwork; and a literature review may treat published studies as its primary data. Established methodological accounts in economics and management emphasize this movement between question, evidence, design, and contribution. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 33\">[33]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 75\">[75]<\/button> <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> The same AI operation can also have different consequences across research forms. Extracting a number from a filing, interpreting a participant’s account, and deriving a formal implication all produce text, but they call for different checks.<\/p>\n<p>The most credible evidence concerns bounded operations under specified conditions. Some systems are already capable of retrieving source-backed answers, improving code against a score, and helping human reviewers make their reports more informative. Other findings identify errors that can change a conclusion when researchers treat an output as evidence. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 13\">[13]<\/button> <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 6\">[6]<\/button> <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 105\">[105]<\/button> What follows separates present capability from likely changes to FEB practice. The latter are reasoned expectations that depend on the model, the available evidence, and how researchers use the time they save.<\/p>\n<h2 id=\"cycle-question-and-theory\">Question and theory<\/h2>\n<p>AI makes it easier to explore a question before a team commits to it. A researcher can ask for alternative explanations of a pattern, counterexamples to a proposed mechanism, or neighboring fields that describe a similar phenomenon. Korinek identified such ideation and feedback tasks for economists, alongside background research, coding, data analysis, and writing. His article provides examples of useful microtasks, rather than a measured increase in the quality of completed economic papers. <button class=\"citation\" data-source=\"S06-001\" aria-label=\"Source 8\">[8]<\/button> The practical gain is that a researcher can compare more candidate explanations early enough to revise the project.<\/p>\n<p>The first question is whether those candidates would test different explanations. Si and colleagues built a Claude 3.5 Sonnet ideation agent that retrieved relevant papers, generated many proposals, removed near-duplicates, and ranked the remainder. In a blind comparison across seven NLP prompting topics, expert reviewers rated its proposals more novel than matched human proposals. They did not rate the AI proposals significantly better on feasibility or overall quality when each idea was the unit of analysis. <button class=\"citation\" data-source=\"S14-101\" aria-label=\"Source 9\">[9]<\/button> The study is strong evidence that a carefully constructed system can propose ideas that <em>look<\/em> novel to specialists. It says less about whether a scholar will want to pursue them once access, measures, baselines, and the likely contribution become concrete.<\/p>\n<p>The agent&#39;s own workflow shows how much filtering lies between generation and choice. It produced 4,000 seed proposals per topic, yet only about 200 per topic were nonduplicates under the study&#39;s similarity threshold. Tested AI rankers agreed weakly with the expert ordering of ideas. Even the best tested pairwise ranker attained 53.3% balanced agreement in this difficult task, compared with 56.1% agreement among expert reviewers. <button class=\"citation\" data-source=\"S14-101\" aria-label=\"Source 9\">[9]<\/button> More proposals therefore increase the demand for judgment as well as the supply of options. If a researcher accepts the most polished suggestion, the generation stage can displace the slower comparison of premises, practical constraints, and alternative explanations.<\/p>\n<p>A follow-up study tested what happened when the ideas became projects. Forty-three expert NLP researchers were randomly assigned an anonymized AI or human idea, worked for about 103 hours on average, and submitted code and a short paper for blind review. The AI ideas lost significantly more of their initial rating after execution on novelty, excitement, effectiveness, and overall quality. The final AI–human score difference was <em>not<\/em> statistically significant when each of the 43 projects was treated as the independent unit. <button class=\"citation\" data-source=\"S14-102\" aria-label=\"Source 10\">[10]<\/button> Thus the result identifies an ideation–execution gap, rather than proving that human ideas finish better. It is especially relevant to FEB because the appealing part of a proposal can be the part that becomes hardest to sustain: a field relationship that cannot be accessed, a comparison group that is not comparable, or a theoretical distinction that the proposed evidence cannot reveal. The tested projects concerned NLP prompting over a three-month window; those specific failure rates should not be carried into a multi-year social-science study.<\/p>\n<p>There is also evidence that AI-generated hypotheses can cross an initial validation threshold. Google&#39;s Gemini-based Co-Scientist worked from human-specified biomedical goals and proposed candidates for selected drug-repurposing, liver-fibrosis, and antimicrobial-resistance problems. Experts selected candidates for laboratory work; some showed activity in cell lines or organoids, and one proposed mechanism matched a contemporaneous, then-unpublished experimental discovery. <button class=\"citation\" data-source=\"S06-013\" aria-label=\"Source 106\">[106]<\/button> These results are more informative than a model-generated list of hypotheses. They show what happens when a candidate faces an external test. They also preserve the scientists&#39; role in defining the problem, selecting what to test, and interpreting the result. In FEB, an analogous test might be a small pilot with actual respondents, a search for a critical archival case, or an explicit comparison between a proposed mechanism and a rival one. None has yet been shown to work at the rate observed in the selected biomedical cases.<\/p>\n<p>The effect of AI on the diversity of questions remains conditional. In experiments on everyday and product ideas, GPT-3.5 assistance increased the average human-rated creativity of individual suggestions, particularly for incrementally new ideas. A subsequent reanalysis of those data found lower diversity across the pool of AI-assisted suggestions. <button class=\"citation\" data-source=\"S14-103\" aria-label=\"Source 107\">[107]<\/button> <button class=\"citation\" data-source=\"S14-104\" aria-label=\"Source 12\">[12]<\/button> Doshi and Hauser observed a related individual-gain/collective-diversity pattern in short-story writing. <button class=\"citation\" data-source=\"S05-016\" aria-label=\"Source 84\">[84]<\/button> Yet a separate dynamic experiment found that <em>high passive exposure<\/em> to AI examples increased the semantic diversity of people&#39;s alternative-use ideas without raising individual creativity. <button class=\"citation\" data-source=\"S14-105\" aria-label=\"Source 108\">[108]<\/button> These studies vary in whether people actively ask AI for ideas, merely see examples, or receive particular starting points. They also measure different kinds of originality. The defensible FEB implication is to inspect the <em>set<\/em> of candidate questions and explanations, including those that challenge a comfortable framing. A large stack of similar proposals does not provide that diversity by itself.<\/p>\n<p>Theory development requires a further step. An economist may ask whether the proposed mechanism implies a pattern that competing accounts would not predict. A management scholar may ask which observations would distinguish learning, selection, and retrospective justification in a firm&#39;s account of change. AI can produce candidate counterarguments, but it does not establish that the constructs are distinct or that a study can observe the necessary process. Edmondson and McManus describe the fit among question, prior theory, data, and contribution as a central requirement of organizational field research. <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> AI is most useful here when it gives the scholar a more demanding question to answer, rather than a more fluent version of the answer already preferred.<\/p>\n<h2 id=\"cycle-literature\">Literature<\/h2>\n<p>Literature work begins before writing a review section. Researchers identify candidate records, decide which belong in the inquiry, read the relevant passages, and determine what each paper contributes to the argument. A tool can improve one of these tasks while leaving the others untouched. A source-backed summary, for example, can be accurate about the papers it retrieved while omitting a study that would change the novelty claim. At FEB, a search confined to one discipline can miss relevant work in economics, management, marketing, information systems, or psychology because these fields use different names for related phenomena.<\/p>\n<p>Retrieval-backed synthesis is already useful on tested tasks. OpenScholar searches an open corpus of roughly 45 million papers, retrieves passages, and generates cited scientific answers. On its benchmark, specialized 8B and GPT-4o-based variants outperformed GPT-4o without retrieval on aspects of multi-paper correctness and citation accuracy. Domain experts preferred the OpenScholar variants to expert-written answers in 51% and 70% of pairwise comparisons for the tested systems. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 13\">[13]<\/button> These are substantial results for answering bounded questions with a source trail. The comparison involved 108 questions and 16 expert evaluators; the benchmark covered computer science, biomedicine, physics, and neuroscience, not FEB&#39;s core fields. OpenScholar&#39;s authors also report missed representative papers, occasional unsupported information, and lack of license-protected papers at inference. A scholar can benefit from a rapid first map while still needing to inspect whether that map contains the decisive literature.<\/p>\n<p>The model&#39;s access route changes the problem. In OpenScholar&#39;s recent-literature tests, GPT-4o asked to cite from memory fabricated many paper titles, whereas retrieval-backed systems performed better. The reported 78–90% title-fabrication range belongs to those prompts and model versions. <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 13\">[13]<\/button> An independent citation study asked memory-only GPT-4o to suggest references for 10,000 existing articles. Among the suggestions that matched actual papers, the model favored highly cited work more than the original reference lists did, even while suggesting semantically relevant material. <button class=\"citation\" data-source=\"S08-017\" aria-label=\"Source 14\">[14]<\/button> The latter study did not test interactive search or a retrieval-enabled assistant, so its pattern cannot be assigned to every contemporary literature tool. It does show a possible selection mechanism: prominent, familiar references arrive early, and a researcher who stops there can reinforce an established citation hierarchy while overlooking less visible evidence.<\/p>\n<p>Screening provides another distinct benefit. LEADS, a specialized 7-billion-parameter model trained on medical systematic-review material, helped clinicians rank and inspect candidate studies. In a pilot that presented 30 citations per review topic, expert-plus-LEADS screening reached recall of 0.81 versus 0.78 for expert-only work, with about 21% less time per study. <button class=\"citation\" data-source=\"S14-106\" aria-label=\"Source 109\">[109]<\/button> The gain came from a collaborative workflow; difficult middle-ranked cases still required closer human review. The same paper&#39;s larger search evaluation showed how much work occurs upstream: single-pass top-K recall was about 25% for publications and 32% for trials under its benchmark, and aggregating multiple generated queries raised coverage. <button class=\"citation\" data-source=\"S14-106\" aria-label=\"Source 109\">[109]<\/button> A system can therefore rank records effectively once they are in view without having found the full relevant set. Clinical trial inclusion rules, data sources, and specialist training also differ from a management or economics review.<\/p>\n<p>For FEB, the most likely change is a faster first map of concepts, methods, and disagreements. That map can help a researcher decide where to read deeply. It may also create a false stopping point if a coherent paragraph substitutes for examining the source boundary. The scholar should be able to explain why a search included a discipline, database, period, or type of evidence, and should inspect the original papers that carry the argument&#39;s main claims. In an integrative review, this goes further: published studies are the corpus and the contribution lies in how their findings are compared and recombined, not in how quickly their abstracts are summarized. <button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 51\">[51]<\/button> When a crucial paper is absent or its claim is misread, a well-written synthesis can make the error harder to notice.<\/p>\n<h2 id=\"cycle-design\">Design<\/h2>\n<p>AI can help researchers rehearse a design before collecting expensive data. It can propose manipulations, comparison groups, instruments, sampling approaches, interview prompts, and threats to validity. The capacity to list such options is valuable because it may reveal a weakness while a project is still cheap to change. Yet design quality rests on a specific warrant: what variation or observation permits the promised inference? A broad label, such as an experiment or a difference-in-differences design, cannot supply that warrant on its own.<\/p>\n<p>A recent social-science study illustrates the benefit of inexpensive rehearsal. Ashokkumar and colleagues asked GPT-4 to simulate responses to experimental stimuli and used the simulated differences to forecast real effects from 70 preregistered, nationally representative US survey experiments. The archive included 469 effects and 119,330 participants. Forecasts correlated strongly with observed effects, including for studies unavailable by the model&#39;s training-data cutoff, and performed similarly to pooled human forecasts. At the same time, the predicted effects were systematically too large; correlations were lower in a second archive of 15 megastudies. <button class=\"citation\" data-source=\"S14-107\" aria-label=\"Source 17\">[17]<\/button> This provides evidence for triaging possible interventions and preparing pilots. A simulated effect is a forecast about respondents in the source setting, not a measurement of how a new population or firm will actually respond. Earlier work on synthetic survey respondents likewise shows both reproduction of some aggregate patterns and risks for subgroup variation. <button class=\"citation\" data-source=\"S07-11\" aria-label=\"Source 16\">[16]<\/button> <button class=\"citation\" data-source=\"S07-12\" aria-label=\"Source 110\">[110]<\/button><\/p>\n<p>The distinction between recognizing a method and specifying its identifying detail can be measured directly. Sawarni and colleagues assembled 174 causal questions across 139 real datasets in published work and textbooks. With a question, metadata, and data available, a GPT-5.3 reasoning baseline identified the broad design family in 81.0% of cases, but produced a fully correct identification specification in 37.9%. Errors included omitted and post-treatment controls, wrong treatment or outcome variables, incorrect estimands, and treating an observational comparison as an experiment. <button class=\"citation\" data-source=\"S14-108\" aria-label=\"Source 18\">[18]<\/button> This is a retrospective benchmark on known designs, rather than a prospective test of AI-designed FEB studies. Its error pattern nevertheless points to the exact place where an apparently competent assistant can mislead: the model names a familiar strategy and supplies code, while the treatment, timing, assignment, instrument, or target effect does not match the paper&#39;s claim.<\/p>\n<p>Economic and management traditions describe these design obligations in different terms. The credibility revolution in empirical economics centers the source of identifying variation and the assumptions needed to interpret it; structural approaches use theoretical restrictions to answer other counterfactual questions. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 33\">[33]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 75\">[75]<\/button> Organizational field research asks whether the state of prior theory, the research question, the evidence, and the intended contribution fit together, often with revision during field engagement. <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> A researcher using AI to propose an instrument therefore still has to defend the exclusion restriction in the setting. A field researcher asking AI to draft an interview guide still has to determine whose account could reveal the process and which contrary case could refute the proposed explanation. Those judgments depend on institutions, relationships, and access that a generic design template does not contain.<\/p>\n<p>The FEB opportunity is earlier and more varied criticism of a design. An applied economist could ask for alternative estimands and threats to parallel trends, then test them against the policy&#39;s actual timing and the data structure. A behavioral researcher could compare predicted message effects before an inexpensive human pilot, while accounting for the forecast&#39;s tendency to exaggerate magnitudes. A management researcher could use AI to propose discrepant cases and then decide whether the organization can supply records or interviews that distinguish the candidate mechanisms. Such work may reduce avoidable starts. It improves research only when the suggested objection changes a real choice about sampling, measurement, comparison, or interpretation.<\/p>\n<h2 id=\"cycle-data-and-sources\">Data and sources<\/h2>\n<p>Once a study is designed, AI can turn some previously costly material into analyzable records. A team may parse public corporate filings, transcribe permitted interviews, locate passages in annual reports, or classify descriptions of work. These operations can expand the feasible corpus. They also expose a distinction between acquiring material and having a valid measure. SEC interfaces permit automated retrieval of public filings; CBS microdata are subject to a restricted environment and access conditions. The technical possibility of sending a file to an external model does not determine whether a researcher is authorized to process it there. <button class=\"citation\" data-source=\"S06-023\" aria-label=\"Source 20\">[20]<\/button> <button class=\"citation\" data-source=\"S06-021\" aria-label=\"Source 23\">[23]<\/button> <button class=\"citation\" data-source=\"S06-022\" aria-label=\"Source 111\">[111]<\/button><\/p>\n<p>AI can now collect some of the material, too. In 766 online interviews on two economic topics, an adaptive AI interviewer elicited substantially more distinct themes than the researchers&#39; fixed open-text survey questions. A separate randomized experiment with 2,243 online respondents found more specific reasons than fixed questions, without a detected rise in survey abandonment; the conversation also changed some subsequent attitude answers. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> <button class=\"citation\" data-source=\"S14-305\" aria-label=\"Source 96\">[96]<\/button> These are gains relative to survey questions, not demonstrations that AI matches a skilled human field interviewer. The exchange can improve elicitation and simultaneously change what is being measured.<\/p>\n<p>The evidence on willingness is mixed rather than a story of general resistance. In Chopra and Haaland&#39;s separate experiment with 500 online panelists rating hypothetical invitations, 89% said they would accept a survey and 90% an AI interview when each was described first. Among people who had completed one of their AI interviews on stock-market participation, 53% preferred AI for a future interview, 21% preferred a human, and 26% were neutral. Neither result measures take-up among people outside the panel or the views of those who declined the original interview. <button class=\"citation\" data-source=\"S14-401\" aria-label=\"Source 22\">[22]<\/button> In a direct comparison involving six human and five AI interviews with students, coders rated answer quality similarly overall, but the AI missed more cues to probe surprising replies; its interviewees found the exchange less interesting and less appealing to repeat. <button class=\"citation\" data-source=\"S14-402\" aria-label=\"Source 39\">[39]<\/button> A FEB team interviewing managers, employees, or consumers would therefore have to check who agrees to an AI-mediated conversation and whether the mode changes what they say. Seventeen interviewers in a simulated assistant-supported interview also raised concerns about divided attention, off-target probes, respect, and privacy; these were perceptions, rather than measured participant harms. <button class=\"citation\" data-source=\"S14-409\" aria-label=\"Source 112\">[112]<\/button> Recruitment, respondent experience, and the kind of account elicited belong in the comparison alongside transcript length or number of themes.<\/p>\n<p>The quality of an extracted dataset depends on which fields support the central finding. Yisha and colleagues compared ChatGPT-4 and Claude 3 Opus with verified items from 105 randomized-trial reports in two medical reviews. The models correctly extracted binary-outcome group sizes in 91–94% of cases, but event counts in 57–71%; mean and standard-deviation extraction for continuous outcomes was lower still. <button class=\"citation\" data-source=\"S14-201\" aria-label=\"Source 113\">[113]<\/button> These are May 2024 model and clinical-report results, not expected error rates for FEB. They illustrate why a team should validate the fields used to define its outcome, comparison, or denominator. Firm names might be easy, while event dates, denominator choices, amended disclosures, or the distinction between an intention and a completed action might decide the analysis.<\/p>\n<p>A mislabeled record can alter an estimate. Christensen and Hansen examine AI/ML-generated covariates used in economic analysis. In their remote-work illustration, nine of 1,000 sampled postings were false positives, and a coefficient in a regression on log posted salary changed from 0.364 to 0.641 under their specified correction, with nonoverlapping 95% intervals. This is an illustration of inferential sensitivity, not a causal estimate of remote work&#39;s salary effect. Their correction rests on an explicit model of classification error and supporting information; it is not a universal adjustment for generated labels. <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> Even a small share of false positives across all records can change the estimated relationship when the generated label defines a treatment or control. A researcher should plan the validation sample, error estimate, and inferential treatment as part of measurement, rather than run a polished regression first and audit the labels afterward.<\/p>\n<p>An archival FEB project could retain a trace from each extracted value to the source passage, document version, extraction method, transformation, and review decision. It could oversample ambiguous items for validation and count omissions as well as false positives. This would make a disagreement between model and researcher inspectable, and it would allow corrections to propagate through the analysis. <button class=\"citation\" data-source=\"S14-201\" aria-label=\"Source 113\">[113]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> In interview-based work, the corresponding record may be a transcript segment and a decision about its meaning; in administrative-data work, it may be an access-approved code path and metadata. The check should fit what the research claim depends on, rather than merely prove that an extraction script ran.<\/p>\n<h2 id=\"cycle-analysis-and-interpretation\">Analysis and interpretation<\/h2>\n<p>AI can conduct many analyses once a task has a score or formal output. Aygün and colleagues&#39; ERA system generates and rewrites scientific code, tests alternatives, and selects variants that improve an explicit metric. On selected public tasks, it produced 40 single-cell analysis methods above the previous leaderboard leader and 14 hospitalization forecasts above compared CDC forecasts. <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 6\">[6]<\/button> This is real computational progress. The optimization target also defines the boundary of the result: a higher benchmark score shows better performance on that benchmark, while a scientific paper must still explain why the benchmark, population, comparison, and interpretation answer its question.<\/p>\n<p>Researchers already use AI for routine scientific programming. O&#39;Brien, Milewicz, and Eisty examined free-text accounts from research programmers about one recalled AI-assisted coding episode. Among 506 usable narratives, 52.8% mentioned running generated code to assess it, whereas only 3% mentioned an automated test and 2% another person&#39;s review. <button class=\"citation\" data-source=\"S14-205\" aria-label=\"Source 27\">[27]<\/button> These are selected self-reports, not observations of the researchers&#39; complete verification practices or a measurement of code correctness. They nevertheless make a practical distinction visible. “The script ran” establishes that it executed. It does not establish that a join preserved the intended population, that the right outcome was coded, or that the reported coefficient has the claimed meaning.<\/p>\n<p>Interpretation varies more across FEB research forms than the computational step suggests. In a quantitative paper, AI can produce specifications, plots, and robustness tables while the author decides whether the estimand, selection process, and assumptions support a causal or descriptive claim. In qualitative fieldwork, it can retrieve passages and propose codes while researchers decide what participants meant and whether an awkward case changes the emerging explanation. In a formal or conceptual paper, it can suggest a derivation or counterexample while the scholar tests whether the inference follows from the stated premises. In an integrative review, it can extract statements while the author explains what apparent disagreement among studies reveals. <button class=\"citation\" data-source=\"S06-002\" aria-label=\"Source 33\">[33]<\/button> <button class=\"citation\" data-source=\"S06-003\" aria-label=\"Source 75\">[75]<\/button> <button class=\"citation\" data-source=\"S06-004\" aria-label=\"Source 19\">[19]<\/button> <button class=\"citation\" data-source=\"S06-006\" aria-label=\"Source 51\">[51]<\/button> These tasks have different validation standards, but the common work is to connect an output to an argument that a reader can examine.<\/p>\n<p>AI can help with that connection if it is used to challenge a result. A researcher may ask it to find a possible coding error, state a rival interpretation, or identify a case that does not fit the preferred mechanism. The next step is to check that challenge against the data, not to ask the same system to certify its own answer. A held-out calculation, source-linked validation sample, proof check, or colleague&#39;s substantive review can reveal errors that a self-consistent model response leaves in place. <button class=\"citation\" data-source=\"S06-018\" aria-label=\"Source 6\">[6]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> <button class=\"citation\" data-source=\"S06-010\" aria-label=\"Source 76\">[76]<\/button> The likely FEB effect is therefore conditional: the same speed gain can fund more serious validation, or it can produce more analysis variants without resolving the question.<\/p>\n<h2 id=\"cycle-writing-and-review\">Writing and review<\/h2>\n<p>Writing is the stage at which a researcher has to state what the evidence shows and where the argument stops. AI can reduce the effort needed to draft and edit prose. In a randomized study of short professional-writing tasks, AI assistance improved speed and ratings, though those tasks were not research manuscripts. <button class=\"citation\" data-source=\"S05-007\" aria-label=\"Source 32\">[32]<\/button> A large study of preprints inferred AI-writing use from abstracts and found that detected adoption was followed by higher monthly output relative to comparison authors across arXiv, bioRxiv, and SSRN. The authors expressly cautioned that adoption was not random and the detection measure imperfect, so these associations are not an estimate of AI&#39;s causal effect on scientific productivity. <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 29\">[29]<\/button> Faster drafting can be useful to a researcher writing in a second language; it can also reduce the time in which a weak claim becomes visible to its author.<\/p>\n<p>The writing signal itself has changed. In the same preprint study, linguistically complex AI-signature prose was negatively associated with later publication or ICLR review scores, whereas complexity had a positive association among human-signature papers. Those outcomes are proxies for evaluation, not direct tests of truth. <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 29\">[29]<\/button> The result cautions against treating fluency or complexity as evidence that the underlying analysis is strong. A clear paragraph may accurately express a finding, but it may also make a gap between result and claim harder for a hurried reader to see.<\/p>\n<p>Evidence from a management journal shows why the response should focus on substance. Gartenberg and colleagues examined 6,957 initial submissions and 10,389 text-entered reviews at <em>Organization Science<\/em> through February 2026. They observed higher submission volume after late 2022 and associations between stronger AI-writing detector signatures, lower readability, and less favorable editorial outcomes. In an author-fixed-effects model, the association with editorial decisions weakened to statistical insignificance. The authors themselves used AI for parts of their editorial and then revised it heavily; its detector score was low. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button> A detector score therefore gives neither a reliable account of a researcher&#39;s process nor a verdict on the research. The editorial&#39;s deeper claim is that easy prose production may displace deep reading, field immersion, empirical revision, or sustained theory development. Those are proposed mechanisms; the study observed text, topic words, and editorial outcomes, not whether these activities were skipped. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button><\/p>\n<p>The same distinction applies to review. In the <em>Organization Science<\/em> sample, reviews with higher detector scores were less readable and emphasized theory more than data by the study&#39;s word-frequency measure. The analysis compares some reviews of the same manuscript and includes reviewer effects, but topic words cannot reveal whether a reviewer actually missed a design flaw. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button> By contrast, a randomized intervention at ICLR 2025 gave optional AI feedback to human reviewers on half of 44,831 reviews. Reviews that received the feedback were more often revised than controls, and rebuttal engagement increased; acceptance rates did not change significantly. Human judges preferred revised reports in a selected blind comparison of 100 review pairs, a result that should not be generalized to all reviews in the trial. <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 105\">[105]<\/button> The intervention helped reviewers improve their own reports. It did not ask the system to replace their judgment.<\/p>\n<p>For FEB authors and reviewers, the useful question is whether AI assistance makes a criticism or response more specific and better checked. An author could ask which sentence lacks support and then reopen the data or source. A reviewer could ask whether a report names the exact missing comparison, provided the venue permits such use and confidential material is handled accordingly. A generated full referee report raises a different question: whether it identifies the assumptions or evidence on which the paper&#39;s conclusion depends, without inventing flaws. The evidence does not justify treating those two uses as equivalent. <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 105\">[105]<\/button> <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button><\/p>\n<h2 id=\"cycle-what-changes-across-the-whole-cycle\">What changes across the whole cycle<\/h2>\n<p>When the cost of each operation falls, researchers can attempt more projects and more versions of a project. This creates opportunities for exploration. It also increases the amount of material that must be selected and checked. The <em>Organization Science<\/em> editorial reports increasing submissions across its comparison periods, and the cross-field preprint study observed more output following detected AI adoption. Neither design isolates how much of that change AI caused. <button class=\"citation\" data-source=\"S06-020\" aria-label=\"Source 30\">[30]<\/button> <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 29\">[29]<\/button> The observed pressure on review systems is nevertheless relevant to FEB: faster production can move work from the author to supervisors, collaborators, editors, and referees unless the extra output is matched by effective scrutiny.<\/p>\n<p>An end-to-end system marks a useful boundary for thinking about that pressure. Lu and colleagues&#39; <em>AI Scientist<\/em> generated ideas, code, experiments, figures, a manuscript, and an automated review in computational machine-learning settings. Researchers selected three outputs for a consented workshop trial. One passed the workshop&#39;s review threshold and was withdrawn under the study protocol; the workshop accepted 70% of submissions, and the authors judged none of the three ready for a main-conference paper. They documented weak ideas, implementation errors, and inaccurate citations. <button class=\"citation\" data-source=\"S14-109\" aria-label=\"Source 31\">[31]<\/button> This is evidence that a complete computational paper can sometimes pass a particular review bar after output selection. It says little about research requiring organizational relationships, restricted records, measurement of social constructs, or contested interpretations. It does show why counting an apparently complete manuscript is weaker than examining the work and standards that produced it.<\/p>\n<p>Messeri and Crockett describe a related epistemic risk: when tools make answers and outputs easy to obtain, researchers can acquire an <em>illusion of understanding<\/em> and converge on methods or questions that the tools handle readily. Their argument identifies a mechanism to examine, not an observed decline in FEB research quality. <button class=\"citation\" data-source=\"S06-014\" aria-label=\"Source 70\">[70]<\/button> The creativity experiments above show why neither convergence nor diversity is a universal outcome of AI assistance, and the preprint evidence also suggests that AI-supported work may bring some less prominent sources into view. <button class=\"citation\" data-source=\"S14-104\" aria-label=\"Source 12\">[12]<\/button> <button class=\"citation\" data-source=\"S14-105\" aria-label=\"Source 108\">[108]<\/button> <button class=\"citation\" data-source=\"S14-204\" aria-label=\"Source 29\">[29]<\/button> The relevant question is whether a project exposes its assumptions and alternative accounts more clearly after AI has helped generate and organize them.<\/p>\n<p>Across the six stages, AI may improve research when faster generation leaves more time for the few checks on which a contribution rests: comparing an explanation with a rival, searching for the omitted paper, piloting a manipulation with actual respondents, validating a measure on which the estimate depends, rerunning an analysis on a held-out case, or revising a claim after review. The very same speed gain may lower quality if it is spent mainly on another proposal, another specification, or another polished submission. That conditional effect is more useful for FEB than a single impact score for a stage. It identifies the decision a researcher and a faculty support programme can change, and it keeps the quality of the completed contribution distinct from the volume of material AI can produce. <button class=\"citation\" data-source=\"S14-102\" aria-label=\"Source 10\">[10]<\/button> <button class=\"citation\" data-source=\"S08-020\" aria-label=\"Source 13\">[13]<\/button> <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> <button class=\"citation\" data-source=\"S14-202\" aria-label=\"Source 105\">[105]<\/button><\/p>\n", "toc": [{"id": "cycle-how-ai-changes-the-research-cycle", "text": "How AI changes the research cycle", "level": 1}, {"id": "cycle-question-and-theory", "text": "Question and theory", "level": 2}, {"id": "cycle-literature", "text": "Literature", "level": 2}, {"id": "cycle-design", "text": "Design", "level": 2}, {"id": "cycle-data-and-sources", "text": "Data and sources", "level": 2}, {"id": "cycle-analysis-and-interpretation", "text": "Analysis and interpretation", "level": 2}, {"id": "cycle-writing-and-review", "text": "Writing and review", "level": 2}, {"id": "cycle-what-changes-across-the-whole-cycle", "text": "What changes across the whole cycle", "level": 2}]}, "forms": {"title": "Forms of research", "html": "<h1 id=\"forms-the-form-of-the-research-changes-what-ai-can-do\">The form of the research changes what AI can do<\/h1>\n<p>FEB researchers study different questions with different kinds of evidence. In one project, the central task is to estimate an effect from firm records; in another, it is to understand how employees experience a change in their work; in a third, it is to develop a model or bring several literatures into a new relationship. We group these projects as Quantitative, Qualitative, and Theory/Review because these forms place different demands on an AI-generated output. Many papers combine them. An interview study may count coded responses, and a theoretical paper may use simulations. The grouping helps us ask which part of a study has become cheaper and which part determines whether its claim holds. Statistical meta-analysis belongs with Quantitative research because its central result is an estimate calculated from comparable effects in earlier studies. <button class=\"citation\" data-source=\"S07-32\" aria-label=\"Source 73\">[73]<\/button><button class=\"citation\" data-source=\"S13-305\" aria-label=\"Source 41\">[41]<\/button><\/p>\n<p>Across the three forms, AI can now do more than tidy a manuscript. It can turn records into variables, run code, conduct adaptive interviews, propose codes and themes, answer questions across many papers, draft a review, suggest an explanatory mechanism and solve some stated mathematical proofs. The evaluations document successful automation of defined tasks. Their outcomes differ, however: agreement with a codebook, successful execution, expert preference for a written answer and a verified proof measure different aspects of research quality. We therefore consider the form of the claim before asking how much of the work can be delegated.<\/p>\n<h2 id=\"forms-quantitative-research\">Quantitative research<\/h2>\n<h3 id=\"forms-more-records-can-become-usable-data\">More records can become usable data<\/h3>\n<p>Many FEB quantitative projects begin with records that were collected for purposes other than research. Annual reports have different layouts, news coverage is uneven, and documents in several languages may describe the same transaction or organizational feature in different words. Researchers can ask AI to extract specified fields, link text to entities and produce a processing script. Levich and Knust examine ownership-information extraction from multilingual corporate reports and show both what an extraction system can do and where reporting differences create missed information. <button class=\"citation\" data-source=\"S07-08\" aria-label=\"Source 21\">[21]<\/button> These tasks make a larger panel or a new comparison feasible when manual reading would have been the binding cost.<\/p>\n<p>The gain may change the research question. A researcher studying corporate disclosure could include smaller firms, earlier years or several countries; an operations researcher might connect regulatory documents to transaction records that previously sat in separate formats. Yet the resulting data can be precise for the wrong population. A tool may extract fields accurately from available English reports while missing firms whose reporting follows another convention. It may also assign the same label to different practices across countries. The team therefore needs to know which records entered the sample, which could not be processed and whether the new variable means the same thing in each group. More observations reduce sampling uncertainty only after those measurement and coverage decisions have been defended. <button class=\"citation\" data-source=\"S07-08\" aria-label=\"Source 21\">[21]<\/button><button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 25\">[25]<\/button><\/p>\n<p>Access remains part of that decision. Public SEC APIs provide a lawful route to filings under their access conditions, while restricted administrative microdata require project authorization, named users and an approved environment. <button class=\"citation\" data-source=\"S06-023\" aria-label=\"Source 20\">[20]<\/button><button class=\"citation\" data-source=\"S06-021\" aria-label=\"Source 23\">[23]<\/button> An AI agent can help collect and process data after those conditions have been met; it does not give an investigator a right to retrieve confidential records or move them into an external service. For FEB teams working with company data, survey panels or administrative partners, planning the AI workflow alongside the access agreement is a research-design issue. It determines what data can be compared and what another scholar could later reproduce.<\/p>\n<h3 id=\"forms-generated-variables-change-the-estimate\">Generated variables change the estimate<\/h3>\n<p>A further change occurs when text, images or speech become a measure used in an analysis. A finance scholar may rate earnings-call sentiment, a marketing scholar may classify product claims, and a labour economist may infer a job attribute from vacancies. The model output is then treated as a regressor, outcome or moderator, even though it is an estimate of the underlying concept. Christensen and Hansen show that error in an AI-generated covariate can bias the target coefficient and invalidate a conventional confidence interval; their proposed correction works under specified statistical assumptions. <button class=\"citation\" data-source=\"S07-07\" aria-label=\"Source 24\">[24]<\/button> Thus, a high classification score is not enough if the errors cluster in the firms or periods that carry the substantive comparison.<\/p>\n<p>Ludwig, Mullainathan and Rambachan distinguish two validation jobs that are easily conflated. A model used to <em>predict<\/em> an outcome should be assessed on cases protected from training leakage. A model used to <em>measure<\/em> a concept for later estimation needs comparison with a reference measurement procedure on a deliberately selected sample. Their working-paper examples show that changing a prompt or model can change a downstream estimate, sometimes its size, significance or direction. <button class=\"citation\" data-source=\"S08-013\" aria-label=\"Source 25\">[25]<\/button> If a researcher can try many prompts and then retain the one with the most attractive coefficient, the new flexibility becomes another route to specification search. Conversely, keeping a held-out human-labelled sample and recording the tried prompts can make that flexibility useful: the researcher can choose a prompt for measurement performance rather than for the result it happens to produce.<\/p>\n<p>Duan and Pelger provide a concrete finance case. They processed roughly 260,000 firm-news headlines into stock-month sentiment and obtained twelve different naive slopes, from 0.083 to 0.226, from plausible model–prompt combinations. They then used about 5,320 human-labelled stock-month observations and multiple generated measures to calibrate a sentiment covariate. Their corrected slope was 0.312, and its reported confidence interval was roughly half as long as the interval using only the labelled subsample. <button class=\"citation\" data-source=\"S14-301\" aria-label=\"Source 34\">[34]<\/button> Those numbers describe the tested stock-return specification; they do not establish a causal effect of sentiment or tell other researchers to use the same correction. They show how a relatively small verification sample can recover information from a much larger AI-processed collection when the calibration assumptions fit. For a FEB project, the reference concept, label sample, subgroup errors and estimation method need to be chosen before the attractive regression result becomes the criterion for success.<\/p>\n<h3 id=\"forms-experiments-and-surveys-still-need-people\">Experiments and surveys still need people<\/h3>\n<p>AI can make an experiment more interactive without replacing its participants. Becker and colleagues used customized agents as leaders, coworkers or subordinates in three studies with 789 human participants, including incentivized behaviour. <button class=\"citation\" data-source=\"S07-09\" aria-label=\"Source 114\">[114]<\/button> Compared with a fixed script, an agent can respond to what a participant says while preserving a designed role. The researcher still has to establish what treatment was delivered, whether the model acted consistently enough across conditions and whether the measured behaviour answers the original question. A prompt written once is not necessarily a stable treatment when the underlying model or deployment changes.<\/p>\n<p>Adaptive surveys create a similar opportunity and a new measurement problem. In a randomized online experiment with 2,243 respondents, Austin and colleagues found that an AI interview elicited more specific reasons than fixed survey questions, with extra time but little detected increase in dropout. Some respondents gave more polarized answers to a later closed question after they had explained an earlier position. <button class=\"citation\" data-source=\"S14-305\" aria-label=\"Source 96\">[96]<\/button> A marketing or behavioural-economics researcher could use such an interview to learn how consumers explain a choice. If the aim is to estimate an attitude as it stood before the interaction, however, the interview can change the answer being measured. The comparison is with fixed questions in a US online panel, rather than with an expert human interviewer or every survey setting.<\/p>\n<p>Simulated respondents offer a cheaper way to pilot questions, but they pose a stronger inferential claim when used in place of people. Argyle and colleagues report resemblance for selected political-survey subgroups, whereas Bisbee and colleagues find that plausible averages can coexist with too little individual variation, unstable coefficients and sensitivity to the prompt and period. <button class=\"citation\" data-source=\"S07-11\" aria-label=\"Source 16\">[16]<\/button><button class=\"citation\" data-source=\"S07-12\" aria-label=\"Source 110\">[110]<\/button> In two US panel datasets, Krsteski and colleagues reduce bias in population estimates by correcting synthetic responses with a small set of real human responses; they distinguish that result from the harder task of predicting what a particular person would answer. <button class=\"citation\" data-source=\"S14-302\" aria-label=\"Source 115\">[115]<\/button> A FEB team can therefore use synthetic respondents to inspect questionnaire wording or explore possible response patterns. Estimating how real consumers, employees or managers behave requires validation for that population and outcome, and even the constructive correction study retains human observations.<\/p>\n<h3 id=\"forms-agents-can-execute-an-analysis-without-deciding-its-meaning\">Agents can execute an analysis without deciding its meaning<\/h3>\n<p>Coding and computational replication show how far task automation has moved. Aygün and colleagues’ ERA system searches for software that improves a defined score across Kaggle and domain tasks, including forecasting and numerical integration. <button class=\"citation\" data-source=\"S07-06\" aria-label=\"Source 6\">[6]<\/button> That is useful when an implementation can be scored, such as a data-linkage routine or estimator. The score does not tell a researcher whether the variable captures governance, whether a treatment was as-if randomly assigned or whether the estimated contrast is a meaningful welfare comparison.<\/p>\n<p>Brodeur and colleagues tested a different task in seven-hour reproduction games with 288 researchers in 103 teams. Human-only teams reproduced 31 of 33 assigned results, assisted teams 32 of 35 and AI-led teams 13 of 35. Human-only teams also found more major coding errors. <button class=\"citation\" data-source=\"S07-01\" aria-label=\"Source 28\">[28]<\/button> More recent agents do well on selected executable tasks. Alizadeh and colleagues report that, in their distinct setups, Claude Code reproduced 93.4% and Codex 62.1% of 221 tasks from 54 papers with supplied materials; the two agents received different repair guidance. <button class=\"citation\" data-source=\"S08-010\" aria-label=\"Source 26\">[26]<\/button> Kohler and colleagues gave agents methods descriptions and data but withheld author code and target results across 48 reproducible economics and political-science papers; their best system recovered the sign of 91.1% of coefficients <strong>it produced<\/strong>, excluding missing coefficients from that denominator. <button class=\"citation\" data-source=\"S14-304\" aria-label=\"Source 97\">[97]<\/button> These percentages are not a single leaderboard. They show that agents can complete a substantial share of selected executable tasks. Their different task selection, assistance and success criteria prevent a direct comparison of performance across the studies.<\/p>\n<p>The same studies clarify what a team should chec
